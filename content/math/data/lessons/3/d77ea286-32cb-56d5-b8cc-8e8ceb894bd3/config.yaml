        production:
          purpose: 'One side is already known (guided exploration)'
          pedagogicalIntent: |-
            _Purpose: learn to establish a target value before choosing a missing term._

            1. **`text` resource:** “Which side can we work out right now? **6 + □ = 4 + 5**.” Give a moment to predict whether the box should contain 3, 5 or 9, without marking a guess wrong.
            2. **`scene` resource, proposed:** `Expression Match Lab` (former expressionMatchLab.scene-spec.md; specification embedded in this YAML), entry A. A fixed right-hand board shows four counters joined with five; its total is revealed as **9**. The left board shows six visible counters and a space for the box. Children insert one, two, three or more unit counters using plus/minus controls (a keyboard-equivalent to optional manipulation), then inspect the two totals.
            3. **`text`:** For 3: “Six and three make nine. Four and five make nine. **Both sides match**.” For 9: “The right side is nine altogether, but six plus nine is fifteen. The box is one part, not the whole.” For 5: “Six plus five is eleven, not nine.”
            4. **`markdown`:** “The side with no box gives us a target. Find a number that makes the other side have that same value. Then check _both_ sides.”
          productionNotes: 'Source Section narrative/feedback/accessibility requirements retained without granting editorial approval.'
