                1. **text — existing renderer:** "Look at our little map. The letters A, B, C, D name the rows. The numbers 1, 2, 3, 4 name the columns. Where is **B2**—the second square of row B, or a line where the labels cross?"
                2. **scene — existing Resource type, custom Scene proposed:** Grid Map Workshop (preserved in Scene production.specification), stage A. Show 4×4 cells with labeled rows/columns. Learner selects a **cell** by row choice and column choice (not precision clicking). Tree at **B2**, park at **A4**, pond at **C3**. "Read chosen cell" reveals "B2: tree"; "Show row B" highlights four cells and names them B1–B4.
