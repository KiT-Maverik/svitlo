    # Beyond Ten: Count and Read to Twenty — Methodologist Brief
    
    Date: 2026-10-31
    Slug: numbersFromTenToTwenty
    Methodologist status: Draft
    Code: [Not implemented](#)
    Program dependence: None
    
    ## Educational purpose
    
    Count forward from a chosen start within 20, including ten transitions, and read/write numerals connected to quantities 0–20. Program-neutral and independently teachable.
    
    ## Target audience
    
    **Grade 1 (primary audience)**, early readers using short prompts, countable illustrations, and optional narration. No requirement for mouse use, hearing, or fluent reading.
    
    ## Prerequisites
    
    Identify digits 0–9, one-to-one count through ten and understand cardinality. Provide an optional introductory reminder, not an assumption of demonstrated mastery.
    
    ## Target Skills
    
    - [forward20.data.ts](../../../../data/skills/counting/sequence/skills/forward20.data.ts)
    - [readWrite20.data.ts](../../../../data/skills/numeration/notation/skills/readWrite20.data.ts)
    
    ## Expected learning outcomes
    
    1. Nine then one more makes ten, written 10.
    2. 10+3 = 13; 10+7 = 17; 10+0 = 10.
    3. Each forward count adds one; 19 is followed by 20.
    4. 14 labels fourteen crayons; 10+4 is fourteen.
    
    - Explain a new instance using the underlying number relationship, not merely identify a familiar arrangement.
    
    ## Essential subject matter and instructional depth
    
    Concrete full ten-frame and extra units; no generalized place-value algorithms or carrying. Verified model examples:
    
    - 9, 10.
    - Ten and three → 13.
    - 17, 18, 19, 20.
    - Ten plus four → 14.
    
    ## Conceptual progression and dependencies
    
    1. After nine: Fill tenth cell of a ten-frame and reveal the numeral 10.
    2. Ten and some more: Explore a full ten-frame plus 3, 7 or zero loose beads; select numeral and count aloud or via ordered ledger.
    3. Beyond nineteen: Continue 17,18,19,20 on a 0–20 number strip, one step per activation.
    4. Crayon label: Match an unfamiliar full-ten-plus-four crayon set to 14, contrasting 12 and 21.
    
    ## Misconceptions, examples and boundaries
    
    After 19 comes 110, thirteen is written 103, reversed two-digit numerals are equivalent, all counting must restart at one. Feedback must point to the relevant concrete counting evidence. No score, timed drill, or inference of mastered competence.
    
    ## Localization, accessibility and offline intent
    
    English editorial source only. All learner-facing prompts, count words, control text, accessible descriptions and feedback require complete genuine translations across supported locales. Preserve semantic numeric order under RTL. WCAG 2.2 AA: keyboard/switch/touch support, nonvisual ordered ledger, visible focus, sufficient targets, zoom and reduced motion; no drag-only or audio-only tasks. Design for deterministic fully downloaded offline use, without claiming offline capability is implemented.
    
    ## Sources and factual verification
    
    - The canonical Skill data files linked above, copied unchanged from Mathematics main; regenerated Playground taxonomy pending coordinator.
    - Studio Methodologist Persona and Lesson Editorial Artifacts, consulted in this batch; not runtime contracts.
    
    ## Curriculum / Program compatibility
    
    Standalone. No Program dependency or specific Curriculum alignment claimed.
    
    ## Open editorial decisions
    
    Editor approval required for this Brief, target Skills and numerical boundaries. Confirm genuine locales and accessible Scene interaction before implementation.
    
    ## Methodologist handoff
    
    **Draft, not Approved.** Subsequent Content and Scene files are provisional under explicit batch authorization; formal editorial approval gate has not passed.
