  id: 'a8b35b12-d41d-528d-87bd-1bf0a106711b'
  slug: 'additionCrossingTen'
  type: 'lesson'
  skills: ['e2d79a7d-611e-4c74-b344-aba08db29c38']
  params:
    requireQuiz: false
