  id: "1285fbda-ea25-5767-b5b5-a4cab3539c1f"
  slug: "tooMuchOrTooLittleInformation"
  type: "lesson"
  skills: ["e77dd73e-0505-41d6-9a38-880f63009084","f42f6f4a-7183-4ace-862d-e25a58d9a702"]
