        production:
          purpose: "Test an equality with two expressions"
          productionNotes: |-
            _Purpose: evaluate both entire sides and compare the results._
            
            1. **`text`:** “Does **3 + 5 = 4 + 4** tell the truth? Look at both sides before you decide.” Invite a prediction without immediately revealing the totals.
            2. **`scene` Resource (proposed):** Statement Verifier (Scene specification statementVerifier embedded below), entry A, shows two equal-unit trays with groups 3+5 and 4+4, the original equality and separate “Check side” buttons. The learner can decide true/false then inspect **8** and **8**. “Yes, they are arranged differently but each side equals eight.”
            3. **`text`, misconception feedback:** If false chosen: “Look again: three plus five is eight; four plus four is also eight. A true equality does not require identical writing on each side.” No score, no forced retry.
