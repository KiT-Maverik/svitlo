    # One Group or One in Each? — Methodologist Brief
    
    Date: 2026-10-31
    Slug: divisionByOneAndSelf
    Methodologist status: Draft
    Primary audience: Grade 2
    Code: Not implemented
    Program dependence: None
    
    ## Educational purpose
    
    Use two distinct sharing models to show that dividing by one keeps the starting quantity, while a nonzero number divided by itself equals one. Avoid the false extension to 0 ÷ 0.
    
    ## Target audience
    
    Primary Grade 2, with the prerequisite abilities listed below. This audience applies to this Lesson only; the source Skills remain grade-independent.
    
    ## Prerequisites
    
    - Interpret exact division as sharing among a known positive number of groups.
    - Count up to twelve objects and distinguish the number of groups from the number in each.
    - Use group count × amount in each group to check a total.
    
    ## Target Skills
    
    - [by1AndSelf.data.ts](../../../../data/skills/arithmetic/divide/skills/by1AndSelf.data.ts)
    
    ## Expected learning outcomes
    
    - Build and read 6 ÷ 1 = 6 as one group containing six.
    - Build and read 6 ÷ 6 = 1 as six groups of one.
    - Compare divisor and quotient roles in both models and verify with multiplication.
    - Apply to nine and reject 0 ÷ 0 as undefined.
    
    ## Essential subject matter
    
    For a whole number a, a ÷ 1 = a. For a positive a, a ÷ a = 1. The first model has one group of a; the second has a groups of one. 6 ÷ 1 = 6 and 6 ÷ 6 = 1; 9 ÷ 1 = 9 and 9 ÷ 9 = 1. Checks: 1×6=6, 6×1=6, 1×9=9, 9×1=9. Zero divided by one equals zero, but 0 ÷ 0 is undefined. No fraction/negative arithmetic.
    
    ## Conceptual progression and dependencies
    
    1. Six in One Group: Move all six counters from an initial pool to exactly one named receiving group; allow individual or one-action transfer.
    2. One in Each of Six: Give one original counter to each of six named groups, tracking the unchanged total six.
    3. The Same Whole, Different Share: Compare two separately labeled models with ledger entries Total6/Groups1/Each6 and Total6/Groups6/Each1; select which number names groups.
    4. Nine and a Boundary: Offer two independent nine-counter stories and a zero-divisor non-example with no quotient result; disclose reasons without requiring a guess.
    
    ## Misconceptions, examples and boundaries
    
    Do not interpret 6 ÷ 1 as 'one counter in six groups' or 6 ÷ 6 as 'six in every group'. Do not duplicate counters during sharing, or claim the rule a÷a=1 covers a=0.
    
    ## Localization, accessibility and offline intent
    
    Every child-facing string needs genuine complete supported-locale translations, not English fallbacks. Use exact group labels, semantic RTL operand order and fully operable accessible count ledgers with native keyboard/touch/switch equivalents, WCAG 2.2 AA, visible focus, mobile/zoom, reduced motion and local offline maths once downloaded. No drag-only or speech-only explanation.
    
