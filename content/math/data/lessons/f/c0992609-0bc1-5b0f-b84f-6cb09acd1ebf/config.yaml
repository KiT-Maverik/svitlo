production:
  documentLanguage: "en"
  methodology: |
    # How Many Units Long? — Methodologist Brief
    
    Date: 2026-10-31
    Slug: measuringWithEqualUnits
    Methodologist status: Draft — not approved
    Code: [Not implemented](#)
    Program dependence: None
    
    ## Educational purpose
    
    Same length, different number: the unit matters. This Lesson is an autonomous introduction to its assigned canonical competency; it must be valuable without a Program storyline or assessments.
    
    ## Target audience and depth
    
    **Primary grade: 2** (approximate ages 7–8). Early or mixed readers, multilingual learners, keyboard/switch users, low-vision users and learners who need concrete examples must receive equivalent access. **Instructional depth:** Whole nonstandard units only, no gaps/overlaps; compare unit-size effect, distinguish numerical unit count from physical length. No fractional measuring or cm conversions.
    
    ## Prerequisite knowledge and Skills
    
    Compare lengths by aligned endpoints (compareLength). Count objects reliably to 12 and understand equal-sized copies.
    
    - [compareLength.data.ts](../../../../data/skills/measurement/length/skills/compareLength.data.ts) (previously developed Skill)
    
    ## Target Skills
    
    - [nonstandardLength.data.ts](../../../../data/skills/measurement/length/skills/nonstandardLength.data.ts)
    
    ## Expected observable learning outcomes
    
    - Lay identical unit tiles end-to-end to cover a straight length without gaps or overlaps.
    - Count complete unit intervals accurately and identify misleading measurements.
    - Explain why a shorter unit produces a larger unit count for the same fixed object.
    
    ## Essential mathematical ideas
    
    Measurement iterates one fixed unit to partition a length. A bar of length 12 grid spaces is 6 two-space tiles or 4 three-space tiles long. The physical bar is unchanged despite different numeric counts.
    
    ## Conceptual progression
    
    Start with a plausible misconception, invite a prediction, make the relevant invariant or comparison observable, provide controlled learner manipulation, explain counterexamples, and finish with a fresh independent application. Short formative responses are not proof of mastery.
    
    ## Common misconceptions and boundaries
    
    Counting boundary ticks rather than intervals; leaving gaps, stacking tiles or changing unit size midway; assuming more units means physically longer.
    
    Exclude unneeded symbolic formalism and unrelated geometry or measurement topics. Do not change any Skill definition to match these illustrations.
    
    ## Localization, accessibility and offline
    
    All proposed language must be authentically translated for supported locales, including meaningful viewpoint and spatial-direction semantics in LTR/RTL; numerical or geometric truth must not be mirrored incorrectly. Visual manipulation needs a fully equivalent keyboard and screen-reader path, visible focus, adequate touch targets, no color-only cues, no timers, reduced motion, and WCAG 2.2 AA design verification. All assets and feedback must be available offline after download; these are **requirements, not implementation claims**.
    
    ## Sources and verification
    
