                config:
                  id: "04bbd435-119a-4e36-b1b9-84eb73ea7474"
                  slug: "unitTileWorkbench"
                  type: "scene"
                  params: {}
                  locale:
                    value:
                      en: "Unit Tile Workbench"
                production:
                  specification: |
                    # Unit Tile Workbench — Scene Specification
                    
                    **Status:** Provisional Draft pending Methodologist approval.
                    **Owner:** Educational Screenwriter.
                    **Parent Lesson:** Lesson Content (original now embedded in this config.yaml); Methodologist Brief (original now embedded in this config.yaml).
                    **Implementation:** Proposed only. `scene` Resource type may exist; this bespoke component does not. **Scene interface:** self-contained and prop-free. No invented events, API fields, persistence or scoring.
                    
                    ## Pedagogical purpose
                    
                    Same length, different number: the unit matters. The learner must be able to **predict** a state, **change** a mathematically meaningful property, **observe** a contrast and **explain** its significance. A static animation or decorative drag is insufficient.
                    
                    ## Domain model and immutable rules
                    
                    One rigid 12-grid-interval bar; unit size 2 or 3 intervals, repeated without overlap/gap. Visual grid is conceptual scaffolding, not a claim of centimeters.
                    
                    ## Interaction design and state transitions
                    
                    - Objects/state: bar fixed 12, selected tile size 2/3, covered intervals count, hint/reveal, invalid-spacing demo, reset.
                    - Show accessible starting information and a predicted outcome before the relevant reveal.
                    - Controls: labeled **Choose / Change / Compare / Explain / Undo or Reset**, adapted to the specific context of the Lesson. Use discrete accessible controls; any drag or gesture is optional enhancement.
                    - Every user action updates both the graphical model and a semantic text ledger with the same content. Show one new fact per step; never assume a narrative autoplays.
                    - A wrong prediction prompts a reasoned comparison, offers a hint and a retry, and does not lock progress or affect scores.
                    - Reset returns to the documented preset and clears only local presentation state. Each Section placement must stand alone and must not inherit another Section's model state.
                    
                    ## Exact acceptance scenarios
                    
                    1. Six tiles of width two exactly cover twelve intervals.
                    2. Four tiles of width three exactly cover the same twelve intervals.
                    3. Gaps/overlaps are explicitly invalid; changing units does not change the object's length.
                    4. A child can complete the reasoning without drag, color interpretation, sound or timed actions; explanatory feedback is the same.
                    5. A Section can be reopened and reset with no dependence on a previous Lesson or Program.
                    6. Mathematical labels and relationships remain correct under RTL and locale-specific presentation, including observer-relative directions.
                    7. A narrow mobile viewport, 200% text scaling, reduced-motion preference and offline use after download preserve the exact learning content.
                    
                    ## Visual and media specification
                    
                    Use clear, low-complexity SVG/HTML geometric models with visible endpoints/markers where needed. Animation is optional and pausable; prefer instantaneous state change in reduced-motion mode. Do not embed translatable text into artwork. Labels and controls should remain legible on touch devices; geometry must not be distorted by container scaling.
                    
                    ## Localization and inclusive interaction
                    
                    Prepare real translations for all supported locales; missing translation is a release blocker, never a silent English fallback. Use semantic rather than blanket RTL mirroring. Provide explicit narrated/textual descriptions of object relationships, ordered state summaries, keyboard/switch controls, visible focus, WCAG 2.2 AA contrast/target review, and nonvisual equivalent decisions. Optional audio has captions/transcript. All required material must load from offline assets; no cloud computation or media is necessary.
                    
                    ## Review and handoff
                    
                    The Methodologist must approve the Brief before any content is formally approved. The editor then reviews the provisional scene specification. A future Scene Designer/Coding Agent verifies existing contracts, creates a tested prop-free component and real locale resources separately; no React, Question, Quiz or scoring is part of this PR.
                  purpose: "Proposed interactive Scene for The Missing Space"
                  productionNotes: "Original draft specification; no component implementation or editorial approval. Section-specific variants and placement preserved in Section pedagogicalIntent."
              text1:
                config:
                  id: "40537174-2aa8-4097-b5a2-a7e2a9b50675"
                  slug: "text1"
                  type: "text"
                  params: {}
                  locale:
                    value:
                      en: "Show an unchanging bar of 12 grid spaces. A sequence of six identical two-space tiles covers it exactly; then insert a one-space gap while keeping six tiles. Ask if the result is still correct."
              markdown2:
                config:
                  id: "8cf7817b-26ca-4f9c-bbc4-2329b90ac982"
                  slug: "markdown2"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      en: "Explain: 'A good measurement covers the length once—no holes and no overlap.' Count intervals, not tile boundary marks."
            order: ["text1","unitTileWorkbench","markdown2"]
        production:
          purpose: "The Missing Space"
          pedagogicalIntent: |
            ### Section 1 — The Missing Space
            
            **Purpose:** Elicit prior intuition and create an intelligible problem.
            
            1. **text (existing):** Show an unchanging bar of 12 grid spaces. A sequence of six identical two-space tiles covers it exactly; then insert a one-space gap while keeping six tiles. Ask if the result is still correct.
            2. **scene (type exists; proposed instance):** Work within Unit Tile Workbench (Scene specification embedded in this config.yaml). The child may inspect the current state, predict an outcome, change exactly one relevant variable, and review a previous state. No gesture-only path.
            3. **markdown (existing):** Explain: 'A good measurement covers the length once—no holes and no overlap.' Count intervals, not tile boundary marks.
            
            **Explanatory feedback and recovery:** If they count seven boundary lines: 'Those are the edges between tiles. Count the six spaces covered.'
            
            **Navigation:** Continue after reflection or explore again; never claim success solely from completion. **Accessibility:** readable semantic text corresponding to each state, localized controls, logical keyboard focus, accessible change announcements and an equivalent no-drag route.
            
          productionNotes: "Full original ordered lesson Section with learner copy, mathematical facts, misconceptions/feedback, accessible alternatives, RTL/offline and specialist handoff. Provisional, not approved."
