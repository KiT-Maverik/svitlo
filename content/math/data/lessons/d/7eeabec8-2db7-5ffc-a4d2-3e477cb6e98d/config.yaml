  methodology: |
    # Does the Answer Make Sense? — Methodologist Brief
    
    Date: 2026-10-31
    Slug: doesTheAnswerMakeSense
    Methodologist status: Draft
    Code: [Not implemented](#)
    Program dependence: None
    
    ## Educational purpose
    
    Teach qualitative magnitude and contextual checks as a distinct verification habit, even before or independently of exact recomputation.
    
    ## Target audience
    
    **Primary audience: Grade 3.** Use short clear instructions, optional audio read-aloud, large touch targets and a nonvisual text representation. This is an instructional depth decision for the Lesson, not a grade restriction on the canonical Skill.
    
    ## Prerequisites
    
    - Read and interpret simple quantitative stories; estimate sums using tens/hundreds; compare three-digit numbers; understand what a count can and cannot represent.
    
    ## Target Skills
    
    - [checkReasonableness.data.ts](../../../../data/skills/reasoning/verification/skills/checkReasonableness.data.ts)
    
    ## Expected learning outcomes
    
    - Reject answers incompatible with context or plausible magnitude; estimate a reasonable range before exact calculation; explain why 98 + 105 cannot plausibly equal 2,000; identify when a nonnegative count or unchanged units matters.
    
    ## Essential subject matter
    
    Two groups of roughly 100 objects total roughly 200, not 2,000; 98 + 105 = 203. Estimates are approximate checks, not exact proof. Counting objects cannot produce a negative quantity in simple collection contexts. An estimate can fail to catch a small computation error, so contextual plausibility is not equivalent to verification by an independent exact method.
    
    ## Conceptual progression and dependencies
    
    Begin with a stark magnitude contradiction, make the rough benchmark explicit, check quantities and units, then transfer independently to a novel realistic claim.
    
    ## Misconceptions, examples and boundaries
    
    'Looks close' is not sufficient explanation. Rounding 98 to 100 and 105 to 100 suggests about 200, but 200 is not the exact answer. Do not infer that an answer close to estimate is necessarily correct. Exclude advanced statistical and dimensional-analysis arguments.
    
    ## Localization, accessibility and offline intent
    
    The English examples are editorial source text; genuine translations must be authored for every supported locale before implementation. All quantities, relationships, labels, hints and feedback must remain available in text and not only color, movement or audio. Preserve mathematical relationship order in RTL; do not blindly mirror a number line. Every action needs keyboard and touch alternatives, visible focus, 200% zoom and screen-reader descriptions. Illustrations must have equivalent descriptions; motion is optional. Deliver complete instructional media for offline use; do not promise Note persistence or scoring.
    
    ## Sources and factual verification
    
    - [Canonical Mathematics Skill data](../../../../data/skills/reasoning/verification/skills/checkReasonableness.data.ts) — preserve its competency definition and UUID.
    - [Common Core Mathematics Standards](https://corestandards.org/mathematics-standards/) — consulted only as general age-progression context, not a claim of approved Curriculum alignment.
    
    ## Curriculum / Program compatibility
    
    Not specified. This Lesson is autonomous and Program-neutral.
    
    ## Open editorial decisions
    
    - Editor must approve target grade, learning boundaries and the mapping to the linked canonical Skills before any formal Content approval.
    
    ## Methodologist handoff
    
    **Draft pending approval.** The companion Content (editorial text integrated into this config.yaml) and any [Scene specifications](./scenes/) are provisional review materials authorized for concurrent preparation, not evidence that the Methodologist approval gate has passed.
