    # Make Ten First — Methodologist Brief

    Date: 2026-10-31
    Slug: additionMakeTen
    Methodologist status: Draft
    Primary audience: **Grade 2**
    Code: Not implemented
    Program dependence: None

    ## Educational purpose

    Teach a strategically useful addition decomposition: split one addend so part fills the first addend to ten, then add the remainder. Use counter frames of ten, transparent part labels and the invariant that no counter is lost or added by regrouping. Demonstrate 8+5=8+2+3=13, then transfer to 9+6 and 7+6.

    ## Target audience

    Primary Grade 2 within the requested Grade 1–3 range. Learner readiness is defined by actual prerequisites, not a grade limit on the Skill Taxonomy.

    ## Prerequisites

    Understand ten as a full ten-frame, number complements to ten (such as 8 needs 2), addition within ten, and decomposition of five into two plus three; no written column algorithm required.

    ## Target Skills

    - [makeTenStrategy.data.ts](../../../../data/skills/arithmetic/addition/skills/makeTenStrategy.data.ts)

    ## Expected learning outcomes

    - Identify how many more counters are needed to fill a ten-frame when eight are shown.
    - Decompose five into two and three, make a full ten, then find 8+5=13 while conserving all counters.
    - Explain why 8+2+3 and 8+5 have the same total and reject a decomposition that changes five.
    - Apply the make-ten strategy to 9+6=15 and 7+6=13 with hints if necessary.

    ## Essential subject matter

    Use nonnegative whole-number examples with results at most 20. For 8+5, 8 needs 2 to reach 10, so 5 = 2+3 and 8+5 = (8+2)+3 = 10+3 =13. For 9+6, 9 needs 1 and 6=1+5, total 15. For 7+6, 7 needs 3 and 6=3+3, total 13. The decomposition and rearrangement preserve five/six exactly. Do not claim make-ten is the only valid mental strategy or teach the full associative law as the independent target.

    ## Conceptual progression and dependencies

    1. **How Much to Complete Ten?:** Show one ten-frame with eight occupied cells and two empty. Child selects 'Count empty places', fills precisely two when offered and labels full ten.
    2. **Split Five Into Two and Three:** Show separate source tray of exactly five counters. 'Move two to frame' transfers two actual IDs into the last empty cells; remaining tray now visibly has THREE, not five.
    3. **Now Add the Three Left:** Use separate visible full ten-frame (10) and remaining three counters; learner controls 'Add the three' while text shows original eight plus five unchanged across transformation.
    4. **Use Ten on a Different Sum:** Two staged transfer problems: 9+6 uses 1 and 5, yielding 15; on explicit request, 7+6 uses 3 and 3, yielding 13. Child predicts then steps through frame/split/add or requests entire worked model.

    ## Misconceptions, examples and boundaries

    Taking two from the five without removing them from its source tray, producing 8+5+2=15; thinking 8+2=11; losing the remaining three; treating the written '10' as an extra object; assuming one must split the same addend in every arithmetic problem. An incomplete ten-frame needs exactly the missing positions filled; counters carry stable IDs.

    ## Localization, accessibility and offline intent

    All learner-facing strings, mathematical roles, accessible descriptions and feedback need genuine supported-language translations; no silent English fallback. Real counters and their numbered ordered text equivalents, keyboard/touch/switch operation, RTL-correct operators and quantities, reduced motion, legible touch/zoom mobile and complete offline local feedback after download. No compulsory speech input, drag, external video/audio or time limit.

    ## Sources and factual verification

    - [Playground English taxonomy](../../../../docs/generated/skills/taxonomy.en.md), coordinator-owned generated view requiring regeneration after this branch is integrated.
    - Exact canonical Skill linked above; its UUID and mathematical scope are preserved.
    - [Common Core Mathematics Standards](https://corestandards.org/mathematics-standards/), comparative developmental reference, not national Curriculum approval.

    ## Curriculum / Program compatibility

    Standalone, Program-neutral. Grade 2 is this Lesson's audience, not a bound on the Skill definition.

    ## Open editorial decisions

    - Prerequisite place-value ten-frame competence must be verified before use in Grade 2; the source Skill stays grade-independent and the Lesson does not claim to teach all addition strategies.
    - Validate mathematical cases, exact learner group labels and accessible equivalence before publication.

    ## Methodologist handoff

    **Draft, not approved.** The accompanying provisional Screenwriter script is for editorial inspection only; separate approval of Brief, Content and Scene is required before coding or assessment.
