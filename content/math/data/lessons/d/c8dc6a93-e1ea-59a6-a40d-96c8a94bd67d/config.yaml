    # How Many More or Fewer? — Lesson Content
    
    **Screenwriter status:** Provisional Draft, pending explicit Methodologist approval.  
    **Source:** Draft Methodologist Brief (incorporated in this config.yaml). **Program dependence:** None. **Runtime:** Not implemented.  
    **Language:** English editorial source; production translations are not yet authored.
    
    ## Learning experience
    
    The learner discovers **difference as unmatched quantity** rather than treating “more” as an automatic addition instruction. The comparison always names two complete groups and asks specifically **how many more/fewer**, not “how many does the unknown character have?” (which is taught in the previous operation-selection Lesson). Use one-to-one matching with numerals and an accessible text ledger; make the _difference_ visible without changing either group's count.
    
    
    
    ## Production, accessibility and editorial boundaries
    
    Each Section is a vertically ordered `text`, `markdown`, or **proposed** `scene` Resource. Comparison Gap Lab (Scene specification embedded in this config.yaml) is not currently implemented. Every comparison uses two counts of _the same unit_, never mixes pencils and books in a single arithmetic comparison. An equal-unit bar must not have misleading scale or rely on color/picture size. All choices/explanations are formative; no Question, Quiz, scoring, mastery attribution or persistence is authored.
    
    Provide every named quantity and unmatched-pair result as visible/accessible text, keyboard/switch/tap controls instead of drag-only pairing, high contrast with descriptive labels, focus and zoom/reflow, reduced motion and no time limits. All wordings (“more”, “fewer”, “gap”), symbols, units, feedback and screen-reader descriptions need genuine locale translations. RTL may change UI navigation but must preserve which group is larger and the numerical subtraction order. Require an offline-complete implementation with selected locales/assets later, but do not claim current offline readiness. The Methodologist Brief (incorporated in this config.yaml) remains Draft and this Content is **provisional**.
    
