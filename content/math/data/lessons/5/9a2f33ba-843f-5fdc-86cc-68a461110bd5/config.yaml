                      en: '**Forward:** 46 + 27 = 73. **Backward check:** 73 − 27 = 46. An inverse operation undoes the change.'
            order: ['text1', 'reverseOperationChecker', 'text2', 'markdown3']
        production:
          purpose: 'A journey and the way back'
          pedagogicalIntent: |
            ### Section 1 — A journey and the way back

            _Purpose: perceive the inverse relation before naming it._

            1. **`text`:** “We start at **46** on a number track. We add **27** and claim that we reach **73**. How can we check the claim without doing exactly the same addition again?”
            2. **`scene` resource, proposed:** Reverse-Operation Checker (Scene specification embedded in this config.yaml), entry A. Move from 46 to 73 by +27 on an annotated 0–100 track; then the learner chooses whether returning should use +27 or −27. Numeric start/change/end labels remain in a textual route table for nonvisual use.
            3. **`text`:** Right choice: “73 − 27 = **46**. We returned to the original start, so the proposed sum passes this check.” Wrong choice: “Adding 27 again moves us farther away. To undo an addition of 27, subtract 27.”
            4. **`markdown`:** “**Forward:** 46 + 27 = 73. **Backward check:** 73 − 27 = 46. An inverse operation undoes the change.”

          productionNotes: 'Section production and all remaining learner-copy / feedback guidance are provisional, not evidence of implemented interactions or approval.'
