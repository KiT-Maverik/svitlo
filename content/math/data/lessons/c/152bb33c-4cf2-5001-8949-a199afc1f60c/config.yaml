    ## Original Screenwriter introduction

    # Parts Make a Whole — Lesson Content

    **Screenwriter status:** Provisional Draft, pending explicit Methodologist approval.  
    **Source:** Draft Methodologist Brief (full original source: production.methodology). **Program dependence:** None. **Implementation:** None.  
    **Language:** English editorial source, not yet translated for runtime delivery.

    ## Learning experience

    The learner will work with **one stable two-part partition** in several forms. The central discovery is that 6 and 4 are known parts of the same ten counters, and changing **what is asked** changes the useful operation without changing the objects. Do not repeat the earlier one-step-model Lesson as a generic “which operation?” chooser: here the same whole/parts relation is intentionally reversed.


    ## Original Screenwriter concluding notes

    ## Production, accuracy, accessibility and review

    Every general Section is an **ordered single vertical column** of available `text`/`markdown` and **proposed** `scene` resources. The Partition Lab (full original source: Scene production.specification) has a separate spec; it does not exist in runtime. All groups are explicitly nonoverlapping, and “rest are blue/yellow” means there are exactly two categories. Do not use vague mixed-group illustrations, silently introduce a third category, or treat a 10-unit whole as an additional group to add. This is non-scored instruction, not a Question, Quiz, mastery decision or Note event.

    All words, units, accessible group descriptions, feedback and symbolic reading require authentic translations for all supported locales. In RTL maintain the causal part/whole roles and operand order, not a mirrored arithmetic claim. Every draggable/manipulable object has a keyboard/switch/tap alternative and nonvisual numerical ledger. Use focus management, large targets, reduced-motion/static equivalent, high-contrast non-color-only group identity, small-screen zoom and offline-complete selected-language assets once implemented. The current app's PWA state is not assumed. This Content is **provisional**, pending approval of its Draft Brief (full original source: production.methodology).
