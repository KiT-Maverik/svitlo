    # Plan Two Steps Before You Calculate — Lesson Content

    **Screenwriter status:** Provisional Draft — pending Methodologist Brief (incorporated in this config.yaml) approval.  
    **Program dependence:** None. **Technical state:** Not implemented. **Language:** English editorial source only.

    ## Teaching rationale and instructional contract

    The learner must see the difference between **an intermediate answer** and **the final question** and create a dependency-aware plan. Do not impose a magic two-step formula or treat every two-operation string as equivalent to an explanation. The Lesson exposes two distinct dependencies—**find a whole, then subtract** and **find someone's amount, then combine two amounts**—before an independent transfer. This is not a graded Quiz or evidence of mastery.



    ## Accessibility, implementation and editorial scope

    Each Section is an **ordered single vertical sequence** of `text`, `markdown` and **proposed** `scene` resources; the planner's internal diagram may use responsive spatial layout, but sibling Resources do not become columns. Two-Step Dependency Planner (full Scene specification embedded in this config.yaml) is specified, not implemented. No Question/Quiz, score, storage, Notes or Program quests have been generated. Prompts and explanations are fully authored as English editorial source, not as production locale files.

    The Scene spec must offer **two equivalent paths**: a diagram with accessible quantity and dependency labels, and a purely text-based ordered plan choosing first and second steps. Never require drag/hover, color recognition, motion/audio or speech. Screen readers announce intermediate versus final results and units; keyboard/switch users navigate a stable logical order. In RTL, adapt presentation while retaining causal quantity dependency, mathematical operand order and named person relationships. Translate all strings, units, feedback, numbers and aria-like labels genuinely for all required locales before development; do not silently fall back to English. Reduced motion, responsive zoom and locally available offline contents/feedback are necessary implementation targets, not claims of already shipped capability. The Draft Brief (incorporated in this config.yaml) requires explicit approval before any formal Content or Scene approval.

    Source-language-only English draft; intended locale list follows the current Engine supported language set (ar, be, bn, de, en, es, et, fr, he, hi, id, ja, ka, kk, ko, lt, lv, mr, ms, pl, pt, qm, ta, te, tr, uk, ur, vi, zh), with genuine translations required before implementation. No formal independent approval is implied.
