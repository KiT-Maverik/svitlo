                      ## Original placement
                      
                      2. **`scene` — existing Resource block type; bespoke Scene proposed, not coded.** TableEvidenceExplorer (preserved in Scene production.specification): New table: Star 5, Moon 3, Sun 1, all in 'Number of shapes' column. Learner locates Moon=3 and selects total 9 and difference 2, with separate reveal of each explanation.
