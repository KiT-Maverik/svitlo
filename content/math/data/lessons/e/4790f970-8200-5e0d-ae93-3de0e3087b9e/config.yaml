    Provisional English-only Screenwriter source. Full original introduction, lesson-wide requirements, dependencies and review handoff:

    # One Example Is Not a Rule — Lesson Content

    **Screenwriter status:** Provisional Draft, pending explicit Methodologist approval.  
    **Source:** Draft Methodologist Brief (incorporated in this config.yaml). **Program dependence:** None. **Runtime:** Not implemented.  
    **Language:** English editorial source only, not translated learner assets.

    ## Learning experience

    A single true example is informative but cannot prove a statement about **every** possible case. By contrast, **one verified counterexample** can disprove a universal statement. The scene first teaches what the premise of a claim is, then checks whether a proposed counterexample actually meets it; this prevents children from merely selecting a visually surprising arithmetic fact.



    ## Accuracy, roles and access boundaries

    Parity refers to nonnegative whole numbers in this introductory Lesson; statements have explicitly defined domains. For the odd+odd false claim, 4+5=9 is **not** a counterexample because 4 is even, even though its sum is odd. Other valid odd pairs whose sum is even can be accepted. The Lesson teaches recognizing what examples can/cannot establish and finding counterexamples, **not** formal proof of universal truths. Preserve the two separate Target Skills in the Brief. No new inference competency ID is invented.

    All Section resources appear in an ordered **single vertical column** using available `text`/`markdown` and a **proposed** `scene`. Counterexample Detective (Scene specification embedded in this config.yaml) is editorial-only. The learning choices do not prove mastery or create Questions, quizzes, grades or persistence. Deliver nonvisual parity information, explicit condition checks, keyboard/touch/switch number selection, visible focus, reduced motion and non-color-dependent feedback. Every label, “every/some” quantifier, parity term, explanation, numbers and accessible descriptions require actual localization for all supported locales; RTL retains logical premise/conclusion and arithmetic order. The future implemented selected-locale experience must work offline after download, not assumed available now. Methodologist/editor approval remains outstanding.

