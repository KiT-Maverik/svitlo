  methodology: |
    # Recognize Shapes by Properties — Methodologist Brief
    
    Date: 2026-10-31
    Slug: recognizingPlaneFigures
    Methodologist status: Draft — not approved
    Code: [Not implemented](#)
    Program dependence: None
    
    ## Educational purpose
    
    Change the picture without changing the shape. This Lesson is an autonomous introduction to its assigned canonical competency; it must be valuable without a Program storyline or assessments.
    
    ## Target audience and depth
    
    **Primary grade: 1** (approximate ages 6–7). Early or mixed readers, multilingual learners, keyboard/switch users, low-vision users and learners who need concrete examples must receive equivalent access. **Instructional depth:** Circle, triangle, rectangle and square, varied orientation, proportions and color. Treat square as a special rectangle; avoid forcing a false exclusive classification.
    
    ## Prerequisite knowledge and Skills
    
    Notice straight and curved edges in drawings; distinguish same/different visually or with tactile equivalents. Counting to four helpful but supported.
    
    - No formal prerequisite Skill ID is claimed; foundational experiences are described above.
    
    ## Target Skills
    
    - [identify2dShapes.data.ts](../../../../data/skills/geometry/figures/skills/identify2dShapes.data.ts)
    
    ## Expected observable learning outcomes
    
    - Identify familiar flat figures despite turning, resizing or recoloring.
    - Justify identification using curved boundary, straight sides and corners where appropriate.
    - Explain that every square is a rectangle, although not every rectangle is a square.
    
    ## Essential mathematical ideas
    
    Identity depends on geometric properties, not visual decoration. A square has four equal straight sides and four right angles, so it satisfies the rectangle's defining right-angle condition. Early examples do not require formal proof.
    
    ## Conceptual progression
    
    Start with a plausible misconception, invite a prediction, make the relevant invariant or comparison observable, provide controlled learner manipulation, explain counterexamples, and finish with a fresh independent application. Short formative responses are not proof of mastery.
    
    ## Common misconceptions and boundaries
    
    A rotated square can look like a 'diamond'; children may reject a square as a rectangle; color or size can dominate attention.
    
    Exclude unneeded symbolic formalism and unrelated geometry or measurement topics. Do not change any Skill definition to match these illustrations.
    
    ## Localization, accessibility and offline
    
    All proposed language must be authentically translated for supported locales, including meaningful viewpoint and spatial-direction semantics in LTR/RTL; numerical or geometric truth must not be mirrored incorrectly. Visual manipulation needs a fully equivalent keyboard and screen-reader path, visible focus, adequate touch targets, no color-only cues, no timers, reduced motion, and WCAG 2.2 AA design verification. All assets and feedback must be available offline after download; these are **requirements, not implementation claims**.
    
    ## Sources and verification
    
    - Approved canonical Mathematics Skill file(s): linked above; their IDs, translations and methodological meaning must remain unchanged.
    - [Playground taxonomy view](../../../../docs/generated/skills/taxonomy.en.md) is a generated reference and requires coordinator regeneration after integration.
