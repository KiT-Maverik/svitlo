    # Equal Parts of One Whole — Methodologist Brief

    Date: 2026-10-31
    Slug: equalPartsOfAWhole
    Methodologist status: **Draft — pending editorial approval**
    Code: [Not implemented](#)
    Program dependence: None

    ## Educational purpose

    Recognize a chosen whole and decide whether it has been partitioned into parts of equal area, including when the equal pieces look different. The intended conceptual change is from judging by appearance or one tempting example to checking the specific mathematical condition. This lesson serves one independently assessable canonical Skill without altering its identity.

    ## Target audience

    **Primary grade: Grade 2**, approximately ages 7–8. Children can reason about area conservation before formal fraction notation; Grade 2 gives room to distinguish equal areas from similar outlines. Assume mixed literacy and language fluency: child-facing phrasing must be short and supported by visible and nonvisual equivalents.

    ## Prerequisites

    - Count groups of two and four objects.
    - Identify an entire shape and its pieces.
    - Compare the amount of identical flat paper covered by two shapes without requiring area formulas.

    Prerequisite competence is a planning assumption, not evidence of mastery. A learner lacking it needs a separate scaffold, not a new definition of the target Skill.

    ## Target Skills

    - [wholeAndEqualParts.data.ts](https://github.com/KiT-Maverik/svitlo/blob/main/content/math/data/skills/fractions/representation/skills/wholeAndEqualParts.data.ts)

    ## Expected learning outcomes

    - Point to a specific reference whole and its parts.
    - Distinguish a partition into equal-area parts from an unequal partition even when both contain two pieces.
    - Recognize that two equal halves of one rectangular sheet may be triangular rather than rectangular.
    - Explain why equal parts of different-sized wholes need not be equal in absolute size.

    Completing an exploratory interaction is not independent validation of mastery. Any later formal evidence or scoring belongs to an assessment design.

    ## Essential subject matter and instructional depth

    Use one rectangular paper sheet, its equal-area halves and quarters, and a contrasting off-center cut. Equal means equal area of the same whole, not necessarily identical shape or outline. Defer fraction symbols, numerator/denominator language, arithmetic with fractions and area formulas.

    The whole-and-equal-parts definition in canonical Skill specifies equal magnitude from the same reference whole; visual appearance alone does not establish equivalence.

    ## Conceptual progression and dependencies

    Start from the listed prerequisites, identify what information determines the answer, make a prediction, reveal a controlling comparison, and explain it before transfer. Draw a midpoint vertical cut and an off-center vertical cut on exactly the same rectangle, then place a diagonal cut as a counterexample to the 'same outline' misconception. Conceptual depth is set for this lesson's grade only; the Skill taxonomy remains grade-independent.

    ## Misconceptions, examples and boundaries

    - Two pieces must be halves merely because there are two.
    - Pieces must have the same outline in order to have equal area.
    - A half of a large sheet must equal a half of a small sheet.
    - An off-center split is equal because both pieces are called one part.

    Concrete boundaries: Use one rectangular paper sheet, its equal-area halves and quarters, and a contrasting off-center cut. Equal means equal area of the same whole, not necessarily identical shape or outline. Defer fraction symbols, numerator/denominator language, arithmetic with fractions and area formulas. Repeated exposure alone must not be presented as mastery.

    ## Localization, accessibility and offline intent

    Plan genuine translation of all learner-facing text, controls, accessible descriptions, feedback and any narration into every configured locale. Do not create language fallbacks or substitute English as missing content. For meaningful RTL layout, preserve numbers, logical mathematical direction and shape relations; do not mirror whole diagrams indiscriminately. Include full keyboard/touch and nonvisual equivalent learning actions, visible focus, sufficient targets, contrast, reduced motion, and WCAG 2.2 AA review. After an eventual offline download the complete learning experience, including feedback and Scene assets, must be available without network access; this is a requirement, not an implementation claim.

    ## Sources and factual verification

    - Canonical Mathematics source [wholeAndEqualParts.data.ts](https://github.com/KiT-Maverik/svitlo/blob/main/content/math/data/skills/fractions/representation/skills/wholeAndEqualParts.data.ts) and its methodological description.
    - Studio [Lesson architecture](https://github.com/KiT-Maverik/svitlo/blob/main/studio/docs/entities/lesson.md), [Section architecture](https://github.com/KiT-Maverik/svitlo/blob/main/studio/docs/entities/section.md), and [Lesson Content](https://github.com/KiT-Maverik/svitlo/blob/main/studio/docs/entities/lesson-content.md) descriptions.
    - The specific factual examples and edge cases must be reviewed against the canonical Skill, not used to revise it.

    ## Curriculum / Program compatibility

    This Lesson is standalone and Program-neutral. No national Curriculum, course order or Program storyline is presumed.

    ## Open editorial decisions

    - Editor must approve the Grade 2 learning depth, prerequisites, outcome coverage and target Skill relationship.
    - Screenwriter Content and Scene specifications are authorized **provisional Drafts** for review only; neither changes this Methodologist status.

    ## Methodologist handoff

    Pending explicit approval. Screenwriter content is preparatory under this task's exception to the normal approval gate, not formally approved input. Assessment, runtime Lesson data and implementation are outside this batch.
