    # Read the Value: Euro Coins and Banknotes — Content

    Status: **Provisional Draft — pending Methodologist approval**
    Target Lesson: content/playground/Data/Lessons/1/recognizeEuroCoinsAndNotes/
    Audience: Primary Grade 2
    Methodologist source: Draft Methodologist Brief (embedded in this Lesson config.yaml) (not approved)
