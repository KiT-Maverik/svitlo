    # Read the Value: Euro Coins and Banknotes — Methodologist Brief

    Date: 2026-10-31
    Slug: recognizeEuroCoinsAndNotes
    Methodologist status: Draft
    Code: [Not implemented](#)
    Program dependence: None

    ## Educational purpose

    Recognize actual denominations in an explicitly named euro currency case study, and distinguish face value from physical size or national-side design.

    ## Target audience

    **Primary grade: Grade 2.** This selection depends on mathematical complexity, prerequisites and developmental readiness, not a grade label embedded in Skill Taxonomy. Early readers can use short instructions, countable models and ordered text alternatives.

    ## Prerequisites

    Recognize numerals up to twenty, basic comparisons, and a supplied bridge that one euro equals 100 cents.

    ## Target Skills

    - [recognizeDenominations.data.ts](../../../../data/skills/money/denominations/skills/recognizeDenominations.data.ts)

    ## Expected learning outcomes

    - €2 is a coin and €5 a note.
    - Both are worth €2.
    - €1 is worth more though 50c coin is physically wider.
    - Real €5 note; no standard ordinary €5 euro coin.
    - Explain a changed-context instance using evidence rather than repeating a memorized answer; formative success is not proof of verified mastery.

    ## Essential subject matter

    Euro coins: 1,2,5,10,20,50 cents, and one/two euros. Europa-series banknotes include five and ten euros. Standard circulating five-euro coin does not exist. Fifty-cent coin diameter 24.25 mm exceeds one-euro coin diameter 23.25 mm, but one euro equals 100 cents and exceeds 50 cents in value.

    ## Conceptual progression and dependencies

    Introduce prerequisite number and object meanings → construct and inspect the first model → explain its contrast → retrieve the mathematical principle → independently apply it in the second Scene with a changed arrangement or representation.

    ## Misconceptions, examples and boundaries

    Reading 50 as greater than 1 without converting units; guessing worth from coin size; treating a five-euro banknote as proof a five-euro coin must exist; assuming national-side artwork changes worth.

    **Instructional depth and hard exclusions:** Grade 2 real euro case study; core items one- and two-euro coins plus five- and ten-euro notes; 50-cent contrast supported by explicit conversion reference. No changing currency automatically with UI locale, no purchase or exchange rates, no unlicensed banknote art.

    **Verified numerical examples:**

    - €1/€2 coins; €5/€10 banknotes.
    - €2 remains €2 irrespective of national-side artwork.
    - 50c width 24.25mm>€1 width 23.25mm; monetary 50c<100c.
    - €5 banknote exists; standard €5 coin does not.

    ## Localization, accessibility and offline intent

    Complete genuine translations for every Engine-supported language are required; English drafts are not released locale assets. Semantic RTL must preserve object identity, designated START, pairing membership, euro value and numeric order, not reverse the mathematics. WCAG 2.2 AA plan: keyboard, touch and switch operation, ordered nonvisual ledger, meaningful labels, visible focus, zoom/mobile and reduced-motion equivalents. The selected-language content and same learning interactions must function offline after download, which is a required future capability, not implemented by this task.
    The euro is an explicitly named case-study currency regardless of the learner's UI language. A different currency would require approved source-verified denomination data and editorial adaptation; it must not be silently substituted in translation.

    ## Sources and factual verification

    - Approved canonical Mathematics Skill data files directly linked above, copied unchanged in Batch 1.
    - [Lesson Editorial Artifacts](../../../../../../studio/docs/architecture/lesson-editorial-document.md) and [Learning Experience Philosophy](../../../../../../studio/docs/architecture/learning-experience-philosophy.md).
    - [Official euro source 1](https://www.ecb.europa.eu/euro/coins/html/index.en.html)
    - [Official euro source 2](https://www.ecb.europa.eu/euro/banknotes/html/index.en.html)
    - [Official euro source 3](https://economy-finance.ec.europa.eu/euro/euro-coins-and-notes/euro-coins/common-sides-euro-coins_en)

    ## Curriculum / Program compatibility

    Standalone and Program-neutral. No named Curriculum alignment asserted.

    ## Open editorial decisions

    - Editor: approve Grade 2, prerequisites, target Skills and scope before formal Content/Scene approval.
    - Editor and localization team: verify full-locale copy, semantic RTL and nonvisual equivalence.
    - Editor: approve EUR-specific pedagogy and rights/accuracy review for any later production currency artwork.

    ## Methodologist handoff

    **Draft — not Approved.** The accompanying Content and Scene specifications are **Provisional Drafts prepared under the explicit batch authorization**. Normal approval gate has not passed. Do not implement React, runtime Lesson data, Questions, Quizzes, scoring, Note persistence or undocumented APIs.
