      ## EDITORIAL SOURCES AND OPEN QUESTIONS
      
      - Methodologist Brief (preserved in production.methodology): canonical scope, age group, prerequisite knowledge, mathematical examples and one target Skill.
      - [Generated English Skill taxonomy](https://github.com/KiT-Maverik/svitlo/blob/main/content/math/docs/generated/skills/taxonomy.en.md): canonical methodological definition of finding an unknown addend; Skill source link is in the Brief.
