              2. **scene — proposed:** Liter Measure Studio (Scene specification literMeasureStudio embedded in the corresponding Scene node), placement D. New target capacity fixed **4 L**, initially empty. Pre-reveal nonvisual/visual clue: "Larger than the known three-liter target shown earlier and about four of the standard 1 L reference vessels" would **leak** answer, so instead give only "Clearly larger than a single 1 L vessel; its exact capacity is unknown." Learner chooses estimate {2,3,4 L}, then runs **four** full transfers from the fixed 1 L reference. Target states **0→1→2→3→4 L**, then "full" at 4; fifth attempted full pour is blocked without losing fluid and with feedback "The target is already full."
              3. **markdown — available:** "Four correctly filled reference measures went in before the target was full. Its capacity is **4 L**. The vessel's shape only gave an estimate; the repeated known liters gave a measured result."
            - **Feedback:** Estimate 2 L: "You expected two, but it took four known one-liter measures." Estimate 3 L: "One full measure more was needed." Estimate 4 L: "Your prediction matched the checked capacity." Choosing a half-full reference is explained and must be refilled before a full-liter step; a learner can always replay instead of being stuck.
