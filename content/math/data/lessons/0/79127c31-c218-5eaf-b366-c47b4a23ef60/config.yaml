    # Share Equally: How Many in Each Group? — Methodologist Brief

    Date: 2026-10-31
    Slug: divisionEqualSharing
    Methodologist status: Draft
    Primary audience: **Grade 2** within grades 1–3
    Code: Not implemented
    Program dependence: None

    ## Educational purpose

    Introduce partitive division through an exact, fair share: when the total and the number of groups are known, the learner must discover the size of EACH group. The distinction between the number of recipients and the number of objects in each share is the concept, not a division sign memorized ahead of the experience.

    ## Target audience

    Grade 2, selected for readiness to count and partition groups; the canonical Skill has no grade ceiling. Students need concrete models and short translated prompts, not timed fact recall.

    ## Prerequisites

    - Count groups of objects up to 20 and count how many are in each.
    - Distribute objects one-to-one across two or three labeled recipients.
    - Recognize equal groups as groups with the same amount and explain a leftover object.

    ## Target Skills

    - [equalSharing.data.ts](../../../../data/skills/arithmetic/divide/skills/equalSharing.data.ts)

    ## Expected learning outcomes

    - Share 12 counters fairly among 3 clearly labeled groups and show 4 in each.
    - Explain that 12 is the dividend/total, 3 is the known group count (divisor in this sharing story), and 4 is each group’s size.
    - Recognize that 13 counters cannot be distributed equally among 3 groups with whole counters without one left over.
    - Share 10 into 2 groups, predicting 5 in each and checking through a total count.

    ## Essential subject matter

    With an exact whole-number share, 12 objects and 3 groups give 4 each, written 12 ÷ 3 = 4. The shares must all match: 4+4+4=12. A second exact case 10 ÷ 2 = 5 uses two groups of five. When trying to share 13 counters among 3 groups, four go in each and one remains: there is NO equal share of all thirteen into three whole-number groups; do not falsely write 13 ÷ 3 = 4 as an exact identity. The remainder is observed as one leftover object without a full formal remainder algorithm. A divisor of zero is not used.

    ## Conceptual progression and dependencies

    1. **Give Everyone an Equal Share:** Start 12 uniquely identified counters in a source area and 3 empty labeled groups. Child activates 'Give one to each group' (three moves per complete round) or accessible single-step distribute; three complete rounds plus one produce four each.
    2. **What Do the Numbers Mean?:** Keep the completed twelve-counter sharing scene. Learner activates labeled positions in the expression; highlight total 12, group count 3 and per-group size 4 with full screen-reader names, then reveal 4+4+4=12.
    3. **What if One Counter Is Left?:** Fresh independent 13-counter scene, three groups; allow four fair rounds assigning twelve, then leave exactly one visibly in the source area. Narrate 'four each; one left over' and explicitly refuse to label 13÷3=4 an exact equality.
    4. **Share Ten With Two Groups:** New exact transfer with ten objects and two groups; child predicts 4/5/6, distributes or reveals the groups, then validates 5+5=10.

    ## Misconceptions, examples and boundaries

    Confusing the known three groups with the answer 'three in each'; placing twelve counters in each group (thirty-six total); calling an unequal distribution fair; pretending thirteen can be shared exactly without splitting an object; copying the size from an earlier case. A share distributes, it does not clone the original counters.

    ## Localization, accessibility and offline intent

    Every child-facing string must be genuinely localized, without silent English fallback. Distinguish the group COUNT from group SIZE in all languages; RTL must not reverse the mathematical meaning of expressions. Countable objects and their states have complete keyboard/screen-reader/table-ledger equivalents, full native touch controls, focus, zoom, reduced motion and offline deterministic calculations after downloading selected-language resources. No motor-precision drag or audio-only instructions.

    ## Sources and factual verification

    - [Canonical Skill source](../../../../data/skills/arithmetic/divide/skills/equalSharing.data.ts), identical to Mathematics source, including UUID and translations.
    - [Playground English generated taxonomy](../../../../docs/generated/skills/taxonomy.en.md), coordinator-owned view which must be regenerated after the merge.
    - [Common Core mathematics standards](https://corestandards.org/mathematics-standards/) as a comparative instructional reference, not an assertion of national grade alignment.

    ## Curriculum / Program compatibility

    Not specified. Standalone, Program-neutral. Grade 2 selected for the Lesson, not as a limitation on the Skill definition.

    ## Open editorial decisions

    - Formally introducing quotient/remainder terminology is optional for Grade 2; retain the accuracy of the non-exact case. Do not overlap the existing unknownDividend Lesson's purpose of recovering a hidden starting total.
    - Confirm concrete examples, accessible leftover representation, and age-appropriate terminology before production.

