              markdown1:
                config:
                  id: "84e247bd-ea71-5e56-bf44-c7bdc6af4b84"
                  slug: "markdown1"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      en: "A fair spinner gives both colors the same chance _on each spin_. It does not promise five of each in every short run. In this example, Run A has seven blue and three yellow."
                production:
