  methodology: |
      # The Equals Sign Means Same Value — Methodologist Brief
      
      Date: 2026-10-31
      Slug: equalsMeansSameValue
      Methodologist status: Draft
      Code: [Not implemented](#)
      Program dependence: None
      
      ## Educational purpose
      
      Build the relational meaning of = through matched collections and equivalent arithmetic expressions before treating equality as a sentence to judge.
      
      ## Target audience
      
      **Primary audience: Grade 1.** Use short clear instructions, optional audio read-aloud, large touch targets and a nonvisual text representation. This is an instructional depth decision for the Lesson, not a grade restriction on the canonical Skill.
      
      ## Prerequisites
      
      - Count collections and calculate small additions within ten; recognize + and numerals.
      
      ## Target Skills
      
      - [equalityMeaning.data.ts](https://github.com/KiT-Maverik/svitlo/blob/main/content/math/data/skills/algebra/equalities/skills/equalityMeaning.data.ts)
      
      ## Expected learning outcomes
      
      - Identify equality as two sides with the same value; explain why 3 + 2 = 4 + 1 is true; detect 4 + 2 = 4 + 3 as false without the convention that an answer must come after =; use a concrete model before symbolic explanations.
      
      ## Essential subject matter
      
      The sign = asserts sameness of value, not a request to compute. 3 + 2 and 4 + 1 both equal five; 3 + 2 = 4 + 1 is true. Reversing sides preserves equality. Two unmatched collections do not become equal when a symbol is inserted. Models may have different arrangements but equal counts.
      
      ## Conceptual progression and dependencies
      
      Move from arranging equal-sized collections to comparing two quantities; shift to both sides expressed numerically; finally interpret a reversed equality without physical objects.
      
      ## Misconceptions, examples and boundaries
      
      Misconception: 'the answer is always to the right' or 'the equals sign means now calculate'. Contrast 2 + 3 = 5, 5 = 2 + 3, 2 + 3 = 4 + 1, and false 2 + 3 = 6. Confine calculations mainly to 0–10; exclude algebraic manipulation and equality of nonnumeric objects.
      
      ## Localization, accessibility and offline intent
      
      The English examples are editorial source text; genuine translations must be authored for every supported locale before implementation. All quantities, relationships, labels, hints and feedback must remain available in text and not only color, movement or audio. Preserve mathematical relationship order in RTL; do not blindly mirror a number line. Every action needs keyboard and touch alternatives, visible focus, 200% zoom and screen-reader descriptions. Illustrations must have equivalent descriptions; motion is optional. Deliver complete instructional media for offline use; do not promise Note persistence or scoring.
      
      ## Sources and factual verification
      
      - [Canonical Mathematics Skill data](https://github.com/KiT-Maverik/svitlo/blob/main/content/math/data/skills/algebra/equalities/skills/equalityMeaning.data.ts) — preserve its competency definition and UUID.
      - [Common Core Mathematics Standards](https://corestandards.org/mathematics-standards/) — consulted only as general age-progression context, not a claim of approved Curriculum alignment.
      
      ## Curriculum / Program compatibility
      
      Not specified. This Lesson is autonomous and Program-neutral.
      
      ## Open editorial decisions
      
      - Editor must approve target grade, learning boundaries and the mapping to the linked canonical Skills before any formal Content approval.
      
      ## Methodologist handoff
      
      **Draft pending approval.** The companion Content (full original source: this Lesson's production notes) and any [Scene specifications](https://github.com/KiT-Maverik/svitlo/blob/main/content/math/data/lessons/0/92177be3-97a1-5ca4-b21a-07f0dac27f50/scenes) are provisional review materials authorized for concurrent preparation, not evidence that the Methodologist approval gate has passed.
