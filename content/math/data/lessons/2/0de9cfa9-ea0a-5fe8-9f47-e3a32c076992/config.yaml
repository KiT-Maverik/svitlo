                  slug: "section1Text1"
                  type: "text"
                  params: {}
                  locale:
                    value:
                      en: "Three separate groups have 2, 3 and 4 counters. How many counters in all?"
                production:
                  purpose: "Original text resource from source Screenwriter draft"
