  section:
    items:
      meetThreeBodies:
        config:
          id: "c63a00b7-83ef-4c34-9f7e-91109480f2a8"
          slug: "meetThreeBodies"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Три знайомі небесні тіла"
            navigationLabel:
              uk: "Три знайомі небесні тіла"
          content:
            items:
              firstThought:
                config:
                  id: "d5e3459d-9807-4f5f-9833-bc835864c0d0"
                  slug: "firstThought"
                  type: "text"
                  params: {}
                  locale:
                    value:
                      uk: "Сонце, Земля і Місяць — три різні небесні тіла. Чи однакову роботу вони виконують у космосі? Спробуй назвати їхні ролі, перш ніж читати далі. Дивитися на Сонце для цього не потрібно: ми працюємо з описами й моделями."
                production:
                  purpose: "Викликати початкову здогадку без обов'язкових спостережень."
              threeRoles:
                config:
                  id: "21a62cc4-3710-423e-b21d-caf490461429"
                  slug: "threeRoles"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Сонце — зоря.** Зорі самі випромінюють світло. Сонце — найближча до Землі зоря. Саме його світло освітлює наш день.
                        
                        **Земля — планета.** Вона не світить, як зоря: у космосі ми бачимо її освітлену Сонцем частину. Земля рухається навколо Сонця.
                        
                        **Місяць — природний супутник Землі.** Він рухається навколо Землі. Місяць не випромінює власного світла, як зоря: ми бачимо сонячне світло, відбите від нього.
                        
                        **Приклад.** Земля може виглядати яскравою на фотографії, але від цього не стає зорею. Місяць може сяяти на небі, але це не означає, що він випромінює світло сам.
                        
                        **Перевір свою здогадку:** зоря — Сонце; планета — Земля; природний супутник — Місяць. Головне — не колір і не яскравість, а природа тіла та його зв'язки з іншими.
                production:
                  purpose: "Точні означення, зрозумілий приклад і корекція можливих здогадок."
            order:
              - "firstThought"
              - "threeRoles"
        production:
          purpose: "Знайомі назви отримують чіткі різні ролі; відрізняємо власне та відбите світло."
          pedagogicalIntent: "Знайомі назви отримують чіткі різні ролі; відрізняємо власне та відбите світло."
      sunAmongStars:
        config:
          id: "eadc40d8-f950-44a5-9bc0-b96c7b239045"
          slug: "sunAmongStars"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Сонце й далекі зорі"
            navigationLabel:
              uk: "Сонце й далекі зорі"
          content:
            items:
              starsAtNight:
                config:
                  id: "3ecfd6b7-7485-4702-bc58-5c133204e558"
                  slug: "starsAtNight"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        Уяви нічне небо на малюнку: багато маленьких світних цяток. Більшість із них — дуже далекі зорі. **Сонце теж зоря!** Воно здається нам набагато більшим і яскравішим, тому що знаходиться значно ближче до Землі.
                        
                        Сонце та зорі нічного неба належать до одного типу небесних тіл. Вони не стають різними типами лише через те, що ми бачимо їх по-різному.
                        
                        На навчальному малюнку далека зоря іноді намальована такою самою великою, як Сонце. Це не означає, що їхні справжні розміри однакові: ілюстрація може бути **не в масштабі**.
                production:
                  purpose: "Розрізнити сутність зорі та її видимий вигляд, залежний від відстані."
              starPrediction:
                config:
                  id: "5534a30b-4e23-4625-99d0-3f0b04c8e46c"
                  slug: "starPrediction"
                  type: "text"
                  params: {}
                  locale:
                    value:
                      uk: "Поміркуй: якщо зоря на малюнку дуже маленька, чи можна впевнено сказати, що вона менша за Сонце? Ні. За розміром цятки на малюнку не можна дізнатися справжній розмір зорі. Можливо, вона дуже далеко. Для цього висновку не потрібно спостерігати небо вночі."
                production:
                  purpose: "Мисленнєве передбачення та негайний коригувальний зворотний зв'язок."
            order:
              - "starsAtNight"
              - "starPrediction"
        production:
          purpose: "Запобігти хибному уявленню, ніби Сонце — не зоря."
          pedagogicalIntent: "Запобігти хибному уявленню, ніби Сонце — не зоря."
      pathsAndRoles:
        config:
          id: "5156d545-ab20-424d-88f8-ee586a52e38f"
          slug: "pathsAndRoles"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Хто навколо кого рухається?"
            navigationLabel:
              uk: "Хто навколо кого рухається?"
          content:
            items:
              modelExplained:
                config:
                  id: "3cb62087-ee57-4bc8-a994-631a37aa249c"
                  slug: "modelExplained"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        Небесні тіла пов'язані між собою рухом. **Земля рухається навколо Сонця**, а **Місяць — навколо Землі**.
                        
                        Уяви дві вкладені дороги: Земля проходить свій шлях навколо Сонця; Місяць супроводжує Землю і водночас рухається навколо неї. Такий повторюваний шлях називають **орбітою**.
                        
                        Це спрощена схема зв'язків, **не карта справжніх розмірів, відстаней або швидкостей**. У реальному космосі відстані дуже великі. Тут важливо правильно назвати тіла й напрямок їхніх зв'язків.
                production:
                  purpose: "Ввести орбіту на описовому рівні та два спрямовані відношення."
              relationshipWorkbench:
                config:
                  id: "b0886d5a-a5c3-48c9-998b-fe5a94439f4a"
                  slug: "relationshipWorkbench"
                  type: "scene"
                  params: {}
                  locale:
                    value:
                      uk:
                        heading: "З'єднай небесні тіла за їхніми ролями"
                        instructions: "Визнач ролі Сонця, Землі та Місяця. Потім склади два твердження: хто навколо кого рухається."
                        sun: "Сонце"
                        earth: "Земля"
                        moon: "Місяць"
                        star: "Зоря"
                        planet: "Планета"
                        satellite: "Природний супутник"
                        chooseBody: "Обери тіло"
                        chooseRole: "Обери роль"
                        chooseTraveler: "Хто рухається?"
                        chooseCenter: "Навколо кого?"
                        goodSun: "Так. Сонце — зоря, воно випромінює світло."
                        goodEarth: "Так. Земля — планета, вона рухається навколо Сонця."
                        goodMoon: "Так. Місяць — природний супутник Землі."
                        badRole: "Не орієнтуйся на колір. Пригадай, яке тіло світить само, а яке навколо чого рухається."
                        goodEarthSun: "Так: Земля рухається навколо Сонця."
                        goodMoonEarth: "Так: Місяць рухається навколо Землі."
                        badLink: "Перевір, хто рухається, а навколо кого."
                        done: "Ти розрізнив ролі та зв'язки! Це вправа, не оцінка."
                        reset: "Почати спочатку"
                        scale: "Схема не показує справжні розміри та відстані."
                        textMode: "Текстова вправа"
                production:
                  purpose: "Безоцінкова взаємодія для відпрацювання суттєвих ролей і двох спрямованих зв'язків."
                  specification: |-
                    # Scene: роли та орбітальні зв'язки
                    **Статус:** Stage 2 blueprint, реалізація й реєстрація відкладені до Stage 6.
                    Режим «Ролі»: три підписані тіла (Сонце, Земля, Місяць) співвіднести із трьома підписаними категоріями (зоря, планета, природний супутник). Дитина вибирає спочатку тіло, потім роль. Результати: Сонце→зоря, Земля→планета, Місяць→природний супутник. Кожна спроба дає локалізований текстовий відгук; хибну відповідь дозволено змінити, немає балів чи майстерності.
                    Режим «Зв'язки»: дитина складає два спрямовані твердження «[тіло] рухається навколо [тіло]»: Земля→Сонце і Місяць→Земля. Стрілки означають зв'язок, не напрямок руху орбітою. Місяць водночас рухається із Землею навколо Сонця: не навчати, що такого руху взагалі немає. Але для локального зв'язку природного супутника в цій вправі правильна пара Місяць→Земля.
                    Показати семантичні назви та попередження «не в масштабі». Не кодувати факти лише кольором чи розміром намальованих кіл; не видавати схему за реальне співвідношення розмірів або відстаней. Рух/анімація не потрібні; за наявності врахувати reduced-motion, не залежати від WebGL.
                    Керування: доступний вибір клавішами Tab/Enter/Space й дотиком, необов'язкове перетягування, видимий фокус, скасування, повтор, кнопка початку спочатку. Правильність і підказки доступні screen reader без повторної зайвої балаканини. Для motor/vision access потрібна повністю еквівалентна текстова вправа в наступному блоці.
                    Помилка: запитати, яке тіло випромінює світло та хто навколо кого рухається; не просто «неправильно». Після успіху повідомити факти без оцінки/скору.
                    Офлайн: всі дані локальні, звук/мережа/телескоп/нічне спостереження не потрібні; не прив'язувати до drag only. На слабких пристроях використати семантичні HTML/SVG. RTL впливає тільки на інтерфейс, не змінює напрямок фізичного зв'язку.
                    Acceptance: коректні 3 класи й 2 спрямовані зв'язки; виправлення помилок; keyboard/touch/screen-reader parity; без неправильного масштабу.
                  productionNotes: "Scene та його реєстр ще відсутні; Stage 6 створює код за цим UUID, перевіряє рендер, локалізацію та доступність."
              textAlternative:
                config:
                  id: "cf394958-7885-45e5-b2ea-bd3176d1dd88"
                  slug: "textAlternative"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Та сама вправа словами — без схеми.** Прочитай або прослухай три назви: «Сонце», «Земля», «Місяць».
                        
                        1. Згадай, хто з них сам випромінює світло, хто є планетою, а хто — природним супутником.
                        2. Закінчи два речення: «Земля рухається навколо ...». «Місяць рухається навколо ...».
                        3. **Звір відповідь:** Сонце — зоря; Земля — планета; Місяць — природний супутник. Земля рухається навколо Сонця. Місяць рухається навколо Землі.
                        
                        Якщо переплутав, спитай себе: «Хто світить сам? Яка планета наша? Навколо чого рухається Місяць?» Спробуй ще раз.
                production:
                  purpose: "Повний текстовий і озвучуваний еквівалент Scene із перевіркою відповідей."
            order:
              - "modelExplained"
              - "relationshipWorkbench"
              - "textAlternative"
        production:
          purpose: "Відрізняти ролі та два спрямовані зв'язки з можливістю виправлення."
          pedagogicalIntent: "Scene не готова до Stage 6; поточний текстовий варіант самодостатній."
      transferAndRecall:
        config:
          id: "05a79a36-771c-45f9-aab1-c70bc77af902"
          slug: "transferAndRecall"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Що ще можна впізнати?"
            navigationLabel:
              uk: "Що ще можна впізнати?"
          content:
            items:
              marsExample:
                config:
                  id: "ee6fba9c-8f02-4dc9-8b2d-fbec71e2462b"
                  slug: "marsExample"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Ще один приклад планети — Марс.** На багатьох зображеннях він червонуватий. Але Марс — планета **не через колір**: як і Земля, він рухається навколо Сонця й не світить власним світлом, як зоря.
                        
                        Поміркуй: якщо тіло яскраве на картинці, чи обов'язково воно є зорею? **Ні.** Планети й супутники можуть бути яскравими завдяки відбитому сонячному світлу. А дуже далека зоря може виглядати маленькою цяткою.
                        
                        Порівняй: «Марс — планета, бо червоний» і «Марс — планета, бо він належить до планет і рухається навколо Сонця». **Другий вислів обґрунтований**: колір не визначає тип тіла.
                production:
                  purpose: "Перенести знання на іншу планету та відкинути поверхневу ознаку кольору."
              misconceptions:
                config:
                  id: "ab4356a1-d73b-4928-b0f1-d2c6269266f0"
                  slug: "misconceptions"
                  type: "text"
                  params: {}
                  locale:
                    value:
                      uk: "Знайди помилку: «Місяць світить уночі, отже він зоря». Насправді Місяць відбиває сонячне світло і є природним супутником Землі. Ще одна помилка: «Сонце — велика планета». Сонце — зоря, не планета. Виправляй висновок за природою тіла, а не за його виглядом."
                production:
                  purpose: "Відпрацювати два поширені хибні висновки зі змістовним поясненням."
              recallPrompt:
                config:
                  id: "e5a48469-ec9c-4f65-9b63-4bcd50eb8a0b"
                  slug: "recallPrompt"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Пригадай без підказки** — подумки, вголос або показуючи на слова:
                        
                        - Хто з трьох — зоря, хто — планета, хто — природний супутник?
                        - Земля рухається навколо чого? А Місяць?
                        - Чому Сонце й далекі зорі — зорі, хоч виглядають по-різному?
                        
                        **Коротка самоперевірка:** Сонце — зоря; Земля — планета; Місяць — природний супутник Землі. Земля рухається навколо Сонця, Місяць — навколо Землі. Далекі зорі здаються маленькими через велику відстань, а Сонце — найближча зоря до Землі.
                        
                        Якщо щось переплуталося, повернися до прикладів і спробуй пояснити ще раз.
                production:
                  purpose: "Незалежне відтворення, самоперевірка й виправлення."
            order:
              - "marsExample"
              - "misconceptions"
              - "recallPrompt"
        production:
          purpose: "Використати знання на прикладі Марса, діагностувати помилки й підготуватися до Quiz."
          pedagogicalIntent: "Notes plan — тільки майбутня функція: після ролей «Сонце — зоря; Земля — планета; Місяць — супутник»; після схеми «Земля навколо Сонця; Місяць навколо Землі»; після перенесення «Колір не визначає роль». Unlock API не існує: нічого не додавати до Config."
      objectRolesQuiz:
        config:
          id: "742ca5c5-d2c1-4cc2-a268-ef50ce3f07e8"
          slug: "objectRolesQuiz"
          type: "quiz"
          params: {}
          locale:
            title:
              uk: "Перевір, хто є хто"
            navigationLabel:
              uk: "Перевір себе"
          content:
            items:
              quizIntroduction:
                config:
                  id: "4948081a-8514-4e25-8d85-c5890c419799"
                  slug: "quizIntroduction"
                  type: "text"
                  params: {}
                  locale:
                    value:
                      uk: "Перевір, чи вмієш розрізняти зорю, планету й природний супутник за їхніми ознаками та пояснювати, хто навколо кого рухається. Це не перевірка пам'яті про колір чи картинку. Якщо помилишся, згадай попередні пояснення."
                production:
                  purpose: "Пояснити мету Quiz без вигадування конкретних запитань."
            order:
              - "quizIntroduction"
        production:
          purpose: "Місце для одного обов'язкового Quiz `objectRoles` на Skill 2c404b38-fbad-47f6-a70c-fe12218ac240."
          pedagogicalIntent: "AssessmentMethods classification та relationshipMapping: розрізнити зорю/планету/супутник за природою й відобразити зв'язки Земля→Сонце та Місяць→Земля."
          productionNotes: "Stage 2 навмисно не має params.selection.questionIds, grading, retries і формату оцінювання. Це НЕ повний Quiz Config. Assessment Architect та незалежний Question Bank мають забезпечити реальні переглянуті UUID, відбір, оцінювання і зворотний зв'язок. Не вигадувати заглушки. Stage 6 preflight блокуватиметься, доки банк не інтегровано."
