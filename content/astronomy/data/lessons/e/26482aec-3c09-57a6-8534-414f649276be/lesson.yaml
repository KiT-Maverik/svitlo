      uk: Сонце, Земля і Місяць — хто є хто?
  section:
    items:
      meetThreeBodies:
        config:
          id: "c63a00b7-83ef-4c34-9f7e-91109480f2a8"
          slug: "meetThreeBodies"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Три знайомі небесні тіла"
            navigationLabel:
              uk: "Три знайомі небесні тіла"
          content:
            items:
              firstThought:
                config:
                  id: "d5e3459d-9807-4f5f-9833-bc835864c0d0"
                  slug: "firstThought"
                  type: "text"
                  params: {}
                  locale:
                    value:
                      uk: "Сонце, Земля і Місяць — три різні небесні тіла. Чи однакову роботу вони виконують у космосі? Спробуй назвати їхні ролі, перш ніж читати далі. Дивитися на Сонце для цього не потрібно: ми працюємо з описами й моделями."
                production:
                  purpose: "Викликати початкову здогадку без обов'язкових спостережень."
              threeRoles:
                config:
                  id: "21a62cc4-3710-423e-b21d-caf490461429"
                  slug: "threeRoles"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Сонце — зоря.** Зорі самі випромінюють світло. Сонце — найближча до Землі зоря. Саме його світло освітлює наш день. У нашій Сонячній системі Сонце — центральна зоря: навколо нього рухаються планети, зокрема Земля.
                        
                        **Земля — планета.** Вона не світить, як зоря: у космосі ми бачимо її освітлену Сонцем частину. Земля рухається навколо Сонця.
                        
                        **Місяць — природний супутник Землі.** Він рухається навколо Землі. Місяць не випромінює власного світла, як зоря: ми бачимо сонячне світло, відбите від нього.
                        
                        **Приклад.** Земля може виглядати яскравою на фотографії, але від цього не стає зорею. Місяць може сяяти на небі, але це не означає, що він випромінює світло сам.
                        
                        **Перевір свою здогадку:** зоря — Сонце; планета — Земля; природний супутник — Місяць. Головне — не колір і не яскравість, а природа тіла та його зв'язки з іншими.
                production:
                  purpose: "Точні означення, зрозумілий приклад і корекція можливих здогадок."
            order:
              - "firstThought"
              - "threeRoles"
        production:
          purpose: "Знайомі назви отримують чіткі різні ролі; відрізняємо власне та відбите світло."
          pedagogicalIntent: "Знайомі назви отримують чіткі різні ролі; відрізняємо власне та відбите світло."
      sunAmongStars:
        config:
          id: "eadc40d8-f950-44a5-9bc0-b96c7b239045"
          slug: "sunAmongStars"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Сонце й далекі зорі"
            navigationLabel:
              uk: "Сонце й далекі зорі"
          content:
            items:
              starsAtNight:
                config:
                  id: "3ecfd6b7-7485-4702-bc58-5c133204e558"
                  slug: "starsAtNight"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        Далекі зорі на нічному небі здаються маленькими світними цятками. **Сонце теж зоря!** Воно здається нам набагато більшим і яскравішим, тому що знаходиться значно ближче до Землі.
                        
                        Коли предмет далеко, він може здаватися меншим, ніж такий самий предмет поруч. Але відстань не змінює його справжнього розміру. Так само зоря може здаватися крихітною через велику відстань. Це не означає, що всі зорі однакові за розміром.
                        
                        **Головна думка:** Сонце та далекі зорі — один тип небесних тіл. За тим, наскільки маленькою виглядає зоря, не можна визначити її справжній розмір. Для цього пояснення не потрібно ані бачити малюнок, ані спостерігати нічне небо.
                production:
                  purpose: "Розрізнити сутність зорі та її видимий вигляд, залежний від відстані."
              starPrediction:
                config:
                  id: "5534a30b-4e23-4625-99d0-3f0b04c8e46c"
                  slug: "starPrediction"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Спочатку подумай.** Далека зоря здається нам маленькою цяткою. Чи можемо ми впевнено сказати, що насправді вона менша за Сонце? Скажи «так» або «ні» подумки, вголос чи жестом, перш ніж читати пояснення.
                        
                        **Самоперевірка.** Ні. Маленька цятка не повідомляє справжнього розміру зорі. Зоря може здаватися маленькою, бо вона дуже далеко. Нам не потрібно дивитися на нічне небо, щоб це зрозуміти.
                production:
                  purpose: "Самостійне передбачення й окремий текстовий крок самоперевірки без вигаданих оцінювання чи прихованого UI."
            order:
              - "starsAtNight"
              - "starPrediction"
        production:
          purpose: "Запобігти хибному уявленню, ніби Сонце — не зоря."
          pedagogicalIntent: "Запобігти хибному уявленню, ніби Сонце — не зоря."
      pathsAndRoles:
        config:
          id: "5156d545-ab20-424d-88f8-ee586a52e38f"
          slug: "pathsAndRoles"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Хто навколо кого рухається?"
            navigationLabel:
              uk: "Хто навколо кого рухається?"
          content:
            items:
              modelExplained:
                config:
                  id: "3cb62087-ee57-4bc8-a994-631a37aa249c"
                  slug: "modelExplained"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        Небесні тіла пов'язані між собою рухом. **Земля рухається навколо Сонця**, а **Місяць — навколо Землі**.
                        
                        Уяви два пов'язані рухи: Земля рухається навколо Сонця. Місяць рухається навколо Землі й разом із нею також подорожує навколо Сонця. Шлях, яким рухається небесне тіло навколо іншого, називають **орбітою**.
                        
                        Це спрощена схема зв'язків, **не карта справжніх розмірів, відстаней або швидкостей**. У реальному космосі відстані дуже великі. Тут важливо правильно назвати тіла й напрямок їхніх зв'язків.
                production:
                  purpose: "Ввести орбіту на описовому рівні та два спрямовані відношення."
              relationshipWorkbench:
                config:
                  id: "b0886d5a-a5c3-48c9-998b-fe5a94439f4a"
                  slug: "relationshipWorkbench"
                  type: "scene"
                  params: {}
                  locale:
                    value:
                      uk:
                        heading: "З'єднай небесні тіла за їхніми ролями"
                        instructions: "Визнач ролі Сонця, Землі та Місяця. Потім склади два твердження: хто навколо кого рухається."
                        sun: "Сонце"
                        earth: "Земля"
                        moon: "Місяць"
                        star: "Зоря"
                        planet: "Планета"
                        satellite: "Природний супутник"
                        chooseBody: "Обери тіло"
                        chooseRole: "Обери роль"
                        chooseTraveler: "Хто рухається?"
                        chooseCenter: "Навколо кого?"
                        goodSun: "Так. Сонце — зоря, воно випромінює світло."
                        goodEarth: "Так. Земля — планета, вона рухається навколо Сонця."
                        goodMoon: "Так. Місяць — природний супутник Землі."
                        badRole: "Спробуй ще раз. Зоря випромінює світло сама; планета рухається навколо зорі, а природний супутник — навколо планети. Яке тіло підходить до цієї ролі?"
                        goodEarthSun: "Так: Земля рухається навколо Сонця."
                        goodMoonEarth: "Так: Місяць рухається навколо Землі."
                        badLink: "Спробуй ще раз. Спочатку назви тіло, яке рухається, потім те, навколо якого воно рухається. Земля рухається навколо Сонця; Місяць — навколо Землі."
                        done: "Ти розрізнив ролі та зв'язки! Це вправа, не оцінка."
                        reset: "Почати спочатку"
                        scale: "Схема не показує справжні розміри та відстані."
                        textMode: "Текстова вправа"
                production:
                  purpose: "Безоцінкова взаємодія для відпрацювання суттєвих ролей і двох спрямованих зв'язків."
                  specification: |-
                    # Scene: ролі та орбітальні зв'язки
                    **Статус:** Stage 2 blueprint, реалізація й реєстрація відкладені до Stage 6.
                    Режим «Ролі»: три підписані тіла (Сонце, Земля, Місяць) співвіднести із трьома підписаними категоріями (зоря, планета, природний супутник). Дитина вибирає спочатку тіло, потім роль. Результати: Сонце→зоря, Земля→планета, Місяць→природний супутник. Кожна спроба дає локалізований текстовий відгук; хибну відповідь дозволено змінити, немає балів чи майстерності.
                    Режим «Зв'язки»: дитина складає два спрямовані твердження «[тіло] рухається навколо [тіло]»: Земля→Сонце і Місяць→Земля. Стрілки означають зв'язок, не напрямок руху орбітою. Місяць водночас рухається із Землею навколо Сонця: не навчати, що такого руху взагалі немає. Але для локального зв'язку природного супутника в цій вправі правильна пара Місяць→Земля.
                    Показати семантичні назви та попередження «не в масштабі». Не кодувати факти лише кольором чи розміром намальованих кіл; не видавати схему за реальне співвідношення розмірів або відстаней. Рух/анімація не потрібні; за наявності врахувати reduced-motion, не залежати від WebGL.
                    Стан і завершення: окремо зберігати три правильно встановлені ролі та два правильно складені твердження; помилкова спроба не блокує подальших дій і не стирає правильні відповіді. Повторне натискання правильної пари не додає прогресу. Дозволити змінити вибір, виправити помилку й повторити будь-яку частину без примусового скидання; після всіх п'яти правильних відповідей показати done без балів, таймера чи блокування навігації. Reset очищує лише вправу; після reset повернути фокус до початку керувань передбачувано.
                    Керування: два підписані послідовні вибори для кожної пари; Tab для переходів, Enter/Space для активації та touch із достатніми зонами натискання. Перетягування лише як додаткова опція. Скасування поточного вибору, повтор і скидання; видимий фокус, логічний порядок читання, відсутність несподіваного перенесення фокусу. Зміст правильності й підказки оголошувати screen reader один раз через ненав'язливий live region, а не лише кольором, звуком, розміром або стрілкою. Для motor/vision access потрібна рівноцінна текстова вправа в наступному блоці, без перетягування, розрізнення кольору чи письма.
                    Помилка: badRole/badLink дають локалізовану предметну підказку і наступний крок; дозволені необмежені спроби без покарання. Після успіху оголосити відповідний good* feedback, без балів.
                    Офлайн: всі дані локальні, звук/мережа/телескоп/нічне спостереження не потрібні; не прив'язувати до drag only. На слабких пристроях використати семантичні HTML/SVG. RTL впливає тільки на інтерфейс, не змінює напрямок фізичного зв'язку.
                    Acceptance: коректні 3 класи й 2 спрямовані зв'язки; виправлення помилок; keyboard/touch/screen-reader parity; без неправильного масштабу.
                  productionNotes: "Scene та його реєстр ще відсутні; Stage 6 створює код за цим UUID, перевіряє рендер, локалізацію та доступність."
              textAlternative:
                config:
                  id: "cf394958-7885-45e5-b2ea-bd3176d1dd88"
                  slug: "textAlternative"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Та сама вправа словами — без схеми.** Ось три назви: «Сонце», «Земля», «Місяць». Відповідай подумки, вголос або вказуючи на потрібну назву: писати й перетягувати нічого не потрібно.
                        
                        1. Згадай, хто з них сам випромінює світло, хто є планетою, а хто — природним супутником.
                        2. Закінчи два речення: «Земля рухається навколо ...». «Місяць рухається навколо ...».
                        
                        Спочатку назви всі п’ять відповідей, а тоді переходь до самоперевірки.
                        
                        ---
                        
                        **Звір відповідь:** Сонце — зоря; Земля — планета; Місяць — природний супутник. Земля рухається навколо Сонця. Місяць рухається навколо Землі.
                        
                        Якщо переплутав, спитай себе: «Хто світить сам? Яка планета наша? Навколо чого рухається Місяць?» Спробуй ще раз.
                production:
                  purpose: "Повний текстовий еквівалент Scene із самоперевіркою; доступне озвучення потребує окремої перевіреної Stage 6 реалізації."
                  productionNotes: "Stage 6: забезпечити самостійно доступне читання вголос або еквівалентний локалізований офлайн-спосіб слухати цю вправу для дітей, які ще не читають; семантичний screen-reader шлях, порядок оголошення запитань/відповідей та керування перевірити на пристрої. Аудіоресурсів наразі немає; допомога дорослого не може бути єдиним способом доступу."
            order:
              - "modelExplained"
              - "relationshipWorkbench"
              - "textAlternative"
        production:
          purpose: "Відрізняти ролі та два спрямовані зв'язки з можливістю виправлення."
          pedagogicalIntent: "Практично співвіднести три тіла з їхніми ролями та скласти два спрямовані зв’язки; досягти тих самих навчальних результатів у доступній текстовій вправі без обов’язкового зору чи перетягування."
          productionNotes: "Scene ще не реалізована: Stage 6 перевіряє її з клавіатурою, touch, screen reader, reduced motion, RTL, офлайн і на слабких пристроях. Текстова вправа не є готовим озвученням: самостійний шлях для дітей, які ще не читають, потребує реалізації та перевірки."
      transferAndRecall:
        config:
          id: "05a79a36-771c-45f9-aab1-c70bc77af902"
          slug: "transferAndRecall"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Що ще можна впізнати?"
            navigationLabel:
              uk: "Що ще можна впізнати?"
          content:
            items:
              marsExample:
                config:
                  id: "ee6fba9c-8f02-4dc9-8b2d-fbec71e2462b"
                  slug: "marsExample"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Ще один приклад планети — Марс.** На багатьох зображеннях він червонуватий. Але Марс — планета **не через колір**: як і Земля, він рухається навколо Сонця й не світить власним світлом, як зоря.
                        
                        **Порівняй два об'єкти нічного неба — без спостереження й малюнка.** Сіріус — далека зоря: він сам випромінює світло. Марс — планета нашої Сонячної системи: ми бачимо сонячне світло, відбите від нього. І зоря, і планета можуть здаватися світними цятками. Лише за кольором чи яскравістю не можна впевнено визначити, хто є хто.
                        
                        Поміркуй: хто з цих двох сам випромінює світло, а хто відбиває сонячне? Чи обов'язково яскрава цятка є зорею? Спочатку дай відповіді подумки, вголос або вказавши на назви, не дивлячись на наступний рядок.
                        
                        **Перевір:** Сіріус — зоря, що випромінює світло; Марс — планета, яка відбиває сонячне світло. Ні, сама яскравість не доводить, що тіло є зорею. Планети й супутники можуть бути яскравими завдяки відбитому світлу, а далека зоря може виглядати маленькою цяткою.
                        
                        Порівняй: «Марс — планета, бо червоний» і «Марс — одна з планет Сонячної системи. Як і Земля, він рухається навколо Сонця». **Другий вислів точніший**: колір не визначає тип тіла. Самого руху навколо Сонця також замало, щоб назвати будь-яке тіло планетою: там рухаються й менші небесні тіла. Зараз нам достатньо впізнати Марс як приклад іншої планети.
                production:
                  purpose: "Порівняти далеку зорю з планетою на доступному прикладі, перенести знання на Марс і відкинути поверхневу ознаку кольору."
              misconceptions:
                config:
                  id: "ab4356a1-d73b-4928-b0f1-d2c6269266f0"
                  slug: "misconceptions"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Знайди помилку.** «Місяць світить уночі, отже він зоря». Що тут неправильно? Спочатку спробуй пояснити сам.
                        
                        **Перевір пояснення:** Місяць відбиває сонячне світло й є природним супутником Землі, а не зорею.
                        
