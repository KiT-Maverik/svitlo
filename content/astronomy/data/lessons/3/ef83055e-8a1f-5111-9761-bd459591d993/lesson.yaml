                  locale: 
                    value: 
                      uk: |-
                        ## Запис без інтерактивної вправи
                        
                        Скажи вголос, намалюй, познач значками або напиши п'ять відповідей:
                        
                        **Що?** …  
                        **Коли?** …  
                        **Де або звідки?** …  
                        **Як я це дізнався чи дізналася?** …  
                        **Які умови відомі?** …
                        
                        Якщо це навчальний опис, **назви його джерелом**, а не особистим спостереженням. Якщо чогось не знаєш, познач «не вказано».
                        
                        **Самоперевірка:** інша людина зрозуміє запис? Вона зможе відрізнити помічене від здогаду? Якщо ні, спробуй уточнити одне поле.
                production: 
                  purpose: "Рівноцінний маршрут без працюючої Scene, клавіатури, фотозапису та вимог до письма."
