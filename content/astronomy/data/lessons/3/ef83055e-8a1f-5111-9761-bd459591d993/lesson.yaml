      noticeOrGuess: 
        config: 
          id: "603dbc63-be9c-5a5a-92fe-c877090cecfe"
          slug: "noticeOrGuess"
          type: "content"
          params: {}
          locale: 
            title: 
              uk: "Що я помітив?"
            navigationLabel: 
              uk: "Що я помітив?"
          content: 
            items: 
              welcome: 
                config: 
                  id: "ab32a0f0-49e0-5c69-a34f-cec8436c33cd"
                  slug: "welcome"
                  type: "markdown"
                  params: {}
                  locale: 
                    value: 
                      uk: |-
                        # Мій перший щоденник неба
                        
                        Уяви, що друг не бачив неба, на яке ти дивився або дивилася. Як допомогти йому зрозуміти, **що ти помітив або помітила**?
                        
                        Сьогодні ти створиш короткий запис про небо. Можна використати кілька слів, значки, малюнок або усне пояснення. Довгі речення не потрібні.
                        
                        Якщо власного спостереження немає, працюй з підписаним навчальним описом. Виходити вночі, мати телескоп, робити фото чи повідомляти адресу не потрібно. Якщо дивишся на справжнє небо, **ніколи не дивися прямо на Сонце, зокрема через оптичні прилади без спеціального захисту**.
                production: 
                  purpose: "Мотивація і безпечний доступ до практики без письма, фото чи нічного виходу."
              noticeExample: 
                config: 
                  id: "7f19ac6f-2907-5889-aff3-ce29fe24f7a1"
                  slug: "noticeExample"
                  type: "markdown"
                  params: {}
                  locale: 
                    value: 
                      uk: |-
                        ## Помічена деталь, враження чи здогад?
                        
                        Уяви **вигаданий навчальний малюнок** із Місяцем і двома хмарами. Це не фотографія справжнього неба.
                        
                        - **Перевірюване:** «На малюнку є Місяць і дві хмари».
                        - **Враження:** «Небо красиве». Так можна почуватися, але це не назва побаченої деталі.
                        - **Здогад:** «Хмари з'явилися через Місяць». Малюнок не показує такої причини.
                        
                        Якщо ти лише прочитав або прочитала опис, кажи **«в описі сказано»**, а не «я бачив у небі».
                        
                        ### Спробуй
                        Яке речення дає другові перевірювану інформацію: «На малюнку дві хмари» чи «Місяць покликав хмари»? Назви або покажи його.
                        
                        **Самоперевірка:** перше описує те, що зображено. Друге вигадує причину. Якщо помилився чи помилилася, спробуй залишити тільки деталь, яку можна перевірити.
                production: 
                  purpose: "Приклад і контрприклади факту, враження та причинної здогадки; пояснювальний відгук."
            order:
              - "welcome"
              - "noticeExample"
        production: 
          purpose: "Відрізнити помічену деталь від враження і здогаду."
          pedagogicalIntent: "Короткі доступні пояснення, приклади, самостійна дія, зворотний зв'язок та перенесення без scored Quiz."
      makeARecord: 
        config: 
          id: "7d07f12a-bdaa-55d5-bb9a-b85bb06974e9"
          slug: "makeARecord"
          type: "content"
          params: {}
          locale: 
            title: 
              uk: "П'ять підказок"
            navigationLabel: 
              uk: "П'ять підказок"
          content: 
            items: 
              recordGuide: 
                config: 
                  id: "940cef95-fe46-5e87-bd83-0ad989163439"
                  slug: "recordGuide"
                  type: "markdown"
                  params: {}
                  locale: 
                    value: 
                      uk: |-
                        # П'ять підказок
                        
                        Щоб інша людина зрозуміла твій запис, дай короткі відповіді:
                        
                        1. **Що?** Який об'єкт або деталь помітні?
                        2. **Коли?** Ранок, день, вечір або відома дата.
                        3. **Де або звідки?** Загальне місце («з вікна») **або джерело** («з навчального опису»). Точну адресу і GPS не потрібно.
                        4. **Як?** Самостійно побачив, прочитав, роздивився підписане зображення чи прослухав опис?
                        5. **Умови?** Було ясно, хмарно чи щось заважало? Тільки відомі подробиці.
                        
                        Якщо чогось не знаєш, чесно познач **«не вказано»**, а не вигадуй. Значки, малюнок або коротка розповідь теж можуть бути хорошим записом.
                production: 
                  purpose: "Роз'яснити складові доступного астрономічного запису без вимоги точних особистих даних."
              workedRecord: 
                config: 
                  id: "e637e30e-06c0-54ae-a1eb-98a66b0f70c1"
                  slug: "workedRecord"
                  type: "markdown"
                  params: {}
                  locale: 
                    value: 
                      uk: |-
                        ## Приклад запису
                        
                        Ось **вигаданий навчальний опис**: «Увечері на небі видно Місяць і дві хмари. Інших подробиць немає». Це не фото реального неба й не наше особисте спостереження.
                        
                        - **Що:** Місяць і дві хмари.
                        - **Коли:** вечір — так сказано в описі.
                        - **Де або звідки:** навчальний опис «Вечірнє небо»; місце не вказано.
                        - **Як:** ми прочитали опис.
                        - **Умови:** згадані дві хмари; інших умов не вказано.
                        
                        **Готовий короткий запис:** «У навчальному описі “Вечірнє небо” сказано, що ввечері було видно Місяць і дві хмари. Місце не вказано».
                        
                        Інша людина може зрозуміти **що стало відомо і звідки**, не сплутавши опис із власним спостереженням.
                production: 
                  purpose: "Модель повного короткого запису з чесно зазначеним походженням."
              recordMistakes: 
                config: 
                  id: "1cbca476-86d5-55c7-8247-b9f8b096f3c0"
                  slug: "recordMistakes"
                  type: "markdown"
                  params: {}
                  locale: 
                    value: 
                      uk: |-
                        ## Як виправити неточність?
                        
                        **Неповний запис:** «Учора небо було красиве».
                        
                        Незрозуміло, що саме було помічено, як та звідки про це дізналися. «Красиве» — це враження.
                        
                        **Краще:** «Увечері з вікна я побачив або побачила дві хмари. Дивився або дивилася без приладів. Було хмарно».
                        
                        **Твоя черга:** обери одне пропущене поле в першому записі й скажи, як його доповнити. Якщо потрібної деталі немає, скажи **«не вказано»**. Ми оцінюємо зрозумілість відомостей, не почерк чи довжину фраз.
                production: 
                  purpose: "Надати виправний приклад і активну спробу покращити неповний запис."
            order:
              - "recordGuide"
              - "workedRecord"
              - "recordMistakes"
        production: 
          purpose: "Навчитися будувати зрозумілий запис з п'яти полів."
          pedagogicalIntent: "Короткі доступні пояснення, приклади, самостійна дія, зворотний зв'язок та перенесення без scored Quiz."
      yourSkyJournal: 
        config: 
          id: "2891b2b8-469d-5772-af1d-af309d5b6fb0"
          slug: "yourSkyJournal"
          type: "content"
          params: {}
          locale: 
            title: 
              uk: "Мій запис"
            navigationLabel: 
              uk: "Мій запис"
          content: 
            items: 
              recordTask: 
                config: 
                  id: "52d283ad-a994-5329-8845-6b542a48f49d"
                  slug: "recordTask"
                  type: "markdown"
                  params: {}
                  locale: 
                    value: 
                      uk: |-
                        # Тепер твій запис
                        
                        Обери один із двох рівноправних шляхів:
                        
                        - **Власне безпечне спостереження.** Пригадай щось, що ти вже помітив або помітила на небі. Не потрібно зараз виходити надвір і не можна дивитися прямо на Сонце.
                        - **Готовий навчальний опис.** Якщо власного спостереження немає, користуйся наступним прикладом. Він **вигаданий для тренування**; обов'язково познач це джерело.
                        
                        Заповни п'ять підказок. Можна обрати слова чи значки або сказати власну відповідь. Не потрібні адреса, фото, мікрофон чи довгий текст.
                production: 
                  purpose: "Підготувати дитину до доступного індивідуального запису з позначенням джерела."
