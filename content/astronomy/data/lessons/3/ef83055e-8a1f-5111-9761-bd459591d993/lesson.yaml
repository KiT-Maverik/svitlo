                        noScore: 
                          uk: "Тут немає оцінок. Можна виправляти."
                production: 
                  purpose: "Практичний конструктор власного структурованого запису без оцінювання."
                  specification: |-
                    # Scene — конструктор запису
                    Мета: власний запис дитини з п'ятьма полями — що, коли, де/звідки, як, умови. Це формувальне свідчення, не scored Quiz; автоматично оцінювати правдивість власних слів не можна.
                    Джерела: дитина обирає «моє безпечне спостереження» або «вигаданий навчальний опис». У прикладі відомо лише «увечері», «Місяць», «дві хмари»; решта — не вказано. Не називати його реальним астрономічним знімком. Якщо пізніше використовується справжнє фото, спершу перевірити походження, ліцензію, дату і підпис; додати офлайн-доступний текстовий опис.
                    Стани: chooseSource -> editFields -> preview -> revise/complete. П'ять незалежних семантичних полів з підписами, готові слова/значки з текстом і можливість власних слів. Для невідомої деталі — «не вказано», для пропущеного поля — конкретна підказка; для плутанини «бачив/прочитав» — запит виправити джерело; для вигаданої причини — прохання залишити лише перевірювану деталь. Перегляд дозволяє виправлення; очищення потребує підтвердження.
                    Немає балів, таймера, GPS, камери, вимоги мікрофона, зовнішнього API чи обіцянки збереження між сесіями. Доступні keyboard/touch/screen reader, focus order, текстовий live feedback, 320px, RTL, reduced motion, contrast; не покладатися тільки на колір чи піктограму. Доступний текст кнопки «Прочитати» не означає гарантований офлайн TTS. Всі тексти з locale.value.
                    Повноцінний варіант без Scene — Markdown-шаблон наступного блоку (усно, словами, малюнком або значками). Реальну React-реалізацію, реєстрацію UUID і технічні тести роблять лише на Stage 6.
                  productionNotes: "Сцену ще не реалізовано. React-компонент, registry, інтеграція, локалізації та перевірка offline/a11y залишаються для Stage 6."
              recordChecklist: 
