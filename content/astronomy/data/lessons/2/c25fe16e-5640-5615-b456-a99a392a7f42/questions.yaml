              params: {}
              locale:
                value:
                  uk: "Уяви нове місто Д, позначене на колі посередині кульки, як у моделі уроку. Щойно в місті Д настав день. Лампа нерухома, а кулька продовжує обертатися. Що згодом станеться в місті Д?"
          order:
            - "prompt"
        hint:
          items:
            hintText:
              id: "7c4e3b90-ccf1-4f74-9c91-000000000018"
              slug: "hintText"
              type: "text"
              params: {}
              locale:
                value:
                  uk: "Простеж подумки за позначкою Д, поки кулька обертається, а лампа стоїть на місці."
          order:
            - "hintText"
        explanation:
          items:
            explanationText:
              id: "7c4e3b90-ccf1-4f74-9c91-000000000019"
              slug: "explanationText"
              type: "text"
              params: {}
              locale:
                value:
                  uk: "Коли кулька продовжує обертатися, позначка Д згодом переходить з освітленого боку на неосвітлений. Тоді в місті Д настане ніч, хоча лампа не вимикалася."
          order:
            - "explanationText"
        answers:
          correct:
            items:
              correctAnswer:
                id: "7c4e3b90-ccf1-4f74-9c91-00000000001a"
