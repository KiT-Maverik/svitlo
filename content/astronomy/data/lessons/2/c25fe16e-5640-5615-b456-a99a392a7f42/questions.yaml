              locale:
                value:
                  uk: "Ліхтарик і кулька допомагають зрозуміти освітлений бік та обертання. Але їхні розміри й відстань не відповідають справжнім Сонцю та Землі."
          order:
            - "explanationText"
        answers:
          correct:
            items:
              correctAnswer:
