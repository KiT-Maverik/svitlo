                id: "7c4e3b90-ccf1-4f74-9c91-00000000001b"
                slug: "wrong1"
                type: "text"
                params: {}
                locale:
                  value:
                    uk: "У місті Д день залишиться назавжди, бо воно вже стало освітленим."
              wrong2:
                id: "7c4e3b90-ccf1-4f74-9c91-00000000001c"
                slug: "wrong2"
                type: "text"
                params: {}
                locale:
                  value:
                    uk: "Місто Д стане темним лише тоді, коли вимкнуть лампу."
