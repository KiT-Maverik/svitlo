        restrictions: []
      locale: {}
      content:
        question:
          items:
            prompt:
              id: "7c4e3b90-ccf1-4f74-9c91-000000000010"
              slug: "prompt"
              type: "text"
              params: {}
              locale:
                value:
                  uk: "На кульці є позначка Г, яка зараз на темному боці. Лампа світить, але ні лампу, ні кульку більше не рухають. Що буде в місці Г, доки модель залишається нерухомою?"
          order:
            - "prompt"
        hint:
          items:
            hintText:
              id: "7c4e3b90-ccf1-4f74-9c91-000000000011"
              slug: "hintText"
              type: "text"
              params: {}
              locale:
                value:
                  uk: "Уяви, що час іде, але положення кульки та лампи не змінюється."
          order:
            - "hintText"
        explanation:
          items:
            explanationText:
              id: "7c4e3b90-ccf1-4f74-9c91-000000000012"
              slug: "explanationText"
              type: "text"
              params: {}
              locale:
                value:
                  uk: "Коли кулька й лампа нерухомі, позначка Г залишається на тому самому темному боці. Зміна дня і ночі в моделі потребує повороту кульки."
          order:
            - "explanationText"
        answers:
          correct:
            items:
              correctAnswer:
                id: "7c4e3b90-ccf1-4f74-9c91-000000000013"
                slug: "correctAnswer"
                type: "text"
                params: {}
                locale:
                  value:
                    uk: "У місці Г залишатиметься ніч, доки кульку не повернуть."
            order:
              - "correctAnswer"
          incorrect:
            items:
              wrong1:
                id: "7c4e3b90-ccf1-4f74-9c91-000000000014"
                slug: "wrong1"
                type: "text"
                params: {}
                locale:
                  value:
                    uk: "У місці Г з часом настане день, навіть якщо нічого не рухати."
              wrong2:
                id: "7c4e3b90-ccf1-4f74-9c91-000000000015"
                slug: "wrong2"
                type: "text"
                params: {}
                locale:
                  value:
                    uk: "Нерухома лампа поступово освітить усі боки кульки."
            order:
              - "wrong1"
              - "wrong2"
          distractors:
            items: {}
            order: []
