    sameTimeDifferentPlaces:
      id: "7c4e3b90-ccf1-4f74-9c91-000000000001"
      slug: "sameTimeDifferentPlaces"
      type: "selectOneAnswer"
      params:
        assessmentMethod: "interpretation"
        restrictions: []
      locale: {}
      content:
        question:
          items:
            prompt:
              id: "7c4e3b90-ccf1-4f74-9c91-000000000002"
              slug: "prompt"
              type: "text"
              params: {}
              locale:
                value:
                  uk: "У двох далеких місцях Землі зараз по-різному: у місці К — день, а в місці Л — ніч. Сонце продовжує світити. Чому так може бути?"
          order:
            - "prompt"
        hint:
          items:
            hintText:
              id: "7c4e3b90-ccf1-4f74-9c91-000000000003"
              slug: "hintText"
              type: "text"
              params: {}
              locale:
                value:
                  uk: "Уяви кульку й ліхтарик. Поміркуй, що відрізняє два місця, якщо в них одночасно по-різному світло."
          order:
            - "hintText"
        explanation:
          items:
            explanationText:
              id: "7c4e3b90-ccf1-4f74-9c91-000000000004"
              slug: "explanationText"
              type: "text"
              params: {}
              locale:
                value:
                  uk: "Сонце освітлює не всю Землю одночасно. Місце К зараз на освітленому боці, а місце Л — на неосвітленому."
          order:
            - "explanationText"
        answers:
          correct:
            items:
              correctAnswer:
                id: "7c4e3b90-ccf1-4f74-9c91-000000000005"
                slug: "correctAnswer"
                type: "text"
                params: {}
                locale:
                  value:
                    uk: "Місце К повернене до Сонця, а місце Л — від Сонця."
            order:
              - "correctAnswer"
          incorrect:
            items:
              wrong1:
                id: "7c4e3b90-ccf1-4f74-9c91-000000000006"
                slug: "wrong1"
                type: "text"
                params: {}
                locale:
                  value:
                    uk: "Якщо Сонце світить, у всіх місцях Землі має бути день."
              wrong2:
                id: "7c4e3b90-ccf1-4f74-9c91-000000000007"
                slug: "wrong2"
                type: "text"
                params: {}
                locale:
                  value:
                    uk: "Сонце вимкнулося тільки для місця Л."
            order:
              - "wrong1"
              - "wrong2"
          distractors:
            items: {}
            order: []
    whyNightArrives:
      id: "7c4e3b90-ccf1-4f74-9c91-000000000008"
      slug: "whyNightArrives"
      type: "selectOneAnswer"
      params:
        assessmentMethod: "interpretation"
        restrictions: []
      locale: {}
      content:
        question:
          items:
            prompt:
              id: "7c4e3b90-ccf1-4f74-9c91-000000000009"
              slug: "prompt"
              type: "text"
              params: {}
              locale:
                value:
                  uk: "Біля одного будинку вдень було світло, а згодом настала ніч. Яка зміна це пояснює?"
          order:
            - "prompt"
        hint:
          items:
            hintText:
              id: "7c4e3b90-ccf1-4f74-9c91-00000000000a"
              slug: "hintText"
              type: "text"
              params: {}
              locale:
                value:
                  uk: "Уяви кульку з позначкою будинку й лампу. Що має змінитися, щоб біля будинку стало темніше?"
          order:
            - "hintText"
        explanation:
          items:
            explanationText:
              id: "7c4e3b90-ccf1-4f74-9c91-00000000000b"
              slug: "explanationText"
              type: "text"
              params: {}
              locale:
                value:
                  uk: "День змінюється ніччю, бо Земля обертається навколо своєї осі. Місце разом із Землею переходить на неосвітлений бік."
          order:
            - "explanationText"
        answers:
          correct:
            items:
              correctAnswer:
                id: "7c4e3b90-ccf1-4f74-9c91-00000000000c"
                slug: "correctAnswer"
                type: "text"
                params: {}
                locale:
                  value:
                    uk: "Будинок разом із Землею повернувся від сонячного світла."
            order:
              - "correctAnswer"
          incorrect:
            items:
              wrong1:
                id: "7c4e3b90-ccf1-4f74-9c91-00000000000d"
                slug: "wrong1"
                type: "text"
                params: {}
                locale:
                  value:
                    uk: "Сонце перестало світити всій Землі до ранку."
              wrong2:
                id: "7c4e3b90-ccf1-4f74-9c91-00000000000e"
                slug: "wrong2"
                type: "text"
                params: {}
                locale:
                  value:
                    uk: "Земля за кілька годин облетіла навколо Сонця."
            order:
              - "wrong1"
              - "wrong2"
          distractors:
            items: {}
            order: []
    stoppedGlobeKeepsNight:
      id: "7c4e3b90-ccf1-4f74-9c91-00000000000f"
