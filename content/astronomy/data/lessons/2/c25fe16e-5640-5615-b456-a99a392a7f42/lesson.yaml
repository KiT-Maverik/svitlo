      uk: Чому змінюються день і ніч
  section:
    items:
      opening:
        config:
          id: "22b4ca93-c0c9-4cc7-9de8-7c7c3523d09b"
          slug: "opening"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Де зараз день?"
            navigationLabel:
              uk: "День і ніч"
          content:
            items:
              openingQuestion:
                config:
                  id: "7dc8cb5b-fc1c-42e4-aae7-f9f521a1c7ac"
                  slug: "openingQuestion"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        Уяви знайоме вікно. Зранку надворі світлішає, а ввечері темнішає. Ми називаємо це **днем** і **ніччю**.
                        
                        **Поміркуй перед поясненням:** якщо біля твого дому день, чи обов’язково зараз день в усіх інших місцях Землі?
                        
                        Можеш відповісти вголос, показати жестом або просто обрати свою думку. Щоб міркувати про день і ніч, не треба виходити надвір або дивитися на Сонце.
                production:
                  purpose: "Викликати передбачення та спиратися на побутовий досвід без небезпечного спостереження."
              sunKeepsShining:
                config:
                  id: "f582bd87-2764-411a-ba0c-9a1001947509"
                  slug: "sunKeepsShining"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Сонце світить і вдень, і вночі.** Воно не вимикається, коли для нас настає ніч.
                        
                        Сонячне світло освітлює ту частину Землі, що звернена до Сонця. Там **день**. На частині, відверненій від Сонця, — **ніч**.
                        
                        Отже, **в той самий час** в одному місці Землі може бути день, а в іншому — ніч. Важливе не те, чи «увімкнене» Сонце, а куди звернене наше місце на Землі.
                production:
                  purpose: "Пояснити одночасність дня й ночі та спростувати уявлення про згасання Сонця."
            order:
              - "openingQuestion"
              - "sunKeepsShining"
        production:
          purpose: "Відкрити центральну проблему уроку й усунути хибну ідею про вимикання Сонця."
          pedagogicalIntent: "Передбачення → наукове пояснення → зіставлення двох місць; не оцінювати відповідь як mastery."
      model:
        config:
          id: "75d03bfe-882a-4ef1-8eee-b3c7a02026ff"
          slug: "model"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Модель із кулькою"
            navigationLabel:
              uk: "Світло й тінь"
          content:
            items:
              globeLamp:
                config:
                  id: "c24e84f0-5766-4ace-a72b-69894a846f05"
                  slug: "globeLamp"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        Уяви **круглу кульку — модель Землі**, а поруч із нею **ліхтарик — модель Сонця**. Світло ліхтарика падає на один бік кульки. Другий бік залишається неосвітленим.
                        
                        - Бік, повернений до ліхтарика, показує, де на Землі **день**.
                        - Бік, повернений від ліхтарика, показує, де **ніч**.
                        
                        Це **спрощена модель**: справжні Сонце й Земля мають інші розміри та відстань між ними. Нам потрібна лише ідея, звідки надходить світло. Якщо кульки немає, достатньо уявити її або скористатися наступною моделлю на екрані.
                production:
                  purpose: "Ввести причинно точну модель джерела світла та освітленої/неосвітленої півкулі."
              twoPlaces:
                config:
                  id: "871e9e7a-0e2b-428d-95e8-3ca59104d28b"
                  slug: "twoPlaces"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Приклад.** Позначимо на кульці два місця: **А** — на боці, зверненому до світла, і **Б** — на протилежному боці.
                        
                        1. Місце **А** освітлене: там **день**.
                        2. Місце **Б** не освітлене прямим сонячним світлом: там **ніч**.
                        
                        **Перевір своє пояснення:** в місці Б ніч не через те, що Сонце зникло. Сонце продовжує освітлювати місце А.
                        
                        А що зміниться, якщо повернути саму кульку?
                production:
                  purpose: "Дати опрацьований приклад та природно підвести до механізму обертання."
            order:
              - "globeLamp"
              - "twoPlaces"
        production:
          purpose: "Показати просторову причину різної освітленості через зрозумілий предметний аналог."
          pedagogicalIntent: "Порівняння двох визначених місць без картографії, чисел або вимоги фізичного обладнання."
          productionNotes: "Не пропонувати пряме сонячне спостереження або ліхтар із небезпечно яскравим променем; фізична демонстрація необов’язкова."
      rotation:
        config:
          id: "0edb8604-db15-4e5a-909f-14abce803e6e"
          slug: "rotation"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Чому день змінюється ніччю"
            navigationLabel:
              uk: "Земля обертається"
          content:
            items:
              rotationExplanation:
                config:
                  id: "b43aef54-9d62-4f89-a473-11755c89a7f5"
                  slug: "rotationExplanation"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Земля весь час обертається навколо своєї осі.** Вісь — це уявна лінія, навколо якої вона крутиться. Ми не відчуваємо цього повороту так, як поворот іграшки в руках.
                        
                        Коли місце на Землі повертається до сонячного світла, для нього настає день. Коли воно поступово відвертається, день змінюється ніччю. **Не Сонце щодня облітає Землю, а Земля повертається.**
                        
                        Спробуй на моделі: передбач, що буде в місці А, а тоді поверни Землю.
                production:
                  purpose: "Пояснити причину зміни часу освітлення в конкретному місці й підготувати перевірюване передбачення."
              rotationScene:
                config:
                  id: "cc37b798-2391-4ea5-b39a-98b3a3cbdb4a"
                  slug: "rotationScene"
                  type: "scene"
                  params: {}
                  locale:
                    value:
                      heading:
                        uk: "Поверни Землю"
                      introduction:
                        uk: "Сонце лишається на місці. Позначка А спочатку звернена до світла, а Б — на темному боці."
                      sunLabel:
                        uk: "Сонце"
                      earthLabel:
                        uk: "Земля"
                      placeALabel:
                        uk: "Місце А"
                      placeBLabel:
                        uk: "Місце Б"
                      dayLabel:
                        uk: "День"
                      nightLabel:
                        uk: "Ніч"
                      initialState:
                        uk: "Зараз у місці А день, у місці Б ніч."
                      changedState:
                        uk: "Земля повернулася на півоберту. Тепер у місці А ніч, у місці Б день."
                      predictionPrompt:
                        uk: "У місці А зараз день. Що буде там після півоберту Землі?"
                      dayChoice:
                        uk: "Залишиться день"
                      nightChoice:
                        uk: "Буде ніч"
                      correctFeedback:
                        uk: "Так! Місце А відвернеться від Сонця й опиниться на неосвітленому боці. Там буде ніч."
                      retryFeedback:
                        uk: "Подивись, куди повернеться місце А. Сонце не вимикається — змінюється положення Землі. Спробуй ще."
                      rotateButton:
                        uk: "Повернути Землю на півоберту"
                      resetButton:
                        uk: "Почати спочатку"
                      stateAnnouncement:
                        uk: "Опис стану моделі"
                      modelLimit:
                        uk: "Це спрощена модель освітлення. Вона не показує справжні розміри, відстані й усі особливості Землі."
                production:
                  purpose: "Практика причинного передбачення: коли конкретне місце переходить з освітленого боку на темний і навпаки."
                  specification: |-
                    # Інтерактивна модель «Поверни Землю»
                    
                    ## Навчальна мета і точна фізична модель
                    Невелика 2D-модель без 3D або мережевих залежностей. Схематичне коло Землі освітлюється умовним Сонцем справа. Ліва половина кола лишається темною, права — освітленою. Дві чітко названі позначки А і Б лежать на протилежних місцях умовного екваторіального кола: спочатку А на освітленому боці, Б — на темному. Обертання позначок навколо центру на півоберту міняє їх місцями, але джерело світла та межа освітлення НЕ обертаються разом із Землею. Це модель причинності, не карта Землі, не симуляція швидкості добового руху чи полярних областей. Ніколи не показувати так, ніби Сонце вимикається.
                    
                    ## Точна послідовність дій
                    1. Початковий стан: А звернене до Сонця (день), Б відвернене (ніч); показати підпис і структурований текст initialState.
                    2. Попросити дитину спочатку передбачити, що буде в А після півоберту. Дві альтернативи dayChoice і nightChoice — це НЕ Question Bank, НЕ оцінка, НЕ Quiz. Після вибору дати локалізоване correctFeedback або retryFeedback; помилка ніколи не блокує повтору.
                    3. Окремою дією rotateButton повернути Землю/позначки на 180°: А тепер неосвітлене (ніч), Б освітлене (день). Показати changedState; кнопка може повертати модель ще на півоберту, повертаючи початкові умови. Кнопка resetButton скидає положення, відповідь і підказку. Жодного таймера чи автоматичного повороту.
                    4. Стан моделі й наслідок повороту необхідно оголошувати текстом після кожної дії. Не змінювати освітленість усього світу і не стверджувати, що кожне географічне місце проходить полярний день/ніч за цим спрощенням.
                    5. Якщо дитина змінює стан до відповіді, оновити формулювання задачі або скинути передбачення так, щоб питання стосувалося чітко показаного початкового стану. Не залишати застарілий правильний/неправильний фідбек.
                    
                    ## Семантика і взаємодія
                    SVG або семантичний HTML; прості статичні фігури, без тексту всередині растрових зображень. Розрізняти світлу/темну ділянки підписами та візерунком, а не лише кольором. Усі дії — стандартні клавіатурні й сенсорні кнопки з видимим фокусом; немає необхідності тягнути кулю мишкою. Пояснення стану має бути доступне в окремій текстовій області; повідомлення про зміну — у ввічливому live region, без надмірних повторів. Порядок читання й кнопок логічний за локаллю, але напрямок сонячних променів та фізична схема не дзеркаляться механічно для RTL.
                    
                    ## Рівноцінний не-візуальний шлях
                    Поруч із схемою завжди текстовий опис: «А звернене до Сонця — день; Б відвернене — ніч»; після повороту стани міняються. Сліпий/незрячий учень має змогу отримати ту саму умову, зробити те саме передбачення двома кнопками і почути/прочитати причинний фідбек без потреби в SVG. Для вчителя допустимий тактильний аналог із кулькою та мітками, але не обов’язковий. Не трактувати моторні, зорові, мовні чи читацькі обмеження як неправильну відповідь.
                    
                    ## Технічні/редакційні обмеження та критерії приймання
                    Усе джерело підписів і фідбеку надходить з локалізованих Scene locale.value полів, не з hardcoded JSX. Не потребує WebGL, аудіо, зовнішніх зображень, мережі чи нової бібліотеки. Анімація необов’язкова; при prefers-reduced-motion або слабкому пристрої перемикати стан миттєво із збереженням усіх завдань і результатів. Після завантаження офлайн усі стани мають працювати локально. Перевірити обидва стани, reset, повтор після помилки, клавіатуру, screen reader, мобільну ширину, RTL, відсутність залежності від кольору і заборону автоматичної оцінки навчальної майстерності. Реального Scene-компонента/реєстрації зараз НЕ створено; це завдання Stage 6.
              rotationReflection:
                config:
                  id: "66adbb17-22a3-4b9e-b080-020cd34e6be9"
                  slug: "rotationReflection"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Згадай, що сталося на моделі.** Сонце залишилося на своєму місці, але Земля повернулася. Місце А опинилося на темному боці, тому там стала **ніч**. Місце Б опинилося на освітленому боці — там став **день**.
                        
                        Спробуй пояснити це власними словами, жестами або коротким реченням: **що повернулося і чому змінилося освітлення?** Якщо важко, повернися до моделі й спробуй ще раз.
                production:
                  purpose: "Пов'язати дію й причинне пояснення без додаткового scored-завдання."
            order:
              - "rotationExplanation"
              - "rotationScene"
              - "rotationReflection"
        production:
          purpose: "Зробити рух Землі доступним для керованого експерименту, передбачення і коригування помилки."
          pedagogicalIntent: "Передбачення → маніпуляція моделлю → негайний пояснювальний фідбек → самостійне причинне пояснення."
          productionNotes: "Сцена є запланованим ресурсом, а не реалізованим UI; Stage 6 потребує окремої реалізації та тестів a11y/offline."
      transfer:
        config:
          id: "ccfc0b58-2d23-47ea-9b67-22458aa57324"
          slug: "transfer"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Поясни по-новому"
            navigationLabel:
              uk: "Перевір пояснення"
          content:
            items:
              misconceptions:
                config:
                  id: "f70a1c23-be27-48dc-a6ab-75ee993932c1"
                  slug: "misconceptions"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        Порівняй три пояснення:
                        
                        - **«Сонце вимикається щоночі».** Ні. Сонце продовжує світити, але наше місце на Землі може бути відвернене від нього.
                        - **«Сонце щодня облітає Землю».** Ні. Чергування дня й ночі пояснює обертання **самої Землі навколо осі**.
                        - **«Якщо у мене день, то день усюди».** Ні. Одночасно інша частина Землі може не отримувати прямого сонячного світла.
                        
                        **Головна відмінність:** змінюється те, **який бік Землі повернений до Сонця**, а не те, чи світить Сонце.
                production:
                  purpose: "Дати контрприклади трьом основним помилковим причинним поясненням."
              newPlace:
                config:
                  id: "c6cf9260-b0f3-450f-9966-a6fdbd70168b"
                  slug: "newPlace"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Нова ситуація.** Уяви місце **В** на моделі Землі. Зараз воно на темному боці, тому там ніч.
                        
                        **Спочатку передбач:** що станеться, коли Земля повернеться так, що місце В опиниться на освітленому боці? Чи повинно Сонце для цього «вмикатися»?
                        
                        **Порівняй із поясненням:** у місці В настане **день**, бо воно повернеться до сонячного світла. Сонце не вимикалося — змінилося положення місця В. Якби місце В залишалося на боці, відверненому від світла, там була б ніч.
                        
                        Можеш показати своє пояснення на уявній кульці, використати позначки на моделі або розповісти його.
                production:
                  purpose: "Перенести причину зміни дня й ночі на інше умовне місце та відрізнити зміну обставин від магічного «вмикання»."
              finalRecall:
                config:
                  id: "db2fdc79-fed3-4fb8-8417-b824103f99e7"
                  slug: "finalRecall"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Спробуй згадати без підказки:**
                        
                        - Звідки на Землю приходить денне світло?
                        - Чому зараз може бути день в одному місці та ніч в іншому?
                        - Що спричиняє чергування дня й ночі в одному місці?
                        
                        **Коротка перевірка для себе:** світло йде від Сонця; звернений до нього бік Землі освітлений; Земля обертається, тому для кожного звичайного місця день і ніч змінюються.
                production:
                  purpose: "Завершити відтворенням причинного пояснення й підготувати до незалежного Quiz."
            order:
              - "misconceptions"
              - "newPlace"
              - "finalRecall"
        production:
          purpose: "Закріпити причинне розуміння, виправити міфи та перенести знання на новий приклад."
          pedagogicalIntent: "Контрприклади → нова умовна точка В → самопояснення → підготовка до Quiz."
          productionNotes: "Формувальні запитання в Markdown не є scored Questions. Розкриття зразка відповіді після власної спроби має бути педагогічно відокремлене й перевірене на Stage 3/4."
      rotationAndIlluminationQuiz:
        config:
          id: "622e900a-4f7e-47dc-9c3e-4946444cea9f"
          slug: "rotationAndIlluminationQuiz"
          type: "quiz"
          params: {}
          locale:
            title:
              uk: "Чому змінюються день і ніч: перевірка"
            navigationLabel:
              uk: "Перевір знання"
          content:
