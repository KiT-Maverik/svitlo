          slug: "opening"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Де зараз день?"
            navigationLabel:
              uk: "День і ніч"
          content:
            items:
              openingQuestion:
                config:
                  id: "7dc8cb5b-fc1c-42e4-aae7-f9f521a1c7ac"
                  slug: "openingQuestion"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        Уяви знайоме вікно. Зранку надворі світлішає, а ввечері темнішає. Ми називаємо це **днем** і **ніччю**.
                        
                        **Поміркуй перед поясненням:** якщо біля твого дому день, чи обов’язково зараз день в усіх інших місцях Землі?
                        
                        Можеш спочатку поміркувати, потім сказати свою відповідь уголос або показати жестом. Щоб міркувати про день і ніч, не треба виходити надвір або дивитися на Сонце.
                production:
                  purpose: "Викликати передбачення та спиратися на побутовий досвід без небезпечного спостереження."
              sunKeepsShining:
                config:
                  id: "f582bd87-2764-411a-ba0c-9a1001947509"
                  slug: "sunKeepsShining"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Сонце світить і вдень, і вночі.** Воно не вимикається, коли для нас настає ніч.
                        
                        Сонячне світло освітлює ту частину Землі, що звернена до Сонця. Там **день**. На частині, відверненій від Сонця, — **ніч**.
                        
                        Отже, **в той самий час** в одному місці Землі може бути день, а в іншому — ніч. Важливе не те, чи «увімкнене» Сонце, а куди звернене наше місце на Землі.
                production:
                  purpose: "Пояснити одночасність дня й ночі та спростувати уявлення про згасання Сонця."
            order:
              - "openingQuestion"
              - "sunKeepsShining"
        production:
          purpose: "Відкрити центральну проблему уроку й усунути хибну ідею про вимикання Сонця."
          pedagogicalIntent: "Передбачення → наукове пояснення → зіставлення двох місць; не оцінювати відповідь як mastery."
