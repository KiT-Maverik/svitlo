    # Як помітити зміни на небі
    
    ## Мета та межі
    Створити перше розрізнення двох повторюваних змін — освітленості під час доби та видимої освітленої частини Місяця — без уявлення, ніби це один і той самий механізм.
    
    ## Аудиторія і передумови
    Діти приблизно 6–8 років, які тільки починають навчання астрономії; читання, письмові навички, нічні спостереження і телескоп не є умовою.
    Передумови: досвід денного світла і темряви без попередніх астрономічних курсів. За відсутності власних спостережень використовувати достовірні підписані зображення або озвучені описи.
    
    ## Перевірені Skills та джерела
    - faa8f11a-cc06-42c9-8864-8151732e690a — `content/astronomy/data/skills/earthMoonAndSun/terrestrialSkyCycles/dayAndNight.ts` (перевірена канонічна таксономія).
    - 53bba831-1f84-4b25-8e05-33f54167cc98 — `content/astronomy/data/skills/earthMoonAndSun/lunarAppearance/lunarPhases.ts` (перевірена канонічна таксономія).
    
    ## Спостережувані результати
    - За знайомими прикладами відрізнити денне та нічне небо і назвати хоча б одну спостережувану відмінність.
    - Розпізнати, що видима освітлена частина Місяця на зображеннях різних дат може відрізнятися.
    - Пояснити на простому рівні, що день і ніч пов'язані з обертанням Землі, а не щоденним рухом Сонця навколо Землі; не вимагати повної геометрії фаз.
    
    ## Науково коректні опорні твердження
    - Земля обертається навколо своєї осі, тож різні ділянки її поверхні послідовно звернені до Сонця; цим пояснюється зміна дня і ночі.
    - Місяць не змінює своєї фізичної форми: з Землі видно різну частину освітленої Сонцем половини Місяця в різні моменти.
    - Доба і цикл видимого вигляду Місяця мають різні причини й тривалості; їх не можна змішувати.
    
    ## Типові помилкові уявлення
    - «Сонце облітає Землю щодоби» — це не причина дня й ночі.
    - «Місяць набуває нової фізичної форми» — ні, змінюється видима освітлена частина.
    - «Фази Місяця завжди спричиняє тінь Землі» — ні, звичайні фази пов'язані з геометрією освітлення, а тінь Землі є ключовою під час місячного затемнення.
    - «Обидва явища — той самий цикл» — ні.
    
    ## Принципова навчальна прогресія
    Від спільних спостережень «змінюється освітленість» і «вигляд Місяця інший» до виокремлення двох явищ, елементарного обґрунтування добового циклу й усвідомлення меж пояснення місячних фаз. Якщо одна Lesson виявиться когнітивно завеликою, редактор має узгодити її поділ.
    
