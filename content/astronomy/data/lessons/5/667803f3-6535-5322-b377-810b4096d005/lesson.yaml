      uk: Чому Місяць виглядає по-різному
  section:
    items:
      noticeMoon:
        config:
          id: "aeb987c1-704e-4ef6-8a93-000000000001"
          slug: "noticeMoon"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Один Місяць — різні зображення"
            navigationLabel:
              uk: "Спостерігаємо"
          content:
            items:
              openingQuestion:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000011"
                  slug: "openingQuestion"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        # Місяць щоразу інший?
                        У різні дні ми бачимо на небі Місяць. Іноді його світла частина тоненька, як серп; іноді світиться приблизно половина круга, а іноді — майже весь круг.
                        
                        **Як гадаєш:** Місяць насправді змінює форму чи змінюється те, скільки його освітленої частини ми бачимо? Можна відповісти словами, жестом або показати знайому форму.
                        
                        Поглянь на три зображення. На кожному — **той самий Місяць**, але його сфотографували у різні дні.
                production:
                  purpose: "Створити прогноз перед поясненням; не вимагати читання від учня."
              threeMoonViews:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000012"
                  slug: "threeMoonViews"
                  type: "image"
                  params:
                    fill: true
                    aspectRatio: 2.2
                    objectFit: "contain"
                  locale:
                    alt:
                      uk: "Три фотографічно достовірні вигляди того самого диска Місяця однакового розміру: на першому видно тонкий освітлений серп, на другому приблизно половину, на третьому майже повну світлу частину."
                    caption:
                      uk: "Той самий Місяць у різні дні: вузький серп, освітлена половина й майже повний диск."
                    fallback:
                      unavailable:
                        uk: "Порівняй словесні описи: вузький світлий серп; освітлена половина диска; майже весь диск освітлений."
                      offline:
                        uk: "Якщо зображення недоступне, скористайся словесним описом трьох виглядів Місяця."
                production:
                  purpose: "Порівняти спостережувані фази за надійними, окремо підтвердженими зображеннями."
                  prompt: "Три послідовні зображення видимого диска одного й того самого Місяця: тонкий серп, приблизно половина, майже повний диск. Показати однаковий розмір диска, природну освітлену форму та темну частину, без облич, очей чи вбудованих написів."
                  productionNotes: "Медіапродюсер має відібрати науково достовірні, ліцензійно придатні знімки з підтвердженими датами/фазами (наприклад NASA) або забезпечити редакційно затверджену точну схематичну альтернативу. Якщо використовуються знімки, дати та атрибуція додаються окремими локалізованими підписами, не малюються на зображенні. fileName ще не існує і свідомо не заданий. Перевірити невізуальний і локальний офлайн-еквіваленти."
              whatChanged:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000013"
                  slug: "whatChanged"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Порівняй
                        Що спільного? На кожному зображенні — та сама кругла куля Місяця. Що різниться? **Розмір і вигляд світлої частини, яку ми бачимо із Землі.**
                        
                        Зображення не показують, ніби від Місяця відрізали шматок. Темна частина не зникла — вона просто не так освітлена для нашого погляду.
                        
                        Тепер перевіримо, звідки береться світло й чому видима світла частина змінюється.
                production:
                  purpose: "Дати словесний зворотний зв'язок на прогноз та перехід до причини."
            order: ["openingQuestion", "threeMoonViews", "whatChanged"]
        production:
          purpose: "Викликати цікавість і відокремити незмінний небесний об'єкт від його видимого вигляду."
          pedagogicalIntent: "Викликати цікавість і відокремити незмінний небесний об'єкт від його видимого вигляду."
          productionNotes: "Матеріал доречний і без ілюстрації: опис трьох видів і правильне пояснення в markdown забезпечують рівноцінне базове розуміння. Фото та його фактичні дати/атрибуції перевірити при виробництві медіа."
      moonLight:
        config:
          id: "aeb987c1-704e-4ef6-8a93-000000000002"
          slug: "moonLight"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Звідки світиться Місяць"
            navigationLabel:
              uk: "Сонячне світло"
          content:
            items:
              whyLight:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000021"
                  slug: "whyLight"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        # Хто освітлює Місяць?
                        Сонце випромінює власне світло. А Місяць **не світить сам, як Сонце**: його поверхня відбиває сонячне світло, і частина цього світла потрапляє до наших очей.
                        
                        Уяви кулю, на яку світить лампа. Один її бік освітлений, а інший залишається темнішим. Так само Сонце освітлює приблизно **половину кулястого Місяця**.
                        
                        Коли Місяць рухається навколо Землі, ми бачимо **різну частину освітленої Сонцем половини**. Тому він виглядає то серпом, то наполовину освітленим, то майже повним. Сама куля не змінює форми.
                production:
                  purpose: "Доступно пояснити відбите світло, сталість кулі й зміну видимої частки."
              moonLightExplorer:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000022"
                  slug: "moonLightExplorer"
                  type: "scene"
                  params: {}
                  locale:
                    value:
                      title:
                        uk: "Лабораторія місячного світла"
                      instruction:
                        uk: "Обери вигляд Місяця. Порівняй, яку частину освітленої кулі видно із Землі."
                      crescent:
                        uk: "Видно вузький світлий серп."
                      half:
                        uk: "Видно приблизно половину освітленого диска."
                      almostFull:
                        uk: "Видно майже весь світлий диск."
                      sunLabel:
                        uk: "Сонце освітлює Місяць."
                      earthLabel:
                        uk: "Земля: звідси ми дивимося."
                      moonLabel:
                        uk: "Місяць залишається кулею."
                      viewLabel:
                        uk: "Вигляд із Землі"
                      fromAboveLabel:
                        uk: "Спрощений вигляд згори"
                      controls:
                        crescent:
                          uk: "Серп"
                        half:
                          uk: "Половина"
                        almostFull:
                          uk: "Майже повний"
                        reset:
                          uk: "Почати спочатку"
                        listen:
                          uk: "Прослухати пояснення"
                      explanation:
                        uk: "Сонце постійно освітлює приблизно половину Місяця. Із Землі ми бачимо різну частину цієї світлої половини, коли Місяць рухається."
                      reminder:
                        uk: "Це спрощена модель. Розміри й відстані не у масштабі."
                      nonvisual:
                        uk: "Три стани одного кулястого Місяця: спочатку видно тонкий освітлений серп, потім половину видимого диска, далі майже весь світлий диск. Сонце освітлює половину кулі у кожному стані."
                production:
                  purpose: "Кероване порівняння спрощених фаз і зв'язку зі світлом Сонця."
                  specification: |-
                    # Модель «Чому змінюється освітлена частина»
                    Освітня мета: дати дитині контроль над трьома зіставними виглядами того самого Місяця та зв'язати їх із сонячним освітленням, не вимагаючи тривимірної орбітальної геометрії.
                    Вхід: три явно підписані перемикачі — «Серп», «Половина», «Майже повний»; кнопка «Почати спочатку». Жодного обов'язкового перетягування, таймера, автоматичного програвання або навігації за кольором. Початковий стан — «Серп».
                    Візуалізація: один незмінний за діаметром круглий диск Місяця у вигляді з Землі; змінюється лише його світла частина. Поруч необов'язкова, але синхронна навчальна схема згори: умовні Сонце, Земля-спостерігач і Місяць в трьох коректних відносних положеннях. Сонячний напрям сталий, Сонце освітлює приблизно половину кулястого Місяця; від положення Місяця відносно Землі й Сонця залежить, яка частина цієї половини видна спостерігачеві. Перемикачі не мають самі собою створювати затемнення або ефект обрізаної фізичної кулі.
                    Стани: (1) тонкий світлий серп, (2) близько половини освітленого диска, (3) майже повний світлий диск. Кожен показує той самий фізичний Місяць; активна кнопка позначена текстом та станом pressed, не лише кольором. Не прив'язувати «серп» до конкретного лівого/правого боку: орієнтація залежить від півкулі та положення спостерігача. Фази повинні бути астрономічно узгоджені між схемою згори і диском.
                    Відгук: після кожного перемикання озвучувати через доступний status (не нав'язливо) відповідне локалізоване crescent/half/almostFull і пояснення. За повторного натискання стан не збільшує бали. «Почати спочатку» повертає початковий стан. Додатковий текст під моделлю пояснює відбиття сонячного світла.
                    Межі моделі: не показувати точний масштаб орбіт, повну геометрію восьми фаз, земну тінь як причину звичайних фаз чи Сонце як доступний для прямого споглядання об'єкт. Позначити спрощення текстом. Рух між станами факультативний; при reduced motion переходи миттєві.
                    Доступність: керування мишею, дотиком, клавіатурою (Tab, Enter/Space); помітний фокус і логічний порядок; всі підписи з uk locale.value і згодом повноцінні en/pl/qm. Динамічний текст про видиму освітлену частку має бути доступний екранному читачеві. Невізуальний еквівалент: такі самі три текстові стани, вибір кнопками і слухове/текстове пояснення. Не потрібні розпізнавання кольору, руху, просторових стрілок чи дрібного шрифту; при низькій продуктивності статичні SVG/HTML-стани зберігають той самий навчальний зміст.
                    Офлайн/ресурси: усі моделі, тексти та ефекти — локальні; ніяких зовнішніх API, потокового відео чи мережевих зображень. Stage 6 розробник має реалізувати Scene, зареєструвати UUID, написати тести відповідності трьох станів, keyboard/a11y та офлайн-сценарію.
                  productionNotes: "Requires a real registered Scene implementation at Stage 6. Localized strings are source-only in uk; no Scene exists yet. All modes, interaction feedback and offline nonvisual alternatives must be verified before publication."
              workedExample:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000023"
                  slug: "workedExample"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Приклад: два спостереження
                        Уяви, що в понеділок на зображенні видно **вузький світлий серп**, а через кілька днів — **більшу світлу частину диска**.
                        
                        **Що сталося?** Ми не спостерігали, як Місяць виріс чи змінив свою форму. Це той самий Місяць, але тепер із Землі видно більшу частину його освітленої Сонцем поверхні.
                        
                        **А де тінь Землі?** Звичайні фази — не результат того, що Земля щовечора затуляє Місяць. Коли тінь Землі справді падає на Місяць, це інше явище — *місячне затемнення*. Знати його подробиці зараз не потрібно.
                production:
                  purpose: "Пропрацювати новий випадок і коректно виправити типову помилку про земну тінь."
            order: ["whyLight", "moonLightExplorer", "workedExample"]
        production:
          purpose: "Сформувати причинне розуміння: Місяць відбиває сонячне світло, а видно різну частку освітленої півкулі."
          pedagogicalIntent: "Сформувати причинне розуміння: Місяць відбиває сонячне світло, а видно різну частку освітленої півкулі."
          productionNotes: "Схему з рухом тіл не трактувати як вимогу знання точної геометрії орбіт або назв восьми фаз; статичні описи трьох станів зберігають логіку для слабких пристроїв і невізуального режиму."
      practiceMoon:
        config:
          id: "aeb987c1-704e-4ef6-8a93-000000000003"
          slug: "practiceMoon"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Знайди правильне пояснення"
            navigationLabel:
              uk: "Тренуємося"
          content:
            items:
              detectiveIntro:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000031"
                  slug: "detectiveIntro"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        # Спробуй пояснити самостійно
                        Тепер спробуй розібратися з **новими** зображеннями. Звертай увагу не на те, з якого боку світло, а на те, **яку частину диска видно освітленою**.
                        
                        Коли помилишся, ти зможеш змінити відповідь. Це тренування, а не оцінка.
                production:
                  purpose: "Підготувати коротку формувальну вправу без оцінок і покарання за помилки."
              moonDetective:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000032"
                  slug: "moonDetective"
                  type: "scene"
                  params: {}
                  locale:
                    value:
                      title:
                        uk: "Детектив освітленого Місяця"
                      instruction:
                        uk: "Роздивися новий вигляд Місяця. Обери пояснення. Спробуй ще раз, якщо помилишся."
                      firstCase:
                        uk: "На зображенні видно вузьку світлу смужку Місяця."
                      secondCase:
                        uk: "На зображенні видно майже повний світлий диск Місяця."
                      thirdCase:
                        uk: "Два зображення показують різний поворот освітленого диска."
                      optionVisibleLight:
                        uk: "Змінилося, скільки освітленої частини видно із Землі."
                      optionChangedBody:
                        uk: "Місяць став іншою фігурою."
                      optionEarthShadow:
                        uk: "Земля щодня затуляє Місяць своєю тінню."
                      optionSameBody:
                        uk: "Це той самий круглий Місяць; його вигляд може бути повернутий на фото."
                      feedbackCorrect:
                        uk: "Так! Місяць залишається кулею. Ми бачимо різну частину поверхні, освітленої Сонцем."
                      feedbackTryAgain:
                        uk: "Спробуй знову: подумай, що насправді змінюється — сама куля чи видима світла ділянка."
                      feedbackShadow:
                        uk: "Під час звичайних фаз це не тінь Землі. Земна тінь на Місяці — окреме явище, затемнення."
                      feedbackOrientation:
                        uk: "Правильно! Поворот зображення або сторона серпа не змінює форму Місяця."
                      nextCase:
                        uk: "Наступний приклад"
                      retry:
                        uk: "Спробувати ще"
                      finish:
                        uk: "Завершити спробу"
                      noScore:
                        uk: "Це тренування, а не оцінка."
                production:
                  purpose: "Безоцінкове перенесення знань на нові та повернуті зображення."
                  specification: |-
                    # Детектив Місяця: формувальна вправа (НЕ scored Quiz)
                    Мета: перенести правило «те саме кулясте тіло / інша видима освітлена частина» на нові зображення; виявити плутанину з тінню Землі й орієнтацією без оцінювання mastery.
                    Доступні кейси: A — вузька світла смужка на незмінному диску; B — майже повний диск; C — зображення приблизно тієї самої освітленої частки, повернуте відносно іншого спостереження. Жоден кейс не потребує називати фазу, читати дати напам'ять чи знати орбітальну схему. Для A/B правильний сенс «Змінилося, скільки освітленої частини видно із Землі», а не фізична форма. Для C правильний сенс «Це той самий круглий Місяць; його вигляд може бути повернутий на фото».
                    Подача: один кейс на екрані, заголовок та короткий опис; показати диск із незалежною доступною словесною характеристикою. Запитання «Яке пояснення підходить?»; альтернативи локалізовані в locale.value (optionVisibleLight/optionChangedBody/optionEarthShadow/optionSameBody), кількість у конкретному кейсі невелика. Кнопки мають очевидні accessible names, великі цілі дотику та клавіатурний фокус. Вибір не оцінюється числовими балами.
                    Зворотний зв'язок: правильний вибір -> feedbackCorrect або feedbackOrientation із поясненням. «Місяць змінив форму» -> feedbackTryAgain, залишити можливість повторити, не приховувати навчальний контент. «Земля затулила світло» -> feedbackShadow, чітко розрізнити звичайні фази і затемнення, не поглиблюючи теми. Дозволити повтори і повернення до раніших кейсів; noScore повсякчас. Не застосовувати вимоги Question Bank, Quiz API, таймер чи градацію успіху до цієї сцени.
                    Демонстрація для розробника: незмінний розмір диска в усіх кейсах; різна частка освітлення у A/B, лише поворот у C. Не виводити висновок про фазу тільки за лівим/правим краєм або кольором. В окремому screen-reader тексті описати умову й наслідок вибору, а помилки оголошувати доброзичливо.
                    Доступний рівноцінний шлях: альтернативні текстові кейси нижче у markdown blocks цього ж розділу, які можна виконати усно/клавіатурою без візуального розпізнавання. Не показувати лише колірні відмінності. Без анімації за reduced-motion. Повністю офлайн локальні SVG/HTML, не завантажувати нічого із мережі.
