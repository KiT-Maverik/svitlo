          locale:
            title:
              uk: "Один Місяць — різні зображення"
            navigationLabel:
              uk: "Спостерігаємо"
          content:
            items:
              openingQuestion:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000011"
                  slug: "openingQuestion"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        # Місяць щоразу інший?
                        У різні дні ми бачимо на небі Місяць. Іноді його світла частина тоненька, як серп; іноді світиться приблизно половина круга, а іноді — майже весь круг. Світлої частини стає то більше, то менше, а знайомі вигляди знову повторюються.
                        
                        **Як гадаєш:** Місяць насправді змінює форму чи змінюється те, скільки його освітленої частини ми бачимо? Можна відповісти словами, жестом або показати знайому форму.
                        
                        Поглянь на три зображення. Вони показують, як **той самий Місяць** може виглядати в різні дні. Це три приклади, а не весь порядок змін.
                production:
                  purpose: "Створити прогноз перед поясненням; не вимагати читання від учня."
              threeMoonViews:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000012"
                  slug: "threeMoonViews"
                  type: "image"
                  params:
                    fill: true
                    aspectRatio: 2.2
                    objectFit: "contain"
                  locale:
                    alt:
                      uk: "Три зображення того самого диска Місяця однакового розміру: тонкий освітлений серп, приблизно половина освітленого диска й майже повний світлий диск. Це окремі приклади, а не повна послідовність фаз."
                    caption:
                      uk: "Три можливі вигляди Місяця у різні дні: вузький серп, освітлена половина й майже повний диск. Згодом освітленої частини знову стає менше."
                    fallback:
                      unavailable:
                        uk: "Порівняй словесні описи: вузький світлий серп; освітлена половина диска; майже весь диск освітлений."
                      offline:
                        uk: "Якщо зображення недоступне, скористайся словесним описом трьох виглядів Місяця."
                production:
                  purpose: "Порівняти спостережувані фази за надійними, окремо підтвердженими зображеннями."
                  prompt: "Три порівняльні, не обов'язково послідовні у часі вигляди диска того самого Місяця: тонкий серп, приблизно половина, майже повний диск. Показати однаковий розмір диска, природну освітлену форму та темну частину, без облич, очей чи вбудованих написів."
                  productionNotes: "Медіапродюсер має відібрати науково достовірні, ліцензійно придатні знімки з перевіреними фактичними датами/фазами (наприклад NASA) або забезпечити редакційно затверджену точну схематичну альтернативу. До вибору реального ресурсу не називати цей блок фотографіями чи датованими знімками. Для справжніх фото додати підтверджені дати, джерело й атрибуцію окремими локалізованими підписами; для ілюстрацій зазначити, що це схема. Не вбудовувати текст у зображення. fileName ще не існує і свідомо не заданий. Перевірити невізуальний і локальний офлайн-еквіваленти."
              whatChanged:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000013"
                  slug: "whatChanged"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Порівняй
                        Що спільного? На кожному зображенні — та сама кругла куля Місяця. Що різниться? **Розмір і вигляд світлої частини, яку ми бачимо із Землі.**
                        
                        Зображення не показують, ніби від Місяця відрізали шматок. Темна частина не зникла — вона просто не так освітлена для нашого погляду.
                        
                        Після того як світлої частини видно багато, її може ставати менше: знову видно половину, а згодом серп. Такі зміни повторюються. Три зображення вище — лише приклади, а не всі кроки циклу.
                        
                        Тепер перевіримо, звідки береться світло й чому видима світла частина змінюється.
                production:
                  purpose: "Дати словесний зворотний зв'язок на прогноз та перехід до причини."
            order: ["openingQuestion", "threeMoonViews", "whatChanged"]
        production:
          purpose: "Викликати цікавість і відокремити незмінний небесний об'єкт від його видимого вигляду."
          pedagogicalIntent: "Викликати цікавість і відокремити незмінний небесний об'єкт від його видимого вигляду."
          productionNotes: "Матеріал доречний і без ілюстрації: опис трьох видів і правильне пояснення в markdown забезпечують рівноцінне базове розуміння. Фото та його фактичні дати/атрибуції перевірити при виробництві медіа."
      moonLight:
        config:
          id: "aeb987c1-704e-4ef6-8a93-000000000002"
          slug: "moonLight"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Звідки світиться Місяць"
            navigationLabel:
              uk: "Сонячне світло"
          content:
            items:
              whyLight:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000021"
                  slug: "whyLight"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        # Хто освітлює Місяць?
                        Сонце випромінює власне світло. А Місяць **не світить сам, як Сонце**: його поверхня відбиває сонячне світло, і частина цього світла потрапляє до наших очей.
                        
                        Уяви кулю, на яку світить лампа. Один її бік освітлений, а інший залишається темнішим. Так само Сонце освітлює приблизно **половину кулястого Місяця**.
                        
                        Коли Місяць рухається навколо Землі, ми бачимо **різну частину освітленої Сонцем половини**. Тому він виглядає то серпом, то наполовину освітленим, то майже повним. Потім видима світла частина може ставати меншою, і знайомі вигляди повторюються. Сама куля не змінює форми.
                production:
                  purpose: "Доступно пояснити відбите світло, сталість кулі й зміну видимої частки."
              moonLightExplorer:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000022"
                  slug: "moonLightExplorer"
                  type: "scene"
                  params: {}
                  locale:
                    value:
                      title:
                        uk: "Лабораторія місячного світла"
                      instruction:
                        uk: "Обери вигляд Місяця. Порівняй, яку частину освітленої кулі видно із Землі."
                      crescent:
                        uk: "Видно вузький світлий серп."
                      half:
                        uk: "Видно приблизно половину освітленого диска."
                      almostFull:
                        uk: "Видно майже весь світлий диск."
                      sunLabel:
                        uk: "Сонце освітлює Місяць."
                      earthLabel:
                        uk: "Земля: звідси ми дивимося."
                      moonLabel:
                        uk: "Місяць залишається кулею."
                      viewLabel:
                        uk: "Вигляд із Землі"
                      fromAboveLabel:
                        uk: "Спрощений вигляд згори"
                      controls:
                        crescent:
                          uk: "Серп"
                        half:
                          uk: "Половина"
                        almostFull:
                          uk: "Майже повний"
                        reset:
                          uk: "Почати спочатку"
                      explanation:
                        uk: "Сонце освітлює приблизно половину Місяця. Із Землі видно то більшу, то меншу частину цього освітлення. Згодом схожі вигляди повторюються."
                      causalCue:
                        uk: "У кожному прикладі Сонце освітлює приблизно половину кулястого Місяця. Змінюється те, скільки цієї освітленої частини видно із Землі."
                      reminder:
                        uk: "Це спрощена модель. Розміри й відстані не у масштабі."
                      nonvisual:
                        uk: "Три окремі приклади того самого кулястого Місяця: тонкий світлий серп, половина видимого диска, майже повний світлий диск. Це не всі фази й не обов’язковий порядок. Після майже повного Місяця освітленої частини знову може ставати менше; знайомі вигляди повторюються."
                      unavailable:
                        uk: "Модель не відкрилася. Ті самі три вигляди Місяця описано словами. Можеш продовжити з поясненням і прикладом нижче."
                      continueWithoutScene:
                        uk: "Продовжити без інтерактивної моделі"
                production:
                  purpose: "Кероване порівняння спрощених фаз і зв'язку зі світлом Сонця."
                  specification: |-
                    # Модель «Чому змінюється освітлена частина»
                    Освітня мета: дати дитині контроль над трьома зіставними виглядами того самого Місяця та зв'язати їх із сонячним освітленням, не вимагаючи тривимірної орбітальної геометрії.
                    Вхід: три явно підписані перемикачі — «Серп», «Половина», «Майже повний»; кнопка «Почати спочатку». Жодного обов'язкового перетягування, таймера, автоматичного програвання або навігації за кольором. Початковий стан — «Серп».
                    Візуалізація: один незмінний за діаметром круглий диск Місяця у вигляді з Землі; змінюється лише його світла частина. ОБОВ'ЯЗКОВИЙ причинний орієнтир навіть без схеми орбіти: поруч проста статична куля, на яку світить позначене Сонце, і приблизно половина цієї кулі освітлена в усіх трьох прикладах (без твердження, що це назавжди та сама фізична півкуля). Незмінний напис causalCue та підпис «Вигляд із Землі» зв'язують освітлення кулі з видимим диском; перемикання змінює тільки показану спостерігачеві частку освітлення та її текстовий опис, а не розмір кулі чи джерело світла. Це два прості узгоджені статичні HTML/SVG-подання, також для слабкого пристрою; не просто перемальовування трьох іконок без пояснення причини. Поруч необов'язкова, але синхронна навчальна схема згори: умовні Сонце, Земля-спостерігач і Місяць в трьох коректних відносних положеннях. Сонячний напрям сталий у цій схемі, Сонце освітлює приблизно половину кулястого Місяця; від положення Місяця відносно Землі й Сонця залежить, яка частина цієї половини видна спостерігачеві. Перемикачі не мають самі собою створювати затемнення або ефект обрізаної фізичної кулі.
                    Стани: (1) тонкий світлий серп, (2) близько половини освітленого диска, (3) майже повний світлий диск. Це три незалежно вибирані приклади, а не часові кроки чи повний цикл; після майже повного вигляду освітленої частини знову стає менше й знайомі вигляди повторюються. Обов'язково показати це в пояснювальному тексті та невізуальному описі, не вимагати восьми назв фаз. Кожен стан показує той самий фізичний Місяць; активна кнопка позначена текстом та станом pressed, не лише кольором. Не прив'язувати «серп» до конкретного лівого/правого боку: орієнтація залежить від півкулі та положення спостерігача. Фази повинні бути астрономічно узгоджені між схемою згори і диском.
                    Відгук: після кожного перемикання оновлювати видимий текстовий опис і ненав'язливий доступний status (для екранного читача) відповідним локалізованим crescent/half/almostFull; завжди показувати причинний causalCue і explanation, а не лише іншу форму диска. Окремого аудіопрогравача та кнопки прослуховування немає: дитина може скористатися стандартним читанням екрана. За повторного натискання стан не збільшує бали. «Почати спочатку» повертає початковий стан. Додатковий текст під моделлю пояснює відбиття сонячного світла та повторення фаз.
                    Межі моделі: не показувати точний масштаб орбіт, повну геометрію восьми фаз, земну тінь як причину звичайних фаз чи Сонце як доступний для прямого споглядання об'єкт. Позначити спрощення текстом. Рух між станами факультативний; при reduced motion переходи миттєві.
                    Доступність: керування мишею, дотиком, клавіатурою (Tab, Enter/Space); помітний фокус і логічний порядок; всі підписи з uk locale.value і згодом повноцінні en/pl/qm. Динамічний текст про видиму освітлену частку має бути доступний екранному читачеві. Невізуальний еквівалент: ті самі три текстові стани, вибір кнопками, постійний causalCue про освітлену Сонцем половину кулі, словесне порівняння видимої із Землі частини для кожного стану й доступне для екранного читача текстове пояснення циклу; без власного аудіоконтролю або необхідності мати аудіофайл. Не потрібні розпізнавання кольору, руху, просторових стрілок чи дрібного шрифту; при низькій продуктивності статичні SVG/HTML-стани зберігають той самий навчальний зміст.
                    Відмова / рівноцінний шлях: відсутня реєстрація Scene, помилка завантаження JS-чанка, несправність графіки або офлайн без чанка НЕ повинні обвалювати Section чи приховувати whyLight і workedExample. Stage 6 має передбачити локальне ізолювання помилки/доступний стан очікування замість поточного порожнього Suspense: показати локалізовані unavailable і continueWithoutScene, постійний causalCue, nonvisual та три статичні словесні стани; повідомити про проблему ненав'язливим live-status, після дії перенести фокус до наступного пояснення, залишити навігацію уроком. Обов'язковий для доступу зміст не залежить від успішного Scene-рендерингу; все це поки виробнича вимога, не наявна можливість UI Kit. Перевірити примусово відсутню реєстрацію і офлайн-невдале завантаження окремими тестами.
                    Офлайн/ресурси: усі моделі, тексти та ефекти — локальні; ніяких зовнішніх API, потокового відео чи мережевих зображень. Stage 6 розробник має реалізувати Scene, зареєструвати UUID, написати тести відповідності трьох станів, keyboard/a11y та офлайн-сценарію.
                  productionNotes: "Requires a real registered Scene implementation at Stage 6. Localized strings are source-only in uk; no Scene exists yet. All modes, interaction feedback and offline nonvisual alternatives must be verified before publication."
              workedExample:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000023"
                  slug: "workedExample"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Приклад: два спостереження
                        Уяви, що в понеділок на зображенні видно **вузький світлий серп**, а через кілька днів — **більшу світлу частину диска**.
                        
                        **Що сталося?** Ми не спостерігали, як Місяць виріс чи змінив свою форму. Це той самий Місяць, але тепер із Землі видно більшу частину його освітленої Сонцем поверхні.
                        
                        **А якщо світла частина згодом зменшиться?** Це теж звичайна зміна вигляду Місяця. Світлої частини стає то більше, то менше, і цикл повторюється.
                        
                        **А де тінь Землі?** Звичайні фази — не результат того, що Земля щовечора затуляє Місяць. Коли тінь Землі справді падає на Місяць, це інше явище — *місячне затемнення*. Знати його подробиці зараз не потрібно.
                production:
                  purpose: "Пропрацювати новий випадок і коректно виправити типову помилку про земну тінь."
            order: ["whyLight", "moonLightExplorer", "workedExample"]
        production:
          purpose: "Сформувати причинне розуміння: Місяць відбиває сонячне світло, а видно різну частку освітленої півкулі."
          pedagogicalIntent: "Сформувати причинне розуміння: Місяць відбиває сонячне світло, а видно різну частку освітленої півкулі."
          productionNotes: "Схему з рухом тіл не трактувати як вимогу знання точної геометрії орбіт або назв восьми фаз; статичні описи трьох станів зберігають логіку для слабких пристроїв і невізуального режиму."
      practiceMoon:
        config:
          id: "aeb987c1-704e-4ef6-8a93-000000000003"
          slug: "practiceMoon"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Знайди правильне пояснення"
            navigationLabel:
              uk: "Тренуємося"
          content:
            items:
              detectiveIntro:
                config:
                  id: "aeb987c1-704e-4ef6-8a93-000000000031"
                  slug: "detectiveIntro"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        # Спробуй пояснити самостійно
                        Тепер спробуй розібратися з **новими** зображеннями. Звертай увагу не на те, з якого боку світло, а на те, **яку частину диска видно освітленою**.
                        
