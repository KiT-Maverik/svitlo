                  script: "Ми помітили дві зміни. Удень і вночі освітлення різне. Місяць у різні дні теж виглядає по-різному. Спочатку обери, покажи або скажи запитання про день і ніч: чому вони змінюються? Потім зроби це окремо для Місяця: чому змінюється його освітлений вигляд? Для кожної теми можна обрати вже повне запитання. А якщо хочеться своє, спершу придумай і скажи або покажи повне запитання, а тоді окремо підтвердь це. Вибір способу ще не є запитанням. Нічого не потрібно записувати чи надсилати. Відповідати на запитання зараз не треба. За бажанням можна пропустити."
                  specification: "Записати цей український сценарій чітко і без музики, з короткими паузами. Можливість повтору, паузи, керування клавіатурою. Підготувати справжній UUID файл, офлайн-пакет і перевірений текстовий еквівалент у Stage 6; en/pl/qm потребують власних перекладів і узгодженого аудіосупроводу."
