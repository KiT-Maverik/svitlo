          params: {}
          locale:
            title:
              uk: "Що видно вдень і вночі?"
            navigationLabel:
              uk: "День і ніч"
          content:
            items:
              dayIntro:
                config:
                  id: "cd9659dc-1a6c-444f-a402-4800645b2fc6"
                  slug: "dayIntro"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Те саме місце, але різне освітлення
                        На **умовних навчальних схемах**, а не на фотографіях, — те саме дерево, будинок і пагорб. На одному зображенні **світліше**, на іншому **темніше**. Коли є денне світло, ми говоримо «день». Коли настає темний час — «ніч». Схема допомагає порівняти освітлення; для справжніх знімків день і ніч перевіряють також за місцем, датою та часом зйомки.
                        
                        **Порівняй:** що змінилося? Що залишилося тим самим?
                        
                        Помічати та називати відмінність — це **спостерігати**. Зараз не треба пояснювати, чому приходить ніч. І не потрібно дивитися прямо на Сонце.
                production:
                  purpose: "Відкрити тему і дати наочний порівняльний критерій."
                  productionNotes: "Авторське джерело uk готове; не вимагає окремого Runtime ресурсу."
              dayAudio:
                config:
                  id: "fd3c34f6-58a3-4738-b035-045bc27bffbe"
                  slug: "dayAudio"
                  type: "audio"
                  params: {}
                  locale:
                    title:
                      uk: "Послухай: день і ніч"
                    description:
                      uk: "Прослухай пояснення і за бажанням повтори."
                    fallback:
                      unavailable:
                        uk: "Запис наразі недоступний. Той самий зміст є в тексті уроку."
                      offline:
                        uk: "Слухай після завантаження уроку або скористайся текстом."
                      playbackError:
                        uk: "Запис не відтворився. Можна прочитати текст поруч."
                      retry:
                        uk: "Спробувати знову"
                production:
                  purpose: "Надати рівноцінний слуховий вхід без вимоги читати."
                  script: "Порівняй дві умовні схеми того самого місця. Ось дерево, будинок і пагорб. Удень місце освітлює денне світло. Уночі денного світла немає, хоча можуть світити ліхтарі. Навіть у похмурий день залишається день. А Місяць іноді видно і вдень. Тому за самим Місяцем, хмарами чи ліхтарями не визначають день або ніч. На справжніх знімках допомагають перевірені місце, дата і час зйомки. Що змінилося між схемами? А що залишилося тим самим? Це спостереження. Не дивися прямо на Сонце."
                  specification: "Записати цей український сценарій чітко і без музики, з короткими паузами. Можливість повтору, паузи, керування клавіатурою. Підготувати справжній UUID файл, офлайн-пакет і перевірений текстовий еквівалент у Stage 6; en/pl/qm потребують власних перекладів і узгодженого аудіосупроводу."
                  productionNotes: "У Stage 2 сценарій готовий, але аудіофайл не існує. Немає вигаданого fileName. Сусідній Markdown забезпечує текстовий еквівалент, але цей вступний аудіоблок НЕ замінює потрібні озвучені стани, варіанти і feedback Scene. У Stage 6 забезпечити її незалежний озвучений шлях без читання за Scene production.specification."
              dayScene:
                config:
                  id: "80ecd1b4-8405-41ad-ac71-bd97d0f2c9e8"
                  slug: "dayScene"
                  type: "scene"
                  params: {}
                  locale:
                    value:
                      prompt:
                        uk: "Порівняй два зображення того самого місця."
                      first:
                        uk: "День: дерево, будинок і пагорб при денному освітленні."
                      second:
                        uk: "Ніч: ті самі дерево, будинок і пагорб у темряві."
                      dayLabel:
                        uk: "Денне освітлення"
                      nightLabel:
                        uk: "Нічна темрява"
                      showDay:
                        uk: "Показати день"
                      showNight:
                        uk: "Показати ніч"
                      showBoth:
                        uk: "Порівняти разом"
                      whatChanged:
                        uk: "Що помітно змінилося?"
                      lightChoice:
                        uk: "Стало світліше або темніше"
                      placeChoice:
                        uk: "Змінилося саме місце"
                      lightFeedback:
                        uk: "Так, на одному малюнку світліше, на другому темніше."
                      placeFeedback:
                        uk: "Дерево, будинок і пагорб залишилися. Змінилося освітлення."
                      whatSame:
                        uk: "Що залишилося тим самим?"
                      sameFeedback:
                        uk: "Той самий краєвид!"
                      evidencePrompt:
                        uk: "А тепер порівняй два перевірені знімки того самого місця: один удень, інший уночі."
                      evidenceDayLabel:
                        uk: "Перевірений знімок удень"
                      evidenceNightLabel:
                        uk: "Перевірений знімок уночі"
                      evidenceSourceNote:
                        uk: "Це справжні знімки, не навчальні схеми. Місце, дата й час кожного знімка вказані окремо."
                      hint:
                        uk: "Поглянь, чи змінилися обриси предметів."
                      again:
                        uk: "Порівняти ще раз"
                      voiceControls:
                        speak:
                          uk: "Прослухати підпис, вибір або відгук"
                        repeat:
                          uk: "Повторити озвучення"
                        pause:
                          uk: "Зупинити озвучення"
                production:
                  purpose: "Дати дитині порівняти той самий краєвид при різній освітленості."
                  specification: |-
                    Навчальна Scene для спостереження, а не причинного пояснення.
                    Ілюстративна пара: два SVG того самого ВИГАДАНОГО краєвиду з будинком, деревом і пагорбом. Контур, масштаб і предмети незмінні; на першій панелі світло, на другій темно. Явно назвати умовними навчальними схемами, не фотографіями або документованими спостереженнями. Не робити Сонце, зорі, Місяць, лампу або погоду вирішальними ознаками дня й ночі.
                    ОБОВ'ЯЗКОВА окрема доказова пара для Stage 6: знайти ДВА реальні фотографічні або архівні документовані кадри того самого місця (або методологічно допустимих зіставних місць), із підтверджено різними часами зйомки — один у денний період, один у нічний. Це конкретні два різночасові спостереження одного/зіставного краєвиду, НЕ повторно затемнений кадр, вигадані SVG, складений з різних епох колаж без походження чи художній рендер. Для КОЖНОГО кадру до Stage 6 finalization зафіксувати справжні оригінальні URL/архівний запис, автора/правовласника, дозвіл або ліцензію, місце/географічну прив'язку, дату, локальний час і часовий пояс (або переведений UTC), джерело й спосіб перевірки часу. Незалежно звірити дату, координати й час з астрономічними даними сходу/заходу Сонця (наприклад, USNO) і з документацією першоджерела; перевірити, що різницю не створили тільки експозиція, штучне освітлення чи хмари. Відхилити кадри без доказової прив'язки, невизначені права або фото, які помилково приписують одному місцю. У Stage 2 такої підтвердженої пари та ліцензій ЩЕ НЕ ВИБРАНО; не вписувати вигаданих дат, часу, джерела або назви файлів. Відсутність успішно верифікованої пари перед Stage 6 — BLOCKER, не замінювати її SVG.
                    Відокремити два навчальні режими: (А) умовна схема для простого порівняння незмінних предметів; (Б) підтверджені реальні знімки для перевірки фактичного дня/ночі. Не називати SVG доказом фактичної пори доби. Коли реальні кадри будуть законно підібрані, вивести для кожного дата/час/місце/атрибуція в локалізованих підписах і в незоровому/озвученому описі. Порядок двох кадрів не повинен залежати від кольору чи RTL; не приховувати будь-який з них офлайн. До підготовки реальної пари Stage 6 не позначати ресурс чи Lesson як завершений.
                    Кроки: спочатку обидва підписані стани УМОВНОЇ схеми; кнопки вибрати один і повернути порівняння; запитання, що змінилося, та що залишилось; запропонувати варіанти про освітлення/зміну місця. Після схеми — явно окрема пара верифікованих денного й нічного кадрів із датою, часом, місцем та доступною атрибуцією, де дитина ще раз описує відмінність. Будь-який вибір супроводжується локалізованим поясненням: освітлення інше, але той самий пейзаж. Немає балів, таймерів, перевірки mastery, Quiz чи зовнішніх Question ID. Дозволити повтор і перехід незалежно від вибору.
                    Всі тексти контролів і відгуків брати з scene locale.value, без hardcoded української в коді. Клавіатура, дотик, focus order, screen reader, live region, не кольоровий єдиний сигнал. Дві структуровані невізуальні описи та статична пара потрібні і без SVG/анімації; на 320px без горизонтальної прокрутки. RTL міняє лише семантичне компонування, не науковий зміст. Reduced motion — без переходів. Весь компонент працює локально без мережі й на слабкому пристрої.
                    Для дитини, яка ще не читає: кожен основний підпис, вибір, стан, підказка й feedback має кероване окреме озвучення на вимогу (велика кнопка зі зрозумілою піктограмою; повтор і пауза). На Stage 6 записати та упакувати офлайн-озвучення UK для ключів scene locale.value: prompt, first, second, dayLabel, nightLabel, showDay, showNight, showBoth, whatChanged, lightChoice, placeChoice, lightFeedback, placeFeedback, whatSame, sameFeedback, evidencePrompt, evidenceDayLabel, evidenceNightLabel, evidenceSourceNote, hint, again і voiceControls. Підписи з фактичними датою, часом, місцем і джерелом для двох верифікованих кадрів, коли вони будуть відібрані, також мають бути повністю озвучені та доступні офлайн. Після вибору озвучити відповідний feedback, навіть без уміння читати. Ніяких обов'язкових автовідтворень чи мережевих TTS. Локальний TTS допустимий тільки після перевірки наявного українського голосу й повного offline-тесту на підтримуваних пристроях; інакше потрібні локальні записані кліпи для кожного ключа. Паралельно зберегти текст і screen-reader еквівалент, керування з клавіатури/дотику без звуку; дорослий читач — додаткова допомога, не єдина можливість. У Stage 2 записи й UUID бінарних файлів ще НЕ створені.
                  productionNotes: "Scene та реєстрація компонента ще не виконані. Stage 6 має реалізувати і перевірити SVG, доступність, точність джерел, RTL та офлайн."
              dayExplain:
                config:
                  id: "f7ac388e-f6b5-4521-a67c-18a80ab96ac2"
                  slug: "dayExplain"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ### Відмінність не означає, що предмети зникли
                        Коли темно, дерево й будинок залишаються на своєму місці — їх лише важче побачити. Вуличний ліхтар може світити вночі, але не перетворює ніч на день.
                        
                        **Місяць іноді видно і вдень.** Тому не можна визначати день чи ніч лише за Місяцем, зорями, хмарами або штучними ліхтарями.
                        
                        Ми вже помітили зміну освітленості. Пізніше можна поставити інше запитання: **чому змінюються день і ніч?**
                production:
                  purpose: "Виправити помилки про зникнення предметів і Місяць лише вночі."
                  productionNotes: "Авторське джерело uk готове; не вимагає окремого Runtime ресурсу."
              dayRecap:
                config:
                  id: "63dc6b4b-c9e7-4b20-b424-8a0811b443d0"
                  slug: "dayRecap"
                  type: "text"
                  params: {}
                  locale:
                    value:
                      uk: "Скажи або покажи: «На одному зображенні світліше, на іншому — темніше». Це спостереження."
                production:
                  purpose: "Закріпити опис результату без scored перевірки."
            order:
              - "dayIntro"
              - "dayAudio"
              - "dayScene"
              - "dayExplain"
              - "dayRecap"
        production:
          purpose: "Спостереження денного й нічного вигляду."
          pedagogicalIntent: "Знайомий досвід → схема → пояснювальний відгук → контрприклади."
          productionNotes: "Блоки й український текст укладено редакційно; програмні Scenes та реальне аудіо створюються лише на Stage 6."
      sMoon:
        config:
          id: "d4fa419e-75bf-4df7-a414-e2613e4227c8"
          slug: "sMoon"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Один Місяць — різні вигляди"
            navigationLabel:
              uk: "Місяць"
          content:
            items:
              moonIntro:
                config:
                  id: "a3abf8be-5714-4a13-96ed-b864e60f9fff"
                  slug: "moonIntro"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Поглянь на Місяць у різні дні
                        На двох **навчальних схемах** зображений той самий круглий Місяць. Проте те, **яка частина видимого диска освітлена**, відрізняється:
                        - **26 січня 2026 року** — перша чверть: приблизно половина видимого диска Місяця освітлена.
                        - **1 лютого 2026 року** — повня: майже весь видимий диск Місяця освітлений.
                        
                        Ці дати відповідають перевіреним астрономічним даним. Схеми **не є фотографіями**, зробленими з певного місця.
                        
                        **Що ти помічаєш?** Не треба поки пояснювати, чому видима освітлена частина Місяця змінюється.
                production:
                  purpose: "Показати дві датовані й науково підтверджені відмінності вигляду Місяця."
                  productionNotes: "Авторське джерело uk готове; не вимагає окремого Runtime ресурсу."
              moonAudio:
                config:
                  id: "1e81a98a-95a0-4f7f-869c-7baa12631075"
                  slug: "moonAudio"
                  type: "audio"
                  params: {}
                  locale:
                    title:
                      uk: "Послухай: два вигляди Місяця"
                    description:
                      uk: "Прослухай пояснення і за бажанням повтори."
                    fallback:
                      unavailable:
                        uk: "Запис наразі недоступний. Той самий зміст є в тексті уроку."
                      offline:
                        uk: "Слухай після завантаження уроку або скористайся текстом."
                      playbackError:
                        uk: "Запис не відтворився. Можна прочитати текст поруч."
                      retry:
                        uk: "Спробувати знову"
                production:
                  purpose: "Надати слуховий опис зображень для дітей, які не читають."
                  script: "Це один і той самий Місяць у різні дні. На першій схемі, двадцять шостого січня дві тисячі двадцять шостого року, приблизно половина видимого диска Місяця освітлена. Це перша чверть. На другій схемі, першого лютого того самого року, майже весь видимий диск освітлений. Це повня. Покажи або скажи, де видно більшу освітлену частину. Справжня кругла форма Місяця не змінилася і від нього нічого не відламалося. А коли хмара на хвилину закриває частину Місяця, це не нова фаза: хмара просто заважає його бачити. Зверни увагу на окрему навчальну схему з хмарою."
                  specification: "Записати цей український сценарій чітко і без музики, з короткими паузами. Можливість повтору, паузи, керування клавіатурою. Підготувати справжній UUID файл, офлайн-пакет і перевірений текстовий еквівалент у Stage 6; en/pl/qm потребують власних перекладів і узгодженого аудіосупроводу."
                  productionNotes: "У Stage 2 сценарій готовий, але аудіофайл не існує. Немає вигаданого fileName. Сусідній Markdown забезпечує текстовий еквівалент, але цей вступний аудіоблок НЕ замінює потрібні озвучені стани, варіанти і feedback Scene. У Stage 6 забезпечити її незалежний озвучений шлях без читання за Scene production.specification."
              moonScene:
                config:
                  id: "fae02030-82c2-4c8a-a18a-3a1a789a8477"
                  slug: "moonScene"
                  type: "scene"
                  params: {}
                  locale:
                    value:
                      prompt:
                        uk: "Де видно більшу освітлену частину Місяця?"
                      firstLabel:
                        uk: "26 січня 2026 — перша чверть"
                      secondLabel:
                        uk: "1 лютого 2026 — повня"
                      firstDescription:
                        uk: "Круглий диск. Приблизно половина видимого диска освітлена."
                      secondDescription:
                        uk: "Такий самий круглий диск. Майже весь видимий диск освітлено."
                      showFirst:
                        uk: "Перший вигляд"
                      showSecond:
                        uk: "Другий вигляд"
                      showBoth:
                        uk: "Порівняти разом"
                      firstChoice:
                        uk: "На першому"
                      secondChoice:
                        uk: "На другому"
                      correct:
                        uk: "На другому видно більшу освітлену частину."
                      help:
