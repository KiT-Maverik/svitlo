                production:
                  purpose: "Озвучити підсумок і підтримати дітей без навичок читання."
                  script: "Ми помітили дві зміни. Удень і вночі небо над тим самим місцем освітлене по-різному. Місяць у різні дні теж виглядає по-різному. Спочатку обери, покажи або скажи запитання про день і ніч: чому вони змінюються? Потім зроби це окремо для Місяця: чому змінюється його освітлений вигляд? Для кожної теми можна обрати вже повне запитання. А якщо хочеться своє, придумай і скажи вголос або за бажанням напиши повне запитання, а тоді окремо підтвердь це. Якщо не говориш чи не пишеш, обери готове ПОВНЕ запитання на картці з озвученням. Вибір способу ще не є запитанням. Нічого не потрібно записувати чи надсилати. Відповідати на запитання зараз не треба. За бажанням можна пропустити."
