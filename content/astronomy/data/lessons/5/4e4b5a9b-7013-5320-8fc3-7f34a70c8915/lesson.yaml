                production:
                  purpose: "Надати рівноцінний слуховий вхід без вимоги читати."
                  script: "Порівняй дві умовні схеми того самого місця. Ось дерево, будинок і пагорб, а над ними — небо. На першій схемі небо й краєвид освітлені денним світлом. На другій те саме небо та місце вночі темніші. Уночі денного світла немає, хоча можуть світити ліхтарі. Навіть у похмурий день залишається день. А Місяць іноді видно і вдень. Тому за самим Місяцем, хмарами чи ліхтарями не визначають день або ніч. На справжніх знімках допомагають перевірені місце, дата і час зйомки. Що змінилося між схемами? А що залишилося тим самим? Це спостереження. Не дивися прямо на Сонце."
                  specification: "Записати цей український сценарій чітко і без музики, з короткими паузами. Можливість повтору, паузи, керування клавіатурою. Підготувати справжній UUID файл, офлайн-пакет і перевірений текстовий еквівалент у Stage 6; en/pl/qm потребують власних перекладів і узгодженого аудіосупроводу."
                  productionNotes: "У Stage 2 сценарій готовий, але аудіофайл не існує. Немає вигаданого fileName. Markdown і повідомлення помилки дають текстову альтернативу для тих, хто читає або не користується звуком, але НЕ замінюють озвучення для дитини, яка ще не читає. У Stage 6 вимагати реальний офлайн-файл цього повного сценарію та повний незалежний пакет озвучених станів/feedback Scene, перевірений повтор/паузу й доступний retry; не оголошувати готовність джерельної локалі, якщо відсутні обоє придатних голосових шляхів або fallback лишає дитину лише з текстом. Тести офлайн і відсутності мережі обов’язкові перед релізом; локальний TTS можливий лише після підтвердженої придатності голосу та offline."
