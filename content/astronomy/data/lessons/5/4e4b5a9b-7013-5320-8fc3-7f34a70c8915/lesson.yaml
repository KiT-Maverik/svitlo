                  specification: |-
                    Навчальна Scene двох датованих схем видимого освітлення Місяця, а не двох нібито зроблених світлин.
                    Джерело дат: US Naval Observatory https://aa.usno.navy.mil/calculated/moon/phases?date=2026-01-01&format=t&nump=50 ; перша чверть 26.01.2026 о 04:47 UTC, повня 01.02.2026 о 22:09 UTC. Пояснення NASA: https://science.nasa.gov/moon/moon-phases/ . Зробити два однакові за зовнішнім контуром і розміром круглих SVG-диски: перший освітлений приблизно наполовину, другий майже повністю. Дати постійно видимі поруч із дисками. Ці картинки — схематична візуалізація станів у наведені дати, не доказ спостереження з конкретної країни/місцевості. Орієнтація світлої половини на першій схемі не є універсальним лівим або правим краєм.
                    Кроки: показати обидва датовані диски, дати порівняти кожен, запитати де більше світлої частини, запитати чи змінилася фізична форма об'єкта, відгуком відзначити різницю у видимій освітленості та однаковий круглий диск. Після цього окремий, явно умовний контрприклад: той самий круглий диск на короткий час частково ЗАТУЛЕНО намальованою хмарою. Запитати cloudPrompt з варіантами cloudNotPhase/cloudIsPhase і відтворити відповідно cloudNotPhaseFeedback/cloudIsPhaseFeedback. Діти можуть повторити порівняння, побачити/почути опис без хмари та з хмарою; хмару НЕ малювати як межу освітленої фази й не змішувати з двома датованими схемами. Обидва варіанти отримують коректний доброзичливий відгук. Це не нова перевірка причин і не Quiz; без балів, таймерів чи блокування.
                    Незоровий режим: підписи, дати та точні словесні описи кожної схеми, керований screen reader; усі варіанти клавіатурою, дотиком, без руху й кольору як єдиного коду. Семантичний RTL і адаптивний вузький екран. Дані фаз і власні SVG входять до офлайн-пакета, ніяких runtime запитів до астрономічних API.
                    Для дитини, яка ще не читає: велика доступна кнопка прослуховування для КОЖНОГО датованого диска, запитання, підпису, контролю, варіанта вибору і feedback; окремі повтор та пауза. На Stage 6 записати офлайн-кліпи UK для ключів scene locale.value: prompt, firstLabel, secondLabel, firstDescription, secondDescription, showFirst, showSecond, showBoth, firstChoice, secondChoice, correct, help, shapePrompt, sameShape, lostPiece, sameShapeFeedback, lostPieceFeedback, cloudDescription, cloudPrompt, cloudNotPhase, cloudIsPhase, cloudNotPhaseFeedback, cloudIsPhaseFeedback, sourceNote, again і voiceControls. Озвучені тексти хмарного контрприкладу мають точно відповідати Markdown moonExplain та сценарію moonAudio. Дати й назви фаз читати вголос словами: «двадцять шостого січня дві тисячі двадцять шостого року, перша чверть» та «першого лютого дві тисячі двадцять шостого року, повня». Відгук після вибору озвучити за відповідним ключем. Локальний TTS — лише після підтверджених тестів голосу та офлайн-режиму, інакше потрібні локальні записи. Зберегти повні підписи для тих, хто не чує, й структуровані незорові описи. Не вигадувати файлових UUID чи готових звукових ресурсів у Stage 2.
                  productionNotes: "Scene та реєстрація компонента ще не виконані. Stage 6 має реалізувати і перевірити SVG, доступність, точність джерел, RTL та офлайн."
