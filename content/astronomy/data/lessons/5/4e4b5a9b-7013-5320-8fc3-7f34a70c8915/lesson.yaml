                  specification: |-
                    Scene формувальної рефлексії після двох спостережень, не scored Quiz. Дві картки: спостереження за освітленістю дня/ночі та два датовані вигляди Місяця. У кожної — підписана піктограма, коротка спостережна фраза, готове запитання, опціонально можливість продиктувати запитання дорослому чи записати його локально. Не вимагати читання, письма, мікрофона, облікового запису, зберігання відповіді або інтернету. Не створювати банк Question IDs.
