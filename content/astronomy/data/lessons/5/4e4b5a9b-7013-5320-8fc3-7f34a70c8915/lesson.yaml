                      uk: |-
                        ## Що ми помітили?
                        **День і ніч:** той самий краєвид може бути світлішим або темнішим.
                        
                        **Місяць:** у різні дні видно різні частини його освітленого диска.
                        
                        Це **два різні спостереження**. Тому можна поставити два запитання:
                        - «Чому змінюються день і ніч?»
                        - «Чому вигляд освітленої частини Місяця змінюється?»
                        
                        Спочатку **постав або познач запитання про день і ніч**, а потім **окреме запитання про вигляд Місяця**. Для кожної теми можеш обрати готове повне запитання або **скласти своє** — сказати його вголос, показати за допомогою слів і піктограм чи, за бажанням, записати. Якщо обираєш своє, спершу постав запитання, **потім окремо підтвердь**, що воно вже поставлене. Сам вибір «хочу своє» ще не означає, що запитання прозвучало. **Відповіді поки не потрібні.** Писати необов’язково; якщо не хочеш відповідати, можна перейти далі.
