          pedagogicalIntent: "Знайомий досвід → схема → пояснювальний відгук → контрприклади."
          productionNotes: "Блоки й український текст укладено редакційно; програмні Scenes та реальне аудіо створюються лише на Stage 6."
      sMoon:
        config:
          id: "d4fa419e-75bf-4df7-a414-e2613e4227c8"
          slug: "sMoon"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Один Місяць — різні вигляди"
            navigationLabel:
              uk: "Місяць"
          content:
            items:
              moonIntro:
                config:
                  id: "a3abf8be-5714-4a13-96ed-b864e60f9fff"
                  slug: "moonIntro"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Поглянь на Місяць у різні дні
                        На двох **навчальних схемах** зображений той самий круглий Місяць. Проте те, **яка частина видимого диска освітлена**, відрізняється:
                        - **26 січня 2026 року** — перша чверть: приблизно половина видимого диска Місяця освітлена.
                        - **1 лютого 2026 року** — повня: майже весь видимий диск Місяця освітлений.
                        
