config:
  id: 4e4b5a9b-7013-5320-8fc3-7f34a70c8915
  slug: skyChangesOverview
  type: lesson
  skills:
    - faa8f11a-cc06-42c9-8864-8151732e690a
    - 53bba831-1f84-4b25-8e05-33f54167cc98
  params:
    languages:
      - uk
      - en
      - pl
      - qm
    requireQuiz: false
    sections:
      allowNavigation: true
      allowSkipping: true
      showIndexes: true
  locale:
    title:
      uk: Як помітити зміни на небі
  section:
    items:
      sDay:
        config:
          id: "f25202e1-6ea2-4c61-b281-fb1e15ea9d31"
          slug: "sDay"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Що видно вдень і вночі?"
            navigationLabel:
              uk: "День і ніч"
          content:
            items:
              dayIntro:
                config:
                  id: "cd9659dc-1a6c-444f-a402-4800645b2fc6"
                  slug: "dayIntro"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Те саме місце, але різне освітлення
                        На навчальних малюнках — те саме дерево, будинок і пагорб. На одному зображенні **світліше**, на іншому **темніше**. Коли є денне світло, ми говоримо «день». Коли настає темний час — «ніч».
                        
                        **Порівняй:** що змінилося? Що залишилося тим самим?
                        
                        Помічати та називати відмінність — це **спостерігати**. Зараз не треба пояснювати, чому приходить ніч. І не потрібно дивитися прямо на Сонце.
                production:
                  purpose: "Відкрити тему і дати наочний порівняльний критерій."
                  productionNotes: "Авторське джерело uk готове; не вимагає окремого Runtime ресурсу."
              dayAudio:
                config:
                  id: "fd3c34f6-58a3-4738-b035-045bc27bffbe"
                  slug: "dayAudio"
                  type: "audio"
                  params: {}
                  locale:
                    title:
                      uk: "Послухай: день і ніч"
                    description:
                      uk: "Прослухай пояснення і за бажанням повтори."
                    fallback:
                      unavailable:
                        uk: "Запис наразі недоступний. Той самий зміст є в тексті уроку."
                      offline:
                        uk: "Слухай після завантаження уроку або скористайся текстом."
                      playbackError:
                        uk: "Запис не відтворився. Можна прочитати текст поруч."
                      retry:
                        uk: "Спробувати знову"
                production:
                  purpose: "Надати рівноцінний слуховий вхід без вимоги читати."
                  script: "Порівняй те саме місце. Ось дерево, будинок і пагорб. Коли світло — день, коли темніше — ніч. Що змінилося? А що залишилося? Це спостереження. Не дивися прямо на Сонце."
                  specification: "Записати цей український сценарій чітко і без музики, з короткими паузами. Можливість повтору, паузи, керування клавіатурою. Підготувати справжній UUID файл, офлайн-пакет і перевірений текстовий еквівалент у Stage 6; en/pl/qm потребують власних перекладів і узгодженого аудіосупроводу."
                  productionNotes: "У Stage 2 сценарій готовий, але аудіофайл не існує. Немає вигаданого fileName. Зміст дублює сусідній Markdown для доступності."
              dayScene:
                config:
                  id: "80ecd1b4-8405-41ad-ac71-bd97d0f2c9e8"
                  slug: "dayScene"
                  type: "scene"
                  params: {}
                  locale:
                    value:
                      prompt:
                        uk: "Порівняй два зображення того самого місця."
                      first:
                        uk: "День: дерево, будинок і пагорб при денному освітленні."
                      second:
                        uk: "Ніч: ті самі дерево, будинок і пагорб у темряві."
                      dayLabel:
                        uk: "Денне освітлення"
                      nightLabel:
                        uk: "Нічна темрява"
                      showDay:
                        uk: "Показати день"
                      showNight:
                        uk: "Показати ніч"
                      showBoth:
                        uk: "Порівняти разом"
                      whatChanged:
                        uk: "Що помітно змінилося?"
                      lightChoice:
                        uk: "Стало світліше або темніше"
                      placeChoice:
                        uk: "Змінилося саме місце"
                      lightFeedback:
                        uk: "Так, на одному малюнку світліше, на другому темніше."
                      placeFeedback:
                        uk: "Дерево, будинок і пагорб залишилися. Змінилося освітлення."
                      whatSame:
                        uk: "Що залишилося тим самим?"
                      sameFeedback:
                        uk: "Той самий краєвид!"
                      hint:
                        uk: "Поглянь, чи змінилися обриси предметів."
                      again:
                        uk: "Порівняти ще раз"
                production:
                  purpose: "Дати дитині порівняти той самий краєвид при різній освітленості."
                  specification: |-
                    Навчальна Scene для спостереження, а не причинного пояснення.
                    Зображення: два SVG того самого умовного краєвиду з будинком, деревом і пагорбом. Контур, масштаб і предмети незмінні; на першій панелі світло, на другій темно. Позначити як навчальні зображення, не фотографії. Не робити Сонце, зорі, Місяць, лампу або погоду вирішальними ознаками дня й ночі.
                    Кроки: спочатку обидва підписані стани; кнопки вибрати один і повернути порівняння; запитання, що змінилося, та що залишилось; запропонувати варіанти про освітлення/зміну місця. Будь-який вибір супроводжується локалізованим поясненням: освітлення інше, але той самий пейзаж. Немає балів, таймерів, перевірки mastery, Quiz чи зовнішніх Question ID. Дозволити повтор і перехід незалежно від вибору.
                    Всі тексти контролів і відгуків брати з scene locale.value, без hardcoded української в коді. Клавіатура, дотик, focus order, screen reader, live region, не кольоровий єдиний сигнал. Дві структуровані невізуальні описи та статична пара потрібні і без SVG/анімації; на 320px без горизонтальної прокрутки. RTL міняє лише семантичне компонування, не науковий зміст. Reduced motion — без переходів. Весь компонент працює локально без мережі й на слабкому пристрої.
                  productionNotes: "Scene та реєстрація компонента ще не виконані. Stage 6 має реалізувати і перевірити SVG, доступність, точність джерел, RTL та офлайн."
              dayExplain:
                config:
                  id: "f7ac388e-f6b5-4521-a67c-18a80ab96ac2"
                  slug: "dayExplain"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ### Відмінність не означає, що предмети зникли
                        Коли темно, дерево й будинок залишаються на своєму місці — їх лише важче побачити. Вуличний ліхтар може світити вночі, але не перетворює ніч на день.
                        
                        **Місяць іноді видно і вдень.** Тому не можна визначати день чи ніч лише за Місяцем, зорями, хмарами або штучними ліхтарями.
                        
                        Ми вже помітили зміну освітленості. Пізніше можна поставити інше запитання: **чому змінюються день і ніч?**
                production:
                  purpose: "Виправити помилки про зникнення предметів і Місяць лише вночі."
                  productionNotes: "Авторське джерело uk готове; не вимагає окремого Runtime ресурсу."
              dayRecap:
                config:
                  id: "63dc6b4b-c9e7-4b20-b424-8a0811b443d0"
                  slug: "dayRecap"
                  type: "text"
                  params: {}
                  locale:
                    value:
                      uk: "Скажи або покажи: «На одному зображенні світліше, на іншому — темніше». Це спостереження."
                production:
                  purpose: "Закріпити опис результату без scored перевірки."
            order:
              - "dayIntro"
              - "dayAudio"
              - "dayScene"
              - "dayExplain"
              - "dayRecap"
        production:
          purpose: "Спостереження денного й нічного вигляду."
          pedagogicalIntent: "Знайомий досвід → схема → пояснювальний відгук → контрприклади."
          productionNotes: "Блоки й український текст укладено редакційно; програмні Scenes та реальне аудіо створюються лише на Stage 6."
      sMoon:
        config:
          id: "d4fa419e-75bf-4df7-a414-e2613e4227c8"
          slug: "sMoon"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Один Місяць — різні вигляди"
            navigationLabel:
              uk: "Місяць"
          content:
            items:
              moonIntro:
                config:
                  id: "a3abf8be-5714-4a13-96ed-b864e60f9fff"
                  slug: "moonIntro"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Поглянь на Місяць у різні дні
                        На двох **навчальних схемах** зображений той самий круглий Місяць. Проте освітлена частина, яку видно із Землі, відрізняється:
                        - **26 січня 2026 року** — перша чверть: видно приблизно половину освітленого диска.
                        - **1 лютого 2026 року** — повня: видно майже весь освітлений диск.
                        
                        Ці дати відповідають перевіреним астрономічним даним. Схеми **не є фотографіями**, зробленими з певного місця.
                        
                        **Що ти помічаєш?** Не треба поки пояснювати, чому видима освітлена частина Місяця змінюється.
                production:
                  purpose: "Показати дві датовані й науково підтверджені відмінності вигляду Місяця."
                  productionNotes: "Авторське джерело uk готове; не вимагає окремого Runtime ресурсу."
              moonAudio:
                config:
                  id: "1e81a98a-95a0-4f7f-869c-7baa12631075"
                  slug: "moonAudio"
                  type: "audio"
                  params: {}
                  locale:
                    title:
                      uk: "Послухай: два вигляди Місяця"
                    description:
                      uk: "Прослухай пояснення і за бажанням повтори."
                    fallback:
                      unavailable:
                        uk: "Запис наразі недоступний. Той самий зміст є в тексті уроку."
                      offline:
                        uk: "Слухай після завантаження уроку або скористайся текстом."
                      playbackError:
                        uk: "Запис не відтворився. Можна прочитати текст поруч."
                      retry:
                        uk: "Спробувати знову"
                production:
                  purpose: "Надати слуховий опис зображень для дітей, які не читають."
                  script: "Це один і той самий Місяць у різні дні. На першому зображенні видно приблизно половину освітленого круга. На другому освітлений круг майже повний. Покажи або скажи, на якому малюнку освітлена частина більша. Справжня форма Місяця не змінилася."
                  specification: "Записати цей український сценарій чітко і без музики, з короткими паузами. Можливість повтору, паузи, керування клавіатурою. Підготувати справжній UUID файл, офлайн-пакет і перевірений текстовий еквівалент у Stage 6; en/pl/qm потребують власних перекладів і узгодженого аудіосупроводу."
                  productionNotes: "У Stage 2 сценарій готовий, але аудіофайл не існує. Немає вигаданого fileName. Зміст дублює сусідній Markdown для доступності."
              moonScene:
                config:
                  id: "fae02030-82c2-4c8a-a18a-3a1a789a8477"
                  slug: "moonScene"
                  type: "scene"
                  params: {}
                  locale:
                    value:
                      prompt:
                        uk: "Де видно більшу освітлену частину Місяця?"
                      firstLabel:
                        uk: "26 січня 2026 — перша чверть"
                      secondLabel:
                        uk: "1 лютого 2026 — повня"
                      firstDescription:
                        uk: "Круглий диск. Приблизно половина видимого диска освітлена."
                      secondDescription:
                        uk: "Такий самий круглий диск. Майже весь видимий диск освітлено."
                      showFirst:
                        uk: "Перший вигляд"
                      showSecond:
                        uk: "Другий вигляд"
                      showBoth:
                        uk: "Порівняти разом"
                      firstChoice:
                        uk: "На першому"
                      secondChoice:
                        uk: "На другому"
                      correct:
                        uk: "На другому видно більшу освітлену частину."
                      help:
                        uk: "На першому видно приблизно половину, на другому — майже весь диск."
                      shapePrompt:
                        uk: "Чи змінив Місяць свою справжню круглу форму?"
                      sameShape:
                        uk: "Ні, його форма та сама"
                      lostPiece:
                        uk: "Так, він утратив шматочок"
                      sameShapeFeedback:
                        uk: "Правильно помічено: змінюється видима освітлена частина."
                      lostPieceFeedback:
                        uk: "В обох схемах круглий контур однаковий. Від Місяця нічого не відламалося."
                      sourceNote:
                        uk: "Це схеми фаз за даними астрономічного календаря, не фотографії."
                      again:
                        uk: "Порівняти ще раз"
                production:
                  purpose: "Порівняти різні видимі освітлені частини того самого Місяця."
                  specification: |-
                    Навчальна Scene двох датованих схем видимого освітлення Місяця, а не двох нібито зроблених світлин.
                    Джерело дат: US Naval Observatory https://aa.usno.navy.mil/calculated/moon/phases?date=2026-01-01&format=t&nump=50 ; перша чверть 26.01.2026 о 04:47 UTC, повня 01.02.2026 о 22:09 UTC. Пояснення NASA: https://science.nasa.gov/moon/moon-phases/ . Зробити два однакові за зовнішнім контуром і розміром круглих SVG-диски: перший освітлений приблизно наполовину, другий майже повністю. Дати постійно видимі поруч із дисками. Ці картинки — схематична візуалізація станів у наведені дати, не доказ спостереження з конкретної країни/місцевості. Орієнтація світлої половини на першій схемі не є універсальним лівим або правим краєм.
                    Кроки: показати обидва, дати порівняти кожен, запитати де більше світлої частини, запитати чи змінилася фізична форма об'єкта, відгуком відзначити різницю у видимій освітленості та однаковий круглий диск. Для плутанини з відламаним шматком або хмарами надати конкретне пояснення без механічної моделі й без засудження помилки. Вибір і повтор доступні, немає балів, таймерів чи Quiz.
                    Незоровий режим: підписи, дати та точні словесні описи кожної схеми, керований screen reader; усі варіанти клавіатурою, дотиком, без руху й кольору як єдиного коду. Семантичний RTL і адаптивний вузький екран. Дані фаз і власні SVG входять до офлайн-пакета, ніяких runtime запитів до астрономічних API.
                  productionNotes: "Scene та реєстрація компонента ще не виконані. Stage 6 має реалізувати і перевірити SVG, доступність, точність джерел, RTL та офлайн."
              moonExplain:
                config:
                  id: "be948409-31e8-4d41-a417-a6b864c9ba6a"
                  slug: "moonExplain"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ### Чого не сталося?
                        Місяць **не відламався** і фізично не перетворився на півколо. На обох схемах він круглий. Змінилася частина його освітленої поверхні, яку ми бачимо.
                        
                        Якщо хмара тимчасово затуляє Місяць, це інше явище — не звичайна фаза Місяця.
                        
                        Можна запитати: **«Чому освітлена частина Місяця виглядає по-різному?»** Поки достатньо помітити різницю.
                production:
                  purpose: "Розмежувати освітлений вигляд, форму Місяця й закриття хмарами."
                  productionNotes: "Авторське джерело uk готове; не вимагає окремого Runtime ресурсу."
              moonRecap:
                config:
                  id: "1c4140b2-4f03-44cf-af46-13aab27eda4b"
                  slug: "moonRecap"
                  type: "text"
                  params: {}
                  locale:
                    value:
                      uk: "Скажи або покажи: «Спочатку видно приблизно половину освітленого Місяця, а пізніше — майже весь освітлений диск»."
                production:
                  purpose: "Закріпити спостереження без пояснення фаз."
            order:
              - "moonIntro"
              - "moonAudio"
              - "moonScene"
              - "moonExplain"
              - "moonRecap"
        production:
          purpose: "Опис датованих виглядів освітленого Місяця."
          pedagogicalIntent: "Науково датовані схеми → доступне порівняння → відгук → корекція хибних уявлень."
          productionNotes: "Блоки й український текст укладено редакційно; програмні Scenes та реальне аудіо створюються лише на Stage 6."
      sReflect:
        config:
          id: "f9396c00-0956-4938-8551-f9d0638cd998"
          slug: "sReflect"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Дві зміни — два запитання"
            navigationLabel:
              uk: "Наші запитання"
          content:
            items:
              reflectIntro:
                config:
                  id: "c1505ae0-7006-4e33-bcf6-2c1fd354876f"
                  slug: "reflectIntro"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Що ми помітили?
                        **День і ніч:** той самий краєвид може бути світлішим або темнішим.
                        
                        **Місяць:** у різні дні видно різні частини його освітленого диска.
                        
                        Це **два різні спостереження**. Тому можна поставити два запитання:
                        - «Чому змінюються день і ніч?»
                        - «Чому вигляд освітленої частини Місяця змінюється?»
                        
                        Обери запитання, скажи своїми словами або покажи піктограму. **Не треба зараз знати відповіді** й нічого не потрібно писати.
                production:
                  purpose: "Побачити дві незалежні теми для допитливих запитань."
                  productionNotes: "Авторське джерело uk готове; не вимагає окремого Runtime ресурсу."
              reflectAudio:
                config:
                  id: "67fcca8b-ec8a-4fa1-ba18-a3b1df3e99f2"
                  slug: "reflectAudio"
                  type: "audio"
                  params: {}
                  locale:
                    title:
