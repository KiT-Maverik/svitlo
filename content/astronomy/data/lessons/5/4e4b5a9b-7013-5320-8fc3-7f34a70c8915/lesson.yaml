                production:
                  purpose: "Допомогти сформулювати окремі питання про дві різні зміни без Quiz."
                  specification: |-
                    Scene формувальної рефлексії після двох спостережень, не scored Quiz. Дві картки: спостереження за освітленістю дня/ночі та два датовані вигляди Місяця. У кожної — підписана піктограма, коротка спостережна фраза, готове запитання, опціонально можливість продиктувати запитання дорослому чи записати його локально. Не вимагати читання, письма, мікрофона, облікового запису, зберігання відповіді або інтернету. Не створювати банк Question IDs.
                    Навчальна послідовність: (1) показати картку дня/ночі й запросити поставити або позначити ОДНЕ запитання про неї; (2) явно перейти до окремої картки Місяця і запросити ДРУГЕ запитання; (3) показати обидва окремі запитання поруч і запропонувати порівняти. Вибір ТІЛЬКИ назви теми НЕ є сформульованим запитанням. Для кожної теми дитина може обрати готове ПОВНЕ запитання (або піктограму саме цього повного запитання з текстом і озвученням), або обрати ШЛЯХ власного запитання. Обрати «хочу своє» означає ЛИШЕ обрати шлях; показати ownQuestionPrompt й ownQuestionRouteFeedback, не встановлюючи acknowledgment. Попросити спочатку добровільно скласти ПОВНЕ запитання: усно без запису, виклавши слова/піктограми як повне запитальне речення, або необов'язковим текстом. Дати ОКРЕМУ доступну кнопку confirmOwnDayQuestion / confirmOwnMoonQuestion, яку дитина натискає тільки після того, як сказала, показала або склала своє запитання. Мікрофон, запис/перевірка вмісту, дорослий чи обов'язкове письмо не потрібні: підтвердження — добровільне повідомлення дитини, не доказ перевіреного змісту. Перехід до другого кроку й завершення доступні також без підтвердження або при пропуску — ніхто не примушує говорити чи писати.
                    Редакційні стани: dayQuestionAcknowledged=false, moonQuestionAcknowledged=false на старті; це лише локальні тимчасові прапорці взаємодії, НЕ Engine поля, НЕ оцінка, не автоматична верифікація сформульованих слів і НЕ доказ mastery. Для теми дня встановити тільки після вибору chooseDay (повний готовий текст, не сама назва теми) АБО окремої дії confirmOwnDayQuestion ПІСЛЯ власного формулювання; для Місяця аналогічно тільки після chooseMoon АБО confirmOwnMoonQuestion. Самі ownDayQuestion/ownMoonQuestion лише відкривають шлях, ніколи не встановлюють прапорці; тема, прослуховування, вибір піктограми ТІЛЬКИ теми, відсутність дії та skip також не встановлюють їх. Якщо дитина повернулася й вибрала інший шлях, не зберігати фальшиве підтвердження; дозволити повторно сформулювати чи пропустити без перешкод. Після вибору теми — topicFeedback; після вибору шляху власного запитання — ownQuestionRouteFeedback; після готового повного запитання — dayQuestionFeedback або moonQuestionFeedback; ЛИШЕ після окремого самопідтвердження власного запитання — ownQuestionFeedback. bothQuestionsFeedback показати тільки коли ОБИДВА різні прапорці true, причому текст повідомляє про два ПОЗНАЧЕНІ запитання, а не про записаний або перевірений мовний зміст. Після пропуску — skippedFeedback, при неповній парі — incompleteFeedback; жоден текст не заявляє, що дитина сказала обидва, якщо цього не було підтверджено. Навігація назад, повтор або відмова не блокують урок.
