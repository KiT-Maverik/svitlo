  section:
    items:
      skyAroundUs:
        config:
          id: "3e911ad2-0530-57f8-8aa5-10819d205c59"
          slug: "skyAroundUs"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Що можна помітити на небі?"
            navigationLabel:
              uk: "Помічаємо небо"
          content:
            items:
              welcome:
                config:
                  id: "18ba7cd1-b973-57a6-bee5-86b50328a4da"
                  slug: "welcome"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        # Небо можна досліджувати без приладів
                        Уяви готовий підписаний знімок неба. На ньому — світлі хмари й синій простір. Що ти помічаєш? Можна назвати колір, форму хмар і те, де небо світліше.
                        
                        **Спостерігати** — означає уважно помічати й описувати. Для цього не завжди потрібно виходити надвір, бачити на власні очі чи мати телескоп. Фото або точний опис теж допомагають досліджувати небо.
                        
                        **Спробуй:** назви дві ознаки з опису. Наприклад: «Я чую про світлі хмари й синій простір». Твоя фраза може бути іншою.
                        
                        **Важливо:** ми не шукаємо Сонце поглядом. Його зображення можна побачити без прямого погляду на Сонце.
                production:
                  purpose: "Ввести визначення спостереження та першу доступну дію."
                  productionNotes: "Stage 2: повний український текст готовий; переклади, незалежне рев'ю і перевірка рендерингу — пізніші етапи."
              skyExamples:
                config:
                  id: "827b5df7-917c-5e7e-9e21-65048f89e8a9"
                  slug: "skyExamples"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Порівнюємо два уявні описи неба
                        Уяви **перший опис**: майже все синє небо закривають хмари. А тепер **другий опис**: на синьому небі лише три маленькі хмари. Це вигадані приклади для роздумів, а не фотографії, які зараз відкриті на екрані.
                        
                        **Спробуй сам:** у якому описі хмари закривають більшу частину неба? Назви слова, які допомогли тобі це визначити. Спочатку подумай або скажи відповідь, а тоді розгорни картку «Перевір порівняння» нижче.
                        
                        Якщо хочеш дізнатися про **саме Сонце**, користуйся підготовленим науковим зображенням. Опис хмар — це вивчення неба, а не спосіб роздивлятися сонячний диск.
                        
                        **Подумай:** чи можна досліджувати небо вдень або вдома? Можна за готовими знімками та точними словесними описами, без нічного виходу.
                production:
                  purpose: "Пояснити різницю між розгляданням неба й готовим зображенням Сонця."
                  productionNotes: "Stage 2: повний український текст готовий; переклади, незалежне рев'ю і перевірка рендерингу — пізніші етапи."
              skyCompareCheck:
                config:
                  id: "0121e00a-ab04-57f1-be3a-ea1f5571895d"
                  slug: "skyCompareCheck"
                  type: "checkpoint"
                  params:
                    headingLevel: 3
                    showIndices: true
                    showChevron: true
                    enableChecks: false
                    requireCompletion: false
                  locale:
                    title:
                      uk: "Перевір порівняння"
                  content:
                    items:
                      twoSkyDescriptions:
                        config:
                          id: "155f2765-cca3-54f9-b8cc-1f012312919e"
                          slug: "twoSkyDescriptions"
                          type: "checkpointItem"
                          question:
                            config:
                              id: "962bdb05-54a6-5e60-b774-5e5d7e9ac4cf"
                              slug: "twoSkyDescriptionsQuestion"
                              type: "text"
                              params: {}
                              locale:
                                value:
                                  uk: "У першому уявному описі хмари закривають майже все небо, а в другому на синьому небі — три маленькі хмари. У якому описі хмари займають більшу частину неба? За якими словами ти це визначив?"
                          answer:
                            config:
                              id: "31f4461b-62ab-50e1-b0fd-215764c09447"
                              slug: "twoSkyDescriptionsAnswer"
                              type: "checkpointAnswer"
                              content:
                                items:
                                  twoSkyDescriptionsExplanation:
                                    config:
                                      id: "f5c927f5-6dc0-5aeb-8797-e8bda45420c3"
                                      slug: "twoSkyDescriptionsExplanation"
                                      type: "text"
                                      params: {}
                                      locale:
                                        value:
                                          uk: "У першому описі хмари закривають більшу частину неба — сказано «майже все небо». У другому три маленькі хмари займають меншу частину синього неба. Ми порівняли, яку частину неба закривають хмари, а не їхню кількість. Дивитися на Сонце для цього не потрібно."
                                order:
                                  - "twoSkyDescriptionsExplanation"
                    order:
                      - "twoSkyDescriptions"
                production:
                  purpose: "Змістовно відокремити дитячу спробу порівняння від розкриття пояснення."
                  productionNotes: "Read-aloud: дорослий читає обидва уявні описи, робить паузу для усної/жестової відповіді, а потім відкриває пояснення. Лише accordion; оцінок та кнопки виконання немає."
            order:
              - "welcome"
              - "skyExamples"
              - "skyCompareCheck"
        production:
          purpose: "Від знайомого опису хмар перейти до питання, як отримувати відомості про Сонце безпечно."
          pedagogicalIntent: "Активне осмислення науково коректного правила із доступним feedback; не вимагати читання, письма, нічних спостережень або приладів."
          productionNotes: |-
            Доступ для дитини, яка не читає: дорослий послідовно читає welcome й skyExamples українською та описує два уявні неба; робить паузу після «назви дві ознаки» і «у якому описі хмари закривають більшу частину неба», приймає усну/жестову відповідь, тільки після неї розкриває skyCompareCheck і читає пояснення. Не потребує фотографії, відео, нічного виходу чи приладу. Stage 6 перевіряє клавіатурне розкриття Checkpoint. TTS/аудіозаписи не створені й не обіцяні.
      solarSafety:
        config:
          id: "12936be4-a2f0-5b31-b6eb-79a63b90687f"
          slug: "solarSafety"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Чому потрібно берегти очі?"
            navigationLabel:
              uk: "Бережемо очі"
          content:
            items:
              whyProtectEyes:
                config:
                  id: "5ae8cf30-7084-5d1f-aa8a-79701cca070c"
                  slug: "whyProtectEyes"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        # Сонце не можна перевіряти поглядом
                        Сонце дуже яскраве. **Навіть короткий прямий погляд на Сонце може пошкодити очі.** Тому не пробуй так робити й не пропонуй іншим.
                        
                        Звичайні сонцезахисні окуляри не роблять погляд на Сонце безпечним. Бінокль або телескоп без належного спеціального сонячного захисту особливо небезпечні. У цьому уроці ми **не виконуємо** прямі сонячні спостереження.
                        
                        **Порівняй:**
                        - «Я швидко погляну на Сонце». **Небезпечно:** короткий погляд теж ризикований.
                        - «Я розгляну перевірений знімок Сонця». **Безпечно:** можна дізнатися, який вигляд має Сонце, не дивлячись на нього.
                        
                        Цікавість дослідника — це добре. Потрібно лише обрати безпечний спосіб.
                production:
                  purpose: "Правило сонячної безпеки, причинне пояснення, протиставлення ризикованого й безпечного."
                  productionNotes: "Stage 2: повний український текст готовий; переклади, незалежне рев'ю і перевірка рендерингу — пізніші етапи."
              safeWays:
                config:
                  id: "62dfa921-fff7-5b31-b975-882f8ce70b8a"
                  slug: "safeWays"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Як дізнатися про Сонце без ризику?
                        Попроси дорослого показати **готове фото або запис**, підготовлений науковцями. За таким зображенням можна описати Сонце, не дивлячись на нього на небі.
                        
                        Фахівці іноді отримують зображення Сонця спеціальними пристроями — наприклад, проєкцією на поверхню. У цьому уроці можна лише переглянути **готовий запис**. Ми не майструємо та не випробовуємо такі пристрої і ніколи не дивимося через отвір проєктора.
                        
                        **Поширена помилка:** «Дуже темні окуляри захищають». **Виправлення:** колір окулярів не доводить захист для прямого погляду на Сонце.
                        
                        **Інша помилка:** «Небо можна досліджувати тільки вночі». **Виправлення:** навіть вдень можна описувати готовий знімок хмар.
                        
                        **Коротко:** для знань про Сонце обирай наукові знімки, а не ризикований погляд.
                production:
                  purpose: "Сформувати позитивні безпечні альтернативи без небезпечних інструкцій."
                  productionNotes: "Stage 2: повний український текст готовий; переклади, незалежне рев'ю і перевірка рендерингу — пізніші етапи."
            order:
              - "whyProtectEyes"
              - "safeWays"
        production:
          purpose: "Науково коректно розрізнити небезпечний прямий погляд і перегляд готового фото/запису."
          pedagogicalIntent: "Активне осмислення науково коректного правила із доступним feedback; не вимагати читання, письма, нічних спостережень або приладів."
          productionNotes: |-
            Дорослий або доступний читач екрана читає whyProtectEyes і safeWays вголос з паузою після двох протилежних намірів. Дитина показує або називає «безпечний»/«небезпечний», тоді слухає і пояснює різницю. Жодної демонстрації прямого погляду, оптики чи проєктора; це лише словесне обговорення. Наукові джерела NASA/AAS закріплені в Stage 1; озвучення автоматичним TTS/медіа на Stage 2 не реалізоване.
      safeChoices:
        config:
          id: "382eacbe-b1a2-5988-9469-2dc6ed35d707"
          slug: "safeChoices"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Обираємо безпечні дії"
            navigationLabel:
              uk: "Тренуємо вибір"
          content:
            items:
              practiceIntro:
                config:
                  id: "d172d47e-8c5b-57e5-95d5-590783750974"
                  slug: "practiceIntro"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        # Обери дію, яка береже очі
                        Перед кожним рішенням подумай: **«Чи потрібно мені для цього дивитися прямо на Сонце?»** Якщо так — шукай інший спосіб. Фото чи словесний опис часто дають потрібні відомості без ризику.
                        
                        Нижче — **три короткі ситуації у картках**. Після прочитання чи прослуховування вибери безпечну дію подумки, вголос або показом. Лише потім відкрий пояснення в картці. Це тренування, а не оцінка; ти можеш передумати і спробувати знову. Виходити надвір, дивитися на Сонце, брати прилади чи писати не потрібно.
                production:
                  purpose: "Підвести до неоцінюваної ситуаційної практики."
                  productionNotes: "Stage 2: повний український текст готовий; переклади, незалежне рев'ю і перевірка рендерингу — пізніші етапи."
              safeChoiceLab:
                config:
                  id: "98f915af-6818-5dba-a461-9756c578dd1b"
                  slug: "safeChoiceLab"
                  type: "scene"
                  params:
                    disabled: true
                  locale:
                    value:
                      intro:
                        uk: "Три ситуації. Обери дію, прочитай пояснення. Можна змінювати вибір: це тренування, не оцінка."
                      controls:
                        next:
                          uk: "Далі"
                        restart:
                          uk: "Спробувати з початку"
                        textAlternative:
                          uk: "Відкрити текстову вправу"
                        feedbackHeading:
                          uk: "Пояснення вибору"
                        progressPhoto:
                          uk: "Ситуація 1 з 3"
                        progressGlasses:
                          uk: "Ситуація 2 з 3"
                        progressClouds:
                          uk: "Ситуація 3 з 3"
                      photo:
                        prompt:
                          uk: "Марійка хоче побачити, який вигляд має Сонце. Що порадиш?"
                        risk:
                          uk: "Поглянути просто на Сонце лише на мить"
                        safe:
                          uk: "Розглянути підписане наукове фото Сонця"
                        safeFeedback:
                          uk: "Добре! На готовому знімку можна вивчати Сонце, не дивлячись на нього."
                        riskFeedback:
                          uk: "Небезпечно. Навіть швидкий прямий погляд на Сонце може пошкодити очі. Обери фото."
                      glasses:
                        prompt:
                          uk: "Богдан має звичайні темні окуляри. Чи можна дивитися на Сонце?"
                        safe:
                          uk: "Не дивитися; попросити перевірене зображення"
                        risk:
                          uk: "Надягти окуляри й подивитися на Сонце"
                        safeFeedback:
                          uk: "Так! Звичайні окуляри не захищають для прямого спостереження Сонця."
                        riskFeedback:
                          uk: "Ні. Темні окуляри не є спеціальним сонячним захистом. Дивись на готовий знімок."
                      clouds:
                        prompt:
                          uk: "Оля не має телескопа й не може вийти надвір. Чи може вона дослідити денне небо?"
                        risk:
                          uk: "Ні, досліджувати небо можна лише вночі"
                        safe:
                          uk: "Описати хмари на готовій фотографії"
                        safeFeedback:
                          uk: "Правильно! Достатньо готових фото й описів. Дивитися на Сонце не потрібно."
                        riskFeedback:
                          uk: "Досліджувати небо можна і вдень за фотографією чи словесним описом."
                      done:
                        uk: "Молодець, ти потренувався обирати безпечні джерела відомостей про небо."
                      retry:
                        uk: "Подумай: чи можна отримати ті самі відомості без погляду на Сонце?"
                production:
                  purpose: "Формувальна практика безпечних рішень із негайним поясненням."
                  specification: |-
                    # «Безпечний вибір»: Scene — editorial specification (not implemented)
                    Status: Scene configurator is authored, but the local Scene and its registry do not exist. The Stage 2/3 draft keeps config.params.disabled: true; the UI Kit ContentBlockRenderer skips disabled items before dispatching the Scene block. Content remains valid as a fully accessible text-first practiceReveal Checkpoint even if Scene is never mounted. No Scene playback or network-independent Scene code is claimed.
                    
                    ## Learning experience and invariant truth
                    Three situations in fixed order photo, glasses, clouds, each with a prompt, one safe and one risk action, and distinct safeFeedback/riskFeedback, sourced from this node's locale.value. All cases are unscored formative learning, not Question Bank data. Key safe is always the safe action. A mistake must lead only to explanatory feedback, never an instruction to perform an unsafe physical action or emulate a solar view.
                    
                    ## Explicit displayed option order
                    For photo render [risk, safe]; for glasses render [safe, risk]; for clouds render [risk, safe]. These stable per-case sequences are part of the design: do not derive them from alphabetical keys, implicit map iteration, side color or a rule that always puts safe first. Preserve logical keyboard/screen-reader order equal to the visible order and semantically stable option labels. The separate text-first Checkpoint uses the matching A/B order.
                    
                    ## Localized control copy
                    Read the exact Ukrainian keys from locale.value.controls: next, restart, textAlternative, feedbackHeading and progressPhoto/progressGlasses/progressClouds. Do not hardcode «Далі» or other visible/assistive copy inside React. Resolve all future declared languages from real reviewed translations only; no English fallback masquerading as a translation.
                    
                    ## States, actions and feedback
                    Initial state: intro, progressPhoto, first case prompt and two action buttons with neither selected. Activating either action by touch, Enter or Space reveals the matching safeFeedback/riskFeedback next to the buttons and announces it once politely for screen readers. The child can activate the other option to change their mind, with a fresh explanation and no penalty. After any response next appears; require no timer, score, grade or forced-success gate. Move to the next case, then done with restart available. Restart resets all local Scene selections to case one. Maintain predictable focus and allow learner navigation to the textAlternative pathway. Avoid duplication of visible Scene and complete text practice when both are enabled; the equivalent Checkpoint must always remain independently reachable.
                    
                    ## Accessibility and non-reader facilitation
                    Use native labelled buttons, no drag/drop, flashing light, color-only coding or animated staring at Sun. Announce progress and feedback accessibly, keep focus order visible and keyboard/touch-screen-reader parity, scale content 200%, honor reduced motion and RTL semantics. For a pre-reader: the facilitator reads the prompt and the two options aloud, accepts a spoken or pointing answer, reads the distinct feedback, and pauses so the child can choose again. Recorded narration/TTS is not implemented; the source text is the approved read-aloud script. No webcam, GPS, live Sun exposure, browser audio requirement or special equipment.
                    
                    ## Nonvisual and low-end route, crash guard
                    The text-first afterPractice + practiceReveal Checkpoint precedes this disabled Scene in section.order. It is the *primary* Draft exercise, not a fallback that appears only after a crash. Current UI Kit Scene.tsx throws on an unknown Scene ID and Suspense fallback=null does not catch that throw. At Stage 6 the Coding Agent must implement/register the real Scene and guard attempted mounting with a real error boundary or Scene-aware routing that renders the same independent text practice on missing/chunk-error/offline failure; only then may disabled be removed. Verify that children can always reach practiceReveal, including no script/network and slow devices, rather than relying on the next Markdown sibling to survive a render crash. No renderer/platform change is authored at this stage.
                    
                    ## Visual constraints and Stage 6 evidence
                    Use quiet 2D icons (photo, ordinary sunglasses, clouds), never simulated direct looking or sunlit bright-flash effects, DIY projector instructions, live camera or forbidden magnifiers. All graphics have explanatory text; preserve lesson neutrality. Scene acceptance requires real code+registry, keyboard/touch/screen reader, accessible live region, deterministic option order, all localized labels, explicit fallback, offline package/low-end verification and all three distinct feedback sets. Do not claim a CI-green YAML or successful text practice proves Scene completion.
                  productionNotes: "Readiness: editorial source/specification only. Scene is intentionally disabled in current Config to avoid mounting an unregistered Scene. Text-first practiceReveal is available as the required learning-equivalent route. Stage 6 must register and verify Scene, implement an error fallback, and only then enable it; no runtime behavior is claimed."
              afterPractice:
                config:
                  id: "15501927-9c5e-570d-aee6-8b22efa0ef31"
                  slug: "afterPractice"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Три ситуації — текстова вправа
                        Ця вправа **працює без спеціальної Scene**. У наступних трьох картках є коротка ситуація і два варіанти дії. Спочатку обери варіант подумки, назви його вголос або покажи на нього. **Лише після власної спроби** відкрий картку й порівняй пояснення.
                        
                        Картки мають різний порядок відповідей, тому не вгадуй за місцем кнопки: подумай, який спосіб безпечний для очей.
                        
