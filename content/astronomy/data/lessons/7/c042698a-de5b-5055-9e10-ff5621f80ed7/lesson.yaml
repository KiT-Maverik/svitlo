                          uk: "Добре! На готовому знімку можна вивчати Сонце, не дивлячись на нього."
                        riskFeedback:
                          uk: "Небезпечно. Навіть швидкий прямий погляд на Сонце може пошкодити очі. Обери фото."
                      glasses:
                        prompt:
                          uk: "Богдан має звичайні темні окуляри. Чи можна дивитися на Сонце?"
                        safe:
                          uk: "Не дивитися; попросити перевірене зображення"
                        risk:
                          uk: "Надягти окуляри й подивитися на Сонце"
                        safeFeedback:
                          uk: "Так! Звичайні окуляри не захищають для прямого спостереження Сонця."
                        riskFeedback:
                          uk: "Ні. Темні окуляри не є спеціальним сонячним захистом. Дивись на готовий знімок."
                      clouds:
                        prompt:
                          uk: "Оля не має телескопа й не може вийти надвір. Чи може вона дослідити денне небо?"
                        safe:
                          uk: "Описати хмари на готовій фотографії"
                        risk:
                          uk: "Ні, досліджувати небо можна лише вночі"
                        safeFeedback:
                          uk: "Правильно! Достатньо готових фото й описів. Дивитися на Сонце не потрібно."
                        riskFeedback:
                          uk: "Досліджувати небо можна і вдень за фотографією чи словесним описом."
                      done:
                        uk: "Молодець, ти потренувався обирати безпечні джерела відомостей про небо."
                      retry:
                        uk: "Подумай: чи можна отримати ті самі відомості без погляду на Сонце?"
                production:
                  purpose: "Формувальна практика безпечних рішень із негайним поясненням."
                  specification: |-
                    # «Безпечний вибір»: інтерактивна Scene
                    Стан: Stage 2 — готова редакційна специфікація; реалізації і Scene registry немає. Не видавати сцену за працюючий продукт.
                    
                    ## Навчальна дія
                    Показати рівно три незалежні кейси у порядку photo, glasses, clouds. Кожен має prompt і дві кнопки (safe/risk), відповідне окреме safeFeedback/riskFeedback, усі тексти тільки з locale.value. Ключ safe є безпечним у всіх кейсах; ключ risk — помилковим. Вибір не оцінюється, не записує прогрес і не замінює Quiz.
                    
                    ## Стан і переходи
                    Початок: intro, перша ситуація, дві кнопки, жодного вибору. Активація кнопки показує відповідне пояснення у доступній області біля вибору; повторне натискання іншої кнопки змінює пояснення. «Далі» стає доступним після спроби; не блокувати дитину помилкою й дати право повторити. Після третього кейсу — done, можливість знову пройти три кейси. Помилка не запускає симуляцію небезпечної дії. Якщо сцену перервали, повторний запуск повертає її до першого кейсу.
                    
                    ## Точність і візуальна режисура
                    Лише спокійні символічні 2D-картки «фото», «окуляри», «хмари», без сліпучого світла, зображення прямого погляду на Сонце чи інструкцій із саморобних фільтрів. Усі стани підписані словами, не тільки кольором. Не вимагати камери, геолокації, аудіо чи реального сонячного світла. Ніякої Course-історії, персонажів поза нейтральними прикладами або scoring.
                    
                    ## Доступність й ефективність
                    Таб-навігація в логічному порядку; Enter/Space активує кнопку; після вибору focus передбачуваний; feedback оголошується screen reader рівно один раз. Touch-кнопки достатні, текст масштабується, немає таймера/drag/drop/руху, стан не залежить від кольору або слуху. LTR/RTL семантичні, без дзеркалення фізичного сенсу. Reduced-motion і слабкі пристрої отримують ті самі результати. Офлайн після публікації: невеликий bundled код і локалізовані дані, без мережевих ресурсів.
                    
                    ## Повноцінний запасний шлях
                    Якщо Scene не працює або недоступна, наступний Markdown afterPractice містить усі три ситуації, альтернативи й коректні пояснення: дитина може відповісти усно/подумки/вказуванням. Реалізація Stage 6 повинна або показувати текстовий альтернативний шлях замість Scene, або забезпечувати його явний вибір, не проголошувати Quiz пройденим.
                    
                    ## Приймання Stage 6
                    Точно три кейси і два відмінні feedback кожного, зміна вибору, повтор, клавіатура, screen reader, 200% масштаб, reduced motion, mobile, offline, low-end. Не створювати Question IDs чи scored результати. Scene UUID: 98f915af-6818-5dba-a461-9756c578dd1b.
                  productionNotes: "Stage 2: copy and spec ready; Stage 6 scene code, registry and runtime/accessibility/offline verification pending."
              afterPractice:
                config:
                  id: "15501927-9c5e-570d-aee6-8b22efa0ef31"
                  slug: "afterPractice"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Ті самі три ситуації — без інтерактивної вправи
                        Якщо картки недоступні, уяви кожну ситуацію, обери відповідь подумки, вголос або вкажи на неї, а потім прочитай пояснення.
                        
                        **1. Марійка хоче побачити Сонце.** Поглянути на нього одну мить чи розглянути готовий науковий знімок?  
                        **Пояснення:** готовий знімок безпечний, а навіть швидкий прямий погляд ризикований.
                        
                        **2. Богдан має звичайні темні окуляри.** Подивитися через них на Сонце чи попросити готове зображення?  
                        **Пояснення:** окуляри не забезпечують потрібний захист; обираємо зображення.
                        
                        **3. Оля не може вийти надвір.** Відмовитися від дослідження чи описати хмари на фотографії?  
                        **Пояснення:** можна досліджувати фото або опис без приладів і нічного виходу.
                        
                        **Що спільного?** У всіх безпечних рішеннях немає прямого погляду на Сонце.
                production:
                  purpose: "Рівноцінна текстова альтернатива кожному стану Scene."
                  productionNotes: "Stage 6 має показувати цей fallback замість Scene або на вибір, щоб не перевантажувати дублюванням."
