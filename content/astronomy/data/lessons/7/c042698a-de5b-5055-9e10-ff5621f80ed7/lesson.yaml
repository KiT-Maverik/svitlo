      skyAroundUs:
        config:
          id: "3e911ad2-0530-57f8-8aa5-10819d205c59"
          slug: "skyAroundUs"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Що можна помітити на небі?"
            navigationLabel:
              uk: "Помічаємо небо"
          content:
            items:
              welcome:
                config:
                  id: "18ba7cd1-b973-57a6-bee5-86b50328a4da"
                  slug: "welcome"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        # Небо можна досліджувати без приладів
                        Уяви готовий підписаний знімок неба. На ньому — світлі хмари й синій простір. Що ти помічаєш? Можна назвати колір, форму хмар і те, де небо світліше.
                        
                        **Спостерігати** — означає уважно помічати й описувати. Для цього не завжди потрібно виходити надвір, бачити на власні очі чи мати телескоп. Фото або точний опис теж допомагають досліджувати небо.
                        
                        **Спробуй:** назви дві ознаки з опису. Наприклад: «Я чую про світлі хмари й синій простір». Твоя фраза може бути іншою.
                        
                        **Важливо:** ми не шукаємо Сонце поглядом. Його зображення можна побачити без прямого погляду на Сонце.
                production:
                  purpose: "Ввести визначення спостереження та першу доступну дію."
                  productionNotes: "Stage 2: повний український текст готовий; переклади, незалежне рев'ю і перевірка рендерингу — пізніші етапи."
              skyExamples:
                config:
                  id: "827b5df7-917c-5e7e-9e21-65048f89e8a9"
                  slug: "skyExamples"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Порівняння теж допомагає
                        На першому готовому фото хмар багато. На другому — лише кілька. Скажи, чим ці фото відрізняються. **Відповідь:** на першому хмар більше, ніж на другому.
                        
                        А от якщо ми хочемо побачити, який вигляд має **саме Сонце**, потрібне підготовлене наукове зображення. Опис хмар — це вивчення неба, але не спосіб роздивлятися сонячний диск.
                        
                        **Подумай:** чи може людина вивчати небо вдень або вдома? Так: готові фото й озвучені описи доступні без нічного виходу.
                production:
                  purpose: "Пояснити різницю між розгляданням неба й готовим зображенням Сонця."
                  productionNotes: "Stage 2: повний український текст готовий; переклади, незалежне рев'ю і перевірка рендерингу — пізніші етапи."
            order:
              - "welcome"
              - "skyExamples"
        production:
          purpose: "Від знайомого опису хмар перейти до питання, як отримувати відомості про Сонце безпечно."
          pedagogicalIntent: "Активне осмислення науково коректного правила із доступним feedback; не вимагати читання, письма, нічних спостережень або приладів."
          productionNotes: "Без реальних вимог до вікна/вулиці; обидва приклади повністю описані словами."
      solarSafety:
        config:
          id: "12936be4-a2f0-5b31-b6eb-79a63b90687f"
          slug: "solarSafety"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Чому потрібно берегти очі?"
            navigationLabel:
              uk: "Бережемо очі"
          content:
            items:
              whyProtectEyes:
                config:
                  id: "5ae8cf30-7084-5d1f-aa8a-79701cca070c"
                  slug: "whyProtectEyes"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        # Сонце не можна перевіряти поглядом
                        Сонце дуже яскраве. **Навіть короткий прямий погляд на Сонце може пошкодити очі.** Тому не пробуй так робити й не пропонуй іншим.
                        
                        Звичайні сонцезахисні окуляри не роблять погляд на Сонце безпечним. Бінокль або телескоп без належного спеціального сонячного захисту особливо небезпечні. У цьому уроці ми **не виконуємо** прямі сонячні спостереження.
                        
                        **Порівняй:**
                        - «Я швидко погляну на Сонце». **Небезпечно:** короткий погляд теж ризикований.
                        - «Я розгляну перевірений знімок Сонця». **Безпечно:** можна дізнатися, який вигляд має Сонце, не дивлячись на нього.
                        
                        Цікавість дослідника — це добре. Потрібно лише обрати безпечний спосіб.
                production:
                  purpose: "Правило сонячної безпеки, причинне пояснення, протиставлення ризикованого й безпечного."
                  productionNotes: "Stage 2: повний український текст готовий; переклади, незалежне рев'ю і перевірка рендерингу — пізніші етапи."
              safeWays:
                config:
                  id: "62dfa921-fff7-5b31-b975-882f8ce70b8a"
                  slug: "safeWays"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        ## Як дізнатися про Сонце без ризику?
                        Попроси дорослого показати **готове фото або запис**, підготовлений науковцями. За таким зображенням можна описати Сонце, не дивлячись на нього на небі.
                        
                        Фахівці іноді отримують зображення Сонця спеціальними пристроями — наприклад, проєкцією на поверхню. У цьому уроці можна лише переглянути **готовий запис**. Ми не майструємо та не випробовуємо такі пристрої і ніколи не дивимося через отвір проєктора.
                        
                        **Поширена помилка:** «Дуже темні окуляри захищають». **Виправлення:** колір окулярів не доводить захист для прямого погляду на Сонце.
                        
                        **Інша помилка:** «Небо можна досліджувати тільки вночі». **Виправлення:** навіть вдень можна описувати готовий знімок хмар.
                        
                        **Коротко:** для знань про Сонце обирай наукові знімки, а не ризикований погляд.
                production:
                  purpose: "Сформувати позитивні безпечні альтернативи без небезпечних інструкцій."
                  productionNotes: "Stage 2: повний український текст готовий; переклади, незалежне рев'ю і перевірка рендерингу — пізніші етапи."
            order:
              - "whyProtectEyes"
              - "safeWays"
        production:
          purpose: "Науково коректно розрізнити небезпечний прямий погляд і перегляд готового фото/запису."
          pedagogicalIntent: "Активне осмислення науково коректного правила із доступним feedback; не вимагати читання, письма, нічних спостережень або приладів."
          productionNotes: "Усі небезпечні дії — лише словесні контрприклади, не візуальні інструкції; джерела NASA/AAS зі Stage 1."
      safeChoices:
        config:
          id: "382eacbe-b1a2-5988-9469-2dc6ed35d707"
          slug: "safeChoices"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Обираємо безпечні дії"
            navigationLabel:
              uk: "Тренуємо вибір"
          content:
            items:
              practiceIntro:
                config:
                  id: "d172d47e-8c5b-57e5-95d5-590783750974"
                  slug: "practiceIntro"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        # Обери дію, яка береже очі
                        Перед кожним рішенням подумай: **«Чи потрібно мені для цього дивитися прямо на Сонце?»** Якщо так — шукай інший спосіб. Фото чи словесний опис часто дають потрібні відомості без ризику.
                        
                        У вправі можна помилятися, міняти вибір і читати пояснення. Це **тренування, а не оцінка**. Не потрібні реальні сонячні спостереження, прилади чи письмо.
                production:
                  purpose: "Підвести до неоцінюваної ситуаційної практики."
                  productionNotes: "Stage 2: повний український текст готовий; переклади, незалежне рев'ю і перевірка рендерингу — пізніші етапи."
              safeChoiceLab:
                config:
                  id: "98f915af-6818-5dba-a461-9756c578dd1b"
                  slug: "safeChoiceLab"
                  type: "scene"
                  params: {}
                  locale:
                    value:
                      intro:
                        uk: "Три ситуації. Обери дію, прочитай пояснення. Можна змінювати вибір: це тренування, не оцінка."
                      photo:
                        prompt:
                          uk: "Марійка хоче побачити, який вигляд має Сонце. Що порадиш?"
                        safe:
                          uk: "Розглянути підписане наукове фото Сонця"
                        risk:
                          uk: "Поглянути просто на Сонце лише на мить"
