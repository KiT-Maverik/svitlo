    - 6b5700fb-8ba9-4483-9b1b-5c6a28347e12 # observationPractice
    - c8f35ba8-a7b9-4e99-83bc-1f21326aafc7 # terrestrialSkyCycles
    - 48079b94-cef6-4aaa-9d94-80c5099520df # lunarAppearance
  skills:
    - b4b9b469-391d-40f8-b11d-6884c76ed106 # safeSolarObservation
    - faa8f11a-cc06-42c9-8864-8151732e690a # dayAndNight
    - 05f79f1d-da4d-4c52-a2d1-332cfd48867c # astronomicalObservationRecords
    - 2c404b38-fbad-47f6-a70c-fe12218ac240 # solarSystemComponents
    - 53bba831-1f84-4b25-8e05-33f54167cc98 # lunarPhases (introductory observation, not full mastery)
  explanation: >-
    Заплановані навчальні цілі охоплюють безпечне спостереження,
    фіксацію простих спостережень, розуміння зміни дня й ночі
    та початкове розрізнення складових Сонячної системи.
    UUID повних таксономічних компетентностей задають напрям,
    а не твердження про досягнуту першокласниками повну майстерність.
