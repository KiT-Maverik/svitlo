content:
  items:
    firstLookAtSky:
      type: lesson
      slug: firstLookAtSky
      lessonId: 5217424c-e9d7-45e6-8f49-bb450d8e47f1
      title: Почнімо досліджувати небо
      objective: >-
        Пояснити, чому не можна дивитися безпосередньо на Сонце,
        і назвати приклади безпечного спостереження за небом.
      skills:
        - b4b9b469-391d-40f8-b11d-6884c76ed106 # safeSolarObservation
      depth: Вступне розпізнавання ризиків без обов'язкового особистого спостереження.
      sequenceReason: Навчити безпеки перед іншими спостереженнями денного неба.
      matchingRationale: >-
        Редакторський задум незалежного Lesson; у пакеті Astronomy
        немає існуючих Lessons. Без прив'язки до конкретного Course.
    safeObservation:
      type: chapter
      slug: safeObservation
      title: Спостерігаємо за небом безпечно
      methodology: >-
        Почати з життєвого досвіду дітей: що видно на небі вдень і
        ввечері, які спостереження безпечні, як записати побачене
        малюнком, піктограмою або коротким усним описом. Спершу
        пояснити заборону прямого спостереження Сонця без захисту.
        Не вимагати читання, нічних виходів або фізичного доступу
        до відкритого неба.
      outcomes:
        skillGroups:
          - 6b5700fb-8ba9-4483-9b1b-5c6a28347e12 # observationPractice
        skills:
          - b4b9b469-391d-40f8-b11d-6884c76ed106 # safeSolarObservation
          - 05f79f1d-da4d-4c52-a2d1-332cfd48867c # astronomicalObservationRecords
        explanation: >-
          Дитина розрізняє приклади безпечної й небезпечної поведінки
          та фіксує просте спостереження за допомогою доступного
          їй формату; повного володіння професійним протоколом
          спостереження не вимагаємо.
      content:
        items:
          observationJournal:
            type: lesson
            slug: observationJournal
            lessonId: 26157b19-77ae-4bbb-ad0e-8f1a5ffae6b8
            title: Мій перший щоденник неба
            objective: >-
              Зафіксувати одне спостереження малюнком, піктограмою
              чи коротким усним описом, зазначивши час дня.
            skills:
              - 05f79f1d-da4d-4c52-a2d1-332cfd48867c # astronomicalObservationRecords
            depth: Прості дані про спостереження; не вимагаємо письма або нічних виходів.
            sequenceReason: Після навчання безпеки перейти до фіксації побаченого.
            matchingRationale: >-
              Новий Course-neutral Lesson для базових записів
              спостереження; перевірений Skill у taxonomy.
        order:
          - observationJournal
    skyCycles:
      type: module
      slug: skyCycles
      title: Як змінюється небо
      methodology: >-
        Після безпечних спостережень порівняти регулярні видимі зміни:
        день і ніч, освітлений вигляд Місяця в різні дні. Йти від
        впізнаваного досвіду до простих моделей і залишати
        геометричні пояснення фаз та складну механіку поза
        обов'язковими результатами першого класу.
      outcomes:
        skillGroups:
          - c8f35ba8-a7b9-4e99-83bc-1f21326aafc7 # terrestrialSkyCycles
          - 48079b94-cef6-4aaa-9d94-80c5099520df # lunarAppearance
        skills:
          - faa8f11a-cc06-42c9-8864-8151732e690a # dayAndNight
          - 53bba831-1f84-4b25-8e05-33f54167cc98 # lunarPhases
        explanation: >-
          Учень порівнює денне і нічне небо, помічає повторювані
          зміни та описує відмінності видимого Місяця; це вступне
          знайомство з двома Skill, а не сертифікація повного їх обсягу.
      content:
        items:
          skyChangesOverview:
            type: lesson
            slug: skyChangesOverview
            lessonId: f5dfb216-b1a4-4f16-82f6-fb2a1169f64d
            title: Як помітити зміни на небі
            objective: >-
              Порівняти денне та нічне небо і помітити,
              що освітлена частина Місяця може виглядати по-різному,
              відокремлюючи спостереження від пояснення причин.
            skills:
              - faa8f11a-cc06-42c9-8864-8151732e690a # dayAndNight
              - 53bba831-1f84-4b25-8e05-33f54167cc98 # lunarPhases
            depth: >-
              Спостереження та порівняння; не повна геометрія фаз
              Місяця чи деталізована механіка обертання Землі.
            sequenceReason: Спільний вступ до двох циклів перед тематичними Chapters.
            matchingRationale: >-
              Тестове розміщення прямо у Module.
              TODO(editorial): перевірити ширину Lesson,
              бо обидва підпорядковані Chapters ще не наповнені.
          dayAndNight:
            type: chapter
            slug: dayAndNight
            title: Чому бувають день і ніч
            methodology: >-
              Зіставити світло й темряву на знайомих прикладах,
              використати доступну просту модель Землі, що обертається,
              і показати, чому на одному боці є день, а на іншому ніч.
              Не вимагати пояснень астрономічних координат або
              самостійного складного просторового моделювання.
            outcomes:
              skills:
                - faa8f11a-cc06-42c9-8864-8151732e690a # dayAndNight
              explanation: >-
                Дитина розрізняє день і ніч та на доступному рівні
                пов'язує їх чергування з обертанням Землі.
          moonAppearance:
            type: chapter
            slug: moonAppearance
            title: Місяць змінює свій вигляд
            methodology: >-
              За зіставленням безпечних зображень і спостережень
              помічати різні видимі освітлені частини Місяця;
              обговорювати, що Місяць не стає іншою фізичною формою.
              Повна геометрична теорія фаз не входить у вимоги;
              пропонувати альтернативу особистим нічним спостереженням.
            outcomes:
              skills:
                - 53bba831-1f84-4b25-8e05-33f54167cc98 # lunarPhases
              explanation: >-
                Дитина впізнає і порівнює видимі форми освітленої
                частини Місяця, не претендуючи на повне пояснення
                орбітальної геометрії.
        order:
          - skyChangesOverview
          - dayAndNight
          - moonAppearance
    solarSystem:
      type: module
      slug: solarSystem
      title: Наші космічні сусіди
      methodology: >-
        Перейти від знайомих об'єктів до початкової класифікації:
        Сонце як зоря, Земля як планета, Місяць як її природний
        супутник. Інші планети знайомлять із системою на прикладах,
        без запам'ятовування великих переліків, масштабів і
        механічних деталей руху.
      outcomes:
        skillGroups:
          - abfb0627-a4a5-410e-9881-04d22158a297 # systemArchitecture
        skills:
          - 2c404b38-fbad-47f6-a70c-fe12218ac240 # solarSystemComponents
        explanation: >-
          Дитина наводить прості приклади зорі, планети й супутника
          та розрізняє їхні ролі в Сонячній системі.
      content:
        items:
          solarSystemBasics:
            type: chapter
            slug: solarSystemBasics
            title: Сонце, Земля та їхні сусіди
            methodology: >-
              На прикладі Сонця, Землі й Місяця з'ясувати відмінності
              ролей зорі, планети й природного супутника. Поступово
              показати інші планети як членів Сонячної системи,
              не перетворюючи знайомство на вимогу складної
              класифікації або розрахунків.
            outcomes:
              skills:
                - 2c404b38-fbad-47f6-a70c-fe12218ac240 # solarSystemComponents
              explanation: >-
                Дитина пояснює простими словами, що Сонце є зорею,
                Земля планетою, а Місяць її природним супутником.
            content:
              items:
                sunEarthMoonRoles:
                  type: lesson
                  slug: sunEarthMoonRoles
                  lessonId: 9b0bf991-e871-4b2e-9e1c-d15497135906
                  title: Сонце, Земля і Місяць — хто є хто?
                  objective: >-
                    Розрізнити Сонце як зорю, Землю як планету,
                    а Місяць як природний супутник Землі.
                  skills:
                    - 2c404b38-fbad-47f6-a70c-fe12218ac240 # solarSystemComponents
                  depth: Базова класифікація за роллю без масштабів та формул.
                  sequenceReason: Перенести досвід спостереження на поняття небесних тіл.
                  matchingRationale: >-
                    Новий самостійний Lesson без Course-залежних
                    персонажів; відповідає перевіреному Skill.
              order:
                - sunEarthMoonRoles
        order:
          - solarSystemBasics
  order:
    - firstLookAtSky
    - safeObservation
    - skyCycles
    - solarSystem
