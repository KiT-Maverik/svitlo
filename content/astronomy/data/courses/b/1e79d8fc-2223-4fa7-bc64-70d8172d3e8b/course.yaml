id: 1e79d8fc-2223-4fa7-bc64-70d8172d3e8b
type: course
slug: astronomyGradeOne
title: Астрономія для першокласників
description: Перші спостереження за небом і знайомство із Землею, Місяцем, Сонцем та Сонячною системою.
documentLanguage: uk
supportedLanguages:
  - uk
  - en
  - pl
  - qm
grade:
  min: 1
  max: 1
methodology:
  purpose: >-
    Дати учням першого класу початкові науково коректні уявлення про те,
    що можна спостерігати на небі, та сформувати звичку ставити запитання,
    перевіряти прості припущення й спостерігати безпечно.
  audience: >-
    Учні першого класу (орієнтовно 6–8 років, залежно від освітньої системи).
    Початкові навички читання й письма можуть бути ще не сформовані;
    матеріал має бути придатним до самостійного вивчення та навчання з дорослим.
  approach: >-
    Рухатися від знайомих спостережень до обережних причинно-наслідкових
    пояснень: запитання, передбачення, безпечне спостереження або модель,
    зіставлення з попереднім досвідом, усне чи візуальне відтворення.
    Не вважати впізнавання зображення доказом повного володіння Skill.
  depth: >-
    Вступний рівень. Навчати розрізняти Сонце, Місяць, зорі та планети
    на зрозумілих прикладах; помічати зміну дня й ночі та видимого
    вигляду Місяця. Складні просторові моделі, координати, астрономічні
    обчислення й повні механістичні пояснення залишаються поза межами
    обов'язкових результатів першого класу.
  scope: >-
    Вступне спостереження неба, безпека спостереження за Сонцем,
    простий щоденник спостережень з піктограмами, добова зміна
    освітленості, впізнавання поширених небесних тіл і початкове
    знайомство із Сонячною системою. Видимі зміни Місяця
    розглядати описово, не заявляючи повного опанування складної геометрії фаз.
  accessibility: >-
    Передбачити короткі фрази, озвучення з текстовою альтернативою,
    доступні описи зображень, альтернативи завданням на зір, слух,
    письмо чи дрібну моторику та керований темп. Нічне спостереження
    не має бути обов'язковою умовою доступу до результату навчання.
    Діти ніколи не повинні дивитися на Сонце без належного захисту;
    не пропонувати пряме спостереження чи оптику без сертифікованих фільтрів.
  entryConditions: >-
    Не потрібні попередні курси астрономії. Достатньо побутового
    знайомства зі світлом і темрявою; читання, складна арифметика,
    телескоп і особисте нічне спостереження не є передумовами.
  sourceNotes: >-
    Робочий пілот нового Create Course Flow.
    Таксономічні UUID звірені з content/astronomy/data/skills.
    Власник погодив вступну глибину, чотиримовний пілот і
    відсутність заяв про відповідність освітнім стандартам
    2026-11-17. Stage 2 макроструктура очікує редакторської перевірки.
