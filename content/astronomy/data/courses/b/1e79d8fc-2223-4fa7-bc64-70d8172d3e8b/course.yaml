content:
  items:
    firstLookAtSky:
      type: lesson
      slug: firstLookAtSky
      title: Почнімо досліджувати небо
      objective: >-
        Пояснити, чому не можна дивитися безпосередньо на Сонце,
        і назвати приклади безпечного спостереження за небом.
      skills:
        - b4b9b469-391d-40f8-b11d-6884c76ed106 # safeSolarObservation
      depth: Вступне розпізнавання ризиків без обов'язкового особистого спостереження.
      sequenceReason: Навчити безпеки перед іншими спостереженнями денного неба.
      matchingRationale: >-
        Редакторський задум незалежного Lesson; у пакеті Astronomy
        немає існуючих Lessons. Без прив'язки до конкретного Course.
      quizRequired: true
      methodology: |-
        # Почнімо досліджувати небо
        
        ## Мета та межі
        Навчити помічати небо, не наражаючи зір на небезпеку. Розмежувати цікавість до спостереження і небезпечне пряме споглядання Сонця.
        
        ## Аудиторія і передумови
        Діти приблизно 6–8 років, які тільки починають навчання астрономії; читання, письмові навички, нічні спостереження і телескоп не є умовою.
        Передумови: досвід денного світла і темряви без попередніх астрономічних курсів. За відсутності власних спостережень використовувати достовірні підписані зображення або озвучені описи.
        
        ## Перевірені Skills та джерела
        - b4b9b469-391d-40f8-b11d-6884c76ed106 — `content/astronomy/data/skills/observingTheSky/observationPractice/safeSolarObservation.ts` (перевірена канонічна таксономія).
        
        ## Спостережувані результати
        - Назвати або показати принаймні один приклад безпечного спостереження за небом без прямого погляду на Сонце.
        - Розпізнати на доступному прикладі небезпечні способи: дивитися на Сонце, користуватися біноклем чи телескопом без спеціального сертифікованого сонячного фільтра.
        - Пояснити, що для астрономічних спостережень можна використовувати готові знімки, малюнки й описи; не потрібно дивитися на Сонце.
        
        ## Науково коректні опорні твердження
        - Сонячне світло може ушкодити очі; звичайні сонцезахисні окуляри, саморобні фільтри й нефільтрована оптика не роблять пряме споглядання Сонця безпечним.
        - Небо можна описувати і без спостережень Сонця: хмари, освітленість, видимі об'єкти на перевірених фото; нічні виходи не потрібні.
        - Використовувати спеціальні методи сонячних спостережень можна лише за визначеними правилами з відповідним захистом і під відповідальним наглядом; для цього віку не призначати прямі сонячні спостереження.
        
        ## Типові помилкові уявлення
        - «На Сонце можна швидко поглянути без ризику» — ні, таке завдання не пропонуємо.
        - «Темні окуляри або звичайний телескоп захищають» — ні; не рекомендувати жодної імпровізованої оптики.
        - «Досліджувати небо можна лише вночі» — ні.
        
        ## Принципова навчальна прогресія
        Спочатку поставити запитання «що можна помітити на небі?»; потім відокремити безпечні способи отримання інформації від небезпечних і лише після цього розглядати прості спостережні приклади. Автор Screenwriter окремо визначить форми практики.
        
        ## Assessment plan
        ```yaml
        assessmentPlan:
          quizRequired: true
          quizzes:
            - key: safeSkyChoices
              purpose: 'Переконатися, що дитина переносить правило сонячної безпеки на нову ситуацію, а не лише повторює заборону.'
              skills: [b4b9b469-391d-40f8-b11d-6884c76ed106]
              requiredAssessmentMethods: [classification, application]
        ```
        Це методологічне обґрунтування Quiz, а не готові запитання, бали, способи введення відповідей чи реалізація Section. Різні методи оцінюють різні когнітивні операції; Assessment Architect визначить валідні завдання, критерії та банки.
        
        ## Доступність, локалізація, офлайн
        Усе має працювати без доступу до вулиці й без апаратури; зображення супроводжуються словами і доступним текстом; не вимагати читання або розпізнавання лише за кольором.
        Планові мови Lesson: uk, en, pl, qm; українська — єдина авторська мова на цьому етапі. Жодних невиконаних перекладів не імітувати. Однакові цілі мають бути досяжними у слабкій мережі/офлайн та без обов'язкових органів чуття чи письма.
        
        ## Механізми перевірки достовірності і межі
        Канонічний предметний орієнтир: `content/astronomy/docs/skills/taxonomy.md` та верифіковані Code визначення вище; освітній стандарт із країною/версією не заявляється. Цей вступний Lesson не засвідчує повної майстерності всієї таксономічної компетентності.
        Сценарій, персонажі Course, Епізоди, конкретні Sections, Questions, мультимедіа та scoring є окремими наступними рішеннями спеціалістів.
    safeObservation:
      type: chapter
      slug: safeObservation
      title: Спостерігаємо за небом безпечно
      methodology: >-
        Почати з життєвого досвіду дітей: що видно на небі вдень і
        ввечері, які спостереження безпечні, як записати побачене
        малюнком, піктограмою або коротким усним описом. Спершу
        пояснити заборону прямого спостереження Сонця без захисту.
        Не вимагати читання, нічних виходів або фізичного доступу
        до відкритого неба.
      outcomes:
        skillGroups:
          - 6b5700fb-8ba9-4483-9b1b-5c6a28347e12 # observationPractice
        skills:
          - b4b9b469-391d-40f8-b11d-6884c76ed106 # safeSolarObservation
          - 05f79f1d-da4d-4c52-a2d1-332cfd48867c # astronomicalObservationRecords
        explanation: >-
          Дитина розрізняє приклади безпечної й небезпечної поведінки
          та фіксує просте спостереження за допомогою доступного
          їй формату; повного володіння професійним протоколом
          спостереження не вимагаємо.
      content:
        items:
          observationJournal:
            type: lesson
            slug: observationJournal
            title: Мій перший щоденник неба
            objective: >-
              Зафіксувати одне спостереження малюнком, піктограмою,
              аудіо чи словами: що, коли, де/з якого джерела та як побачено.
            skills:
              - 05f79f1d-da4d-4c52-a2d1-332cfd48867c # astronomicalObservationRecords
            depth: Прості дані про спостереження; не вимагаємо письма або нічних виходів.
            sequenceReason: Після навчання безпеки перейти до фіксації побаченого.
            matchingRationale: >-
              Новий Course-neutral Lesson для базових записів
              спостереження; перевірений Skill у taxonomy.
            quizRequired: false
            methodology: |-
              # Мій перший щоденник неба
              
              ## Мета та межі
              Сформувати звичку відокремлювати те, що було побачено або представлено в достовірному джерелі, від здогадки та залишати зрозумілий іншим слід спостереження.
              
              ## Аудиторія і передумови
              Діти приблизно 6–8 років, які тільки починають навчання астрономії; читання, письмові навички, нічні спостереження і телескоп не є умовою.
              Передумови: досвід денного світла і темряви без попередніх астрономічних курсів. За відсутності власних спостережень використовувати достовірні підписані зображення або озвучені описи.
              
              ## Перевірені Skills та джерела
              - 05f79f1d-da4d-4c52-a2d1-332cfd48867c — `content/astronomy/data/skills/observingTheSky/observationPractice/astronomicalObservationRecords.ts` (перевірена канонічна таксономія).
              
              ## Спостережувані результати
              - Показати або сказати, що було помічено на небі, використовуючи малюнок, піктограму, аудіо чи кілька слів.
              - Зафіксувати орієнтовний час (ранок, день, вечір або дата), загальне місце чи джерело, спосіб і суттєві умови спостереження; не вимагати геолокації.
              - Порівняти два записи і назвати одну помічену відмінність без вигаданого пояснення причини.
              
              ## Науково коректні опорні твердження
              - Астрономічний запис має відповідати на питання «що? коли? звідки або за яких умов?». Вступні піктограми — початок, не повний протокол наукового спостереження.
              - Суб'єктивне враження «гарно» відрізняється від спостережного твердження «на зображенні є Місяць і дві хмари».
              - Достовірні зображення не тотожні особистому спостереженню; потрібно позначати, що саме використано.
              
              ## Типові помилкові уявлення
              - «Запис має бути довгим текстом» — ні, для першокласника піктограма, малюнок, аудіо або вибір доступних описів допустимі.
              - «На знімку і в реальному небі завжди все однакове» — ні, місце і час можуть відрізнятися.
              - «Здогад про причину — це вже спостереження» — ні, розрізняємо побачене й припущене.
              
              ## Принципова навчальна прогресія
              Від однієї деталі у відомому зображенні до короткого структурованого запису (об'єкт, умовний час, умови) і порівняння двох незалежних записів. Дозволити готові зображення замість особистого виходу на вулицю.
              
              ## Assessment plan
              ```yaml
              assessmentPlan:
                quizRequired: false
                quizzes: []
              ```
              Scored Quiz не потрібен: доказом є доступний індивідуальний запис про що, коли, де/звідки та як спостерігали, з поясненням для іншої людини. Надати формувальний відгук за змістом запису без оцінювання почерку, мовлення чи моторики. Це не скасовує майбутнього незалежного оцінювання.
              Question Bank: Not Applicable для цього практичного Lesson, оскільки його визначальний результат — власний структурований запис із поясненням, а типові Questions підміняли б автентичне виконання розпізнаванням. Це конкретне методичне обґрунтування винятку, а не відкладена незавершена робота.
              
              ## Доступність, локалізація, офлайн
              Перевага формувальному оцінюванню через якість власного доступного запису, а не нав'язаному scored Quiz. Варіанти без клавіатури та письма, без власного фото чи геолокації, з озвученням та офлайн-зразками. Assessment Architect може пізніше запропонувати валідні докази, але поточний Methodologist не вимагає Quiz.
              Планові мови Lesson: uk, en, pl, qm; українська — єдина авторська мова на цьому етапі. Жодних невиконаних перекладів не імітувати. Однакові цілі мають бути досяжними у слабкій мережі/офлайн та без обов'язкових органів чуття чи письма.
              
              ## Механізми перевірки достовірності і межі
              Канонічний предметний орієнтир: `content/astronomy/docs/skills/taxonomy.md` та верифіковані Code визначення вище; освітній стандарт із країною/версією не заявляється. Цей вступний Lesson не засвідчує повної майстерності всієї таксономічної компетентності.
              Сценарій, персонажі Course, Епізоди, конкретні Sections, Questions, мультимедіа та scoring є окремими наступними рішеннями спеціалістів.
        order:
          - observationJournal
    skyCycles:
      type: module
      slug: skyCycles
      title: Як змінюється небо
      methodology: >-
        Після безпечних спостережень порівняти регулярні видимі зміни:
        день і ніч, освітлений вигляд Місяця в різні дні. Йти від
        впізнаваного досвіду до простих моделей і залишати
        геометричні пояснення фаз та складну механіку поза
        обов'язковими результатами першого класу.
