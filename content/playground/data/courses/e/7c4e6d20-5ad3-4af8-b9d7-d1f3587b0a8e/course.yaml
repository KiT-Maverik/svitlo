  skills: ['00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000008']
  skillGroups: ['00000000-0000-4000-8000-000000000003']
  explanation: 'Recognition of familiar color and simple shape before comparison and transfer; the group reference tests group-level prerequisites, not blanket proof of mastery.'
