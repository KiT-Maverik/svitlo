# Synthetic E2E editorial fixture; English is the source, Ukrainian is planned, not fabricated.
# Course Flow owns this single temporary course.yaml until independently approved Stage 5.
id: '7c4e6d20-5ad3-4af8-b9d7-d1f3587b0a8e'
type: 'course'
slug: 'playgroundE2eLearningLab'
title: 'Playground E2E · Light, Shapes and Color'
description: 'A synthetic bilingual Course designed to exercise the complete Svitlo authoring, materialization, assessment, translation and publishing pipeline.'
documentLanguage: 'en'
supportedLanguages: ['en', 'uk']
age:
  min: 8
  max: 11
grade:
  min: 3
  max: 5
methodology:
  purpose: 'A deliberately varied, non-production E2E Course fixture. Validate all Course/Lesson/Question/Flashcard workflows, module/chapter/episode composition, reused and newly planned Lessons, independent Question Bank links, per-Lesson completion policy, real Section/ContentBlock creation, media TODOs and en/uk translation review.'
  audience: 'Developers and specialist reviewers exercising a simulated curriculum for ages 8–11, grades 3–5. End-user language and accessibility requirements still apply. It is NOT approved teaching material, and synthetic taxonomy entries are not education-standard evidence.'
  approach: 'Progress from recognition through comparison, guided manipulation and independent assessment: first shapes, then light and colors, finally a cross-topic check. A Course-owned Episode adds optional narrative without changing standalone Lesson meaning. Contrast optional/required quizzes, external bank selection, flashcard-only work and media-rich Scenes. Every Lesson slot specifies exact intended Section types and ContentBlock types; the Lesson Flow, not Course Stage 3, authors their final Configs.'
  depth: 'Broad synthetic coverage with narrowly defined, observable recognition and explanation. Exercise all currently runtime-supported Section kinds (content, practice, learningFlow, codingTask, flashcards, quiz) across different Lessons; cover the ten ContentBlocks (text, markdown, code, image, audio, video, youtube, carousel, checkpoint, scene). Build-only Quest is explicitly not treated as operational runtime coverage.'
  accessibility: 'Keyboard and switch-compatible interaction, visual contrast, alt text, audio descriptions or transcripts, captions for videos, a nonvisual equivalent for each Scene, reduced motion, and small-screen responsive layout are required at Lesson implementation. Missing media must be visible unresolved TODO blockers rather than invented finished assets.'
  scope: 'Exactly two Modules (one with two Chapters and one with one Chapter), one root Chapter, one root Episode, direct root and module Lessons, chapter Lessons, two distinct reused existing Lessons (one unchanged, one Course-only override), eight new Lesson slots with future UUID allocation, distinct Quiz/Flashcards bank decisions, and assessment-only Lessons referencing upstream banks. Educational copy is minimal, but functional block and section coverage is mandatory later.'
  entryConditions: "Basic ability to recognize familiar red objects and circles, follow short instructions, and choose accessible input controls. The Course's prerequisite UUIDs represent a test of skill prerequisite propagation; this fixture must not pretend mastery of every taxonomy descendant."
  sourceNotes: 'Only English is authored at this point. Ukrainian is planned, not translated or approved. No verified EducationStandard is claimed. Source Skill/Group/Domain UUIDs are from content/playground/data/skills/testColors, testShapes and testLight. Existing Lessons lightDiscovery and howLightMoves are reused by exact UUID; the first is pure reuse and the second has explicit inline Course-only edits that Stage 5 transforms into a stateless Build API override. Future Question/Flashcard IDs must come from approved actual banks; do not insert fake UUIDs here.'
