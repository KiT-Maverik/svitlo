  methodology: |-
    Instructional purpose: Identify triangles and squares from their sides and corners, including rotated examples.

    Audience/depth: ages 8–11, guided exploration to independent recognition or explanation as appropriate; synthetic Playground demonstration, not a production curriculum.

    Target Skills: 00000000-0000-4000-8000-000000000011 (verified Playground taxonomy); 00000000-0000-4000-8000-000000000012 (verified Playground taxonomy).

    Sequence and prerequisites: First Chapter Lesson. It provides the first independently owned Question Bank for the later shapesAssessment Lesson.. Distinguish the broader Course entry conditions from the knowledge taught in this Lesson.

    Planned Sections (ordered authoring requirements; the separate Lesson Flow later materializes their actual Configs):
    1. content — definitions and worked comparisons
    2. practice — learner identifies properties with feedback
    3. learningFlow — short interactive manipulation of polygons

    Planned ContentBlock coverage: text, markdown, image, scene, checkpoint. These are implementation requirements, not already-authored blocks. Reuse shared UI Kit components; no fabricated files.

    Assessment decisions: requiresQuestionBank=true; requiresFlashcardBank=false; requiresQuizSection=false; requiresFlashcardsSection=false; quizRequiredForCompletion=false. Bank presence, section presence and completion gate are independent decisions.

    Assessment evidence: Create diagnostic Question Bank items for properties, rotated counterexamples and the misconception that orientation changes a shape; no local Quiz Section.. Questions need meaningful core and extension evidence; each Quiz must select explicit real Question IDs from independently reviewed banks. Flashcards should have one idea each and no filler.

    Media and Scenes: any planned physical media or Scene receives an explicit handoff/specification; missing assets remain visible TODO (BLOCKER) obligations, not invented final media.

    Accessibility and localization: English is the source; Ukrainian is a required later genuine translation. Every interaction needs keyboard, nonvisual equivalent, captions/transcripts for media, reduced motion and mobile layouts.

    Verification: separate Lesson/Question/Flashcard workflows own construction and approval. Structural validity or TODO placeholders are not approval.
