production:
  documentLanguage: en
  methodology: |-
    Instructional purpose: Demonstrate transfer by selecting evidence on geometry, color classification, and light propagation.

    Audience/depth: ages 8–11, guided exploration to independent recognition or explanation as appropriate; synthetic Playground demonstration, not a production curriculum.

    Target Skills: 00000000-0000-4000-8000-000000000011 (verified Playground taxonomy); 00000000-0000-4000-8000-000000000008 (verified Playground taxonomy); 00000000-0000-4000-8000-000000000004 (verified Playground taxonomy); 00000000-0000-4000-8000-000000000015 (verified Playground taxonomy).

    Sequence and prerequisites: Top-level Chapter follows both Modules and depends on their independently reviewed Question Banks. It is an assessment-only Lesson, not a standalone teaching replacement.. Distinguish the broader Course entry conditions from the knowledge taught in this Lesson.

    Planned Sections (ordered authoring requirements; the separate Lesson Flow later materializes their actual Configs):
    1. content — explain what is assessed and how to navigate
    2. practice — optional preparatory contrast
    3. quiz — blocking multi-Lesson Question selection with mixed Skills

    Planned ContentBlock coverage: markdown, text, checkpoint. These are implementation requirements, not already-authored blocks. Reuse shared UI Kit components; no fabricated files.

    Assessment decisions: requiresQuestionBank=false; requiresFlashcardBank=false; requiresQuizSection=true; requiresFlashcardsSection=false; quizRequiredForCompletion=true. Bank presence, section presence and completion gate are independent decisions.

    Assessment evidence: Use a minimal balanced sample from multiple upstream banks; show diagnostic feedback for each independent learning outcome. Do not create own Question Bank.. Questions need meaningful core and extension evidence; each Quiz must select explicit real Question IDs from independently reviewed banks. Flashcards should have one idea each and no filler.

    Media and Scenes: any planned physical media or Scene receives an explicit handoff/specification; missing assets remain visible TODO (BLOCKER) obligations, not invented final media.

    Accessibility and localization: English is the source; Ukrainian is a required later genuine translation. Every interaction needs keyboard, nonvisual equivalent, captions/transcripts for media, reduced motion and mobile layouts.

    Verification: separate Lesson/Question/Flashcard workflows own construction and approval. Structural validity or TODO placeholders are not approval.

    External assessment dependency: Question Bank owners: shapeStudio/recognition/polygonIntro; shapeStudio/recognition/circleAndOval; colorLight/illumination/lightPath; colorLight/illumination/colorTransfer. These are Course slot keys, not Question UUIDs. Real Question selections can be integrated only after source-bank validation and approved localization.
