                  title: "Як ШІ навчається на прикладах?"
                  objective: "На керованих прикладах розрізнити явно задане правило та модель, чию поведінку налаштовують за навчальними даними, і пояснити, чому нові приклади можуть давати інший результат."
                  skills:
                    - 014446e9-1ee1-4797-85ce-869b67208166
                    - 799b85b6-30c0-489b-8e8a-b821a3332a75
                  depth: "Ознайомче порівняння механізмів: людина задає правило проти моделі, параметри якої налаштовуються за прикладами; лише з підтримкою дорослого, без формул або власного тренування."
                  sequenceReason: "Завершує модуль після послідовностей, умов і класифікації цілей ШІ; створює основу для наступного модуля про помилки, незалежну перевірку й відповідальність людини."
                  methodology: |-
                    # Методологія — Як ШІ навчається на прикладах?
                    
                    ## Аудиторія, мета, передумови та межі
                    Цей Lesson є самостійним навчальним матеріалом для дітей приблизно шести років; сценарій не потребує Course-персонажа, акаунта, інтернету чи навички читати. Вступна опора: дорослий може навести просте правило «якщо умова виконана — зроби дію», але урок повинен повторити його без вимоги пройти конкретний попередній Lesson. Мета — порівняти два різні способи визначати поведінку систем: безпосередньо прописане правило та результат навчання моделі за прикладами. Не навчати кодувати алгоритм, змінювати ваги моделі вручну, обчислювати метрики точності, завантажувати набори реальних даних.
                    
                    ## Два канонічні Skills й окремі результати
                    (1) distinguishRulesFromTrainedModels — 014446e9-1ee1-4797-85ce-869b67208166, source content/informatics/data/skills/artificialIntelligence/aIFundamentals/distinguishRulesFromTrainedModels.ts. Дитина з опорою на приклад пояснює: в одному випадку людина явно задала критерій/дію, в іншому система налаштовувала параметри під час навчання на даних; може розрізнити два описи без фрази «ШІ сам думає». (2) explainLearningFromExamples — 799b85b6-30c0-489b-8e8a-b821a3332a75, source content/informatics/data/skills/artificialIntelligence/aIFundamentals/explainLearningFromExamples.ts. Дитина пояснює за підтримки, що приклади допомагають налаштувати модель для відповіді на новий випадок; розуміє, що лише запам'ятати показані приклади недостатньо для надійної роботи з новими. Рівень другого Skill суто вступний, без претензії на повну технічну компетентність.
                    
                    ## Науково коректний зміст, приклади та контрприклади
                    Явно запрограмоване правило — людина прямо задає умову, наприклад «якщо на картці є коло, познач її». Навчена модель — під час тренування її внутрішні параметри коригуються за набором прикладів і критерієм якості; після цього вона намагається узагальнити й відповісти на нові дані. Безекранне сортування карток дитиною тільки НАГАДУЄ оцінку/класифікацію, але не є реальним тренуванням ML-моделі; автор і дорослий повинні називати це ілюстрацією. Система з фіксованим правилом може працювати без ML; багато AI-систем використовують ML, але не всі; правило та навчена модель можуть поєднуватися. Показані приклади можуть бути неповними або однобічними; правильне відтворення відомих прикладів не доводить успіху на невідомому випадку. Модель не стає людиною і не гарантує істинності відповіді.
                    
                    ## Концептуальна послідовність і типові помилки
                    Почати з явного правила, де результат можна прослідкувати, порівняти з описом системи, якій показували багато різних прикладів і перевіряли, чи вона правильно відповідає. Далі поставити новий випадок: інший предмет або незнайома форма, й обговорити чому можливий промах і навіщо потрібні різні навчальні приклади. Не демонструвати несправжню «автоматичну зміну моделі» лише перестановкою карток без пояснення аналогії. Хиби: «навчання — це просто запам'ятовування всіх картинок», «комп'ютер розуміє як дитина», «людина не бере участі», «будь-яке правило — машинне навчання», «навчена модель завжди правильна». Корекція — короткі контрприклади, розмежування обох механізмів і меж достовірності.
                    
                    ## Докази навчання та Assessment Architect intent
                    Для ПЕРШОГО Skill окремий evidence core: класифікувати опис системи як явно задані правила або налаштована на прикладах модель, обґрунтувавши механізм; назвати можливість поєднання. Для ДРУГОГО: пояснити роль прикладів, причину потреби перевіряти новий випадок і чому запам'ятовування навчальної картки не є доказом узагальнення. Extension: перенести на інше буденне призначення ШІ та передбачити можливу помилку через обмежені приклади. AssessmentMethodKey (реальний Engine перелік): classification та justification для першого Skill, interpretation, prediction, knowledgeTransfer для другого; уникати штучного поєднання двох компетентностей в одному невідокремлюваному результаті. Власний майбутній повний Question Bank має належати цьому instructional Lesson, незалежно від Quiz. Quiz Sections: 0 (quizRequired: false); причина — діагностика концептуальних хиб на віковому рівні потребує пояснення й підтримки, а не обов'язкового scored тесту. Незалежний банк потрібний і планується пізніше, але Question/Flashcard UUID й банк PR зараз не створюються.
                    
                    ## Інклюзивність, приватність та джерела
                    Усі приклади без реальних особистих відомостей, фото дітей, неперевіреного публічного ШІ чи акаунта учня. Збереження можливості пояснити голосом, тактильними предметами, жестом; невимушений темп і дорослий-модератор. Повний офлайн-еквівалент, відсутність обов'язкового дисплея; для візуального порівняння потрібні словесні пояснення, не лише кольори. Авторитет — точні методологічні визначення двох Skills із поточного TypeScript каталогу та Course Methodology. Конкретний досвід і Section планує Screenwriter, майбутні Question діагностику та відповіді — Assessment Architect; цей Course Stage 3 не є Lesson Production.
                  quizRequired: false
