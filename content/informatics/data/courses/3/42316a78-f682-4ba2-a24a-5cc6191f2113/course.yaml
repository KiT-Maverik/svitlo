          - 799b85b6-30c0-489b-8e8a-b821a3332a75
          - 573cc148-e6f3-4f3f-871c-a5b1f733f2b0
        explanation: "Учень знаходить простий повторюваний шаблон, перевіряє умову «якщо — то» і на доступних прикладах відрізняє явно задане правило від системи, яку навчають на даних. Розуміє, що ШІ може розпізнавати, передбачати або створювати."
      prerequisites:
        skills:
