                  depth: "Пояснення значення наочних даних з контекстом; усні й предметні приклади, без таблиць великих наборів даних."
                  sequenceReason: "Після знайомства з пристроями дитина розуміє, що саме вони отримують і передають; перед алгоритмами варто ввести зрозумілі вхідні дані та смисл повідомлення."
                  methodology: |-
                    # Methodology — Як дані стають повідомленням?
                    
                    ## Аудиторія та передумови
                    Самостійний вступний урок для шестирічних дітей, читання й письма не потребує. Можна провести без реального цифрового пристрою. Досить досвіду сприймання чисел, піктограм чи усних повідомлень; якщо числове позначення незнайоме, дорослий його озвучує. Мета — відрізняти записане значення (дані) від повідомлення з поясненим змістом. Не навчати тут баз даних, кодування або математичної статистики.
                    
                    ## Skill та вимірювані результати
                    Skill distinguishMessagesFromData, 46aeedfa-5976-449d-89c3-97901d99b779; source: content/informatics/data/skills/informationAndData/informationSearchAndVerification/distinguishMessagesFromData.ts. Дитина може: (1) показати, якої інформації бракує в записі «18», щоб зрозуміти, що він означає; (2) обрати й пояснити, яке повідомлення має смисл за доданої одиниці й об'єкта; (3) на новому прикладі відрізнити значення від його пояснення для адресата. Глибина — розуміння на конкретному прикладі та перенос за опорними запитаннями, а не наукове визначення «даних».
                    
                    ## Точний предметний зміст
                    Дані можуть бути числами, записаними словами, символами, вимірами чи позначками. Значення «18» без додаткового контексту не каже, чи це температура, кількість олівців або час. Повідомлення «У кімнаті 18 градусів» має об'єкт і одиницю та надає адресатові смисл. Однакові дані можуть бути використані в різних повідомленнях. Не протиставляти їх як «дані — беззмістовні, повідомлення — завжди правдиве»: повідомлення може бути хибним або незрозумілим; смисл не означає істинність. Не стверджувати, що будь-яке число обов'язково є цифровим даним у комп'ютері.
                    
                    ## Логіка пізнання й поширені хиби
                    Почати з одного неповного знака/числа, порівняти кілька можливих тлумачень; додати контекст, повторити з іконкою та новою ситуацією. Дитина має усвідомити, що ті самі дані без предмета, одиниці чи автора не задають однозначного повідомлення. Хибні уявлення: «будь-яке число — готова інформація», «усі зрозуміють символ однаково», «якщо повідомлення зрозуміле, воно правдиве». Пояснювати на зрозумілих прикладах, не карати за різні правдоподібні інтерпретації неповних даних.
                    
                    ## Оцінювання та банк
                    Окремий повноцінний Question Bank має належати саме цьому майбутньому Lesson; Question/Flashcard Production у Course Stage 3 не розпочинається. Core: для часткового запису дитина називає відсутню деталь; пояснює смисл повного повідомлення; відрізняє факт даних від тлумачення. Extension: те саме число в іншому контексті, з урахуванням того, що повідомлення може бути помилковим. AssessmentMethodKey: interpretation, missingInformationInference, justification; за необхідності representationTranslation, якщо змінюється форма представлення без зміни суті. Не вимагати швидкого читання. Quiz Sections: 0; у цьому віці достатньо цілеспрямованої формувальної діагностики смислу й перенесення в новому контексті; банк зберігає повну незалежну перевірку для майбутньої практики. Одне вгадане зображення не підтверджує розуміння.
                    
                    ## Доступність, культура й джерела
                    Озвучені приклади, великі картки/предмети, зрозумілі одиниці, альтернативні усні/тактильні способи відповіді та відсутність залежності від інтернету. Не вимагати жодних реальних персональних даних. Порівняння «18 градусів» має уточнювати одиницю температури у контексті, без фізіологічних узагальнень. Джерело термінів — канонічний Skill та Course Methodology; типи питань і поріг доказовості визначить Assessment Architect.
