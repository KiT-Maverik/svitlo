                  depth: "Підтримуване пояснення й практичне застосування одного перевірного правила в буденних ситуаціях; без складених логічних виразів і програмного синтаксису."
                  sequenceReason: "Після перевірки закономірності дитина знайомиться з правилом, де результат залежить від точно відомої умови; це база для порівняння з явно запрограмованими системами."
                  methodology: |-
                    # Методологія — Перевір умову «якщо — то»
                    
                    ## Аудиторія, передумови, мета
                    Самостійний урок інформатики для шести років із неоднаковим досвідом. Не потребує читання, усних навичок рахування великих чисел чи використання програмного забезпечення. Передумова — зрозуміти побутове речення з одним спостережуваним фактом, наприклад «двері відчинені». За необхідності дорослий показує предметну дію та озвучує умову. Мета — встановлювати, чи істинна конкретна проста умова за відомих фактів; це не урок із комбінацій AND/OR/NOT, вкладених розгалужень або мов програмування.
                    
                    ## Цільовий Skill і спостережувані результати
                    evaluateASimpleCondition — 52ae07ef-6103-48d2-a568-8a2ad38f480c, джерело: content/informatics/data/skills/computationalThinking/logicAndPatterns/evaluateASimpleCondition.ts. Дитина може: (1) зіставити одну чітку умову з наявним фактом, (2) визначити «виконується» або «не виконується» з поясненням, (3) вказати «не знаю/не вистачає інформації», якщо факт приховано, (4) зробити відповідний висновок для наступної безпечної дії. Глибина: підтримане осмислення трьох різних станів епістемічної визначеності, а не символічна логіка. Структуру «якщо — то» застосовувати лише як зрозуміле формулювання, не плутати його з реальною умовною командою програмування.
                    
                    ## Предметна точність, приклади й межові випадки
                    Проста умова — одна перевірювана властивість: «вікно відчинене», «картка червона», «лампа увімкнена». Якщо перед нами відчинені двері, висловлення «двері відчинені» істинне; якщо явно зачинені — хибне; якщо дверей не видно — даних недостатньо, а не автоматично «хибне». Приклад умовної інструкції: «Якщо на картці коло, поклади її на килимок», але рішення про виконання потребує побачити форму. Для шестирічних різниця між умовою і дією важливіша за нотацію. Не використовувати приклади, що вимагають виконання небезпечних дій чи підозр про реальних людей. Якщо правило не уточнене, приймати відповідь «невідомо» й просити сказати, який факт допоможе.
                    
                    ## Прогресія та діагностика хиб
                    Почати зі спостережуваної істинної умови, порівняти з хибною, тоді прибрати потрібне свідчення та запитати, чи є підстави для відповіді. На наступному прикладі змінити предмет, зберігши мисленнєву операцію перевірки одного факту. Можлива хиба «не бачу — отже хибно»; корекція — розрізнення невідомого стану й явно протилежного стану. Інша хиба: «якщо умова хибна, завжди треба виконати протилежну дію»; без вказаного else цього не випливає. Не подавати шкільне правило як приклад моральної оцінки людини.
                    
                    ## План assessment та майбутня власність банку
                    Власний повний Lesson Question Bank буде окремо створено лише після Lesson Production authorization. Core: рішення про один відомий стан, окремо — хибний стан, окремо — випадок відсутнього факту; контрприклад до автоматичного припущення «ні». Extension: новий життєвий контекст без складеної умови. Канонічні AssessmentMethodKey: interpretation, application, missingInformationInference, justification; за належного конструкта knowledgeTransfer. Не оцінювати швидкість/читання або влучання в три кнопки замість пояснення. Quiz Sections: 0 (quizRequired: false) — педагогічно доречніші коротка спільна перевірка й формувальне зворотне пояснення; це не скасовує незалежного повного банку. Випадкове вгадування не є підтвердженням тривалого оволодіння.
                    
                    ## Доступність, безпека й джерела
                    Використовувати великі фізичні картки/тактильні стани, доступний усний/жестовий вибір, не покладатися лише на колір або слух. Без таймера, без авторизації онлайн, без персональних дитячих даних. Канонічне обґрунтування — згаданий Skill та Course methodology; Screenwriter створює навчальні Section пізніше, Assessment Architect окремо перевірить Question validity. Мовні приклади повинні допускати переклад без зміни логічного змісту.
                  quizRequired: false
