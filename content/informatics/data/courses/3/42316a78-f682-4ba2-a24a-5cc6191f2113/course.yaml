    trustAndDigitalSafety:
      type: module
      slug: trustAndDigitalSafety
      title: "Надійність ШІ та цифрова безпека"
      methodology: "Навчальна мета й глибина: Учень розпізнає, що відповідь ШІ може бути ненадійною, і з допомогою дорослого пропонує спосіб незалежної перевірки. Визначає приклади персональних даних та обирає безпечніші дії під час цифрової взаємодії. Послідовність і оцінювання: Висновок із попереднього навчання на прикладах: помилки можливі, тому рішення перевіряє людина. Навчання безпеки подається перед завершальним міжтемним застосуванням. Оцінювати практичний вибір у новій ситуації, а не швидкість або загальну кількість натискань. Орієнтир навантаження: 4 заняття; остаточні Lesson slots визначаються лише на Stage 3."
      outcomes:
        skills:
          - f93aa878-a1ad-4820-82a3-30f4b182f147
          - 4f039591-11ed-4341-90ab-7389f7ce8efe
          - cadaea6e-bd81-441e-82f3-73389d1373bf
          - 42bbcb35-f4d0-496b-b90c-495b08683e32
        explanation: "Учень розпізнає, що відповідь ШІ може бути ненадійною, і з допомогою дорослого пропонує спосіб незалежної перевірки. Визначає приклади персональних даних та обирає безпечніші дії під час цифрової взаємодії."
      prerequisites:
        skills:
          - 014446e9-1ee1-4797-85ce-869b67208166
          - 799b85b6-30c0-489b-8e8a-b821a3332a75
        explanation: "Після ознайомлення з явними правилами та навчанням на прикладах; учень не мусить знати технічної будови ШІ."
      content:
        items:
          aiErrorsAndVerification:
            type: chapter
            slug: aiErrorsAndVerification
            title: "Помилки ШІ та перевірка відповідей"
            methodology: "Очікуваний результат: На помітному прикладі вказує можливу помилку або суперечність; разом із дорослим порівнює відповідь із незалежним надійним джерелом і розуміє, що впевнений тон не гарантує істинності. Логіка й межі: Орієнтовно два заняття: від обмежених навчальних прикладів до результатів, які потребують перевірки. Використовувати заздалегідь підготовлені безпечні відповіді й факти, не вимагати самостійного вебпошуку, оцінки складних доказів або використання відкритого чатбота дитиною."
            outcomes:
              skills:
                - f93aa878-a1ad-4820-82a3-30f4b182f147
                - 4f039591-11ed-4341-90ab-7389f7ce8efe
              explanation: "На помітному прикладі вказує можливу помилку або суперечність; разом із дорослим порівнює відповідь із незалежним надійним джерелом і розуміє, що впевнений тон не гарантує істинності."
            prerequisites:
              skills:
                - 799b85b6-30c0-489b-8e8a-b821a3332a75
              explanation: "Потрібна ознайомча ідея навчання на прикладах з попереднього розділу."
          privacyAndResponsibleChoices:
            type: chapter
            slug: privacyAndResponsibleChoices
            title: "Приватність, відповідальний вибір і підсумкове застосування"
            methodology: "Очікуваний результат: Розпізнає власну адресу, контакти, фото та інші особисті дані; вирішує не передавати їх у запиті до цифрового помічника без дорослого. На новій задачі пояснює короткий алгоритм і один спосіб перевірки результату. Логіка й межі: Останні орієнтовно два заняття забезпечують інтеграцію засвоєного без вигадування окремого Skill «сортувати картки» або нового виду оцінювання. Дорослий керує цифровими засобами, використовуються вигадані особи та дані. Для підсумку допустимий усний, предметний або малюнковий спосіб пояснення."
            outcomes:
              skills:
                - cadaea6e-bd81-441e-82f3-73389d1373bf
                - 42bbcb35-f4d0-496b-b90c-495b08683e32
                - 1ab60caa-36e7-4cc8-9e2e-64f13352717c
              explanation: "Розпізнає власну адресу, контакти, фото та інші особисті дані; вирішує не передавати їх у запиті до цифрового помічника без дорослого. На новій задачі пояснює короткий алгоритм і один спосіб перевірки результату."
            prerequisites:
              skills:
                - f93aa878-a1ad-4820-82a3-30f4b182f147
              explanation: "Спирається на попередню розмову про помилки й перевірку; персональні дані вивчаються у цьому самому розділі."
        order:
          - aiErrorsAndVerification
          - privacyAndResponsibleChoices
