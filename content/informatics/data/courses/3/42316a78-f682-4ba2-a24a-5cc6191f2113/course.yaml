            title: "Закономірності та прості умови"
            methodology: "Очікуваний результат: Знаходить закономірність на кількох елементах і перевіряє власне припущення; вирішує, чи спрацьовує одна проста умова, та прогнозує дію за правилом. Логіка й межі: Орієнтовно два заняття: від повторів і помітних відмінностей до простого причинного правила. Пояснити, що продовження двох елементів не доводить будь-який майбутній результат. Відокремити хибну умову від випадку, де даних бракує. Не вимагати складної логіки."
