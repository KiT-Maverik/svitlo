                  methodology: |-
                    # Методологія — Як перевірити відповідь ШІ?
                    
                    ## Аудиторія, вступ і відокремлення від Course
                    Самостійний урок для шестирічних дітей. Дорослий надає коротке заздалегідь створене твердження, безпечне надійне незалежне джерело та озвучені інструкції. Для початку достатньо вміти порівняти два факти; курс чи сюжет не є обов'язковою передумовою, вступне пояснення про можливість помилок наведене прямо в уроці. Мета — не самостійний вебпошук, не повне дослідження надійності джерел і не розв'язання спірних питань, а зрозумілий алгоритм звірки одного фактичного твердження. Не вимагати реальних акаунтів чи публічного використання ШІ.
                    
                    ## Канонічний Skill та результати
                    verifyFactsInAnAIResponse — UUID 4f039591-11ed-4341-90ab-7389f7ce8efe; content/informatics/data/skills/artificialIntelligence/reliabilityAndResponsibleAIUse/verifyFactsInAnAIResponse.ts. Результат із підтримкою дорослого: (1) виділяє конкретну частину відповіді, яка стверджує факт; (2) обирає релевантне незалежне джерело, а не повтор ШІ; (3) звіряє факт зі свідченням, звертаючи увагу на контекст і, коли це важливо, дату; (4) каже «підтвердили», «спростували» або «не встановили» з коротким поясненням. Глибина — керована перевірка й перенесення на іншу безпечну ситуацію; це не повна компетентність дорослого фактчекера.
                    
                    ## Зміст, приклади та межові випадки
                    ШІ може сформулювати фактичне твердження, яке треба перевірити за джерелом незалежного походження. Приклад: підготовлена відповідь «у цієї настільної гри є чотири фішки», а перед дитиною офіційна коробка з переліком комплекту і фішки; можна звірити саме кількість і конкретну версію гри. Альтернативний контекст — назва тварини та науково-дитяча книжка, зміст якої попередньо перевірив педагог. Якщо видання гри різні, без уточнення версії не можна робити впевнений висновок. Дата актуальна для змінних фактів (години роботи бібліотеки, погода) і не повинна ігноруватися. Відповідь іншого чатбота або скопійований переказ початкового тексту не є автоматично незалежним підтвердженням. Зовсім не кожне твердження перевіряється однаково легко; чесно повідомляти, коли даних бракує.
                    
                    ## Прогресія та концептуальні хиби
                    Спочатку дорослий озвучує твердження, показує джерело і допомагає знайти відповідну деталь, потім дитина виконує ті самі смислові кроки на новому, короткому прикладі. Відокремити «джерело повторює текст» від «джерело має власну перевірювану основу». Хиби: «дві однакові відповіді ШІ — доказ», «все у книжці підходить до питання незалежно від видання», «відсутність свідчення доводить неправду», «перевірити — означає натиснути пошук». Педагог питає, що саме збігається/не збігається, і допускає результат «ще не знаємо».
                    
                    ## Assessment Architect intent та банк
                    Планується окремий незалежний повний Question Bank, що належить цьому майбутньому Lesson, не банку іншого уроку. Core: обрати перевірне твердження; відрізнити незалежне джерело від переказу; аргументувати підтвердження/спростування/недостатність даних у контексті. Extension: перевірка факту, залежного від дати або версії, на іншому навчальному предметі. Канонічні AssessmentMethodKey: verification, interpretation, justification, knowledgeTransfer; за браком важливої деталі — missingInformationInference. Конструкт не оцінюється швидкістю читання чи користування браузером. Quiz Sections: 0, quizRequired: false: учень має здійснити осмислену звірку з допомогою дорослого, а не вибрати один варіант на таймері; банк усе одно повинен містити різноманітні валідні запитання для пізнішої практики. Питання, відповіді, оцінювання та їхні UUID належать незалежному Questions workflow.
                    
                    ## Доступність, безпека і відповідальність
                    Джерела перевіряються педагогом перед заняттям, доступні офлайн у друкованому, предметному або озвученому еквіваленті. Приклади без медичних/правових/небезпечних порад або приватних даних. Допускати відповідь голосом, жестом, порівнянням предметів; не покладатися тільки на колір, екран, дрібний шрифт чи навичку читання. Фактичні вимоги джерела — канонічний Skill, а Stage 3 не створює справжнього ШІ-запиту чи оцінних банків. Після цього уроку можна безпечно обговорювати приватність як ще один критерій відповідального використання.
