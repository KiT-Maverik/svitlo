                  methodology: |-
                    # Методологія — Як безпечно попросити допомоги в ШІ?
                    
                    ## Призначення, аудиторія і самостійність Lesson
                    Це окремий instruction-focused Lesson для дітей близько шести років; він корисний і без сюжету Course, але передумови потрібно за потреби коротко повторити прямо в уроці: що таке приватні відомості та впорядковані кроки. Не потрібні читання, письмо, програмування, дитячий акаунт або справжній доступ до ШІ. Дорослий наводить ВИГАДАНІ запити й організовує їх обговорення без реального надсилання. Мета — зберегти смисл корисного запитання, прибравши зайву інформацію про людей, і скласти короткий безпечний план дій із перевіркою результату. Не перетворювати Lesson на техніку оптимізації промптів чи запит реальних особистих фактів.
                    
                    ## Дві окремі перевірювані компетентності
                    Skill protectPersonalDataInPrompts — 42bbcb35-f4d0-496b-b90c-495b08683e32; content/informatics/data/skills/artificialIntelligence/reliabilityAndResponsibleAIUse/protectPersonalDataInPrompts.ts. Учень виявляє зайві відомості, що можуть ідентифікувати людину, прибирає/узагальнює їх у підготовленому запиті без втрати основної мети й пояснює вибір. Показати: доступність онлайн-сервісу не гарантує конфіденційності надісланого.
                    
                    Окремий повторний Skill constructASequentialAlgorithm — 1ab60caa-36e7-4cc8-9e2e-64f13352717c; content/informatics/data/skills/algorithms/construction/constructASequentialAlgorithm.ts. Дитина формулює скінченний порядок із п'яти простих кроків: обрати корисне запитання → перевірити наявність приватних деталей → замінити їх загальним формулюванням → передати підготовлений запит дорослому й отримати від нього заздалегідь підготовлену умовну відповідь ШІ → разом із дорослим перевірити фактичне твердження в цій відповіді за незалежним надійним джерелом. Це офлайн-симуляція, а не надсилання запиту дитиною до справжнього сервісу; порядок дій має зрозумілу мету та результат без небезпечних дій. Послідовність — окремий observable outcome; вдалий безпечний запит сам по собі не доводить уміння складати алгоритм. Ні цикл, ні складна умова, ні код не є цільовими Skills.
                    
                    ## Суттєві факти, приклади і контрприклади
                    Небезпечний вигаданий запит: «Порадь цікаву гру для Софії, яка живе у будинку 10 на вулиці Сонячній, і ось її номер телефону». Умова про гру не потребує адреси та контакту, тож корисний запит: «Порадь гру для дитини шести років, яка любить загадки». Це приклад узагальнення, а не дозвіл самостійно надіслати його будь-якому сервісу: дорослий відповідає за налаштування й допустимість використання. Інший приклад: щоб дізнатися спосіб намалювати кота, не треба завантажувати фото обличчя дитини або її геолокацію. Контрприклад до надмірного «видалити все»: якщо прибрати також мету «загадки для шестирічних», відповідь може стати не по темі. Вимога «говори впевнено» не робить зміст відповіді правдивим; перевіряти факт потрібно незалежно. Навіть загальний запит може потребувати контролю дорослого.
                    
                    ## Прогресія, спільна практика, діагностика хиб
                    Спочатку дорослий показує вигаданий запит і разом із дитиною відокремлює мету від зайвих приватних деталей; потім дитина пропонує виправлення на новому прикладі; нарешті пояснює 3–5 дій безпечного запитування та перевірки у новій побутовій ситуації. Високі ризики й реальні дані не демонструвати. Хиби: «чим більше особистих відомостей, тим краща відповідь», «загальнодоступний чат зберігає секрети», «треба видалити будь-яку інформацію включно з метою», «дорослий не потрібен, якщо ШІ ввічливий», «після відповіді нічого перевіряти». Відповідати обговоренням окремих критеріїв, не соромити дитину і не стверджувати, що вона навчилася безпечно користуватися інтернетом після однієї вправи.
                    
                    ## Assessment Architect intent і залежності
                    Це звичайний навчальний Lesson, НЕ окремий assessment-only Lesson, тому має володіти власним майбутнім незалежним Question Bank. Core для protectPersonalDataInPrompts: визначити непотрібні ідентифікатори, безпечно перефразувати запит, пояснити, як збережено мету. Core для constructASequentialAlgorithm: скласти правильну скінченну послідовність із чітких дій і обґрунтувати важливий порядок. Не намагатися виміряти обидва Skills однією неділеною відповіддю; evidence окремий, попри спільний приклад. Extension: перенесення в інший небрендовий контекст; ситуація, де ознака є корисною для задачі, але можна узагальнити її без особистої ідентифікації. Канонічні AssessmentMethodKey для захисту: application, justification, knowledgeTransfer; для алгоритму: knowledgeConstruction, prediction, verification. Локальні Quiz Sections: 0 (quizRequired: false); вибір обґрунтований віком, ризиком disclosure та потребою безпечного формувального обговорення. Повний Question Bank з різноманітними діагностичними задачами запланований, але Question IDs і source bank створюються тільки в окремому авторизованому процесі. Assessment-only slot не вводити: інтеграція застосування тут педагогічно достатня, а створення scored контрольної заради формального чекпоінта не обґрунтоване.
                    
                    ## Доступність, приватність, офлайн та джерела
                    Використовувати тільки вигадані профілі й нескладні фізичні картки, усне/жестове/тактильне пояснення, доступну альтернативу без екрана та інтернету, без QR, дитячого акаунта, завантаження фото, реальних номерів або геолокацій. Запит до ШІ тут уявний; безпека у реальному сервісі залишається справою дорослого. Ніякого примусу дитини розкривати власні дані. Критерії походять із двох канонічних Skills і Course Methodology; Screenwriter обере інструменти та Sections після окремої авторизації, Assessment Architect — валідність Question Bank, перекладачі — справжній локалізований текст.
