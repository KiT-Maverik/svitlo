    trustAndDigitalSafety:
      type: module
      slug: trustAndDigitalSafety
      title: "Надійність ШІ та цифрова безпека"
      methodology: "Навчальна мета й глибина: Учень розпізнає, що відповідь ШІ може бути ненадійною, і з допомогою дорослого пропонує спосіб незалежної перевірки. Визначає приклади персональних даних та обирає безпечніші дії під час цифрової взаємодії. Послідовність і оцінювання: Висновок із попереднього навчання на прикладах: помилки можливі, тому рішення перевіряє людина. Навчання безпеки подається перед завершальним міжтемним застосуванням. Оцінювати практичний вибір у новій ситуації, а не швидкість або загальну кількість натискань. Орієнтир навантаження: 4 заняття; остаточні Lesson slots визначаються лише на Stage 3."
      outcomes:
        skills:
          - f93aa878-a1ad-4820-82a3-30f4b182f147
          - 4f039591-11ed-4341-90ab-7389f7ce8efe
          - cadaea6e-bd81-441e-82f3-73389d1373bf
          - 42bbcb35-f4d0-496b-b90c-495b08683e32
        explanation: "Учень розпізнає, що відповідь ШІ може бути ненадійною, і з допомогою дорослого пропонує спосіб незалежної перевірки. Визначає приклади персональних даних та обирає безпечніші дії під час цифрової взаємодії."
