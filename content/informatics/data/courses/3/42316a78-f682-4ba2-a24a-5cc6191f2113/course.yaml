content:
  items:
    digitalWorldAndInstructions:
      type: module
      slug: digitalWorldAndInstructions
      title: "Цифровий світ і послідовність дій"
      methodology: "Навчальна мета й глибина: Учень розрізняє приклади цифрових пристроїв та інформаційних повідомлень, а також відтворює коротку послідовність інструкцій і помічає зламаний крок. Перший крок — конкретні предмети й дії, а не формальні визначення. Послідовність і оцінювання: Спочатку дитина встановлює, що цифрові засоби допомагають передавати та опрацьовувати інформацію, а потім використовує вже знайомі життєві дії для побудови алгоритму. Лише безекранні або короткі керовані демонстрації. Після модуля доречно перевірити перенесення послідовності у нову побутову задачу, не вимагаючи Quiz. Орієнтир навантаження: 4 заняття; остаточні Lesson slots визначаються лише на Stage 3."
      outcomes:
        skills:
          - 0000b5e9-fa19-45d0-8b8d-1367d82dc123
          - 46aeedfa-5976-449d-89c3-97901d99b779
          - 1ab60caa-36e7-4cc8-9e2e-64f13352717c
        explanation: "Учень розрізняє приклади цифрових пристроїв та інформаційних повідомлень, а також відтворює коротку послідовність інструкцій і помічає зламаний крок. Перший крок — конкретні предмети й дії, а не формальні визначення."
      prerequisites:
        skills: []
        explanation: "Жодної попередньої інформатичної підготовки. Дорослий допомагає з інструкціями, як визначено в методології Course."
      content:
        items:
          devicesAndInformation:
            type: chapter
            slug: devicesAndInformation
            title: "Цифрові пристрої та інформація"
            methodology: "Очікуваний результат: Упізнає цифровий пристрій серед знайомих предметів за призначенням, а не лише за екраном; на конкретному прикладі розрізняє записані дані та осмислене повідомлення. Придатне свідчення: пояснює свій вибір і переносить його на інший предмет або повідомлення. Логіка й межі: Перші орієнтовно два заняття з дванадцяти: від спостережуваного пристрою до поняття даних та інформації. Ізольоване сортування карток не доводить розуміння; потрібні пояснення, приклади й контрприклади. Не вводити електронні схеми, байти або мережеві протоколи."
            outcomes:
              skills:
                - 0000b5e9-fa19-45d0-8b8d-1367d82dc123
                - 46aeedfa-5976-449d-89c3-97901d99b779
              explanation: "Упізнає цифровий пристрій серед знайомих предметів за призначенням, а не лише за екраном; на конкретному прикладі розрізняє записані дані та осмислене повідомлення. Придатне свідчення: пояснює свій вибір і переносить його на інший предмет або повідомлення."
            prerequisites:
              skills: []
              explanation: "Вступ до Course: читання і досвід із цифровими пристроями не обов'язкові."
          sequencesAndCorrections:
            type: chapter
            slug: sequencesAndCorrections
            title: "Послідовності команд і пошук помилок"
            methodology: "Очікуваний результат: Складає послідовність із 3–5 зрозумілих дій для досяжної мети, передбачає результат і за допомогою випробування виправляє помилковий крок; пояснює, чому порядок іноді змінює результат. Логіка й межі: Наступні орієнтовно два заняття спираються на зрозумілі дитині об'єкти та повідомлення. Команди спершу виконуються людиною або іграшковим «роботом». Складні цикли, рекурсію й синтаксис програмних мов не вводити. Порівнювати результат у двох побутових контекстах."
            outcomes:
              skills:
                - 1ab60caa-36e7-4cc8-9e2e-64f13352717c
              explanation: "Складає послідовність із 3–5 зрозумілих дій для досяжної мети, передбачає результат і за допомогою випробування виправляє помилковий крок; пояснює, чому порядок іноді змінює результат."
            prerequisites:
              skills: []
              explanation: "Попередній розділ дає знайомі об'єкти; формального Skill-пререквізиту немає."
        order:
          - devicesAndInformation
          - sequencesAndCorrections
    rulesAndAI:
      type: module
      slug: rulesAndAI
      title: "Закономірності, правила й перше знайомство із ШІ"
      methodology: "Навчальна мета й глибина: Учень знаходить простий повторюваний шаблон, перевіряє умову «якщо — то» і на доступних прикладах відрізняє явно задане правило від системи, яку навчають на даних. Розуміє, що ШІ може розпізнавати, передбачати або створювати. Послідовність і оцінювання: Перехід від алгоритмічних дій до логічних правил має передувати поясненню навчання на прикладах. Демонстрація з картками моделює відбір прикладів, але не підміняє справжнє тренування моделі. Після модуля слід порівняти нову ситуацію для правила та моделі без формальних параметрів чи статистики. Орієнтир навантаження: 4 заняття; остаточні Lesson slots визначаються лише на Stage 3."
      outcomes:
        skills:
          - 19dbf903-354a-41cb-90a1-07633df5f480
          - 52ae07ef-6103-48d2-a568-8a2ad38f480c
          - 014446e9-1ee1-4797-85ce-869b67208166
          - 799b85b6-30c0-489b-8e8a-b821a3332a75
          - 573cc148-e6f3-4f3f-871c-a5b1f733f2b0
        explanation: "Учень знаходить простий повторюваний шаблон, перевіряє умову «якщо — то» і на доступних прикладах відрізняє явно задане правило від системи, яку навчають на даних. Розуміє, що ШІ може розпізнавати, передбачати або створювати."
      prerequisites:
        skills:
          - 1ab60caa-36e7-4cc8-9e2e-64f13352717c
        explanation: "Спирається на знайомство з короткою послідовністю інструкцій у першому модулі. Це внутрішня навчальна залежність, не вимога володіти Skill до початку Course."
      content:
        items:
          patternsAndSimpleRules:
            type: chapter
            slug: patternsAndSimpleRules
            title: "Закономірності та прості умови"
            methodology: "Очікуваний результат: Знаходить закономірність на кількох елементах і перевіряє власне припущення; вирішує, чи спрацьовує одна проста умова, та прогнозує дію за правилом. Логіка й межі: Орієнтовно два заняття: від повторів і помітних відмінностей до простого причинного правила. Пояснити, що продовження двох елементів не доводить будь-який майбутній результат. Відокремити хибну умову від випадку, де даних бракує. Не вимагати складної логіки."
            outcomes:
              skills:
                - 19dbf903-354a-41cb-90a1-07633df5f480
                - 52ae07ef-6103-48d2-a568-8a2ad38f480c
              explanation: "Знаходить закономірність на кількох елементах і перевіряє власне припущення; вирішує, чи спрацьовує одна проста умова, та прогнозує дію за правилом."
            prerequisites:
              skills:
                - 1ab60caa-36e7-4cc8-9e2e-64f13352717c
              explanation: "Спершу потрібне кероване розуміння послідовності дій, відпрацьоване в попередньому модулі."
          aiTasksAndLearningExamples:
            type: chapter
            slug: aiTasksAndLearningExamples
            title: "Завдання ШІ та навчання на прикладах"
            methodology: "Очікуваний результат: Розрізняє на життєвих прикладах розпізнавання, передбачення й створення, пояснює різницю між встановленим людиною правилом та моделлю, навченою на прикладах; знає, що приклади можуть бути неповними. Логіка й межі: Орієнтовно два заняття після вивчення правил. Показувати спрощену імітацію розпізнавання на різних прикладах і чітко називати її аналогією, а не реальним машинним навчанням. Не приписувати системі людські почуття або безпомилковість."
            outcomes:
              skills:
                - 573cc148-e6f3-4f3f-871c-a5b1f733f2b0
