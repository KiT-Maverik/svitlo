          aiTasksAndLearningExamples:
            type: chapter
            slug: aiTasksAndLearningExamples
            title: "Завдання ШІ та навчання на прикладах"
            methodology: "Очікуваний результат: Розрізняє на життєвих прикладах розпізнавання, передбачення й створення, пояснює різницю між встановленим людиною правилом та моделлю, навченою на прикладах; знає, що приклади можуть бути неповними. Логіка й межі: Орієнтовно два заняття після вивчення правил. Показувати спрощену імітацію розпізнавання на різних прикладах і чітко називати її аналогією, а не реальним машинним навчанням. Не приписувати системі людські почуття або безпомилковість."
