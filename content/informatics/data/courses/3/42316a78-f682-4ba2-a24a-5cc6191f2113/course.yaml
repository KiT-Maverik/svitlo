      content:
        items:
          aiErrorsAndVerification:
            type: chapter
            slug: aiErrorsAndVerification
            title: "Помилки ШІ та перевірка відповідей"
            methodology: "Очікуваний результат: На помітному прикладі вказує можливу помилку або суперечність; разом із дорослим порівнює відповідь із незалежним надійним джерелом і розуміє, що впевнений тон не гарантує істинності. Логіка й межі: Орієнтовно два заняття: від обмежених навчальних прикладів до результатів, які потребують перевірки. Використовувати заздалегідь підготовлені безпечні відповіді й факти, не вимагати самостійного вебпошуку, оцінки складних доказів або використання відкритого чатбота дитиною."
            outcomes:
              skills:
                - f93aa878-a1ad-4820-82a3-30f4b182f147
                - 4f039591-11ed-4341-90ab-7389f7ce8efe
              explanation: "На помітному прикладі вказує можливу помилку або суперечність; разом із дорослим порівнює відповідь із незалежним надійним джерелом і розуміє, що впевнений тон не гарантує істинності."
            prerequisites:
