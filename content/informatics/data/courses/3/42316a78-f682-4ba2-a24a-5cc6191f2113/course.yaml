            title: "Послідовності команд і пошук помилок"
            methodology: "Очікуваний результат: Складає послідовність із 3–5 зрозумілих дій для досяжної мети, передбачає результат і за допомогою випробування виправляє помилковий крок; пояснює, чому порядок іноді змінює результат. Логіка й межі: Наступні орієнтовно два заняття спираються на зрозумілі дитині об'єкти та повідомлення. Команди спершу виконуються людиною або іграшковим «роботом». Складні цикли, рекурсію й синтаксис програмних мов не вводити. Порівнювати результат у двох побутових контекстах."
