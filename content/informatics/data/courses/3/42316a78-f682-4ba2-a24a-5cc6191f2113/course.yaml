                  methodology: |-
                    # Методологія — Які відомості про мене особисті?
                    
                    ## Аудиторія, мета та стартові знання
                    Самостійний навчальний Lesson для шестирічних дітей, які можуть не читати і не мати смартфона. Потрібен лише побутовий досвід спілкування з людьми; дорослий пояснює приклади на вигаданих персонажах. Дитина не повинна називати власне справжнє ім'я, адресу, місцеперебування, номер телефону чи надсилати особисті фото. Мета — зрозуміти, що певні відомості дають змогу впізнати людину, особливо разом. Це не юридичний курс персональних даних і не вимога, щоб кожне ім'я саме по собі однозначно визначало одну людину.
                    
                    ## Skill і результати
                    identifyPersonalData — UUID cadaea6e-bd81-441e-82f3-73389d1373bf; source: content/informatics/data/skills/digitalSafetyAndResponsibility/privacy/identifyPersonalData.ts. Дитина (1) упізнає очевидні особисті дані — адресу проживання, контакти, фото з упізнаваним обличчям, поточне точне місцеперебування; (2) пояснює, чому безневинне на перший погляд ім'я разом з адресою може ідентифікувати особу; (3) на новому прикладі розрізняє загальну інформацію та відомості про конкретну людину; (4) обирає звернутися по допомогу до надійного дорослого перед розголошенням. Глибина — практичне розпізнавання і причини обережності, не юридичне трактування всіх категорій.
                    
                    ## Фактичні поняття та приклади
                    Персональними можуть бути відомості, які прямо або в поєднанні з іншими даними стосуються впізнаваної людини. Приклади: «Марко мешкає за адресою [вигадана адреса]»; «на фото добре видно людину»; «ось номер телефону цієї людини»; повідомлення з точним місцем і часом. Звичайне «сьогодні дощить» без контексту не виявляє особу. Ім'я «Марко» не гарантує однозначного встановлення особи, але разом із класом/домом та фото може мати інший ризик. Навіть якщо окрема деталь здається неважливою, поєднання може виявити людину. Не казати, що абсолютно будь-яке зображення чи число персональне; аналізувати контекст, ідентифікацію і адресата.
                    
                    ## Прогресія, хиби і перенос
                    Спершу відрізнити дуже явні приклади від загальної нейтральної інформації; потім показати пари деталей, що разом ідентифікують вигадану особу; завершити новою побутовою ситуацією «чи варто це повідомляти незнайомому застосунку?». Хиби: «особисте — тільки пароль», «якщо дані сказав друг, можна всім передати», «фото без підпису завжди безпечне», «коли інформація була десь написана, вона перестає бути особистою». Корекція — спокійні контрприклади та рішення «питаю дорослого». Не лякати цифровим світом і не просити дітей розкривати власні факти в демонстрації.
                    
                    ## Оцінювання та майбутній банк
                    Цей instructional Lesson буде власником повного незалежного Question Bank після окремого Lesson/Questions Production; на Stage 3 немає ні Question UUID, ні автора готового банку. Core: розрізняти особисті й неособисті приклади; виявляти ризик від комбінації відомостей; пояснювати безпечне рішення. Extension: нова інформаційна ситуація з фотографією чи місцеперебуванням і неповними контекстними даними. AssessmentMethodKey: classification, relationshipMapping, justification, knowledgeTransfer. Відповідь тільки через сортування не достатня: потрібно коротко пояснити, хто може впізнати людину і чому. Quiz Sections: 0, quizRequired: false — безпечне розпізнавання й формувальний діалог кращі за вимогу вводити реальні дані в комп'ютер; банк потрібний для майбутньої діагностики. Не робити висновків про фактичну поведінку дитини в інтернеті з однієї відповіді.
                    
                    ## Доступність, приватність та джерела
                    Лише вигадані імена, адреси, номери й обличчя; ніколи не збирати реальні відомості. Офлайн, великі ілюстрації зі словесними поясненнями, можливість відповісти жестом, словами або предметом. Приклади локалізувати без перенесення реальних адрес між регіонами; не вводити дитину у роль винної сторони. Джерело поняття — затверджений Skill у repo та Course Methodology. Screenwriter підбирає безпечні спосіб подачі, Assessment Architect — правильність майбутніх тестових задач.
