                  title: "Що може робити штучний інтелект?"
                  objective: "Розрізнити на зрозумілих прикладах три цілі завдань ШІ — розпізнати, передбачити та створити новий вміст — без припущення, що ШІ завжди правий."
                  skills:
                    - 573cc148-e6f3-4f3f-871c-a5b1f733f2b0
                  depth: "Ознайомче розрізнення цілей завдань; кероване пояснення й перенесення на нові приклади, без технічної будови моделей, тренування або автономного чатбота."
                  sequenceReason: "Після явних умов представити сфери застосування ШІ як різні навчальні завдання; питання про механізми правил і навчання на прикладах розкриє наступний самостійний урок."
                  methodology: |-
                    # Методологія — Що може робити штучний інтелект?
                    
                    ## Аудиторія, вступні умови, призначення
                    Самостійний вступний Lesson для приблизно 6 років. Не потрібні навички читання, роботи з програмою, досвід із чатботами чи попереднє вивчення машинного навчання. Дорослий використовує безпечні абстрактні приклади/заздалегідь підготовлені демонстрації без облікового запису дитини. Мета — зрозуміти, яке завдання пропонують системі ШІ: класифікувати наявне, передбачити ще невідоме, або згенерувати новий вміст. Цей урок не доводить, що всі схожі програмні функції обов'язково «ШІ».
                    
                    ## Цільовий Skill та очікувані результати
                    classifyAITasks — 573cc148-e6f3-4f3f-871c-a5b1f733f2b0; джерело: content/informatics/data/skills/artificialIntelligence/aIFundamentals/classifyAITasks.ts. Дитина може: (1) упізнати задачу розпізнавання об'єкта на зображенні, (2) упізнати задачу прогнозу невідомого значення, (3) упізнати створення нової розповіді або картинки, (4) на новому описі пояснити, що саме потрібно отримати у результаті. Базова глибина — класифікація МЕТИ використання системи; не плутати цю класифікацію зі справжньою моделлю, не вимагати причинної теорії штучного інтелекту.
                    
                    ## Канонічні поняття й точні приклади
                    Розпізнавання: за фотографією визначити, чи є на ній кіт; вхід — зображення, мета — категорія. Передбачення: за наявними вимірюваннями приблизно оцінити, скільки відвідувачів буде завтра; мета — невідоме значення, а не гарантована істина. Генерація: створити нову історію або малюнок за умовою; мета — новий матеріал. Генеративні мовні системи внутрішньо прогнозують наступні частини тексту, тому механізм не тотожний цілі завдання. Деякі застосунки поєднують задачі: навчати відокремлювати конкретний запит користувача, а не навішувати єдину етикетку на всю програму. ШІ не є людиною, не «знає все» та може давати неправильні результати.
                    
                    ## Прогресія і ризик хибних уявлень
                    Спочатку порівняти мету на трьох різних безпечних ситуаціях, далі використати нові предмети й уточнити «що хочемо на виході?». Показати, що смартфон або калькулятор можуть працювати за звичайними правилами і не всі їхні дії належать до ШІ. Поширені хиби: «кожна цифрова програма є ШІ», «передбачення — точно знати майбутнє», «намальована ШІ картинка — справжнє фото», «створення — просто пошук уже готового». Корекція — конкретні вхідні й вихідні приклади та м'які уточнення. Пізніше окремо вивчатимуться правила/навчання моделей та перевірка помилок.
                    
                    ## Assessment intent і майбутній незалежний банк
                    Кожен substantive instructional Lesson має власний майбутній повний Question Bank, який належатиме цьому Lesson після авторизації Production; Quiz/Question UUID зараз не створювати. Core: для трьох сценаріїв назвати мету та обґрунтувати через очікуваний результат; контрприклад до «усе цифрове — ШІ». Extension: приклад застосунку з кількома функціями, де потрібно вибрати саме запитуване завдання, а не механізм. Канонічні AssessmentMethodKey: classification, interpretation, justification, knowledgeTransfer. Не вважати зміну картинки чи порядку варіантів новим доказом. Quiz Sections: 0 (quizRequired: false), адже це перше знайомство з темою й потрібна коротка формувальна перевірка, а не оцінка через екран; повний банк потрібний для різноманітної майбутньої практики. Не заявляти mastery після одного сортування.
                    
                    ## Доступність, приватність, джерела
                    Короткі озвучені ситуації, великі контрастні/тактильні зображення, еквівалент у вигляді предметів або усної розповіді, можливість відповісти жестом чи словом. Не використовувати живий публічний ШІ-чат із дитиною і не вводити реальні дитячі фото чи персональні дані. Основне джерело — чинний канонічний Skill та Course Methodology; конкретні навчальні форми належать Screenwriter, якість запитань — Assessment Architect. Приклади не прив'язані до конкретного бренду.
                  quizRequired: false
                rulesVersusLearnedModels:
                  type: lesson
