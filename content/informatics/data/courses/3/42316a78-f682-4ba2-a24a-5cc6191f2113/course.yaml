                  sequenceReason: "Повторює той самий Skill не заради кількості уроків: спершу конструювання послідовності, тепер незалежне виправлення на нових даних і перевірка після правки."
                  methodology: |-
                    # Methodology — Перевір і полагодь алгоритм
                    
                    ## Самостійний зміст і Skill
                    Самостійний урок для приблизно шестирічних дітей, що вже можуть впорядкувати 2–3 знайомі дії з підтримкою або швидко освоїти це під час вступу. Він не залежить від персонажів чи подій конкретного Course. Цільовий Skill — constructASequentialAlgorithm, 1ab60caa-36e7-4cc8-9e2e-64f13352717c (content/informatics/data/skills/algorithms/construction/constructASequentialAlgorithm.ts). Це цілеспрямована повторна перевірка тієї самої компетентності через виправлення й нову побудову, а НЕ неіснуюча окрема «компетентність натискати перевірку».
                    
                    ## Результати та межі глибини
                    Дитина визначає мету процедури, відтворює 3–5 послідовних кроків, зіставляє фактичний результат із метою, називає суттєву пропущену/переставлену дію та пропонує скінченну виправлену послідовність. Вона перевіряє, чи працює зміна на іншому прикладі. Доказом є пояснений процес виправлення і успішна нова послідовність, а не випадкове впізнання «червоної помилки». Без змінних, рекурсії, циклів, коду, складних умов і формального оцінювання ефективності алгоритмів.
                    
                    ## Правильний зміст та контрприклади
                    Щоб перевірити алгоритм, потрібно знати, що він має досягти, виконати кроки в зазначеному порядку, побачити відмінність між очікуваним і фактичним результатами та змінити потрібний крок. Приклад: «поклади аркуш → візьми олівець → прибери олівець → намалюй коло» не досягає мети, якщо повторно не взяти олівець; корекція — прибрати олівець після малювання. Приклад іншої помилки — алгоритм не має команди завершення потрібної дії; потрібно відновити саме відсутній необхідний крок. Контрприклад: дві незалежні команди можна поміняти місцями без збоїв, тому не кожна зміна порядку є помилкою. Якщо результат неясний, варто уточнити мету; не вигадувати єдине правильне виправлення для багатозначного завдання.
                    
                    ## Порядок засвоєння і хибні уявлення
                    Визначити мету → передбачити результат послідовності → виконати її точно → порівняти з метою → обґрунтувати зміну → перевірити ще раз. На підтримуваному прикладі показати, що помилка може бути в інструкції, а не в дитині чи «неслухняному роботі». Поступово зменшувати допомогу та змінювати предметний контекст. Хиби: «перевіряти не потрібно, якщо інструкція виглядає гарно», «будь-яка перестановка — виправлення», «додавання великої кількості кроків автоматично допоможе», «невдача означає, що нічого не можна покращити». Докази формуються через пояснення й перенесення.
                    
                    ## План оцінювання та Question Bank
                    Цей substantive instructional Lesson має власний майбутній Question Bank у своєму незалежному Lesson Production workflow; питання про «виправлення» не дублюють просте складання команд із іншого Lesson. Core: виявити обов'язковий пропущений крок; визначити зміну результату через перестановку; запропонувати й обґрунтувати виправлення. Extension: новий контекст або випадок, коли два порядки однаково допустимі, щоб перевірити розуміння мети. AssessmentMethodKey: errorDiagnosis, verification, justification, knowledgeTransfer. Локальний Quiz Sections: 0; потрібна видима практика з випробуванням та повторним застосуванням, а не швидкий scored тест на першій спробі. Question Bank залишається незалежним і повним, навіть коли у самому Lesson немає Quiz. Знайти один збій випадково — недостатньо для mastery.
                    
                    ## Доступність, безпека і джерела
                    Завдання без реальних помилок у небезпечних діях: не використовувати електричні прилади, воду/вогонь чи персональні дані дітей. Голос, вибір картки, фізичні предмети та доступний цифровий еквівалент рівноцінні; без часу на реакцію, кольорових підказок як єдиного каналу або вимоги читати. Відповідальність за сюжет/Sections — Screenwriter, за остаточні bank/Question-відповіді — Assessment Architect. Канонічне визначення Skill зберігає Course-neutral значення, незалежно від локального сценарію.
