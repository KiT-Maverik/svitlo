                  methodology: |-
                    # Methodology — Склади команди в правильному порядку
                    
                    ## Аудиторія, предмет і вступ
                    Самостійний урок для 6 років, що не потребує читання чи знання програмування. Достатньо вміння розрізняти дві-три послідовні повсякденні дії з допомогою дорослого. Skill constructASequentialAlgorithm, 1ab60caa-36e7-4cc8-9e2e-64f13352717c; source: content/informatics/data/skills/algorithms/construction/constructASequentialAlgorithm.ts. Мета — описати кінцеву послідовність потрібних дій, кожна з яких спирається на стан після попередньої, без умов і циклів. Називання команд — не програмування виконуваним кодом.
                    
                    ## Конкретний результат і глибина
                    Після практики дитина може (1) назвати досяжну мету в зрозумілій задачі; (2) розташувати 3–5 чітких команд так, щоб результат був можливий; (3) передбачити, що відбудеться після зміни порядку двох залежних кроків; (4) скласти аналогічний короткий план у новому, безпечному контексті. Самостійність перевіряється на другій задачі після прикладу, а не за пам'яттю першої картинки. Складніші стани/програмні конструкції не потрібні.
                    
                    ## Факти, приклади та контрприклади
                    Алгоритм — визначена скінченна процедура з упорядкованих інструкцій для завдання. Приклад: для сортування трьох карток за зображенням можна задати однозначні кроки «візьми кожну картку, подивись на символ, поклади до відповідної групи», але повторення/умову поки розглядати як пояснення вголос, а не вимогу будувати цикл. Краще базовий приклад без прихованих розгалужень: «поклади папір на стіл → візьми олівець → намалюй коло → поклади олівець у коробку». Перестановка «поклади олівець у коробку» перед малюванням без повторного взяття може зірвати мету. Контрприклади: «зроби красиво», «розв'язуй як хочеш», пропущений обов'язковий крок; це не однозначні команди, придатні для виконання. Не вважати, що будь-яка перестановка двох незалежних дій обов'язково порушує результат.
                    
                    ## Концептуальна прогресія й хиби
                    Від мети перейти до потрібних дій, перевірки їхнього порядку на простій моделі, потім до нового набору предметів. Розділити «мету», «команду», «порядок», «результат», «помилку». Типові хиби: кроки називають без перевірки реальності; невизначені формулювання; непомічений пропуск; думка, що чим більше команд, тим кращий алгоритм. Дорослий пропонує контрприклад і запитує про результат, не підказуючи безпосередньо правильне місце кожної картки.
                    
                    ## Оцінювання/майбутній банк
                    За окремим дозволом Lesson Production це instructional Lesson отримує власний повний Question Bank; ніякі Question UUID зараз не створюються. Core: скласти порядок залежних дій; пояснити критичну перестановку; задати відсутній крок. Extension: інший матеріал/інша початкова умова, де порядок частини незалежних дій може бути довільним. AssessmentMethodKey: application, prediction, justification, knowledgeTransfer. Методи оцінюють побудову алгоритму, а не вправність читання/перетягування карток. Quiz Sections: 0; потрібні керована практика, самостійне відтворення нової послідовності й змістовний зворотний зв'язок; незалежний банк усе одно матиме різноманітні валідні питання. Успішно виконана одна карткова вправа не доводить довготривалого mastery.
                    
                    ## Доступність, безпека й межа відповідальності
                    Бажано використовувати безпечні предмети без дрібних небезпечних деталей і приладів з електроживленням; доступні усні, жестові, тактильні та крупні карткові способи. Повністю працює офлайн, не потребує встановлення програм. Фактичне визначення — канонічний Skill. Конкретну послідовність сцен, текст інструкцій і їхню візуальну реалізацію обирає Screenwriter; банк і оцінні правила належать Assessment Architect.
