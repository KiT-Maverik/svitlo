                  methodology: |-
                    # Методологія — Чи завжди ШІ говорить правду?
                    
                    ## Кому й навіщо
                    Самостійний вступний урок для дітей приблизно шести років, зокрема тих, хто ще не читає і не користувався сервісами ШІ. Дорослий озвучує готові безпечні приклади відповідей. Ціль — помітити ознаки можливої ненадійності тексту, що виглядає впевнено, але містить суперечність, неправдоподібну подробицю або посилання без реального перевірюваного джерела. Не вимагається жива розмова з чатботом, самостійний онлайн-пошук, спеціальні знання мовних моделей чи обіцянка знаходити кожну помилку.
                    
                    ## Канонічна компетентність і спостережувані результати
                    Skill identifyAPotentialAIError, UUID f93aa878-a1ad-4820-82a3-30f4b182f147, файл content/informatics/data/skills/artificialIntelligence/aIFundamentals/identifyAPotentialAIError.ts. Учень (1) помічає очевидне протиріччя між короткою відповіддю і наданим контекстом, (2) може вказати деталь, яка потребує перевірки, (3) пояснює простою мовою, що впевнене формулювання саме по собі не доводить правду, (4) обирає звернутися до дорослого, коли не може перевірити. Глибина — розпізнавання ризику і пояснення підстав, а не незалежний професійний аудит джерел.
                    
                    ## Точний зміст, приклади й контрприклади
                    Система ШІ може формулювати зв'язний текст, який не відповідає фактам. Приклад: у завданні на картці чітко сказано «три яблука», а в підготовленій відповіді написано «на картці п'ять яблук» — це протиріччя з видимим доказом. Другий приклад: модель стверджує «саме вчора у вашому саду був слон» без джерела й даних; це непідтверджене твердження, а не автоматично доведена помилка. Третій: обіцянка посилання на книжку, але бібліотекар не може її знайти — сигнал перевірити, не безумовний доказ вигадки. Правильна відповідь теж може бути впевненою; підозрілість не означає хибність. Навчити розмежовувати «бачу суперечність», «можливо хибно», «не знаю, потрібно перевірити».
                    
                    ## Концептуальна послідовність, тренування, хиби
                    Спершу дитина зіставляє картинку та короткий підготовлений текст, потім порівнює два прості взаємовиключні твердження, нарешті оцінює новий випадок без явної підказки. Дорослий обговорює підставу для сумніву і допускає відповідь «не знаю». Типові помилки: «ШІ не помиляється», «якщо текст складний, він правдивий», «якщо сумніваюся, твердження обов'язково хибне», «можна довіряти кожному наведеному посиланню». Не підміняти розпізнавання ризику оцінкою поглядів чи фантазійної історії; художнє вигадування за запитом не тотожне фактичній помилці.
                    
                    ## Assessment intent / Quiz / власний Question Bank
                    Майбутній власник незалежного Question Bank — цей instructional Lesson; банк створюється тільки в окремому Lesson→Questions Production після авторизації. Core evidence: виявити явну суперечність; визначити неперевірювану деталь; обґрунтувати потребу звірки. Extension: новий формат повідомлення, де впевнений тон збережено, але доказів немає. Канонічні AssessmentMethodKey — errorDiagnosis, interpretation, verification, justification. Уникати двох питань з тією ж помилкою, що різняться лише картинкою. Quiz Sections: 0, quizRequired: false; для першого знайомства з ненадійністю доречні предметні порівняння, діалог і відстрочене пригадування, а не формальний екранний тест. Повний незалежний банк все одно необхідний для майбутньої практики; правильний одиничний вибір не доводить mastery.
                    
                    ## Інклюзивність, безпека, джерела
                    Лише заздалегідь перевірені, нестрашні для дітей приклади; не згадувати реальну персональну інформацію чи небезпечні рекомендації. Офлайн-версія з великою карткою, читанням уголос, жестовою/тактильною відповіддю; колір не може бути єдиною ознакою. Канонічне джерело визначення — Skill у репозиторії та методологія Course, не декларація про абсолютну надійність будь-якого продукту. Screenwriter обирає навчальні Section і засоби, Assessment Architect — фактичну якість запитань та відповідей.
