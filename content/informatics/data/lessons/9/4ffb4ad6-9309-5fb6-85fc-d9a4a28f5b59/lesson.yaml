  methodology: |-
    # Методологія — Знайди закономірність і перевір правило

    ## Призначення, аудиторія та передумови
    Самостійний навчальний Lesson для дітей близько шести років. Читання, письмо, володіння мишею й програмування не потрібні; дорослий озвучує короткі запитання та за потреби показує послідовність великих контрастних предметів. Початкова передумова — бачити або відчувати порядок трьох-чотирьох елементів; якщо дитині це складно, почати з предметної демонстрації. Lesson незалежний від вигаданого персонажа чи попередньої Course-історії; не охоплює формальні числові прогресії, складну комбінаторику або статистичні прогнози.

    ## Єдиний цільовий Skill і спостережувані результати
    recognizeAPattern — 19dbf903-354a-41cb-90a1-07633df5f480, джерело: content/informatics/data/skills/computationalThinking/logicAndPatterns/recognizeAPattern.ts. Дитина може: (1) вказати повторювану ознаку серед кількох елементів, (2) сформулювати доступними словами припущення про правило, (3) перевірити правило на показаних елементах, (4) обрати правдоподібне продовження і пояснити його на іншій послідовності. Перенесення на нові елементи — свідчення застосування; просте вгадування наступної картинки — тільки частковий доказ. Рівень — базове розуміння й доступна практична перевірка, не твердження про абсолютну істинність.

    ## Предметні факти, приклади, контрприклади
    Закономірність — правило, яке можна припустити за змінами властивостей або будови послідовності; спостереження її ще не гарантує кожного невідомого майбутнього елемента. Виразний приклад: круг–квадрат–круг–квадрат–круг–квадрат; припущення «чергуються дві форми» узгоджується з усім видимим рядом. Перевірити на додаткових уже відомих елементах, потім запропонувати продовження й пояснення. Контрприклад: круг–квадрат–круг — замало для єдиного доказаного правила: може існувати кілька способів продовжити, якщо умову не задано. Уміти помітити порушення в середині знайомого ряду. Візуальні форми можна замінити ритмом чи тактильною текстурою без зміни поняття.

    ## Концептуальна прогресія та хибні уявлення
    Спершу помічати схожість/відмінність, потім називати можливе правило, перевіряти його відразу на кількох позиціях і випробувати на іншому наборі. Відрізняти «я так здогадуюсь» від «це узгоджується з показаним рядом». Хиби: «один збіг уже доводить правило», «можна завжди передбачити невідоме», «правило залежить лише від кольору». Виправляти контрприкладами й запитанням, на яких елементах припущення працює. Не створювати новий Skill для механіки сортування/перетягування.

    ## Assessment intent та власний майбутній Question Bank
    Майбутній самостійний Lesson володіє окремим повним Question Bank; тепер не створюються Question UUID, bank-файли чи Question PR. Обов'язкові різні джерела evidence: знайти повтор; дати доступне пояснення правила; перевірити на контрприкладі; застосувати до нової модальності. Допустимі канонічні AssessmentMethodKey: patternGeneralization, prediction, verification, justification; їх потрібно прив'язати до різних мисленнєвих операцій, а не до різних картинок одного завдання. Окремий Quiz Section: 0 (quizRequired: false), оскільки новачку важливі проба, обговорення та перевірка в новій ситуації; повний bank усе одно обов'язковий для пізнішої практики. Відповіді можуть бути голосовими, тактильними, жестовими; учитель фіксує помилки без автоматичних заяв про mastery.

    ## Доступність, локалізація, безпека та межа авторства
    Використовувати великі форми з різницею не лише кольору; передбачити тактильну/звукову еквівалентність без швидкісних таймерів, фізично безпечні матеріали та повністю офлайн-режим. Не вимагати цифрового облікового запису чи даних дитини. Текст джерела — канонічний Skill і методологія Course; не заявляти відповідність неперевіреному освітньому стандарту. Конкретні Section, media й навчальні взаємодії — пізніша робота Screenwriter; зміст Question і ключі відповідей — Assessment Architect.
