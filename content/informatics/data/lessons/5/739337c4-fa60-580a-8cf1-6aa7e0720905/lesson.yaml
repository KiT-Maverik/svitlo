                          output:
                            uk: "Без опису роботи лампи визначити не можна."
                          hint:
                            uk: "Звичайна лампа й керована програмою лампа працюють по-різному."
                          explanation:
                            uk: "Потрібно дізнатися. Проста лампа може тільки світити, а керована програмою — обробляти цифрові команди."
