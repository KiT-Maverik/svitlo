      howDevicesUseInformation:
        config:
          id: "b6f90e2a-4df0-4dbf-83a1-a00000000002"
          slug: "howDevicesUseInformation"
          type: "content"
          params: {}
          locale:
            title:
              uk: "Що робить пристрій цифровим?"
            navigationLabel:
              uk: "Зрозумій"
          content:
            items:
              simpleDigitalRule:
                config:
                  id: "b6f90e2a-4df0-4dbf-83a1-b00000000005"
                  slug: "simpleDigitalRule"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        **Дані** — це, наприклад, число або команда, яку отримує пристрій. **Цифровий пристрій** працює з цифровими даними за правилами, які задали люди, і дає результат.
                        
                        Запам’ятай три кроки: **отримав дані → опрацював за правилами → дав результат**. Пристрій не «думає, як людина»: він виконує створені для нього правила.
                production:
                  purpose: "Дати точний, але доступний критерій, не прирівнюючи цифровість до електроживлення."
              calculatorStepByStep:
                config:
                  id: "b6f90e2a-4df0-4dbf-83a1-b00000000006"
                  slug: "calculatorStepByStep"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        Ось **калькулятор**. Ми натискаємо **2, +, 3, =**.
                        
                        1. Він **отримує** числа й команду.
                        2. Він **опрацьовує** їх за правилом додавання.
                        3. Він **показує результат**: **5**.
                        
                        Навіть якщо ти ще не рахуєш такі приклади, ти можеш помітити: результат обчислив сам калькулятор за заданими правилами.
                production:
                  purpose: "Прозорий worked example з даними/обробкою/результатом."
              paperDoesNotCalculate:
                config:
                  id: "b6f90e2a-4df0-4dbf-83a1-b00000000007"
                  slug: "paperDoesNotCalculate"
                  type: "markdown"
                  params: {}
                  locale:
                    value:
                      uk: |-
                        А ось **паперовий календар**. На ньому багато цифр. Але календар **сам не рахує й не обробляє інформацію**. Це людина читає дати й обирає потрібний день.
                        
                        Отже, наявність цифр на предметі не робить його цифровим. Запитай себе: **хто саме обробляє інформацію — предмет чи людина?**
                production:
                  purpose: "Спростувати помилку «бачу цифри — це цифрова річ»."
            order:
