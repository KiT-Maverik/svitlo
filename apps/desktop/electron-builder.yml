appId: org.svitlo.desktop
productName: Svitlo
nativeModules:
  npmRebuild: false
directories:
  output: release
fileOptions:
  files:
    - dist-main/**/*
    - dist-renderer/**/*
    - package.json
    - '!**/*.map'
linux:
  executableName: svitlo
  target:
    - AppImage
mac:
  target:
    - dmg
win:
  target:
    - nsis
