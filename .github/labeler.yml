# PR labels from changed files or agent branch conventions.
# Labels are defined with colors and descriptions in .github/labels.json.
# 'area: repo' is a fallback managed by the PR workflow, not a glob rule.
'area: server':
  - changed-files:
      - any-glob-to-any-file: 'backend/server/**'
'area: platform':
  - changed-files:
      - any-glob-to-any-file: 'frontend/platform/**'
'area: scripts':
  - changed-files:
      - any-glob-to-any-file: 'scripts/**'
