name: Content packages build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'content/**'
      - 'scripts/textbook-tooling/**'
      - 'shared/engine/scripts/checkSkillsTaxonomyStructure/check-skills-taxonomy-structure.mjs'
      - 'shared/engine/scripts/checkSkillsTaxonomyStructure/check-skills-taxonomy-structure.spec.mjs'
      - 'scripts/checkBuiltPackageExports/check-built-package-exports.mjs'
      - 'scripts/checkBuiltPackageExports/check-built-package-exports.spec.mjs'
      - 'scripts/ci/build-changed-content.mjs'
      - 'scripts/ci/build-changed-content.spec.mjs'
      - 'scripts/ci/skills-agent-owners.json'
      - '.github/workflows/content-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Affected content / build, taxonomy and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify changed content packages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/build-changed-content.mjs
      - name: Manually build every content package
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/ci/build-changed-content.mjs --all
