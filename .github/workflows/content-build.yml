name: Content packages build

on:
  pull_request:
    # Ready-for-review requires production resource checks not run on draft PRs.
    # Keep this event even when the formatter makes no source changes.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Content / prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      all: ${{ steps.plan.outputs.all }}
      agent_mode: ${{ steps.plan.outputs.agent_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify changed UI Kit lesson runtime
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^shared/ui-kit/'; then
            npm run package:build --workspace @svitlo/engine
            npm run code:check:types --workspace @svitlo/ui-kit
            npm exec --workspace @svitlo/ui-kit -- vitest run src/components/lesson/LessonController.unit.spec.tsx
          fi
      - name: Typecheck translated Astronomy Lesson sources
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^content/astronomy/data/lessons/'; then
            npm run package:build --workspace @svitlo/engine
            # Full workspace tsc is blocked by an inherited, syntactically invalid
            # Lesson review.ts; verify all translated Question/Quiz modules instead.
            scoped_config=content/astronomy/tsconfig.questions-translation.tmp.json
            trap 'rm -f "$scoped_config"' EXIT
            cat > "$scoped_config" <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [
              "data/lessons/2/c25fe16e-5640-5615-b456-a99a392a7f42/questions/**/*.ts",
              "data/lessons/2/c25fe16e-5640-5615-b456-a99a392a7f42/sections/rotationAndIlluminationQuiz/**/*.ts"
            ],
            "exclude": []
          }
          JSON
            npm exec --workspace @svitlo/astronomy -- tsc -p tsconfig.questions-translation.tmp.json --noEmit
          fi
      - name: Test content build selection and artifacts
        run: |
          node --test scripts/ci/buildChangedContent/*.spec.mjs
          node --test shared/engine/scripts/checkSkillsTaxonomyStructure/check-skills-taxonomy-structure.spec.mjs
      - name: Test final resource readiness gate
        run: node --test scripts/ci/verifyProductionAssets/verify-production-assets.spec.mjs
      - name: Test Course Episode media draft handoff
        run: node --test shared/engine/scripts/courseBuilder/courseBuilder.spec.mjs
      - name: Test published assessment resource references
        run: node --test scripts/textbook-tooling/verifyAssessmentSelections/verifyAssessmentSelections.spec.mjs
      - name: Refuse unfinished Lesson, bank and Episode resources on review-ready PRs
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/verifyProductionAssets/verify-production-assets.mjs "$BASE_SHA" "$HEAD_SHA"
      - name: Plan content builds
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: node scripts/ci/buildChangedContent/plan-content-builds.mjs
      - name: Validate selected package graph and package-artifact guard
        if: steps.plan.outputs.has_builds == 'true' && steps.plan.outputs.agent_mode != 'true'
        run: |
          npm run repo:check:packages
          node --test scripts/checkBuiltPackageExports/check-built-package-exports.spec.mjs

  build:
    name: Content / ${{ matrix.path }}
    needs: prepare
    if: needs.prepare.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build and verify selected textbook or agent scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          CONTENT_BUILD_ALL: ${{ needs.prepare.outputs.all }}
          CONTENT_PACKAGE_PATH: ${{ matrix.path }}
          CONTENT_PACKAGE_KIND: ${{ matrix.kind }}
          SVITLO_MEDIA_MODE: ${{ (github.event_name == 'pull_request' && (github.base_ref != 'main' || github.event.pull_request.draft)) && 'draft' || 'production' }}
        run: node scripts/ci/buildChangedContent/build-changed-content.mjs --package "$CONTENT_PACKAGE_PATH" "$CONTENT_PACKAGE_KIND"

  verify:
    # Keep this exact required status context from the Protect main ruleset.
    name: Affected content / build, taxonomy and packaging
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful preparation and every selected package build
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          HAS_BUILDS: ${{ needs.prepare.outputs.has_builds }}
        run: |
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "::error::Content build preparation did not succeed: $PREPARE_RESULT"
            exit 1
          fi
          if [ "$HAS_BUILDS" = "true" ] && [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::One or more selected content package jobs failed: $BUILD_RESULT"
            exit 1
          fi
          if [ "$HAS_BUILDS" = "false" ] && [ "$BUILD_RESULT" != "skipped" ]; then
            echo "::error::Unexpected content matrix result with no selected packages: $BUILD_RESULT"
            exit 1
          fi
          echo "Content package checks passed."
