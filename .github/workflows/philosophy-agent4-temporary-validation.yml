name: Temporary Agent 4 Philosophy typed validation

on:
  push:
    branches: [review/philosophy-skills-language-review-agent-4]
    paths:
      - '.github/workflows/philosophy-agent4-temporary-validation.yml'

permissions:
  contents: read

jobs:
  philosophy-agent-4-validation:
    name: Philosophy Agent 4 / strict taxonomy and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Check workspaces
        run: node scripts/check-workspaces.mjs
      - name: Validate complete Philosophy taxonomy graph
        run: node scripts/check-skills-taxonomy-structure.mjs learningApps/philosophy/data/skills
      - name: Build shared contracts
        run: npm run build --workspace @svitlo/contracts
      - name: Build shared engine
        run: npm run build --workspace @svitlo/engine
      - name: Typecheck Philosophy, including all authored data
        run: npm run typecheck --workspace @svitlo/philosophy
