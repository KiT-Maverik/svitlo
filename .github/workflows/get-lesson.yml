name: Get Lessons by Skill or ID

# This workflow takes effect for PR comments only after it is merged to main.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository open PR
        type: number
        required: true
      query:
        description: Full /get lesson command
        type: string
        required: true

permissions: {}

concurrency:
  group: get-lesson-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/get lesson'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      sha: ${{ steps.resolve.outputs.sha }}
      valid: ${{ steps.resolve.outputs.valid }}
      query: ${{ steps.resolve.outputs.query }}
      error: ${{ steps.resolve.outputs.error }}
    steps:
      - name: Authorize actor and pin same-repo PR before any checkout
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const comment = process.env.GITHUB_EVENT_NAME === 'issue_comment';
          if (comment && !event.issue?.pull_request) throw Error('PR comments only');
          const actor = comment ? event.comment.user.login : process.env.GITHUB_ACTOR;
          const number = Number(comment ? event.issue.number : event.inputs.pr_number);
          const repo = process.env.GITHUB_REPOSITORY;
          if (!Number.isSafeInteger(number) || number < 1 || !/^[a-zA-Z0-9-]+$/.test(actor)) throw Error('Invalid PR/actor');
          const api = url => JSON.parse(execFileSync('gh', ['api', url], { encoding: 'utf8' }));
          const permission = api('repos/' + repo + '/collaborators/' + actor + '/permission').permission;
          if (!['write', 'maintain', 'admin'].includes(permission)) throw Error('Write permission required');
          const pr = api('repos/' + repo + '/pulls/' + number);
          if (pr.state !== 'open' || pr.head?.repo?.full_name !== repo ||
              !/^[a-f0-9]{40}$/.test(pr.head?.sha ?? '')) throw Error('Open same-repo PR required');
          const command = comment ? event.comment.body : event.inputs.query;
          const UUID = /^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i;
          function parse(body) {
            if (typeof body !== 'string' || body.length > 2500 || /[\r\n\0]/.test(body))
              throw Error('Command must occupy one line');
            const tokens = body.trim().split(/[ \t]+/), flags = new Map(), values = [];
            if (tokens[0] !== '/get' || tokens[1] !== 'lesson' || tokens[2] !== 'by' ||
                !['id','skill'].includes(tokens[3])) throw Error('Expected /get lesson by id|skill');
            for (let i = 4; i < tokens.length; i++) {
              if (tokens[i].startsWith('--')) {
                const flag = tokens[i], value = tokens[++i];
                if (!['--package','--match'].includes(flag) || flags.has(flag) ||
                    !value || value.startsWith('--')) throw Error('Unknown, repeated or incomplete flag');
                flags.set(flag, value);
              } else {
                if (flags.size) throw Error('UUID values must precede flags');
                values.push(tokens[i]);
              }
            }
            const pkg = flags.get('--package') ?? null;
            if (pkg && !/^content\/[a-z][a-z0-9-]*$/.test(pkg)) throw Error('Unsafe package');
            if (tokens[3] === 'id') {
              if (values.length !== 1 || !UUID.test(values[0]) || flags.has('--match'))
                throw Error('Exactly one Lesson UUID required');
              return { by: 'id', lessonId: values[0].toLowerCase(), package: pkg };
            }
            if (!values.length || values.length > 25 || !values.every(x => UUID.test(x)))
              throw Error('Expected 1–25 Skill UUIDs');
            const skills = values.map(x => x.toLowerCase()), match = flags.get('--match') ?? 'any';
            if (new Set(skills).size !== skills.length || !['all','any'].includes(match))
              throw Error('Duplicate Skills or invalid match');
            return { by: 'skill', skills, match, package: pkg };
          }
          let valid = 'true', query = '', error = '';
          try { query = Buffer.from(JSON.stringify(parse(command))).toString('base64'); }
          catch (e) { valid = 'false'; error = Buffer.from(String(e.message).slice(0, 300)).toString('base64'); }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            'pr=' + number, 'sha=' + pr.head.sha, 'valid=' + valid,
            'query=' + query, 'error=' + error, '',
          ].join('\n'));
          NODE

  analyze:
    needs: resolve
    if: needs.resolve.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned parser dependencies safely
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run immutable-source static scan
        env:
          QUERY_B64: ${{ needs.resolve.outputs.query }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
        run: |
          mkdir -p "$RUNNER_TEMP/get-lesson"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const q = JSON.parse(Buffer.from(process.env.QUERY_B64, 'base64').toString('utf8'));
          const args = ['shared/engine/scripts/queryLessons/query-lessons.mjs', '--by', q.by];
          if (q.by === 'id') args.push('--lesson', q.lessonId);
          else {
            for (const id of q.skills) args.push('--skill', id);
            args.push('--match', q.match);
          }
          if (q.package) args.push('--package', q.package);
          args.push('--source-sha', process.env.HEAD_SHA, '--stdout', '--format', 'json');
          const child = spawnSync(process.execPath, args, {
            encoding: 'utf8', timeout: 120000, maxBuffer: 8 * 1024 * 1024,
          });
          let result;
          try {
            if (child.error || child.status !== 0) throw Error((child.stderr || child.error?.message || 'Query failed').slice(0, 350));
            result = JSON.parse(child.stdout);
          } catch (error) {
            result = { query: q, sourceSha: process.env.HEAD_SHA, matches: [], complete: false,
              scanned: { packages: 0, implemented: 0, drafts: 0, candidates: 0 },
              diagnostics: [{ file: '', package: q.package, entityId: null,
                reason: 'Lookup error: ' + String(error.message), incomplete: true }] };
          }
          let body = JSON.stringify({ pr: Number(process.env.PR_NUMBER), sha: process.env.HEAD_SHA, query: q, result });
          if (Buffer.byteLength(body) > 1024 * 1024)
            body = JSON.stringify({ pr: Number(process.env.PR_NUMBER), sha: process.env.HEAD_SHA,
              query: q, result: { query: q, sourceSha: process.env.HEAD_SHA, matches: [], complete: false,
                scanned: { packages: 0, implemented: 0, drafts: 0, candidates: 0 },
                diagnostics: [{ file: '', reason: 'Report too large; restrict with --package', incomplete: true }] } });
          fs.writeFileSync(process.env.RUNNER_TEMP + '/get-lesson/result.json', body);
          NODE
      - name: Upload report only as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: get-lesson-${{ needs.resolve.outputs.pr }}
          path: ${{ runner.temp }}/get-lesson/result.json
          retention-days: 7
          if-no-files-found: error

  report:
    needs: [resolve, analyze]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.analyze.result == 'success' || needs.resolve.outputs.valid == 'false')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Download result from this run only
        if: needs.resolve.outputs.valid == 'true'
        uses: actions/download-artifact@v4
        with:
          name: get-lesson-${{ needs.resolve.outputs.pr }}
          path: report
      - name: Validate untrusted artifact before bot comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
          QUERY_B64: ${{ needs.resolve.outputs.query }}
          ERROR_B64: ${{ needs.resolve.outputs.error }}
          VALID: ${{ needs.resolve.outputs.valid }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const repo = process.env.GITHUB_REPOSITORY, pr = Number(process.env.PR_NUMBER), sha = process.env.HEAD_SHA;
          const api = (url, method, file) => {
            const args = ['api', url];
            if (method) args.push('--method', method, '-F', 'body=@' + file);
            return execFileSync('gh', args, { encoding: 'utf8', timeout: 30000, maxBuffer: 8 * 1024 * 1024 });
          };
          const esc = s => String(s ?? '').slice(0, 180).replace(/[\x00-\x1f\x7f]/g, ' ')
            .replace(/[<>&*_[\]()!#|\x60]/g, x => '\\' + x);
          const id = s => typeof s === 'string' && /^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$/.test(s);
          const safe = s => typeof s === 'string' && s.length < 500 &&
            /^content\/[a-z][a-z0-9-]*\/data\/lessons\/[0-9a-f]\/[a-f0-9-]{36}\//.test(s) &&
            s.split('/').every(x => x !== '.' && x !== '..' && /^[a-zA-Z0-9._-]+$/.test(x));
          const url = p => 'https://github.com/' + repo + '/blob/' + sha + '/' +
            p.split('/').map(encodeURIComponent).join('/');
          const lines = ['<!-- svitlo-get-lesson -->', '## Lesson lookup', '',
            'Analyzed PR head: ' + sha, ''];
          if (process.env.VALID !== 'true') {
            lines.push('Invalid command: ' + esc(Buffer.from(process.env.ERROR_B64, 'base64').toString()), '',
              'Usage: /get lesson by id UUID [--package content/book] OR ' +
              '/get lesson by skill UUID [UUID ...] [--match any|all] [--package content/book].');
          } else {
            if (fs.readdirSync('report').join(',') !== 'result.json' ||
              fs.statSync('report/result.json').size > 1024 * 1024) throw Error('Unexpected lookup artifact');
            const q = JSON.parse(Buffer.from(process.env.QUERY_B64, 'base64').toString('utf8'));
            const payload = JSON.parse(fs.readFileSync('report/result.json', 'utf8')), r = payload.result;
            if (payload.pr !== pr || payload.sha !== sha ||
              JSON.stringify(payload.query) !== JSON.stringify(q) ||
              JSON.stringify(r?.query) !== JSON.stringify(q) || r.sourceSha !== sha ||
              typeof r.complete !== 'boolean' || !Array.isArray(r.matches) || !Array.isArray(r.diagnostics) ||
              !r.scanned || r.matches.length > 10000 || r.diagnostics.length > 10000)
              throw Error('Untrusted report binding/schema mismatch');
            const seen = new Set();
            for (const entry of r.matches) {
              if (!id(entry.lessonId) || !/^content\/[a-z][a-z0-9-]*$/.test(entry.package) ||
                !['implemented','editorial-draft'].includes(entry.status) || !safe(entry.source) ||
                entry.source.split('/')[1] !== entry.package.split('/')[1] ||
                !Array.isArray(entry.skills) || !entry.skills.every(id) ||
                !Array.isArray(entry.matchedSkills) || !entry.matchedSkills.every(s => entry.skills.includes(s)) ||
                (entry.methodology && !safe(entry.methodology)) ||
                (entry.draftSource && !safe(entry.draftSource)))
                throw Error('Unsafe candidate in artifact');
              const key = entry.package + ':' + entry.lessonId;
              if (seen.has(key)) throw Error('Duplicate candidate');
              seen.add(key);
            }
            for (const d of r.diagnostics)
              if (typeof d.reason !== 'string' || d.reason.length > 1000 ||
                (d.file && (typeof d.file !== 'string' || d.file.length > 500)))
                throw Error('Unsafe diagnostic');
            lines.push('Query: ' + esc(q.by === 'id' ? q.lessonId : q.skills.join(', ') + ' (' + q.match + ')') +
              (q.package ? ' in ' + esc(q.package) : ' across textbooks'), '',
              'Verified candidates: **' + r.matches.length + '**. Index ' + (r.complete ? 'complete.' : 'INCOMPLETE.'), '');
            for (const entry of r.matches.slice(0, 15)) {
              lines.push('- [' + esc(entry.title || entry.slug || entry.lessonId) + '](' + url(entry.source) + ')' +
                ' — ' + esc(entry.package) + ' · ' + entry.status + ' · ' + entry.lessonId +
                ' · matched ' + entry.matchedSkills.length + (q.by === 'skill' ? '/' + q.skills.length : '') +
                ' · all Skills: ' + entry.skills.join(', ') +
                (entry.methodology ? ' · [methodology](' + url(entry.methodology) + ')' : '') +
                (entry.draftSource ? ' · [draft YAML](' + url(entry.draftSource) + ')' : '') +
                ' · locales: ' + (entry.languageStatus === 'verified' && Array.isArray(entry.languages) ?
                  entry.languages.map(esc).join(', ') : 'unknown'));
            }
            if (r.matches.length > 15) lines.push('Additional candidates in JSON: ' + (r.matches.length - 15));
            if (!r.matches.length) lines.push(r.complete ? 'No verified Lesson matches.' : 'No verified matches; index incomplete.');
            if (r.diagnostics.length) {
              lines.push('', 'Diagnostics: ' + r.diagnostics.length);
              for (const d of r.diagnostics.slice(0, 8)) lines.push('- ' + esc(d.file) + ': ' + esc(d.reason));
            }
            lines.push('', 'Full JSON artifact (7 days): https://github.com/' + repo +
              '/actions/runs/' + process.env.GITHUB_RUN_ID,
              'Skill overlap is not proof of pedagogical, readiness or language fit.');
          }
          const latest = JSON.parse(api('repos/' + repo + '/pulls/' + pr));
          if (latest.head?.sha !== sha) lines.push('', 'Warning: PR moved; results refer to earlier SHA.');
          const f = process.env.RUNNER_TEMP + '/get-lesson-comment.md';
          fs.writeFileSync(f, lines.join('\n').slice(0, 14000) + '\n');
          const comments = JSON.parse(execFileSync('gh', ['api', 'repos/' + repo +
            '/issues/' + pr + '/comments?per_page=100', '--paginate', '--slurp'],
            { encoding: 'utf8', timeout: 30000, maxBuffer: 8 * 1024 * 1024 })).flat();
          const old = comments.filter(c => c.user?.login === 'github-actions[bot]' &&
            c.body?.startsWith('<!-- svitlo-get-lesson -->')).at(-1);
          if (old) api('repos/' + repo + '/issues/comments/' + old.id, 'PATCH', f);
          else api('repos/' + repo + '/issues/' + pr + '/comments', 'POST', f);
          NODE
