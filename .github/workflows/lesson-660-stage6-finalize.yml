name: Lesson 660 one-time Stage 6 Scene checks

on:
  push:
    branches:
      - agent/astronomy-observation-journal
    paths:
      - .github/workflows/lesson-660-stage6-finalize.yml

permissions:
  contents: write

concurrency:
  group: lesson-660-finalize
  cancel-in-progress: false

jobs:
  source-scenes:
    if: github.repository == 'KiT-Maverik/svitlo' && github.ref == 'refs/heads/agent/astronomy-observation-journal'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Synchronize package lock with the first Astronomy Scene dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build required Engine dependency
        run: npm run package:build --workspace @svitlo/engine
      - name: Verify canonical UUID bucket paths for both Scenes
        run: |
          test -f content/astronomy/scenes/f/43fdcc5a-8c6c-5b71-a2d8-9682c677b47f/index.ts
          test -f content/astronomy/scenes/b/d1bb6314-6977-5bfa-897c-9b7124ca63ab/index.ts
      - name: Generate the canonical Astronomy Scene registry
        run: |
          npm run content:generate:scenes --workspace @svitlo/astronomy
          npm run content:check:scenes --workspace @svitlo/astronomy
      - name: Exercise co-located source-locale Scene model tests
        run: npm run test:components --workspace @svitlo/astronomy
      - name: Check both Scene component TypeScript contracts without the intentionally unfinished Lesson review digest
        run: npm run code:check:scene-types --workspace @svitlo/astronomy
      - name: Confirm source-only TypeScript diagnostics without hiding draft Review gaps
        continue-on-error: true
        run: npm run code:check:types --workspace @svitlo/astronomy
      - name: Commit lockfile and generated Scene loader only
        shell: bash
        run: |
          set -euo pipefail
          test -f content/astronomy/scenes/sceneLoader.ts
          git add -- package-lock.json content/astronomy/scenes/sceneLoader.ts
          git diff --cached --quiet && { echo 'Generated resources unchanged'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Register Astronomy Scenes and synchronize workspace lockfile'
          git push origin HEAD:refs/heads/agent/astronomy-observation-journal
