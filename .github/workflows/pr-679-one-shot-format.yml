name: One-shot format Course PR 679
on:
  push:
    branches:
      - refactor/course-generic-argument-order

permissions:
  contents: read

concurrency:
  group: pr-679-format
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'KiT-Maverik/svitlo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/course-generic-argument-order
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned formatter without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format only the Course materializer and its tests
        run: |
          ./node_modules/.bin/prettier --write \
            shared/engine/scripts/materializeCourseFlow/materialize-course-flow.mjs \
            shared/engine/scripts/materializeCourseFlow/materialize-course-flow.spec.mjs

      - name: Remove the disposable workflow from the final PR diff
        run: rm -- .github/workflows/pr-679-one-shot-format.yml

      - name: Obtain the configured formatter App token
        id: formatter-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_FORMATTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_FORMATTER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Commit formatter output and workflow cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ steps.formatter-app.outputs.token }}
        run: |
          set -euo pipefail
          git add -A -- \
            shared/engine/scripts/materializeCourseFlow/materialize-course-flow.mjs \
            shared/engine/scripts/materializeCourseFlow/materialize-course-flow.spec.mjs \
            .github/workflows/pr-679-one-shot-format.yml
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'Nothing to format'; exit 0
          fi
          git config user.name "${{ steps.formatter-app.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.formatter-app.outputs.app-slug }}[bot]@users.noreply.github.com"
          git commit -m "Format Course draft generation sources"
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
            push origin "HEAD:refs/heads/refactor/course-generic-argument-order"
