name: One-time Lesson 659 Stage 6 draft source handoff

# This temporary workflow is removed in its successful output commit.
# Its execution uses the merged default-branch implementation, not PR code.
on:
  push:
    branches:
      - agent/astronomy-first-look-at-sky
    paths:
      - .github/workflows/lesson-659-stage6-handoff.yml
      - content/astronomy/data/lessons/7/c042698a-de5b-5055-9e10-ff5621f80ed7/lesson.yaml

permissions:
  contents: write

concurrency:
  group: lesson-659-stage6-handoff
  cancel-in-progress: false

jobs:
  handoff:
    if: github.repository == 'KiT-Maverik/svitlo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out existing Lesson branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate and verify from trusted merged main
        shell: bash
        run: |
          set -euo pipefail
          lesson='content/astronomy/data/lessons/7/c042698a-de5b-5055-9e10-ff5621f80ed7'
          source_sha_before="$(sha256sum "$lesson/lesson.yaml" | cut -d' ' -f1)"
          git fetch --no-tags origin main
          git worktree add --detach "$RUNNER_TEMP/svitlo-main" origin/main
          mkdir -p "$RUNNER_TEMP/svitlo-main/$lesson"
          cp "$lesson/lesson.yaml" "$RUNNER_TEMP/svitlo-main/$lesson/lesson.yaml"
          pushd "$RUNNER_TEMP/svitlo-main"
          npm ci --ignore-scripts --no-audit --no-fund
          # Lesson branch now carries merged #706 assessment-Section emission
          # together with the tested canonical .ts Skill resolver fix.
          # All other scripts, contracts and the finalizer stay from main.
          cp "$GITHUB_WORKSPACE/shared/engine/scripts/lessonBuilder/lessonModules.mjs" shared/engine/scripts/lessonBuilder/lessonModules.mjs
          cp "$GITHUB_WORKSPACE/shared/engine/scripts/lessonBuilder/lessonBuilder.spec.mjs" shared/engine/scripts/lessonBuilder/lessonBuilder.spec.mjs
          npx prettier --check shared/engine/scripts/lessonBuilder/lessonModules.mjs shared/engine/scripts/lessonBuilder/lessonBuilder.spec.mjs
          node --test shared/engine/scripts/lessonBuilder/lessonBuilder.spec.mjs
          node shared/engine/scripts/finalizeLesson/finalizeLesson.mjs preflight-draft --source "$lesson/lesson.yaml"
          node shared/engine/scripts/finalizeLesson/finalizeLesson.mjs handoff --source "$lesson/lesson.yaml"
          node shared/engine/scripts/lessonBuilder/lessonBuilder.mjs check --source "$lesson"
          echo "::group::Verified Lesson files"
          find "$lesson" -type f | sort
          echo "::endgroup::"
          echo "::group::Generated blockers"
          grep -R -n 'TODO (BLOCKER):' "$lesson" || true
          echo "::endgroup::"
          test -f "$lesson/index.ts"
          test -f "$lesson/methodology.md"
          test -f "$lesson/production-handoff.json"
          test -f "$lesson/sections/safeSkyChoices/index.ts"
          grep -q 'TODO (BLOCKER):' "$lesson/sections/safeSkyChoices/index.ts"
          test -f "$lesson/lesson.yaml"
          popd
          source_sha_after="$(sha256sum "$lesson/lesson.yaml" | cut -d' ' -f1)"
          test "$source_sha_before" = "$source_sha_after"
          while IFS= read -r -d '' relative; do
            relative="${relative#./}"
            destination="$GITHUB_WORKSPACE/$lesson/$relative"
            if [[ -e "$destination" ]]; then
              echo "::error::Refusing existing destination $destination"
              exit 1
            fi
            mkdir -p "$(dirname "$destination")"
            cp "$RUNNER_TEMP/svitlo-main/$lesson/$relative" "$destination"
          done < <(cd "$RUNNER_TEMP/svitlo-main/$lesson" && find . -type f ! -name 'lesson.yaml' -print0)
          test -f "$lesson/lesson.yaml"
          test "$(sha256sum "$lesson/lesson.yaml" | cut -d' ' -f1)" = "$source_sha_before"
          grep -q 'TODO (BLOCKER):' "$lesson/sections/safeSkyChoices/index.ts"
          git status --short
      - name: Upload verified draft handoff
        uses: actions/upload-artifact@v4
        with:
          name: lesson-659-stage6-draft-sources
          path: |
            content/astronomy/data/lessons/7/c042698a-de5b-5055-9e10-ff5621f80ed7/
            !content/astronomy/data/lessons/7/c042698a-de5b-5055-9e10-ff5621f80ed7/lesson.yaml
          retention-days: 7
          if-no-files-found: error
      - name: Commit verified generated files and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lesson-659-stage6-handoff.yml
          git add -A -- .github/workflows/lesson-659-stage6-handoff.yml content/astronomy/data/lessons/7/c042698a-de5b-5055-9e10-ff5621f80ed7
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              .github/workflows/lesson-659-stage6-handoff.yml|content/astronomy/data/lessons/7/c042698a-de5b-5055-9e10-ff5621f80ed7/*) ;;
              *) echo "::error::Unexpected staged path $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Materialize first sky Lesson Stage 6 bank-pending draft sources"
          git push origin HEAD:agent/astronomy-first-look-at-sky
