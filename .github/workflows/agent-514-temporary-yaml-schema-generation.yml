name: Agent 514 temporary YAML schema generation

on:
  push:
    branches:
      - agent/507-studio-yaml-workflows

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/507-studio-yaml-workflows
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build prerequisite packages
        run: |
          npm run package:build --workspace @svitlo/contracts
          npm run package:build --workspace @svitlo/engine
      - name: Generate and verify seven Engine YAML authoring schemas
        run: |
          npm run content:generate:yaml-schemas --workspace @svitlo/engine
          npm run content:check:yaml-schemas --workspace @svitlo/engine
          node --test shared/engine/scripts/generateYamlSchemas/generateYamlSchemas.spec.mjs
      - name: Commit generator-produced JSON Schemas
        run: |
          git add shared/engine/yaml-schemas/*.schema.json
          if git diff --cached --quiet; then
            echo 'Generator outputs already current'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Generate Engine YAML editor schemas from Zod'
            git push origin HEAD:agent/507-studio-yaml-workflows
          fi
