name: Electron Desktop quality
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'apps/desktop/**'
      - 'shared/adapters/electron/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Temporary one-time manual runner for the targeted Electron minimatch patch.
  # Remove once the npm-generated lockfile is committed and verified.
  refresh-electron-lockfile:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'maintenance/electron-toolchain'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/electron-toolchain
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Resolve the v27 candidate from npm without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify npm lockfile produces a clean installation
        run: npm ci --no-audit --no-fund
      - name: Check locked Electron dependency chains
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const pkg = lock.packages['node_modules/electron-builder'];
          if (pkg?.version !== '27.0.0-alpha.15') throw new Error('Unexpected resolved Electron Builder version');
          const matcher = lock.packages['node_modules/app-builder-lib/node_modules/minimatch'];
          if (matcher?.version !== '11.0.9') throw new Error('app-builder-lib must use patched minimatch@11.0.9; got: ' + matcher?.version);
          const forbidden = Object.entries(lock.packages)
            .filter(([path, value]) =>
              (path.endsWith('/node_modules/inflight') && value.version === '1.0.6') ||
              (path.endsWith('/node_modules/boolean') && value.version === '3.2.0') ||
              (path.endsWith('/node_modules/glob') && value.version?.startsWith('7.')) ||
              (path.endsWith('/node_modules/rimraf') && value.version?.startsWith('2.')))
            .map(([path, value]) => path + '@' + value.version);
          if (forbidden.length) throw new Error('Unresolved legacy dependencies: ' + forbidden.join(', '));
          console.log('Electron Builder:', pkg.version, '; patched matcher:', matcher.version, '; no legacy inflight/boolean/glob7/rimraf2');
          NODE
      - name: Check production audit (must be zero)
        run: npm audit --omit=dev
      - name: Report full audit and Electron package paths
        run: |
          npm audit --json > /tmp/svitlo-npm-audit.json || audit_status=$?
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const audit = JSON.parse(readFileSync('/tmp/svitlo-npm-audit.json', 'utf8'));
          console.log('Full npm audit:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          console.log('Advisories:', Object.keys(audit.vulnerabilities ?? {}).join(', '));
          const builderFindings = ['app-builder-lib', 'dmg-builder', 'electron-builder', 'electron-builder-squirrel-windows'];
          const remaining = builderFindings.filter(name => audit.vulnerabilities?.[name]);
          if (remaining.length) throw new Error('Electron Builder audit findings remain: ' + remaining.join(', '));
          NODE
          npm explain electron-builder
          npm explain minimatch
      - name: Preserve generated lockfile for diagnosing failed pushes
        uses: actions/upload-artifact@v4
        with:
          name: desktop-v27-npm-lockfile
          path: package-lock.json
          retention-days: 1
      - name: Commit npm-generated lockfile on the exact PR branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/maintenance/electron-toolchain'
          git diff --check
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Root lockfile already matches package manifest'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Regenerate Desktop packaging lockfile with npm'
            git push origin HEAD:refs/heads/maintenance/electron-toolchain
          fi
  desktop:
    # Full host/browser/generator suites only at review boundary or explicitly on demand.
    if: (github.event_name == 'workflow_dispatch' && github.ref_name != 'maintenance/electron-toolchain') || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Install workspaces
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Build adapter and renderer
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:build --workspace @svitlo/desktop
      - name: Typecheck adapter and Desktop
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- npm run code:check:types --workspace @svitlo/adapter-electron
          node scripts/ci/quietRun/quiet-run.mjs -- npm run code:check:types --workspace @svitlo/desktop
      - name: Validate Electron adapter resource confinement
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test --workspace @svitlo/adapter-electron
      - name: Lint Desktop
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run code:lint:check --workspace @svitlo/desktop
      - name: Validate Electron source import boundaries
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test --workspace @svitlo/desktop
      - name: Validate packaged resources
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:integration --workspace @svitlo/desktop
      - name: Run Electron smoke test under virtual display
        run: xvfb-run -a npm run test:smoke --workspace @svitlo/desktop
      - name: Package for Linux
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:pack:prepared --workspace @svitlo/desktop
      - name: Start the packaged Linux executable without network
        run: xvfb-run -a npm run test:packaged --workspace @svitlo/desktop
  installers:
    # Packaging distributions is expensive; run on Ready, not on Draft commits.
    if: (github.event_name == 'workflow_dispatch' && github.ref_name != 'maintenance/electron-toolchain') || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Install npm workspaces with restricted scripts
        run: npm ci --no-audit --no-fund
      - name: Build the actual target installer
        run: npm run app:pack:${{ matrix.platform }} --workspace @svitlo/desktop
      - name: Verify installer artifact was produced
        run: npm run test:installers --workspace @svitlo/desktop
