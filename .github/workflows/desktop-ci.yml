name: Electron Desktop quality
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'apps/desktop/**'
      - 'shared/adapters/electron/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Install workspaces
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Record production and full npm audit without masking advisory findings
        shell: bash
        run: |
          mkdir -p packaging-audit
          set +e
          npm audit --omit=dev --json > packaging-audit/production.json
          production_status=$?
          npm audit --json > packaging-audit/full.json
          full_status=$?
          set -e
          echo "production npm audit exit: $production_status; full npm audit exit: $full_status"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            for (const kind of ["production", "full"]) {
              const data = JSON.parse(readFileSync("packaging-audit/" + kind + ".json", "utf8"));
              if (!data.metadata?.vulnerabilities) throw Error(kind + " audit did not return advisory metadata");
              console.log(kind + " vulnerabilities: " + JSON.stringify(data.metadata.vulnerabilities));
              for (const [name, advisory] of Object.entries(data.vulnerabilities ?? {})) {
                console.log(kind + " " + name + " (" + advisory.severity + "): " +
                  JSON.stringify(advisory.via.map(v => typeof v === "string" ? v : v.name)));
              }
            }
          '
          if (( production_status > 1 || full_status > 1 )); then
            echo "::error::npm audit failed to query advisories"; exit 1
          fi
      - name: Report resolved packaging graph
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
            const entries = Object.keys(lock.packages);
            console.log("Resolved lockfile package entries: " + entries.length);
            for (const key of ["electron-builder", "app-builder-lib", "inflight", "glob", "rimraf", "boolean"]) {
              const found = entries.filter(entry => entry.endsWith("/" + key));
              console.log(key + ": " + found.map(entry => lock.packages[entry].version).join(", "));
              if (["electron-builder", "app-builder-lib"].includes(key) && found.length) process.exitCode = 1;
            }
          '
          for name in inflight glob rimraf @electron/get; do
            if npm ls "$name" --all --parseable > /dev/null 2>&1; then
              echo "Dependency provenance for $name"
              npm explain "$name"
            else
              echo "$name not present in installed dependency graph"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: svitlo-forge-npm-audits
          path: packaging-audit/*.json
          if-no-files-found: error
          retention-days: 1
      - name: Build adapter and renderer
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:build --workspace @svitlo/desktop
      - name: Typecheck adapter and Desktop
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- npm run code:check:types --workspace @svitlo/adapter-electron
          node scripts/ci/quietRun/quiet-run.mjs -- npm run code:check:types --workspace @svitlo/desktop
      - name: Validate Electron adapter resource confinement
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test --workspace @svitlo/adapter-electron
      - name: Lint Desktop
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run code:lint:check --workspace @svitlo/desktop
      - name: Validate Electron source import boundaries and Forge hooks
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test --workspace @svitlo/desktop
      - name: Validate published resources
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:integration --workspace @svitlo/desktop
      - name: Run Electron smoke under virtual display
        run: xvfb-run -a npm run test:smoke --workspace @svitlo/desktop
      - name: Create Forge unpacked Linux build
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:pack:prepared --workspace @svitlo/desktop
      - name: Verify unpacked executable
        run: node apps/desktop/scripts/verifyPackageArtifacts/verify-package-artifacts.mjs unpacked
      - name: Start packaged Linux executable offline
        run: xvfb-run -a npm run test:packaged --workspace @svitlo/desktop
      - name: Install Debian maker requirements
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg
      - name: Make Debian distribution
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:pack:make:prepared --workspace @svitlo/desktop
      - name: Verify Debian artifact
        run: node apps/desktop/scripts/verifyPackageArtifacts/verify-package-artifacts.mjs linux
      - uses: actions/upload-artifact@v4
        with:
          name: svitlo-forge-linux-deb
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
          retention-days: 1

  native-installers:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: macos-15
            platform: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Clean install
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Build Desktop from published content
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:build --workspace @svitlo/desktop
      - name: Check Desktop types
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run code:check:types --workspace @svitlo/desktop
      - name: Forge make (includes package)
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:pack:make:prepared --workspace @svitlo/desktop
      - name: Verify native maker artifacts
        run: node apps/desktop/scripts/verifyPackageArtifacts/verify-package-artifacts.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: svitlo-forge-${{ matrix.platform }}
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
          retention-days: 1
