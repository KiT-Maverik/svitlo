name: Informatics skills taxonomy quality

on:
  pull_request:
    paths:
      - 'learningApps/informatics/**'
      - 'shared/contracts/**'
      - 'shared/engine/**'
      - '.github/workflows/informatics-skills.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  informatics-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-workspaces.mjs
      - run: node scripts/check-skills-taxonomy-structure.mjs learningApps/informatics/data/skills
      - run: npm run build --workspace @svitlo/contracts
      - run: npm run build --workspace @svitlo/engine
      - run: npm run typecheck --workspace @svitlo/informatics
      - run: npm run build --workspace @svitlo/informatics
