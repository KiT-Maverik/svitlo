name: Temporary Course Stage 5 materialization 653
on:
  pull_request:
    paths:
      - '.github/workflows/course-materialize-653.yml'
permissions:
  contents: write
jobs:
  materialize:
    if: github.event.pull_request.number == 653 && github.event.pull_request.head.repo.full_name == 'KiT-Maverik/svitlo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Materialize reviewed Course plan
        run: node shared/engine/scripts/materializeCourseFlow/materialize-course-flow.mjs --package content/astronomy --course 1e79d8fc-2223-4fa7-bc64-70d8172d3e8b --write
      - name: Verify generated authoring sources
        run: node shared/engine/scripts/materializeCourseFlow/materialize-course-flow.mjs --package content/astronomy --course 1e79d8fc-2223-4fa7-bc64-70d8172d3e8b --check
      - name: Commit Stage 5 draft artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content/astronomy/data/courses/b/1e79d8fc-2223-4fa7-bc64-70d8172d3e8b/ content/astronomy/data/lessons/
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No artifacts generated'; exit 1; }
          git commit -m "Materialize reviewed astronomy course and lesson methodology handoffs"
          git push origin HEAD:refs/heads/course/astronomy-grade-one
