name: Temporary Course Stage 5 finalize 653
on:
  pull_request:
    paths:
      - '.github/workflows/course-materialize-653.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.pull_request.number == 653 && github.event.pull_request.head.repo.full_name == 'KiT-Maverik/svitlo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Recheck committed Stage 5 outputs and source provenance
        run: |
          set -eu
          source="content/astronomy/data/courses/b/1e79d8fc-2223-4fa7-bc64-70d8172d3e8b/course.yaml"
          test "$(git hash-object "$source")" = "9725baacca8b40638e8054673a193f825f182547"
          node shared/engine/scripts/materializeCourseFlow/materialize-course-flow.mjs --package content/astronomy --course 1e79d8fc-2223-4fa7-bc64-70d8172d3e8b --check
      - name: Finalize unchanged reviewed Course YAML
        run: |
          set -eu
          node shared/engine/scripts/materializeCourseFlow/materialize-course-flow.mjs --package content/astronomy --course 1e79d8fc-2223-4fa7-bc64-70d8172d3e8b --finalize
          test ! -e content/astronomy/data/courses/b/1e79d8fc-2223-4fa7-bc64-70d8172d3e8b/course.yaml
          test ! -e content/astronomy/data/courses/b/1e79d8fc-2223-4fa7-bc64-70d8172d3e8b/config.yaml
      - name: Commit only temporary Course YAML removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- content/astronomy/data/courses/b/1e79d8fc-2223-4fa7-bc64-70d8172d3e8b/course.yaml
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "Finalize reviewed astronomy course source materialization"
          git push origin HEAD:refs/heads/course/astronomy-grade-one
