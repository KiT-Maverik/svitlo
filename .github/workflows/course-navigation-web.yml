name: Course navigation Web verification

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'apps/web/src/app/**/course/**'
      - 'apps/web/src/lib/course*.ts'
      - 'apps/web/src/lib/course*.spec.ts'
      - 'apps/web/scripts/buildTestContent/**'
      - 'shared/adapters/nextjs/publishedCourseLesson.ts'
      - 'shared/engine/assemblers/courseToc/**'
      - 'shared/engine/generators/courses/**'
      - '.github/workflows/course-navigation-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-navigation-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Web / Course navigation and browser
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SVITLO_TEXTBOOK: web-fixture-alpha
      SVITLO_WEB_TEST_SELECTION: web-fixture-alpha
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Install pinned dependencies
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Run Web Vitest unit and component suites
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:components --workspace @svitlo/web
      - name: Check published Web content integration
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:integration --workspace @svitlo/web
      - name: Build Web application with the controlled fixture
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:build --workspace @svitlo/web
      - name: Install Chromium
        run: node scripts/ci/quietRun/quiet-run.mjs -- npx playwright install chromium
      - name: Exercise Course browser routes in desktop and mobile projects
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:e2e --workspace @svitlo/web -- course.e2e.spec.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: course-navigation-web-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
