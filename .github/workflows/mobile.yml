name: Mobile host checks

on:
  pull_request:
    types: [ready_for_review, reopened, synchronize]
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'shared/adapters/capacitor/**'
      - 'content/playground/src/components/scenes/sceneLoader.ts'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Browser, offline content and TypeScript
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @svitlo/mobile
      - run: npm run verify:bundle --workspace @svitlo/mobile
      - run: npm run typecheck --workspace @svitlo/mobile
      - run: npm run lint --workspace @svitlo/adapter-capacitor
      - run: npm run test --workspace @svitlo/mobile
      - run: npm exec --workspace @svitlo/mobile -- playwright install chromium --with-deps
      - run: npm run test:e2e --workspace @svitlo/mobile
  android:
    name: Android debug build
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build --workspace @svitlo/mobile
      - run: npm exec --workspace @svitlo/mobile -- cap sync android
      - name: Compile debug APK without signing
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
  ios:
    name: iOS Simulator build (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @svitlo/mobile
      - run: npm exec --workspace @svitlo/mobile -- cap sync ios
      - name: Build simulator application without code signing
        run: xcodebuild -workspace apps/mobile/ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
