name: Temporary Course 731 Stage 3 native validation
on:
  push:
    branches:
      - course/informatics-young-inventors
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted engine from develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: trusted
          persist-credentials: false
      - name: Checkout current PR commit as read-only input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: trusted/package-lock.json
      - name: Install trusted dependencies
        working-directory: trusted
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native stage 3-complete on pinned Course
        run: |
          echo "PR source SHA: $(git -C candidate rev-parse HEAD)"
          echo "Course source blob: $(git -C candidate hash-object content/informatics/data/courses/3/42316a78-f682-4ba2-a24a-5cc6191f2113/course.yaml)"
          node trusted/shared/engine/scripts/validateCourseFlow/validate-course-flow.mjs --file candidate/content/informatics/data/courses/3/42316a78-f682-4ba2-a24a-5cc6191f2113/course.yaml --stage 3-complete
