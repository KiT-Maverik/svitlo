# Temporary execution harness for the approved Skills taxonomy migration in PR #625.
# Remove this workflow and the tracked temp/ script after the migration has been verified.
name: One-time Skills taxonomy migration

on:
  push:
    branches:
      - new-skills
    paths:
      - 'temp/migrate-skills.mjs'
      - '.github/workflows/one-time-skills-taxonomy-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-skills-taxonomy-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/new-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact migration branch
        uses: actions/checkout@v4
        with:
          ref: new-skills
          fetch-depth: 0
          persist-credentials: true
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Validate codemod syntax
        run: node --check temp/migrate-skills.mjs
      - name: Run all-textbooks dry-run (no writes)
        run: |
          set -o pipefail
          node temp/migrate-skills.mjs --all | tee "$RUNNER_TEMP/skills-migration-dry-run.json"
      - name: Run checked migration
        run: |
          set -o pipefail
          node temp/migrate-skills.mjs --all --write | tee "$RUNNER_TEMP/skills-migration-write.json"
      - name: Check codemod idempotence
        run: |
          node temp/migrate-skills.mjs --all > "$RUNNER_TEMP/skills-migration-after.json"
          node -e '
            const r = require(process.env.RUNNER_TEMP + "/skills-migration-after.json");
            if (r.report.some(x => x.filesToWrite !== 0 || x.legacyFilesToRemove !== 0)) {
              console.error("Codemod is not idempotent:", JSON.stringify(r.report));
              process.exit(1);
            }
            console.log("Verified idempotence across", r.books, "textbooks");
          '
      - name: Validate resulting diff
        run: |
          git diff --check
          echo "Changed taxonomy files:"
          git status --short -- content/*/data/skills | wc -l
      - name: Commit migrated source files to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content/
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Migrate textbook Skills taxonomies to canonical source layout"
          git push origin HEAD:refs/heads/new-skills
