name: Production quality
# Full-repository validation is reserved for production promotion to main.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Production Quality / verify
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    concurrency:
      group: production-quality-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Scoped to this runner/job. No dist cache from Content Build or another run.
    env:
      SVITLO_CI_PACKAGE_BUILD_STATE: ${{ runner.temp }}/svitlo-production-package-builds.json
    steps:
      - uses: actions/checkout@v4
      - name: Test production source policy
        run: node --test scripts/ci/releaseSource/check-release-source.spec.mjs
      - name: Reject non-develop production source
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/ci/releaseSource/check-release-source.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run repo:check:packages
      - run: node scripts/ci/quietRun/quiet-run.mjs -- node --test scripts/ci/packageBuildReuse/package-build-reuse.spec.mjs
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run code:check:types
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm test
      # npm test already covers UI Kit and Math component suites; only Web and
      # Playground have separate component suites not included in npm test.
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:components --workspace @svitlo/playground
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:components --workspace @svitlo/web
      # npm test already executes IndexedDB integration tests with coverage.
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run code:lint:check
      # Global artifact verification reads distributions from this runner.
      # Content Build verifies its own full textbook matrix independently.
      - name: Build all distributable packages
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:build
      # All eligible textbook publishers and tarballs are verified by the
      # required Affected content / build, taxonomy and packaging check.
      - name: Verify compiled public package artifacts
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run repo:check:artifacts
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npx playwright install chromium
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:e2e
      - name: Report package build reuse
        if: always()
        run: node scripts/ci/packageBuildReuse/package-build-reuse.mjs --summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-quality-test-results
          path: |
            apps/web/test-results/
            content/math/test-results/
            apps/platform/test-results/
