name: Questions quality
# AGENT NOTE (temporary CI policy, 2026-10-30):
# Automatic PR and main-branch push runs are intentionally paused while active
# development is predominantly taxonomy/content authoring and agents push often.
# This full-repository suite is expensive and overlaps with focused checks.
# Keep the workflow available for manual runs in GitHub Actions.
# RE-ENABLE automatic pull_request and push-to-main triggers when regular
# executable-code development resumes, and ALWAYS before production releases.
# When re-enabling, optimize redundant builds/E2E and consider concurrency.
# Until then, agents changing executable code must run relevant local checks
# when they have a runnable environment; manual CI remains available.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run packages:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:components
      - run: npm run test:components --workspace @svitlo/math
      - run: npm run test:db:coverage
        if: ${{ !cancelled() }}
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
      - name: Verify compiled public package artifacts
        if: ${{ !cancelled() }}
        run: npm run packages:artifacts:check
      - run: npx playwright install chromium
        if: ${{ !cancelled() }}
      - name: Mathematics UI E2E (desktop and mobile)
        if: ${{ !cancelled() }}
        run: npm run test:e2e --workspace @svitlo/math
      - name: Light lesson and scene checkpoint E2E (Playground)
        if: ${{ !cancelled() }}
        run: npm run test:e2e --workspace @svitlo/playground -- src/data/howLightMoves/LightLesson.e2e.spec.ts src/data/howLightMoves/sections/theory/resources/scenes/Checkpoint/Checkpoint.e2e.spec.ts
      - name: Lesson page E2E (desktop and mobile)
        if: ${{ !cancelled() }}
        run: npm run test:e2e --workspace @svitlo/playground -- src/components/pages/Lesson/Lesson.e2e.spec.ts
      - run: npm run test:e2e
        if: ${{ !cancelled() }}
      - name: Platform catalog smoke E2E (desktop and mobile)
        if: ${{ !cancelled() }}
        run: npm run test:e2e:platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: questions-test-results
          path: |
            content/playground/test-results/
            content/math/test-results/
            frontend/platform/test-results/
