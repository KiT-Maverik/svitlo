name: Questions quality
# AGENT NOTE (temporary CI policy, 2026-10-30):
# Automatic PR and main-branch push runs are intentionally paused while active
# development is predominantly taxonomy/content authoring and agents push often.
# This full-repository suite is expensive and overlaps with focused checks.
# Keep the workflow available for manual runs in GitHub Actions.
# RE-ENABLE automatic pull_request and push-to-main triggers when regular
# executable-code development resumes, and ALWAYS before production releases.
# When re-enabling, optimize redundant builds/E2E and consider concurrency.
# Until then, agents changing executable code must run relevant local checks
# when they have a runnable environment; manual CI remains available.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run repo:check:packages
      - run: npm run code:check:types
      - run: npm test
      - run: npm run test:components
      - run: npm run test:components --workspace @svitlo/math
      - run: npm run test:integration:db:coverage --workspace @svitlo/indexdb
        if: ${{ !cancelled() }}
      - run: npm run code:lint:check
        if: ${{ !cancelled() }}
      - run: npm run app:build
        if: ${{ !cancelled() }}
      - name: Verify migrated textbook publishers and isolated ESM tarballs
        if: ${{ !cancelled() }}
        run: |
          for subject in math physics psychology philosophy language-literature; do
            (cd "content/$subject" && node --test ../../scripts/textbook-tooling/publishTextbook/test-publish.mjs)
            (cd "content/$subject" && node ../../scripts/textbook-tooling/checkPortability/check-portability.mjs)
          done
          (cd content/languages/ukrainian && node --test ../../../scripts/textbook-tooling/publishTextbook/test-publish.mjs)
          (cd content/languages/ukrainian && node ../../../scripts/textbook-tooling/checkPortability/check-portability.mjs)
      - name: Verify compiled public package artifacts
        if: ${{ !cancelled() }}
        run: npm run repo:check:artifacts
      - run: npx playwright install chromium
        if: ${{ !cancelled() }}
      - name: Universal Web lesson E2E (desktop and mobile)
        if: ${{ !cancelled() }}
        run: npm run test:e2e --workspace @svitlo/web
      - run: npm run test:e2e
        if: ${{ !cancelled() }}
      - name: Platform catalog smoke E2E (desktop and mobile)
        if: ${{ !cancelled() }}
        run: npm run test:e2e --workspace @svitlo/platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: questions-test-results
          path: |
            apps/web/test-results/
            content/math/test-results/
            apps/platform/test-results/
