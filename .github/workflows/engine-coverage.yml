name: Engine coverage gaps

# Diagnostic-only, on demand. Not a required gate for every PR commit.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open same-repository PR number to analyze'
        type: number
        required: true

permissions:
  contents: read

concurrency:
  group: engine-coverage-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Engine coverage / analyze
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       github.event.comment.body == '/engine-coverage' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - name: Resolve the open PR's exact commits
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == 'issue_comment' ]]; then
            actor=$(jq -r '.comment.user.login' "$GITHUB_EVENT_PATH")
            [[ "$actor" =~ ^[a-zA-Z0-9-]+$ ]] || { echo '::error::Invalid comment author'; exit 1; }
            access=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" --jq '.permission')
            [[ "$access" == 'write' || "$access" == 'maintain' || "$access" == 'admin' ]] || {
              echo '::error::Workflow requires repository write permission'; exit 1;
            }
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          head_repo=$(jq -r '.head.repo.full_name' <<< "$pr")
          state=$(jq -r '.state' <<< "$pr")
          head_sha=$(jq -r '.head.sha' <<< "$pr")
          branch=$(jq -r '.head.ref' <<< "$pr")
          [[ "$branch" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]*$ && "$branch" != *..* && "$branch" != *//* && "$branch" != */ && "$branch" != *.lock ]] || {
            echo '::error::Unsafe PR branch name'; exit 1;
          }
          base_sha=$(jq -r '.base.sha' <<< "$pr")
          [[ "$state" == "open" ]] || { echo "::error::PR must be open"; exit 1; }
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || {
            echo "::error::Only same-repository PRs are supported by this diagnostic workflow"
            exit 1
          }
          [[ "$head_sha" =~ ^[a-f0-9]{40}$ && "$base_sha" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::Invalid PR commit metadata"
            exit 1
          }
          {
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$head_sha"
            echo "branch=$branch"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the immutable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Engine
        run: npm run package:build --workspace @svitlo/engine

      - name: Validate the coverage filter and gap reporter
        run: node --test shared/engine/scripts/coverage/report.spec.mjs

      - name: Discover files changed by the PR
        shell: bash
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/engine-coverage-changed.z"

      - name: Run the Engine test suite and publish only gaps
        env:
          ENGINE_COVERAGE_SHA: ${{ steps.pr.outputs.head_sha }}
          ENGINE_COVERAGE_CHANGED_FILE: ${{ runner.temp }}/engine-coverage-changed.z
        run: npm run test:coverage --workspace @svitlo/engine

      - name: Stage only the sanitized gap diagnostics
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/engine-coverage-report"
          cp shared/engine/.coverage-engine/engine-gaps.md "$RUNNER_TEMP/engine-coverage-report/"
          cp shared/engine/.coverage-engine/engine-gaps.json "$RUNNER_TEMP/engine-coverage-report/"

      - name: Upload gap-only diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: engine-coverage-gaps-pr-${{ steps.pr.outputs.pr_number }}
          path: ${{ runner.temp }}/engine-coverage-report/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Engine coverage / publish to PR-scoped Agent CI Artifacts
    needs: analyze
    if: needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-ci-publish-${{ needs.analyze.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out pinned PR commit as data only
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.analyze.outputs.head_sha }}
          persist-credentials: true
      - name: Download gap-only report from this run
        uses: actions/download-artifact@v4
        with:
          name: engine-coverage-gaps-pr-${{ needs.analyze.outputs.pr_number }}
          path: report
      - name: Validate report and stage only coverage artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.analyze.outputs.pr_number }}
          TARGET_BRANCH: ${{ needs.analyze.outputs.branch }}
          HEAD_SHA: ${{ needs.analyze.outputs.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const repo = process.env.GITHUB_REPOSITORY;
          const pr = Number(process.env.PR_NUMBER);
          const sha = process.env.HEAD_SHA;
          const branch = process.env.TARGET_BRANCH;
          const latest = JSON.parse(execFileSync('gh', ['api', 'repos/' + repo + '/pulls/' + pr], { encoding: 'utf8' }));
          if (latest.state !== 'open' || latest.head?.repo?.full_name !== repo ||
              latest.head?.sha !== sha || latest.head?.ref !== branch)
            throw Error('PR head changed since read-only coverage run; rerun coverage');
          const names = fs.readdirSync('report').sort();
          if (names.join(',') !== 'engine-gaps.json,engine-gaps.md')
            throw Error('Unexpected coverage artifact entries');
          for (const name of names) {
            const stat = fs.lstatSync('report/' + name);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size > 4 * 1024 * 1024)
              throw Error('Unsafe coverage artifact: ' + name);
          }
          const data = JSON.parse(fs.readFileSync('report/engine-gaps.json', 'utf8'));
          const markdown = fs.readFileSync('report/engine-gaps.md', 'utf8');
          if (data.schemaVersion !== 1 || data.scope !== 'engine' || data.sourceCommit !== sha ||
              !Array.isArray(data.gaps) || data.gaps.length > 5000 ||
              ![data.targetFiles, data.filesWithGaps, data.notExecutedFiles, data.completeFiles]
                .every(n => Number.isSafeInteger(n) && n >= 0) ||
              data.filesWithGaps !== data.gaps.length ||
              !markdown.startsWith('<!-- svitlo-engine-coverage-gaps -->\n'))
            throw Error('Coverage artifact source/schema mismatch');
          for (const gap of data.gaps) {
            if (typeof gap.file !== 'string' || !/^shared\/engine\/[a-zA-Z0-9._/-]+\.(ts|mjs)$/.test(gap.file) ||
                gap.file.split('/').includes('..') || !['partial', 'not-executed'].includes(gap.status) ||
                !Array.isArray(gap.lines) || !Array.isArray(gap.branches) || !Array.isArray(gap.functions))
              throw Error('Unsafe coverage gap entry');
          }
          const dirs = ['.agent-ci-artifacts', '.agent-ci-artifacts/engine-coverage'];
          for (const dir of dirs) {
            if (fs.existsSync(dir) && (fs.lstatSync(dir).isSymbolicLink() || !fs.lstatSync(dir).isDirectory()))
              throw Error('Unsafe Agent CI Artifacts path');
            fs.mkdirSync(dir, { recursive: true });
          }
          // The read-only job may execute untrusted PR code: render the Markdown
          // from verified JSON here instead of copying PR-controlled Markdown.
          const escape = value => String(value ?? '').slice(0, 180)
            .replace(/[\x00-\x1f\x7f]/g, ' ')
            .replace(/[<>&*_[\]()!#|\x60]/g, ch => '\\' + ch);
          const lines = ['# Engine coverage gaps', '',
            'Analyzed PR head: ' + sha, '',
            '| Files considered | With gaps | Not executed | Fully covered |',
            '| ---: | ---: | ---: | ---: |',
            '| ' + data.targetFiles + ' | ' + data.filesWithGaps + ' | ' +
              data.notExecutedFiles + ' | ' + data.completeFiles + ' |', '',
            'Only missing coverage is reported; this is not a test-quality assertion.', ''];
          for (const gap of data.gaps.slice(0, 100)) {
            const link = 'https://github.com/' + repo + '/blob/' + sha + '/' +
              gap.file.split('/').map(encodeURIComponent).join('/');
            const locations = gap.status === 'not-executed' ? 'Not executed' :
              'lines ' + gap.lines.filter(Number.isSafeInteger).join(', ') +
              '; branches ' + gap.branches.filter(Number.isSafeInteger).join(', ');
            lines.push('- [' + escape(gap.file) + '](' + link + ') — ' + locations +
              (gap.changed === true ? ' (changed)' : ''));
          }
          if (data.gaps.length > 100)
            lines.push('Additional gaps in JSON: ' + (data.gaps.length - 100));
          const safeMarkdown = lines.join('\n').slice(0, 30000) + '\n';
          for (const name of names) {
            const dest = '.agent-ci-artifacts/engine-coverage/' + name;
            if (fs.existsSync(dest) && !fs.lstatSync(dest).isFile())
              throw Error('Unsafe existing coverage artifact');
            if (name === 'engine-gaps.md') fs.writeFileSync(dest, safeMarkdown);
            else fs.copyFileSync('report/' + name, dest);
          }
          NODE
      - name: Commit coverage result to the source PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ needs.analyze.outputs.branch }}
          HEAD_SHA: ${{ needs.analyze.outputs.head_sha }}
          PR_NUMBER: ${{ needs.analyze.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          test "$(jq -r '.head.sha' <<<"$latest")" = "$HEAD_SHA"
          test "$(jq -r '.head.ref' <<<"$latest")" = "$TARGET_BRANCH"
          git add -- .agent-ci-artifacts/engine-coverage/
          if git diff --cached --quiet; then
            echo 'Engine coverage artifact is unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(agent-ci): save Engine coverage gaps'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
