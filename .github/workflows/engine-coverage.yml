name: Engine coverage gaps

# Diagnostic-only, on demand. Not a required gate for every PR commit.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open same-repository PR number to analyze'
        type: number
        required: true

permissions:
  contents: read

concurrency:
  group: engine-coverage-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Engine coverage / analyze
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       github.event.comment.body == '/engine-coverage' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - name: Resolve the open PR's exact commits
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == 'issue_comment' ]]; then
            actor=$(jq -r '.comment.user.login' "$GITHUB_EVENT_PATH")
            [[ "$actor" =~ ^[a-zA-Z0-9-]+$ ]] || { echo '::error::Invalid comment author'; exit 1; }
            access=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" --jq '.permission')
            [[ "$access" == 'write' || "$access" == 'maintain' || "$access" == 'admin' ]] || {
              echo '::error::Workflow requires repository write permission'; exit 1;
            }
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          head_repo=$(jq -r '.head.repo.full_name' <<< "$pr")
          state=$(jq -r '.state' <<< "$pr")
          head_sha=$(jq -r '.head.sha' <<< "$pr")
          branch=$(jq -r '.head.ref' <<< "$pr")
          [[ "$branch" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]*$ && "$branch" != *..* && "$branch" != *//* && "$branch" != */ && "$branch" != *.lock ]] || {
            echo '::error::Unsafe PR branch name'; exit 1;
          }
          base_sha=$(jq -r '.base.sha' <<< "$pr")
          [[ "$state" == "open" ]] || { echo "::error::PR must be open"; exit 1; }
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || {
            echo "::error::Only same-repository PRs are supported by this diagnostic workflow"
            exit 1
          }
          [[ "$head_sha" =~ ^[a-f0-9]{40}$ && "$base_sha" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::Invalid PR commit metadata"
            exit 1
          }
          {
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$head_sha"
            echo "branch=$branch"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the immutable PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned workspace dependencies
        run: npm ci --silent --ignore-scripts --no-audit --no-fund

      - name: Build Engine
        run: npm run package:build --workspace @svitlo/engine

      - name: Validate the coverage filter and gap reporter
        run: node --test shared/engine/scripts/coverage/report.spec.mjs

      - name: Discover files changed by the PR
        shell: bash
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/engine-coverage-changed.z"

      - name: Run the Engine test suite and publish only gaps
        env:
          ENGINE_COVERAGE_SHA: ${{ steps.pr.outputs.head_sha }}
          ENGINE_COVERAGE_CHANGED_FILE: ${{ runner.temp }}/engine-coverage-changed.z
        run: npm run test:coverage --workspace @svitlo/engine

      - name: Stage only the sanitized gap diagnostics
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/engine-coverage-report"
          cp shared/engine/.coverage-engine/engine-gaps.json "$RUNNER_TEMP/engine-coverage-report/"

      - name: Validate and bind the gap report to this run
        env:
          SOURCE_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = process.env.RUNNER_TEMP + '/engine-coverage-report/engine-gaps.json';
          const raw = fs.readFileSync(file);
          if (raw.length > 4 * 1024 * 1024) throw Error('Coverage report exceeds 4 MiB');
          const report = JSON.parse(raw.toString('utf8'));
          if (report.schemaVersion !== 1 || report.scope !== 'engine' ||
              report.sourceCommit !== process.env.SOURCE_SHA ||
              !Array.isArray(report.gaps) || report.gaps.length > 5000 ||
              ![report.targetFiles, report.filesWithGaps, report.notExecutedFiles, report.completeFiles]
                .every(value => Number.isSafeInteger(value) && value >= 0) ||
              report.filesWithGaps !== report.gaps.length) {
            throw Error('Invalid Engine coverage source/schema');
          }
          for (const gap of report.gaps) {
            if (typeof gap.file !== 'string' ||
                !gap.file.startsWith('shared/engine/') ||
                !/([.]ts|[.]mjs)$/.test(gap.file) ||
                gap.file.split('/').includes('..') ||
                !['partial', 'not-executed'].includes(gap.status) ||
                ![gap.lines, gap.branches, gap.functions].every(Array.isArray)) {
              throw Error('Unsafe Engine coverage gap entry');
            }
          }
          report.runId = Number(process.env.GITHUB_RUN_ID);
          report.pr = Number(process.env.PR_NUMBER);
          report.request = 'engine-coverage';
          report.complete = true;
          const output = JSON.stringify(report) + String.fromCharCode(10);
          if (Buffer.byteLength(output) > 4 * 1024 * 1024)
            throw Error('Coverage report exceeds size limit');
          fs.writeFileSync(file, output);
          NODE
      - name: Upload gap-only diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: engine-coverage-gaps-pr-${{ steps.pr.outputs.pr_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/engine-coverage-report/engine-gaps.json
          if-no-files-found: error
          retention-days: 1
