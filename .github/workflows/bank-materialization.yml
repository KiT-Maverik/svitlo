name: Materialize reviewed typed Questions or Flashcards from PR command

# Deploy to default branch before enabling real PR commands.
# Never execute candidate PR code with privileged credentials.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository Draft Questions or Flashcards PR
        type: number
        required: true
      bank:
        description: Assessment bank to materialize
        type: choice
        options: [questions, flashcards]
        required: true

permissions: {}

concurrency:
  group: bank-stage5-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  typed_resolve:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (github.event.comment.body == '/questions materialize' ||
         github.event.comment.body == '/flashcards materialize')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      meta: ${{ steps.authorize.outputs.meta }}
      pr: ${{ steps.authorize.outputs.pr }}
      head: ${{ steps.authorize.outputs.head }}
      branch: ${{ steps.authorize.outputs.branch }}
    steps:
      - name: Checkout trusted Bank Stage 3 authorization
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact source SHA and accepted current-HEAD review evidence
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          BANK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ci/bankMaterialization/bank-typed-gate.mjs resolve

  typed_analyze:
    needs: typed_resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted Engine and CLI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout pinned Bank PR for isolated execution, without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.typed_resolve.outputs.head }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Bind exact candidate SHA to its local non-remote branch
        env:
          BANK_BRANCH: ${{ needs.typed_resolve.outputs.branch }}
          BANK_HEAD: ${{ needs.typed_resolve.outputs.head }}
        run: git -C candidate checkout -B "$BANK_BRANCH" "$BANK_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: trusted/package-lock.json
      - name: Install and build trusted Engine
        working-directory: trusted
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- npm ci --ignore-scripts --no-audit --no-fund
          node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build --workspace @svitlo/engine
      - name: Pull pinned isolated worker image
        run: docker pull node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
      - name: Execute one reviewed Bank entrypoint in isolated worker
        env:
          BANK_META_B64: ${{ needs.typed_resolve.outputs.meta }}
          BANK_CANDIDATE_ROOT: candidate
          BANK_REPORT: ${{ runner.temp }}/typed-bank-materialization/report.json
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node trusted/scripts/ci/quietRun/quiet-run.mjs -- node trusted/scripts/ci/bankMaterialization/bank-typed-materialization.mjs analyze
      - name: Upload SHA-pinned verified typed source manifest
        uses: actions/upload-artifact@v4
        with:
          name: typed-bank-stage5-${{ needs.typed_resolve.outputs.pr }}-${{ github.run_id }}
          path: ${{ runner.temp }}/typed-bank-materialization/report.json
          if-no-files-found: error
          retention-days: 7

  typed_publish:
    needs: [typed_resolve, typed_analyze]
    if: needs.typed_analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout default-branch trusted publisher only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download isolated checksummed typed source manifest
        uses: actions/download-artifact@v4
        with:
          name: typed-bank-stage5-${{ needs.typed_resolve.outputs.pr }}-${{ github.run_id }}
          path: report
      - name: Reauthorize, verify bounded files and CAS publish
        env:
          GH_TOKEN: ${{ github.token }}
          BANK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BANK_META_B64: ${{ needs.typed_resolve.outputs.meta }}
          BANK_REPORT: report/report.json
        run: node trusted/scripts/ci/quietRun/quiet-run.mjs -- node trusted/scripts/ci/bankMaterialization/bank-typed-materialization.mjs publish
