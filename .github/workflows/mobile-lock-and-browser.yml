name: Bootstrap mobile npm lockfile and validate React bundle

on:
  push:
    branches:
      - feature/capacitor-mobile-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  npm-and-web:
    if: "!contains(github.event.head_commit.message, 'Synchronize mobile npm lockfile')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/capacitor-mobile-app
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized workspace lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize mobile npm lockfile"
            git push origin HEAD:feature/capacitor-mobile-app
          fi
      - run: npm ci
      - run: npm run build --workspace @svitlo/mobile
      - run: npm run verify:bundle --workspace @svitlo/mobile
      - run: npm run typecheck --workspace @svitlo/mobile
      - run: npm run test --workspace @svitlo/mobile
      - run: npm exec --workspace @svitlo/mobile -- playwright install chromium
      - run: npm run test:e2e --workspace @svitlo/mobile
