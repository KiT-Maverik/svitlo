name: FastGate

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.json'
      - 'scripts/**'
      - '.agent-ci-artifacts/**'
      - '.github/workflows/**'
      - '.github/labeler.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: FastGate / verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse temporary agent artifacts in a main-bound PR
        run: |
          if [ -d .agent-ci-artifacts ]; then
            echo '::error::Remove .agent-ci-artifacts/ before merging into main.'
            exit 1
          fi
      - name: Validate GitHub label catalogue and matchers
        run: node .github/scripts/verify-labels.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Scoped quality checks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/run-fast-gate.mjs "$BASE_SHA" "$HEAD_SHA"
      - name: Manually requested FastGate
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/run-fast-gate.mjs --all
