name: FastGate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: FastGate / verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse successful required result on description edits
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRED_CHECK_NAME: FastGate / verify
        run: node scripts/ci/requiredCheckReuse/required-check-reuse.mjs
      - name: Detect whether this PR needs typechecks
        id: scope
        if: steps.reuse.outputs.reuse != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            changed_files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
            # All JS/TS changes, including scripts, must reach the stub reference guard.
            if grep -Eq '(^package(-lock)?\.json$|^tsconfig[^/]*\.json$|^(apps|content|shared|backend)/.*\.json$|(^|.*/)[^/]+\.(ts|tsx|mts|cts|js|mjs|cjs)$)' <<< "$changed_files"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "No changed TypeScript workspace or dependency config; FastGate has no typechecks to run."
            fi
          fi

      - name: Explain lightweight Draft validation
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: echo 'Draft PR - typechecks are deferred until Ready for review or explicit workflow_dispatch.'

      - uses: actions/setup-node@v5
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
        with:
          node-version: '26'
          cache: npm

      - name: Install pinned dependencies for typechecking
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund

      - name: Verify symbol-aware Course stub guard
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
        run: node --test --test-reporter=dot scripts/ci/checkStubImports/check-stub-imports.spec.mjs

      - name: Reject newly introduced Course stub imports and uses
        if: steps.reuse.outputs.reuse != 'true' && steps.scope.outputs.run == 'true' && github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/checkStubImports/check-stub-imports.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Typecheck changed workspaces and public API consumers
        if: steps.reuse.outputs.reuse != 'true' && github.event_name == 'pull_request' && !github.event.pull_request.draft && steps.scope.outputs.run == 'true'
        env:
          SVITLO_WEB_TEST_SELECTION: web-fixture-alpha
          SVITLO_CI_BUILD_TELEMETRY: ${{ runner.temp }}/svitlo-fastgate-builds.jsonl
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" == "develop" ]]; then
            node scripts/runFastGate/run-fast-gate.mjs "$BASE_SHA" "$HEAD_SHA"
          else
            node scripts/runFastGate/run-fast-gate.mjs "$BASE_SHA" "$HEAD_SHA" --changed-only
          fi

      - name: Manually requested typechecks
        if: github.event_name == 'workflow_dispatch' && steps.scope.outputs.run == 'true'
        env:
          SVITLO_WEB_TEST_SELECTION: web-fixture-alpha
          SVITLO_CI_BUILD_TELEMETRY: ${{ runner.temp }}/svitlo-fastgate-builds.jsonl
        run: node scripts/runFastGate/run-fast-gate.mjs --all

      - name: Summarize observed FastGate dependency builds
        if: always() && steps.scope.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
        run: node scripts/ci/buildTelemetry/summarize-builds.mjs --file "${{ runner.temp }}/svitlo-fastgate-builds.jsonl"

      - name: 'Validated Ready scope v1 | ${{ github.event.pull_request.number }} | ${{ github.event.pull_request.head.ref }} | ${{ github.event.pull_request.head.sha }} | ${{ github.event.pull_request.base.ref }} | ${{ github.event.pull_request.base.sha }} | ${{ github.sha }}'
        if: success() && github.event_name == 'pull_request' && !github.event.pull_request.draft
        run: echo 'Exact Ready validation scope verified.'
