name: FastGate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: FastGate / verify
    # An edited PR event also fires for description-only changes. Recheck only
    # when the target branch changes; new commits and Ready use other events.
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect whether this PR needs typechecks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            changed_files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
            if grep -Eq '(^package(-lock)?\.json$|^tsconfig[^/]*\.json$|^(apps|content|shared|backend)/.*\.(ts|tsx|mts|cts|js|mjs|cjs|json)$)' <<< "$changed_files"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "No changed TypeScript workspace or dependency config; FastGate has no typechecks to run."
            fi
          fi

      - name: Explain lightweight Draft validation
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: echo 'Draft PR - typechecks are deferred until Ready for review or explicit workflow_dispatch.'

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies for typechecking
        if: steps.scope.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund

      - name: Typecheck changed workspaces and public API consumers
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft && steps.scope.outputs.run == 'true'
        env:
          SVITLO_WEB_TEST_SELECTION: web-fixture-alpha
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" == "develop" ]]; then
            node scripts/runFastGate/run-fast-gate.mjs "$BASE_SHA" "$HEAD_SHA"
          else
            node scripts/runFastGate/run-fast-gate.mjs "$BASE_SHA" "$HEAD_SHA" --changed-only
          fi

      - name: Manually requested typechecks
        if: github.event_name == 'workflow_dispatch' && steps.scope.outputs.run == 'true'
        env:
          SVITLO_WEB_TEST_SELECTION: web-fixture-alpha
        run: node scripts/runFastGate/run-fast-gate.mjs --all
