name: Engine generators

on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/engine/generators/**'
      - 'shared/engine/index.ts'
      - 'shared/engine/package.json'
      - 'shared/engine/tsconfig*.json'
      - 'scripts/generators/data/**'
      - 'scripts/textbook-tooling/**'
      - 'package.json'
      - '.github/workflows/engine-generators.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-generators-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Contracts
        run: npm run package:build --workspace @svitlo/contracts
      - name: Typecheck and execute Engine generator tests
        run: npm test --workspace @svitlo/engine

  generator-cli-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Engine dependencies
        run: |
          npm run package:build --workspace @svitlo/contracts
          npm run package:build --workspace @svitlo/engine
      - name: Generate and verify Playground Lesson publications
        run: |
          npm run content:generate:lesson-props -- --package content/playground --write
          npm run content:check:lesson-props -- --package content/playground --check
      - name: Generate and verify Playground Course publications
        run: |
          npm run content:generate:course-props -- --package content/playground --write
          npm run content:check:course-props -- --package content/playground --check
