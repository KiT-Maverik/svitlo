name: Engine generators

on:
  pull_request:
    # Generator and materialization changes also arrive through nested agent PRs
    # targeting integration/<name>; the path filter controls the scope.
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'shared/engine/generators/**'
      - 'shared/engine/assemblers/courseToc/**'
      - 'scripts/ci/courseMaterialization/**'
      - 'scripts/ci/bankMaterialization/**'
      - 'scripts/ci/lessonMaterialization/**'
      - 'scripts/ci/directMaterialization/**'
      - 'scripts/ci/requiredCheckReuse/**'
      - 'scripts/ci/draftCiPolicy/**'
      - 'scripts/ci/productionQuality/**'
      - 'scripts/ci/releaseSource/**'
      - '.github/workflows/fast-gate.yml'
      - '.github/workflows/production-quality.yml'
      - '.github/workflows/lesson-materialization.yml'
      - 'shared/engine/scripts/generateQuestionReviewArtifacts/**'
      - '.github/workflows/bank-materialization.yml'
      - 'shared/engine/scripts/sceneScaffolding/**'
      - 'shared/engine/index.ts'
      - 'shared/engine/package.json'
      - 'shared/engine/tsconfig*.json'
      - 'shared/engine/scripts/generateLessonProps/**'
      - 'shared/engine/scripts/generateCourseProps/**'
      - 'shared/engine/scripts/generateCourseReviewArtifacts/**'
      - 'shared/engine/scripts/generateFlashcardReviewArtifacts/**'
      - 'scripts/generateTranslationReviewArtifacts/**'
      - 'shared/engine/scripts/loadAuthoredConfigurators/**'
      - 'shared/engine/scripts/generatorCliIntegration/**'
      - 'scripts/textbook-tooling/**'
      - 'studio/generator-requirements.md'
      - 'package.json'
      - '.github/workflows/engine-generators.yml'
  workflow_dispatch:
    inputs:
      ci_mode:
        description: 'Normal generator checks or manual Engine build-once/build-each benchmark'
        required: false
        type: choice
        options:
          - standard
          - build-once-engine
          - build-each-engine
        default: standard
  workflow_call:

permissions:
  contents: read

concurrency:
  group: engine-generators-${{ github.event.pull_request.number || github.ref }}${{ inputs.ci_mode == 'build-once-engine' && '-experiment' || inputs.ci_mode == 'build-each-engine' && '-baseline' || '' }}
  cancel-in-progress: true

jobs:
  publisher-isolation:
    name: Publisher isolation / no npm dependencies
    if: ${{ inputs.ci_mode != 'build-once-engine' && inputs.ci_mode != 'build-each-engine' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: Prove typed Lesson and bank publishers load without installed packages
        run: node --test scripts/ci/lessonMaterialization/lesson-typed-publish.spec.mjs scripts/ci/bankMaterialization/bank-typed-materialization.spec.mjs
      - name: Verify static six-command dispatch, trust boundaries and Course dependency inventory
        run: node --test scripts/ci/directMaterialization/materialization-workflow-security.spec.mjs scripts/ci/directMaterialization/trusted-draft.spec.mjs scripts/ci/directMaterialization/course-dependency-isolation.spec.mjs

  ci-policy:
    name: Required check reuse and Draft policy
    if: ${{ inputs.ci_mode != 'build-once-engine' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - run: node --test scripts/ci/requiredCheckReuse/*.spec.mjs scripts/ci/draftCiPolicy/*.spec.mjs scripts/ci/productionQuality/production-quality.spec.mjs scripts/ci/productionQuality/engine-artifact-guard.spec.mjs scripts/ci/releaseSource/check-release-source.spec.mjs

  generator-tests:
    # Full host/browser/generator suites only at review boundary or explicitly on demand.
    if: >-
      inputs.ci_mode != 'build-once-engine' &&
      (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Build Engine
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build --workspace @svitlo/engine
      - name: Verify pinned Prettier import ordering without rewriting sources
        run: npm run test:import-format
      - name: Typecheck Engine and compile generator tests
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- npm run code:check:types --workspace @svitlo/engine
          node scripts/ci/quietRun/quiet-run.mjs -- npx tsc -p shared/engine/tsconfig.test.json
      - name: Run targeted generator and CLI regression tests
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- node --test \
            shared/engine/.test-build/generators/lessons/*.spec.js \
            shared/engine/generators/courses/publishCourseData.spec.mjs \
            shared/engine/generators/skills/publishSkillTree.spec.mjs \
            shared/engine/scripts/generateSkills/prepareSkillsPublication.spec.mjs \
            shared/engine/scripts/generateLessonProps/generateLessonProps.spec.mjs \
            shared/engine/scripts/generateCourseProps/generateCourseProps.spec.mjs \
            shared/engine/.test-build/assemblers/assembleCourseLesson/assembleCourseTree.spec.js \
            shared/engine/.test-build/assemblers/courseToc/*.spec.js \
            shared/engine/scripts/generateCourseReviewArtifacts/generate-course-review-artifacts.spec.mjs \
            shared/engine/scripts/generatorCliIntegration/generatorCliIntegration.spec.mjs \
            shared/engine/scripts/sceneScaffolding/sceneScaffolding.spec.mjs \
            shared/engine/scripts/generateQuestionReviewArtifacts/*.spec.mjs \
            shared/engine/scripts/generateFlashcardReviewArtifacts/generate-flashcard-review-artifacts.spec.mjs \
            scripts/generateTranslationReviewArtifacts/generate-translation-review-artifacts.spec.mjs \
            shared/engine/scripts/generateAssessmentResources/generateAssessmentResources.spec.mjs \
            shared/engine/scripts/loadAuthoredConfigurators/resolveMaterializedEntrypoint.spec.mjs \
            shared/engine/scripts/loadAuthoredConfigurators/typedEditorialDrafts.spec.mjs \
            shared/engine/generators/materializers/course/*.spec.mjs \
            shared/engine/generators/materializers/module/*.spec.mjs \
            shared/engine/generators/materializers/chapter/*.spec.mjs \
            shared/engine/generators/materializers/lesson/*.spec.mjs \
            shared/engine/.test-build/generators/materializers/directMaterialization/*.spec.js \
            shared/engine/.test-build/generators/materializers/lesson/*.spec.js \
            shared/engine/.test-build/generators/materializers/scene/*.spec.js \
            shared/engine/.test-build/generators/materializers/episode/*.spec.js \
            shared/engine/.test-build/generators/materializers/questStage/*.spec.js \
            shared/engine/.test-build/generators/materializers/questTask/*.spec.js \
            scripts/textbook-tooling/generateScenes/generate-scenes.spec.mjs \
            shared/engine/.test-build/generators/materializers/bankSource/*.spec.js \
            scripts/textbook-tooling/verifyAssessmentSelections/verifyAssessmentSelections.spec.mjs \
            scripts/textbook-tooling/buildTextbook/stageTextbookAssets.spec.mjs

      - name: Test typed Bank source and PR-command security
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- node --test \
            scripts/ci/bankMaterialization/bank-typed-materialization.spec.mjs \
            scripts/ci/bankMaterialization/bank-typed-block-evidence.spec.mjs

      - name: Test typed Lesson Stage 6 source and PR-command security
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- node --test \
            scripts/ci/lessonMaterialization/lesson-typed-materialization.spec.mjs \
            scripts/ci/lessonMaterialization/lesson-typed-publish.spec.mjs

      - name: Verify reserved Course parent ownership and AST handoff checks
        run: node scripts/ci/quietRun/quiet-run.mjs -- node --test scripts/ci/directMaterialization/reserved-parent-slot.spec.mjs

      - name: Check formatting of typed Course Flow sources
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- npx prettier --check \
            studio/skills/course-workflow/*.md \
            studio/docs/entities/course.md \
            studio/docs/architecture/README.md \
            shared/engine/scripts/README.md \
            scripts/ci/courseMaterialization/README.md \
            scripts/ci/courseMaterialization/*.mjs \
            shared/engine/scripts/generateFlashcardReviewArtifacts/*.mjs \
            shared/engine/scripts/generateFlashcardReviewArtifacts/README.md \
            shared/engine/configurators/courses/defineCourse/defineCourse.schemas.ts \
            shared/engine/configurators/courses/defineCourse/courseHierarchy.spec.ts \
            package.json shared/engine/package.json

  # Manual-only experiment. Existing workflow is already registered on develop,
  # so dispatch against this feature ref selects these branch-defined jobs.
  # No required Production Quality job/status or regular generator work is changed.
  experiment-engine-producer:
    name: Experiment / Engine build producer
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_mode == 'build-once-engine' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Install pinned dependencies
        run: |
          start=$(date +%s)
          npm ci --no-audit --no-fund
          echo "- Producer npm ci: $(($(date +%s) - start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile Engine exactly once
        run: |
          start=$(date +%s)
          npm run package:build --workspace @svitlo/engine
          echo "- Producer Engine package:build: $(($(date +%s) - start))s (1 invocation)" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate compiled exports and measure artifact contents
        run: |
          start=$(date +%s)
          node scripts/ci/productionQuality/engine-artifact-guard.mjs inspect
          echo "- Producer export validation: $(($(date +%s) - start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Mark upload start
        run: echo "ARTIFACT_UPLOAD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Upload complete Engine dist for this run
        uses: actions/upload-artifact@v6
        with:
          name: experiment-engine-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: shared/engine/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Report upload duration
        run: |
          echo "- Producer artifact upload: $(($(date +%s) - ARTIFACT_UPLOAD_STARTED))s" >> "$GITHUB_STEP_SUMMARY"

  experiment-consumer-types:
    name: Experiment / UI Kit TypeScript consumer
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_mode == 'build-once-engine' }}
    needs: experiment-engine-producer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Install pinned dependencies independently
        run: |
          start=$(date +%s)
          npm ci --no-audit --no-fund
          echo "- TypeScript consumer npm ci: $(($(date +%s) - start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Require Engine dist to be absent before download
        run: test ! -e shared/engine/dist
      - name: Mark download start
        run: echo "ARTIFACT_DOWNLOAD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Download producer artifact into Engine public-export location
        uses: actions/download-artifact@v6
        with:
          name: experiment-engine-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: shared/engine/dist/
      - name: Verify download and snapshot complete dist tree
        id: artifact
        run: |
          echo "- TypeScript consumer artifact download: $(($(date +%s) - ARTIFACT_DOWNLOAD_STARTED))s" >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/productionQuality/engine-artifact-guard.mjs snapshot "$RUNNER_TEMP/engine-dist-before.json"
      - name: Typecheck the compiled Engine consumer
        run: |
          start=$(date +%s)
          npm run code:check:types --workspace @svitlo/ui-kit
          echo "- UI Kit TypeScript check: $(($(date +%s) - start))s (0 Engine package:build invocations)" >> "$GITHUB_STEP_SUMMARY"
      - name: Reject any consumer Engine dist rewrite
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        run: node scripts/ci/productionQuality/engine-artifact-guard.mjs verify "$RUNNER_TEMP/engine-dist-before.json"

  experiment-consumer-tests:
    name: Experiment / Engine unit test consumer
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_mode == 'build-once-engine' }}
    needs: experiment-engine-producer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Install pinned dependencies independently
        run: |
          start=$(date +%s)
          npm ci --no-audit --no-fund
          echo "- Unit consumer npm ci: $(($(date +%s) - start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Require Engine dist to be absent before download
        run: test ! -e shared/engine/dist
      - name: Mark download start
        run: echo "ARTIFACT_DOWNLOAD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Download producer artifact into Engine public-export location
        uses: actions/download-artifact@v6
        with:
          name: experiment-engine-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: shared/engine/dist/
      - name: Verify download and snapshot complete dist tree
        id: artifact
        run: |
          echo "- Unit consumer artifact download: $(($(date +%s) - ARTIFACT_DOWNLOAD_STARTED))s" >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/productionQuality/engine-artifact-guard.mjs snapshot "$RUNNER_TEMP/engine-dist-before.json"
      - name: Run complete Engine unit suite without rebuild-triggering pretest
        run: |
          start=$(date +%s)
          npm --ignore-scripts run test --workspace @svitlo/engine
          echo "- Engine test script: $(($(date +%s) - start))s (0 Engine package:build invocations)" >> "$GITHUB_STEP_SUMMARY"
      - name: Reject any consumer Engine dist rewrite
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        run: node scripts/ci/productionQuality/engine-artifact-guard.mjs verify "$RUNNER_TEMP/engine-dist-before.json"

  # Manual control: two independent consumers start in parallel and each builds
  # Engine locally. No producer, dependency edge or artifact transfer.

  experiment-baseline-types:
    name: Experiment baseline / UI Kit TypeScript (own Engine build)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_mode == 'build-each-engine' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Install pinned dependencies independently
        run: |
          start=$(date +%s)
          npm ci --no-audit --no-fund
          echo "- Baseline types npm ci: $(($(date +%s) - start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Require Engine dist to be absent before local build
        run: test ! -e shared/engine/dist
      - name: Compile Engine locally
        run: |
          start=$(date +%s)
          npm run package:build --workspace @svitlo/engine
          echo "- Baseline types Engine package:build: $(($(date +%s) - start))s (1 invocation)" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate and snapshot locally compiled Engine
        id: artifact
        run: node scripts/ci/productionQuality/engine-artifact-guard.mjs snapshot "$RUNNER_TEMP/engine-dist-before.json"
      - name: Typecheck the compiled Engine consumer
        run: |
          start=$(date +%s)
          npm run code:check:types --workspace @svitlo/ui-kit
          echo "- Baseline types check: $(($(date +%s) - start))s (0 additional Engine package:build invocations)" >> "$GITHUB_STEP_SUMMARY"
      - name: Reject any consumer Engine dist rewrite
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        run: node scripts/ci/productionQuality/engine-artifact-guard.mjs verify "$RUNNER_TEMP/engine-dist-before.json"

  experiment-baseline-tests:
    name: Experiment baseline / Engine unit tests (own Engine build)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_mode == 'build-each-engine' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Install pinned dependencies independently
        run: |
          start=$(date +%s)
          npm ci --no-audit --no-fund
          echo "- Baseline tests npm ci: $(($(date +%s) - start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Require Engine dist to be absent before local build
        run: test ! -e shared/engine/dist
      - name: Compile Engine locally
        run: |
          start=$(date +%s)
          npm run package:build --workspace @svitlo/engine
          echo "- Baseline tests Engine package:build: $(($(date +%s) - start))s (1 invocation)" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate and snapshot locally compiled Engine
        id: artifact
        run: node scripts/ci/productionQuality/engine-artifact-guard.mjs snapshot "$RUNNER_TEMP/engine-dist-before.json"
      - name: Run complete Engine unit suite without rebuild-triggering pretest
        run: |
          start=$(date +%s)
          npm --ignore-scripts run test --workspace @svitlo/engine
          echo "- Baseline tests check: $(($(date +%s) - start))s (0 additional Engine package:build invocations)" >> "$GITHUB_STEP_SUMMARY"
      - name: Reject any consumer Engine dist rewrite
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        run: node scripts/ci/productionQuality/engine-artifact-guard.mjs verify "$RUNNER_TEMP/engine-dist-before.json"
