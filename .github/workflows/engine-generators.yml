name: Engine generators

on:
  pull_request:
    # Generator and materialization changes also arrive through nested agent PRs
    # targeting integration/<name>; the path filter controls the scope.
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'shared/engine/generators/**'
      - 'shared/engine/assemblers/courseToc/**'
      - 'scripts/ci/courseMaterialization/**'
      - 'scripts/ci/bankMaterialization/**'
      - 'scripts/ci/lessonMaterialization/**'
      - 'scripts/ci/directMaterialization/**'
      - 'scripts/ci/requiredCheckReuse/**'
      - 'scripts/ci/packageBuildReuse/**'
      - 'scripts/ci/buildTelemetry/**'
      - 'scripts/runFastGate/**'
      - 'scripts/runWorkspaceScript/**'
      - 'scripts/ci/draftCiPolicy/**'
      - 'scripts/ci/productionQuality/**'
      - 'scripts/ci/releaseSource/**'
      - '.github/workflows/fast-gate.yml'
      - '.github/workflows/production-quality.yml'
      - '.github/workflows/lesson-materialization.yml'
      - 'shared/engine/scripts/generateQuestionReviewArtifacts/**'
      - '.github/workflows/bank-materialization.yml'
      - 'shared/engine/scripts/sceneScaffolding/**'
      - 'shared/engine/index.ts'
      - 'shared/engine/package.json'
      - 'shared/engine/tsconfig*.json'
      - 'shared/engine/scripts/generateLessonProps/**'
      - 'shared/engine/scripts/generateCourseProps/**'
      - 'shared/engine/scripts/generateCourseReviewArtifacts/**'
      - 'shared/engine/scripts/generateFlashcardReviewArtifacts/**'
      - 'scripts/generateTranslationReviewArtifacts/**'
      - 'shared/engine/scripts/loadAuthoredConfigurators/**'
      - 'shared/engine/scripts/generatorCliIntegration/**'
      - 'scripts/textbook-tooling/**'
      - 'studio/generator-requirements.md'
      - 'package.json'
      - '.github/workflows/engine-generators.yml'
      - '.github/scripts/backfill-labels.test.cjs'
  workflow_dispatch:
  workflow_call:
    inputs:
      # The strict Production Quality aggregator also requires a complete
      # Engine generator suite. Direct Ready main PRs must not pay for a
      # second npm-installed copy of the same full suite.
      run_full_generator_tests:
        type: boolean
        default: false
      # May omit only the same concrete files already exercised by the
      # independent required root Engine npm test in Production Quality.
      only_unit_unique_generator_tests:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A workflow_call uses its caller's github.workflow (GitHub Actions rule).
  # Separate standalone Ready runs from their Production Quality reusable calls;
  # otherwise cancel-in-progress can cancel an independent required gate.
  group: engine-generators-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publisher-isolation:
    name: Publisher isolation / no npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: Prove typed Lesson and bank publishers load without installed packages
        run: node --test --test-reporter=dot scripts/ci/lessonMaterialization/lesson-typed-publish.spec.mjs scripts/ci/bankMaterialization/bank-typed-materialization.spec.mjs
      - name: Verify static six-command dispatch, trust boundaries and Course dependency inventory
        run: node --test --test-reporter=dot scripts/ci/directMaterialization/materialization-workflow-security.spec.mjs scripts/ci/directMaterialization/trusted-draft.spec.mjs scripts/ci/directMaterialization/course-dependency-isolation.spec.mjs

  ci-policy:
    name: Required check reuse and Draft policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - run: node --test --test-reporter=dot scripts/ci/requiredCheckReuse/*.spec.mjs scripts/ci/draftCiPolicy/*.spec.mjs scripts/ci/productionQuality/production-quality.spec.mjs scripts/ci/productionQuality/select-generator-tests.spec.mjs scripts/ci/releaseSource/check-release-source.spec.mjs scripts/ci/quietRun/quiet-run.spec.mjs
      - name: Verify job-local package build reuse and passive telemetry
        run: node --test --test-reporter=dot scripts/ci/packageBuildReuse/package-build-reuse.spec.mjs
      - name: Verify direct build-command tracing and summary
        run: node --test --test-reporter=spec scripts/ci/buildTelemetry/*.spec.mjs
      - name: Verify FastGate nested root and changed-workspace selection
        run: node --test --test-reporter=spec scripts/runFastGate/run-fast-gate.spec.mjs
      - name: Verify root unit-workspace coverage and safe timing annotations
        run: node --test --test-reporter=dot scripts/runWorkspaceScript/run-workspace-script.spec.mjs
      - name: Parse touched CI orchestration scripts without npm dependencies
        run: |
          node --check scripts/ci/buildChangedContent/build-changed-content.mjs
          node --check scripts/textbook-tooling/buildTextbook/build.mjs
          node --check scripts/runFastGate/run-fast-gate.mjs
          node --check scripts/ci/buildTelemetry/record-build-command.mjs
          node --check scripts/ci/buildTelemetry/summarize-builds.mjs
      - name: Verify historical backfill labels with repository-scoped mocks
        run: node --test .github/scripts/backfill-labels.test.cjs

  generator-tests:
    # Preserve full Ready suites for all standalone non-main PRs and manual
    # dispatches. A Ready main promotion runs them in Production Quality's
    # explicit reusable call instead of launching a second npm-installed job.
    # The no-npm policy and publisher-isolation jobs still run directly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       (github.event.pull_request.base.ref != 'main' || inputs.run_full_generator_tests))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Build Engine
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build --workspace @svitlo/engine
      - name: Verify pinned Prettier import ordering without rewriting sources
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:import-format
      - name: Typecheck Engine and compile generator tests
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- npm run code:check:types --workspace @svitlo/engine
          node scripts/ci/quietRun/quiet-run.mjs -- npx tsc -p shared/engine/tsconfig.test.json
      - name: Run targeted generator and CLI regression tests
        env:
          # Defaults false for standalone Ready/manual; true only when
          # explicitly invoked by the protected Production Quality workflow.
          SVITLO_CI_ONLY_UNIQUE_GENERATOR_TESTS: ${{ inputs.only_unit_unique_generator_tests }}
        run: node scripts/ci/productionQuality/select-generator-tests.mjs

      # Temporary PR #925 parity diagnostic; manual Production dispatch only.
      - name: Experimental overlapping Engine case parity across workdirs
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { join, resolve } from 'node:path';
          import { planGeneratorTests } from './scripts/ci/productionQuality/select-generator-tests.mjs';
          const root = process.cwd();
          const plan = planGeneratorTests({ uniqueOnly: true });
          if (plan.coveredByUnit.length !== 43 || plan.all.length !== 54) {
            throw new Error('Unexpected experiment input: expected 43 shared / 54 total compiled files');
          }
          const paths = plan.coveredByUnit.map(file => resolve(root, file));
          const runner = String.raw`
            import { run } from 'node:test';
            import { relative } from 'node:path';
            const cases = [];
            let summary;
            for await (const event of run({ files: JSON.parse(process.env.SVITLO_COMPARE_FILES), concurrency: true })) {
              const { type, data } = event;
              if (type === 'test:pass' || type === 'test:fail') cases.push({
                file: relative(process.env.SVITLO_COMPARE_ROOT, data.file || ''),
                name: data.name, nesting: data.nesting, line: data.line, column: data.column,
                status: data.skip ? 'skip' : data.todo ? 'todo' : type === 'test:fail' ? 'fail' : 'pass'
              });
              if (type === 'test:summary' && !data.file) summary = data;
            }
            console.log('SVITLO_CASE_COMPARE_JSON=' + JSON.stringify({ cases, summary: summary?.counts, success: summary?.success }));
            if (!summary?.success) process.exitCode = 1;
          `;
          const snapshots = [];
          for (const [label, cwd] of [['repo-root', root], ['engine-root', join(root, 'shared/engine')]]) {
            const executed = spawnSync(process.execPath, ['--input-type=module', '-'], {
              cwd, encoding: 'utf8', input: runner, maxBuffer: 32 * 1024 * 1024,
              env: { ...process.env, SVITLO_COMPARE_ROOT: root, SVITLO_COMPARE_FILES: JSON.stringify(paths) }
            });
            const serialized = (executed.stdout || '').split(/\r?\n/).find(line => line.startsWith('SVITLO_CASE_COMPARE_JSON='));
            if (executed.error || executed.status !== 0 || !serialized) {
              console.error((executed.stderr || '').slice(-3500));
              console.error((executed.stdout || '').slice(-3500));
              throw executed.error || new Error(label + ' failed or missing machine-readable test results: ' + executed.status);
            }
            const data = JSON.parse(serialized.slice('SVITLO_CASE_COMPARE_JSON='.length));
            assert.equal(data.success, true, label + ' had failing test cases');
            const ids = data.cases.map(entry => JSON.stringify(entry)).sort();
            snapshots.push(ids);
            console.log('GENERATOR_CASE_PARITY mode=' + label + ' source_files=' + paths.length +
              ' events=' + ids.length + ' passed=' + data.summary.passed + ' skipped=' + data.summary.skipped +
              ' todo=' + data.summary.todo + ' failed=' + data.summary.failed);
          }
          if (JSON.stringify(snapshots[0]) !== JSON.stringify(snapshots[1])) {
            const a = new Set(snapshots[0]), b = new Set(snapshots[1]);
            console.error('Only repo-root: ' + JSON.stringify([...a].filter(x => !b.has(x)).slice(0,10)));
            console.error('Only engine-root: ' + JSON.stringify([...b].filter(x => !a.has(x)).slice(0,10)));
            throw new Error('Generator test case identity/status differs between work directories');
          }
          console.log('GENERATOR_CASE_PARITY_SUCCESS sha=' + process.env.GITHUB_SHA +
            ' compared_files=' + paths.length + ' case_events=' + snapshots[0].length);
          NODE
      - name: Test typed Bank source and PR-command security
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- node --test \
            scripts/ci/bankMaterialization/bank-typed-materialization.spec.mjs \
            scripts/ci/bankMaterialization/bank-typed-block-evidence.spec.mjs

      - name: Test typed Lesson Stage 6 source and PR-command security
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- node --test \
            scripts/ci/lessonMaterialization/lesson-typed-materialization.spec.mjs \
            scripts/ci/lessonMaterialization/lesson-typed-publish.spec.mjs

      - name: Verify reserved Course parent ownership and AST handoff checks
        run: node scripts/ci/quietRun/quiet-run.mjs -- node --test scripts/ci/directMaterialization/reserved-parent-slot.spec.mjs

      - name: Check formatting of typed Course Flow sources
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- npx prettier --check \
            studio/skills/course-workflow/*.md \
            studio/docs/entities/course.md \
            studio/docs/architecture/README.md \
            shared/engine/scripts/README.md \
            scripts/ci/courseMaterialization/README.md \
            scripts/ci/courseMaterialization/*.mjs \
            shared/engine/scripts/generateFlashcardReviewArtifacts/*.mjs \
            shared/engine/scripts/generateFlashcardReviewArtifacts/README.md \
            shared/engine/configurators/courses/defineCourse/defineCourse.schemas.ts \
            shared/engine/configurators/courses/defineCourse/courseHierarchy.spec.ts \
            package.json shared/engine/package.json
