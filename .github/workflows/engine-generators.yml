name: Engine generators

on:
  pull_request:
    branches: [main, develop, integration-branch]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'shared/engine/generators/**'
      - 'shared/engine/scripts/lessonBuilder/**'
      - 'shared/engine/scripts/materializeCourseFlow/**'
      - 'shared/engine/scripts/validateCourseFlow/**'
      - 'shared/engine/scripts/generateYamlSchemas/**'
      - 'shared/engine/yaml-schemas/**'
      - 'scripts/ci/courseMaterialization/**'
      - 'scripts/ci/bankMaterialization/**'
      - 'scripts/ci/lessonMaterialization/**'
      - 'shared/engine/scripts/finalizeLesson/**'
      - '.github/workflows/lesson-materialization.yml'
      - 'shared/engine/scripts/questionsBuilder/**'
      - 'shared/engine/scripts/generateQuestionReviewArtifacts/**'
      - 'shared/engine/scripts/flashcardBuilder/**'
      - '.github/workflows/bank-materialization.yml'
      - '.github/workflows/course-materialization.yml'
      - 'shared/engine/scripts/sceneScaffolding/**'
      - 'shared/engine/index.ts'
      - 'shared/engine/package.json'
      - 'shared/engine/tsconfig*.json'
      - 'shared/engine/scripts/generateLessonProps/**'
      - 'shared/engine/scripts/generateCourseProps/**'
      - 'shared/engine/scripts/generateCourseReviewArtifacts/**'
      - 'scripts/generateTranslationReviewArtifacts/**'
      - 'shared/engine/scripts/loadAuthoredConfigurators/**'
      - 'shared/engine/scripts/generatorCliIntegration/**'
      - 'scripts/textbook-tooling/**'
      - 'studio/generator-requirements.md'
      - 'package.json'
      - '.github/workflows/engine-generators.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-generators-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publisher-isolation:
    name: Publisher isolation / no npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove Lesson and both bank publishers load without installed packages
        run: node --test scripts/ci/lessonMaterialization/lesson-publish-isolation.spec.mjs scripts/ci/bankMaterialization/bank-materialization.spec.mjs

  generator-tests:
    # Full host/browser/generator suites only at review boundary or explicitly on demand.
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Build Engine
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build --workspace @svitlo/engine
      - name: Typecheck Engine and compile generator tests
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- npm run code:check:types --workspace @svitlo/engine
          node scripts/ci/quietRun/quiet-run.mjs -- npx tsc -p shared/engine/tsconfig.test.json
      - name: Run targeted generator and CLI regression tests
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- node --test \
            shared/engine/.test-build/generators/lessons/*.spec.js \
            shared/engine/generators/courses/publishCourseData.spec.mjs \
            shared/engine/generators/skills/publishSkillTree.spec.mjs \
            shared/engine/scripts/generateSkills/prepareSkillsPublication.spec.mjs \
            shared/engine/scripts/generateLessonProps/generateLessonProps.spec.mjs \
            shared/engine/scripts/generateCourseProps/generateCourseProps.spec.mjs \
            shared/engine/scripts/generatorCliIntegration/generatorCliIntegration.spec.mjs \
            shared/engine/scripts/lessonBuilder/lessonBuilder.spec.mjs \
            shared/engine/scripts/sceneScaffolding/sceneScaffolding.spec.mjs \
            shared/engine/scripts/generateQuestionReviewArtifacts/*.spec.mjs \
            scripts/generateTranslationReviewArtifacts/generate-translation-review-artifacts.spec.mjs \
            scripts/textbook-tooling/buildTextbook/stageTextbookAssets.spec.mjs

      - name: Test Course Flow regression suites
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- node --test \
            shared/engine/scripts/materializeCourseFlow/materialize-course-flow.spec.mjs \
            shared/engine/scripts/validateCourseFlow/validate-course-flow.spec.mjs \
            scripts/ci/courseMaterialization/course-materialization.spec.mjs \
            scripts/ci/bankMaterialization/bank-materialization.spec.mjs \
            shared/engine/scripts/questionsBuilder/questionsBuilder.spec.mjs \
            shared/engine/scripts/flashcardBuilder/flashcardBuilder.spec.mjs

      - name: Test Lesson Stage 6 finalizer and PR-command security
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- node --test \
            shared/engine/scripts/finalizeLesson/finalizeLesson.spec.mjs \
            scripts/ci/lessonMaterialization/lesson-materialization.spec.mjs

      - name: Verify all checked-in Zod-derived YAML schemas
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run content:check:yaml-schemas --workspace @svitlo/engine

      - name: Check formatting of Course Flow sources and generated schemas
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- npx prettier --check \
            shared/engine/yaml-schemas/*.json \
            studio/skills/course-workflow/*.md \
            studio/docs/entities/course.md \
            studio/docs/architecture/README.md \
            shared/engine/scripts/README.md \
            shared/engine/scripts/validateCourseFlow/README.md \
            shared/engine/scripts/materializeCourseFlow/README.md \
            scripts/ci/courseMaterialization/README.md \
            scripts/ci/courseMaterialization/*.mjs \
            .github/workflows/course-materialization.yml \
            shared/engine/scripts/materializeCourseFlow/*.mjs \
            shared/engine/scripts/validateCourseFlow/*.mjs \
            shared/engine/configurators/courses/defineCourse/defineCourse.schemas.ts \
            shared/engine/configurators/courses/defineCourse/courseHierarchy.spec.ts \
            studio/skills/course-workflow/course-flow.schema.json \
            package.json shared/engine/package.json
