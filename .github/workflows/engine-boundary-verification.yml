name: Verify Engine boundary and app ESLint
on:
  push:
    branches: [fix/engine-build-runtime-exports]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Contracts and both Engine entrypoints
        run: |
          npm run package:build --workspace @svitlo/contracts
          npm run package:build --workspace @svitlo/engine
      - name: Test runtime import graph and guards
        run: |
          node scripts/check-engine-runtime-graph.mjs
          node --test scripts/check-engine-runtime-graph.spec.mjs
      - name: Run Engine tests
        run: npm test --workspace @svitlo/engine
      - name: Lint Web
        working-directory: apps/web
        run: npx eslint .
      - name: Lint Platform
        working-directory: apps/platform
        run: npx eslint .
      - name: Lint Desktop
        working-directory: apps/desktop
        run: npx eslint .
      - name: Lint Mobile
        working-directory: apps/mobile
        run: npx eslint .
