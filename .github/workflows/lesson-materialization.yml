name: Materialize typed Lesson from PR command

# The trusted workflow runs on the default branch. Execute candidate code only in the credential-free isolated worker.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository Draft Lesson PR number
        type: number
        required: true

permissions: {}

concurrency:
  group: lesson-stage6-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  typed-resolve:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/lesson materialize'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      meta: ${{ steps.gate.outputs.meta }}
      pr: ${{ steps.gate.outputs.pr }}
      head: ${{ steps.gate.outputs.head }}
    steps:
      - name: Check out immutable trusted command gate from default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: Authorize actor and locate pinned Lesson source
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          LESSON_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ci/lessonMaterialization/lesson-typed-gate.mjs resolve

  typed-analyze:
    needs: typed-resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    outputs:
      report_sha256: ${{ steps.analysis.outputs.report_sha256 }}
    steps:
      - name: Check out pinned trusted Engine and worker
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out pinned Lesson commit for isolated execution
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.typed-resolve.outputs.head }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: trusted/package-lock.json
      - name: Install and build only trusted Engine code
        working-directory: trusted
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- npm ci --ignore-scripts --no-audit --no-fund
          node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build --workspace @svitlo/engine
      - name: Execute pinned Lesson entrypoint in isolated worker without GitHub credentials
        id: analysis
        env:
          LESSON_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LESSON_TYPED_META_B64: ${{ needs.typed-resolve.outputs.meta }}
          LESSON_TYPED_CANDIDATE: candidate
          LESSON_TYPED_REPORT: ${{ runner.temp }}/typed-lesson-stage6/report.json
        run: node trusted/scripts/ci/quietRun/quiet-run.mjs -- node trusted/scripts/ci/lessonMaterialization/lesson-typed-materialization.mjs analyze
      - name: Retain source-pinned and SHA256-attested analysis evidence
        uses: actions/upload-artifact@v6
        with:
          name: typed-lesson-stage6-${{ needs.typed-resolve.outputs.pr }}-${{ github.run_id }}
          path: ${{ runner.temp }}/typed-lesson-stage6/report.json
          retention-days: 1
          if-no-files-found: error

  typed-publish:
    needs: [typed-resolve, typed-analyze]
    if: needs.typed-analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out pinned trusted publisher with no dependencies
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out pinned Lesson HEAD as data, never execute it
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.typed-resolve.outputs.head }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: Download the exact read-only analyzer artifact
        uses: actions/download-artifact@v7
        with:
          name: typed-lesson-stage6-${{ needs.typed-resolve.outputs.pr }}-${{ github.run_id }}
          path: report
      - name: Verify source HEAD, blob and manifest before atomic commit
        env:
          GH_TOKEN: ${{ github.token }}
          LESSON_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LESSON_TYPED_META_B64: ${{ needs.typed-resolve.outputs.meta }}
          LESSON_TYPED_CANDIDATE: candidate
          LESSON_TYPED_REPORT: report/report.json
          LESSON_TYPED_REPORT_SHA256: ${{ needs.typed-analyze.outputs.report_sha256 }}
        run: node trusted/scripts/ci/quietRun/quiet-run.mjs -- node trusted/scripts/ci/lessonMaterialization/lesson-typed-materialization.mjs publish
