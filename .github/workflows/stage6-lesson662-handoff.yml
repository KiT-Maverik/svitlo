name: Lesson 662 Stage 6 draft source handoff (temporary)
# Retry after canonical Astronomy *.ts Skill resolver fix; remove after successful handoff.
# Temporary, branch-scoped workflow; remove this file once the GitHub runner
# has verified and committed the actual Engine-generated draft inventory.
on:
  push:
    branches:
      - agent/astronomy-sun-earth-moon-roles
    paths:
      - .github/workflows/stage6-lesson662-handoff.yml

permissions:
  contents: write

jobs:
  source-handoff:
    if: github.repository == 'KiT-Maverik/svitlo'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: lesson-662-source-handoff
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify checked-in Engine schema against current Build output
        run: |
          npm run package:build --workspace @svitlo/engine
          npm run content:check:yaml-schemas --workspace @svitlo/engine
      - name: Run the canonical bank-pending Lesson preflight and handoff
        shell: bash
        run: |
          set -euo pipefail
          source='content/astronomy/data/lessons/e/26482aec-3c09-57a6-8534-414f649276be/lesson.yaml'
          node shared/engine/scripts/finalizeLesson/finalizeLesson.mjs preflight-draft --source "$source"
          node shared/engine/scripts/finalizeLesson/finalizeLesson.mjs handoff --source "$source"
          node shared/engine/scripts/lessonBuilder/lessonBuilder.mjs check --source "$source"
          test -f "$source"
          root="${source%/lesson.yaml}"
          test -f "$root/index.ts"
          test -f "$root/constants.ts"
          test -f "$root/methodology.md"
          test -f "$root/production-handoff.json"
          test -f "$root/sections/objectRolesQuiz/index.ts"
          grep -q '^// TODO (BLOCKER):' "$root/sections/objectRolesQuiz/index.ts"
          git diff --exit-code -- "$source"
      - name: Verify focused finalizer and builder regression suites
        run: |
          node --test shared/engine/scripts/finalizeLesson/finalizeLesson.spec.mjs
          node --test shared/engine/scripts/lessonBuilder/lessonBuilder.spec.mjs
      - name: Upload generated source inventory for independent audit
        uses: actions/upload-artifact@v4
        with:
          name: lesson-662-stage6-scaffold
          path: content/astronomy/data/lessons/e/26482aec-3c09-57a6-8534-414f649276be/
          if-no-files-found: error
          retention-days: 7
      - name: Commit only verified Lesson-owned outputs to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          root='content/astronomy/data/lessons/e/26482aec-3c09-57a6-8534-414f649276be'
          git add -A -- "$root"
          git diff --cached --name-only | tee /tmp/lesson-662-staged.txt
          test -s /tmp/lesson-662-staged.txt
          if grep -v "^$root/" /tmp/lesson-662-staged.txt; then
            echo "::error::Generated changes outside the canonical Lesson root"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Scaffold bank-pending Sun Earth Moon Lesson sources'
          git push origin HEAD:refs/heads/agent/astronomy-sun-earth-moon-roles
