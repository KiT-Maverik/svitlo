name: Agent 2 Health and Safety review validation (temporary)

on:
  push:
    branches:
      - review/health-safety-skills-language-review-agent-2
    paths:
      - '.github/workflows/agent2-health-safety-review-validation.temporary.yml'
      - 'content/health-safety/data/skills/**'

permissions:
  contents: read

concurrency:
  group: agent2-health-safety-review-validation
  cancel-in-progress: true

jobs:
  verify:
    name: Validate taxonomy and full Health and Safety TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Check workspace manifests
        run: node scripts/check-workspaces.mjs
      - name: Verify complete Health and Safety taxonomy structure
        run: node scripts/check-skills-taxonomy-structure.mjs content/health-safety/data/skills
      - name: Build contracts
        run: npm run build --workspace @svitlo/contracts
      - name: Build engine
        run: npm run build --workspace @svitlo/engine
      - name: Strict Health and Safety TypeScript
        run: npm run typecheck --workspace @svitlo/health-safety
