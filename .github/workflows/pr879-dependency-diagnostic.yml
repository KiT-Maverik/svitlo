# Temporary, PR-scoped npm dependency diagnostic. Remove before handoff.
name: PR 879 dependency diagnostic

on:
  push:
    branches: [maintenance/dependency-cleanup]

permissions:
  contents: write

concurrency:
  group: pr879-dependency-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.repository == 'KiT-Maverik/svitlo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Regenerate lockfile using npm, without executing install hooks
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean install from the regenerated npm lockfile
        run: npm ci --no-audit --no-fund
      - name: Capture full and production audits
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/pr879-full.json
          full=$?
          npm audit --omit=dev --json > /tmp/pr879-prod.json
          prod=$?
          echo "Audit command statuses: full=$full prod=$prod"
          if [[ $full -gt 1 || $prod -gt 1 ]]; then
            echo "npm audit failed beyond advisory findings"
            exit 1
          fi
      - name: Summarize named advisories and resolved versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkgs = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')).packages;
          const lines = [];
          for (const scope of ['full', 'prod']) {
            const report = JSON.parse(fs.readFileSync('/tmp/pr879-' + scope + '.json', 'utf8'));
            lines.push('### ' + scope + ': ' + JSON.stringify(report.metadata?.vulnerabilities));
            for (const [name, issue] of Object.entries(report.vulnerabilities || {})) {
              const matches = Object.entries(pkgs)
                .filter(([path]) => path === 'node_modules/' + name || path.endsWith('/node_modules/' + name))
                .map(([path, entry]) => entry.version + '@' + path);
              const via = (issue.via || []).map(item => typeof item === 'string' ? item : (item.url || item.name) + ' [' + item.range + ']');
              lines.push(JSON.stringify({name, severity: issue.severity, isDirect: issue.isDirect, range: issue.range, resolved: matches, via, fixAvailable: issue.fixAvailable}));
            }
          }
          const summary = lines.join('\n') + '\n';
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## npm audit diagnostics\n\n```text\n' + summary.slice(0, 55000) + '\n```\n');
          NODE
      - name: Trace deprecations to owning packages
        shell: bash
        run: |
          set +e
          for package in inflight rimraf glob whatwg-encoding tsconfck boolean eslint katex electron-builder electron-winstaller vite-tsconfig-paths jsdom; do
            echo "::group::npm explain $package"
            npm explain "$package" 2>&1 | head -60
            echo "::endgroup::"
          done
      - name: Verify install-script policy remains restrictive
        run: npm config get allow-scripts || true
      - name: Verify repository package boundaries
        run: npm run repo:check:packages
      - name: Commit npm-generated lockfile to this PR branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$PR_SOURCE_BRANCH" = "maintenance/dependency-cleanup"
          if git diff --quiet --exit-code -- package-lock.json; then
            echo "npm lockfile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "fix: synchronize npm lockfile for security remediation"
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push --quiet origin "HEAD:refs/heads/$PR_SOURCE_BRANCH"

  ui-kit-regression:
    name: UI Kit math rendering, Storybook and Web components
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build
      - name: UI Kit components, including Markdown and KaTeX security tests
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:components --workspace @svitlo/ui-kit
      - name: Build UI Kit Storybook
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run storybook:build --workspace @svitlo/ui-kit
      - name: Web and Playground component regression suites
        env:
          SVITLO_WEB_TEST_SELECTION: web-fixture-alpha
        run: node scripts/ci/quietRun/quiet-run.mjs -- node scripts/ci/productionQuality/run-selected-components.mjs

  reproduce-develop-engine:
    name: Reproduce unchanged Engine test failure on develop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f9f5fd661871f2de00b1f3fe3a37a30e0bffebd1
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Run the same Engine test suite on the unmodified develop base
        shell: bash
        run: |
          set +e
          npm run test --workspace @svitlo/engine > /tmp/pr879-base-engine.log 2>&1
          result=$?
          set -e
          if [[ $result -ne 0 ]] && grep -qF 'child_content_question_items_prompt' /tmp/pr879-base-engine.log; then
            echo "Verified: unchanged develop Engine test fails at the same materializer assertion."
            grep -n -C 3 'child_content_question_items_prompt' /tmp/pr879-base-engine.log | tail -n 50
          else
            echo "Baseline does not reproduce the PR failure (exit: $result)"
            tail -n 120 /tmp/pr879-base-engine.log
            exit 1
          fi

  eslint10-compatibility:
    name: Probe ESLint 10 peer resolution without force/overrides
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Attempt nonpersistent ESLint 10 manifest migration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const touched = [];
          for (const [path, entry] of Object.entries(lock.packages)) {
            if (!entry.devDependencies?.eslint || path.includes('node_modules')) continue;
            const manifestPath = path ? path + '/package.json' : 'package.json';
            const pkg = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (!pkg.devDependencies?.eslint) continue;
            pkg.devDependencies.eslint = '^10.15.0';
            if (pkg.devDependencies['@eslint/js']) pkg.devDependencies['@eslint/js'] = '^10.0.0';
            fs.writeFileSync(manifestPath, JSON.stringify(pkg, null, 2) + '\n');
            touched.push(manifestPath);
          }
          console.log('Testing manifests, no changes will be pushed:', touched.join(', '));
          NODE
          set +e
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund > /tmp/pr879-eslint10.log 2>&1
          result=$?
          set -e
          if [[ $result -ne 0 ]]; then
            echo "ESLint 10 upgrade cannot resolve all existing npm peers (exit $result)."
            tail -n 110 /tmp/pr879-eslint10.log
            exit 0
          fi
          echo "ESLint 10 lockfile resolution succeeded; verify locked ESLint versions."
          node <<'NODE'
          const fs = require('node:fs');
          const tree = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')).packages;
          const rows = Object.entries(tree)
            .filter(([path]) => path === 'node_modules/eslint' || path.endsWith('/node_modules/eslint'))
            .map(([path, obj]) => path + ': ' + obj.version);
          console.log(rows.join('\n'));
          if (rows.some(row => row.includes(': 9.'))) process.exitCode = 1;
          NODE
