# One-time, branch-scoped regeneration; remove before submitting the PR for review.
name: Temporary YAML schema regeneration
on:
  push:
    branches: [architecture/strict-yaml-draft-pending-resources]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.event.head_commit.message != 'Regenerate strict YAML editor schemas'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/strict-yaml-draft-pending-resources
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate JSON schemas from Zod
        run: |
          npm run package:build --workspace @svitlo/engine
          npm run content:generate:yaml-schemas --workspace @svitlo/engine
          npm run content:check:yaml-schemas --workspace @svitlo/engine
      - name: Stage changed schemas
        id: changes
        run: |
          git add shared/engine/yaml-schemas/*.schema.json
          if git diff --cached --quiet; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - name: Create formatter app token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.PR_FORMATTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_FORMATTER_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit generated schemas
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com"
          git commit -m "Regenerate strict YAML editor schemas"
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/architecture/strict-yaml-draft-pending-resources
