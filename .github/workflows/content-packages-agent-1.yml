name: Agent 1 textbook package distributions

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/math/**'
      - 'content/physics/**'
      - 'content/psychology/**'
      - 'content/philosophy/**'
      - 'content/language-literature/**'
      - 'content/languages/ukrainian/**'
      - 'scripts/check-built-package-exports.mjs'
      - 'scripts/textbook-tooling/**'
      - '.github/workflows/content-packages-agent-1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-1-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Six packages / build, types, publish and portability
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Validate workspace and package boundaries
        run: npm run packages:check
      - name: Compile shared dependencies
        run: |
          npm run build --workspace @svitlo/contracts
          npm run build --workspace @svitlo/engine
          npm run build --workspace @svitlo/indexdb
          npm run build --workspace @svitlo/ui-kit
          npm run build --workspace @svitlo/adapter-nextjs
          npm run build --workspace @svitlo/playground
      - name: Build all six textbook distributions
        run: |
          for textbook in math physics psychology philosophy language-literature ukrainian; do
            npm run build --workspace "@svitlo/$textbook"
          done
      - name: Strict authoring TypeScript and metadata checks
        run: |
          for textbook in math physics psychology philosophy language-literature ukrainian; do
            npm run typecheck --workspace "@svitlo/$textbook"
          done
          npm run test:types --workspace @svitlo/math
      - name: Validate compiled public entrypoints and manifests
        run: |
          node --test scripts/check-built-package-exports.spec.mjs
          npm run packages:artifacts:check -- --packages \
            shared/contracts shared/engine shared/indexdb shared/ui-kit \
            shared/adapters/nextjs content/playground \
            content/math content/physics content/psychology content/philosophy \
            content/language-literature content/languages/ukrainian
      - name: Preserve real Math localization and content contract tests
        run: npm run test:components --workspace @svitlo/math
      - name: Verify isolated consumer, publication and cleanup for each textbook
        run: |
          for textbook in math physics psychology philosophy language-literature; do
            (cd "content/$textbook" && node --test ../../scripts/textbook-tooling/test-publish.mjs)
            (cd "content/$textbook" && node ../../scripts/textbook-tooling/check-portability.mjs)
          done
          (cd content/languages/ukrainian && node --test ../../../scripts/textbook-tooling/test-publish.mjs)
          (cd content/languages/ukrainian && node ../../../scripts/textbook-tooling/check-portability.mjs)
