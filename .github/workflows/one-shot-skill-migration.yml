name: One-time Skill configurator source migration

on:
  push:
    branches: [tooling/migrate-skill-definitions]
    paths:
      - '.github/workflows/one-shot-skill-migration.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-skill-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'KiT-Maverik/svitlo-web'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Apply approved unchanged migrator across all Skill textbooks
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find content -mindepth 3 -maxdepth 3 -type d -path '*/data/skills' | sort)
          echo "Found ${#packages[@]} Skill taxonomy packages"
          if [ "${#packages[@]}" -ne 15 ]; then
            echo "::error::Unexpected taxonomy package count; refusing a partial rollout"
            exit 1
          fi
          for directory in "${packages[@]}"; do
            textbook="${directory%/data/skills}"
            echo "::group::${textbook}"
            node scripts/migrate-skills-configurators.mjs --package "${textbook}" --write
            echo "::endgroup::"
          done

          # Validate every package before writing any commit; the repository is
          # an isolated CI checkout, so a failure never publishes partial edits.
          for directory in "${packages[@]}"; do
            textbook="${directory%/data/skills}"
            result="$(node scripts/migrate-skills-configurators.mjs --package "${textbook}")"
            echo "${result}"
            if [ "$(echo "${result}" | node -e "let s=''; process.stdin.on('data',b=>s+=b);process.stdin.on('end',()=>console.log(JSON.parse(s).changed))")" != 0 ]; then
              echo "::error::Migration is not idempotent for ${textbook}"
              exit 1
            fi
          done

      - name: Run isolated Art regression tests and migration checks
        run: |
          node --test scripts/migrate-skills-configurators.spec.mjs
          git diff --check

      - name: Commit migrated textbook sources and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'content/*/data/skills'
          git rm -- .github/workflows/one-shot-skill-migration.yml
          staged="$(git diff --cached --name-only)"
          count="$(printf "%s\n" "${staged}" | sed '/^$/d' | wc -l)"
          echo "Staged ${count} changed paths"
          if [ "${count}" -lt 1000 ]; then
            echo "::error::Suspiciously small migration diff; refusing to publish"
            exit 1
          fi
          if git diff --cached --name-only | grep -Ev '^(content/[^/]+/data/skills/|\.github/workflows/one-shot-skill-migration.yml$)'; then
            echo "::error::Unexpected staged path"
            exit 1
          fi
          git commit -m "Migrate Skill taxonomies to Engine definition configurators"
          git push origin HEAD:tooling/migrate-skill-definitions
