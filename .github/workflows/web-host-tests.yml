name: Web host tests

# Ordinary Web host edits need an independent Ready test route. Course-only
# navigation edits retain the existing dedicated Course/browser workflow.
# This suite intentionally does not build Next.js or install Playwright.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'apps/web/**'
      - '!apps/web/src/app/**/course/**'
      - '!apps/web/src/lib/course*.ts'
      - '!apps/web/scripts/buildTestContent/**'
      - 'scripts/ci/testRouting/**'
      - '.github/workflows/web-host-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-host-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Web selection and host components
    # Production Quality already owns the same tests on main promotions.
    if: github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && github.event.pull_request.base.ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SVITLO_TEXTBOOK: web-fixture-alpha
      SVITLO_WEB_TEST_SELECTION: web-fixture-alpha
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Install pinned dependencies
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Prove Web and UI Kit Ready trigger coverage
        run: node scripts/ci/quietRun/quiet-run.mjs -- node --test scripts/ci/testRouting/test-routing.spec.mjs
      - name: Test unsafe or missing Web textbook selection and host components
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:components --workspace @svitlo/web
      - name: Test actual published Web textbook selection
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:integration --workspace @svitlo/web
