name: Agent CI Artifacts / clean

# Always runs for PRs into main and the lesson integration branch, including docs-only changes.
# Configure this check as REQUIRED in main branch protection / rulesets.
on:
  pull_request:
    branches: [main, new-lesson]
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  no-temporary-agent-artifacts:
    name: Agent CI Artifacts / clean
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail if temporary review documents would enter a protected integration branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .agent-ci-artifacts ]; then
            echo '::error::Remove .agent-ci-artifacts/ from this PR before merging.'
            echo 'On an open same-repo PR, use: /agent-artifacts cleanup'
            exit 1
          fi
          echo 'No PR-scoped agent artifacts in merge candidate.'
