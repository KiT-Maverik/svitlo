name: EducationStandard review references

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/generateTranslationReviewArtifacts/**'
      - 'shared/ui-kit/data/definitions/educationStandards/**'
      - 'shared/ui-kit/scripts/generateLocales/loadEducationStandards.mjs'
      - '.github/workflows/translation-review.yml'
      - '.github/workflows/education-standards-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: education-standard-references-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-tests:
    name: EducationStandard adapter and scoped-dispatch tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify source parser, publication cross-check, and locale manifest behavior
        run: node --test scripts/generateTranslationReviewArtifacts/education-standards-reference.spec.mjs
      - name: Verify existing scoped generator behavior
        run: node --test scripts/generateTranslationReviewArtifacts/generate-translation-review-artifacts.spec.mjs
      - name: Verify real Code-derived UI Kit catalog
        if: hashFiles('shared/ui-kit/data/definitions/educationStandards/data/index.ts') != ''
        shell: bash
        run: |
          set -euo pipefail
          npm run package:build --workspace @svitlo/engine
          npm run code:check:types --workspace @svitlo/ui-kit
          node scripts/generateTranslationReviewArtifacts/generate-translation-review-artifacts.mjs --kind education-standards
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { loadEducationStandards } from './shared/ui-kit/scripts/generateLocales/loadEducationStandards.mjs';
          import { readSupportedLanguageCodes } from './shared/engine/scripts/readSupportedLanguages/read-supported-languages.mjs';
          import { readEducationStandardSources } from './scripts/generateTranslationReviewArtifacts/education-standards-reference.mjs';
          const expected = loadEducationStandards().length;
          const languages = readSupportedLanguageCodes();
          const records = readEducationStandardSources(process.cwd(), languages);
          const checkedOutSource = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const manifest = JSON.parse(fs.readFileSync('.agent-ci-artifacts/manifest.json', 'utf8'));
          assert.equal(records.length, expected);
          assert.equal(manifest.sourceCommit, checkedOutSource);
          assert.equal(manifest.scope.kind, 'education-standards');
          assert.equal(manifest.generated.length, languages.length);
          assert.equal(new Set(manifest.generated.map(entry => entry.locale)).size, languages.length);
          assert.equal(manifest.summary.educationStandardDocuments, languages.length);
          assert.equal(manifest.summary.missingTranslations, 0);
          assert.equal(manifest.summary.incompleteDocuments, 0);
          assert.equal(manifest.failures.length, 0);
          assert.deepEqual(manifest.locales, [...languages].sort());
          for (const entry of manifest.generated) {
            assert.equal(entry.kind, 'education-standard');
            assert.equal(entry.standards, expected);
            assert.equal(entry.missing, 0);
            assert.equal(entry.reviewReady, true);
            const markdown = fs.readFileSync(entry.path, 'utf8');
            assert.ok(markdown.includes('Standards: ' + expected));
            assert.ok(markdown.includes('Source commit: ' + checkedOutSource));
            for (const { config, sourcePath } of records) {
              assert.ok(markdown.includes(config.id), 'Missing UUID ' + config.slug + '/' + entry.locale);
              assert.ok(markdown.includes('../../' + sourcePath), 'Missing Code link ' + sourcePath);
            }
          }
          NODE
          # A scoped request replaces the prior references and lists exactly one locale.
          node scripts/generateTranslationReviewArtifacts/generate-translation-review-artifacts.mjs --kind education-standards --locale uk
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('.agent-ci-artifacts/manifest.json', 'utf8'));
          assert.deepEqual(manifest.locales, ['uk']);
          assert.deepEqual(manifest.generated.map(item => item.path),
            ['.agent-ci-artifacts/education-standards/uk.md']);
          assert.equal(manifest.generated[0].missing, 0);
          assert.equal(manifest.generated[0].reviewReady, true);
          assert.equal(manifest.failures.length, 0);
          assert.deepEqual(fs.readdirSync('.agent-ci-artifacts/education-standards'), ['uk.md']);
          NODE
          rm -rf -- .agent-ci-artifacts
      - name: Check related script formatting
        shell: bash
        run: |
          if ! npx prettier --check scripts/generateTranslationReviewArtifacts/education-standards-reference.mjs scripts/generateTranslationReviewArtifacts/education-standards-reference.spec.mjs scripts/generateTranslationReviewArtifacts/generate-translation-review-artifacts.mjs; then
            npx prettier --write scripts/generateTranslationReviewArtifacts/education-standards-reference.mjs scripts/generateTranslationReviewArtifacts/education-standards-reference.spec.mjs scripts/generateTranslationReviewArtifacts/generate-translation-review-artifacts.mjs
            git --no-pager diff -- scripts/generateTranslationReviewArtifacts
            exit 1
          fi
