name: Migrate Engine entrypoint imports (one shot)
on:
  push:
    branches:
      - architecture/engine-build-runtime-exports-474
    paths:
      - .github/workflows/engine-entrypoint-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Migrate tracked imports without touching authored values
        run: node scripts/migrate-engine-entrypoints.mjs --write
      - name: Verify migration is idempotent
        run: node scripts/migrate-engine-entrypoints.mjs --check
      - name: Verify Engine API and repository checks
        run: |
          failures=0
          verify() {
            echo "::group::$*"
            "$@" || failures=$((failures + 1))
            echo "::endgroup::"
          }
          verify npm run package:build --workspace @svitlo/contracts
          verify npm run package:build --workspace @svitlo/engine
          verify node scripts/check-engine-runtime-graph.mjs
          verify node --test scripts/migrate-engine-entrypoints.spec.mjs scripts/migrate-engine-imports.spec.mjs scripts/migrate-shared-imports.spec.mjs
          verify node scripts/migrate-engine-imports.mjs --check
          verify node scripts/migrate-shared-imports.mjs --check
          verify node scripts/check-package-boundaries.mjs
          verify node scripts/check-extraction-readiness.mjs
          verify node --test apps/desktop/tests/engine-runtime-imports.spec.mjs
          verify npm run code:lint:check --workspace @svitlo/desktop
          verify npm run code:lint:check --workspace @svitlo/platform
          verify npm run code:lint:check --workspace @svitlo/web
          verify npm run code:lint:check --workspace @svitlo/mobile
          verify npm run test --workspace @svitlo/engine
          verify npm run code:check:types --workspace @svitlo/ui-kit
          verify npm run code:check:types --workspace @svitlo/adapter-nextjs
          verify npm run code:check:types --workspace @svitlo/adapter-electron
          verify npm run code:check:types --workspace @svitlo/adapter-capacitor
          echo "Verification failures: $failures"
          exit "$failures"
      - name: Commit migrated imports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Migrate Engine imports across authored content and runtime consumers'
            git push origin HEAD:architecture/engine-build-runtime-exports-474
          fi
