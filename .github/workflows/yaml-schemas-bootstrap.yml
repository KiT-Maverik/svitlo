# Temporary one-off materialization step; remove after derived schemas are committed.
name: Refresh YAML editor schemas in integration-fix PR
on:
  pull_request:
    types: [opened, synchronize]
    branches: [integration/yaml-ts-scaffolders]
    paths:
      - 'shared/engine/scripts/generateYamlSchemas/**'
      - '.github/workflows/yaml-schemas-bootstrap.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'agent/508-scaffolder-integration-fixes' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run package:build --workspace @svitlo/contracts
      - run: npm run package:build --workspace @svitlo/engine
      - run: npm run content:generate:yaml-schemas --workspace @svitlo/engine
      - run: npm run content:check:yaml-schemas --workspace @svitlo/engine
      - name: Commit only reproducible derived JSON Schemas
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add -- shared/engine/yaml-schemas/*.schema.json
          if git diff --cached --quiet; then
            echo "Editor schema files are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(engine): refresh deduplicated YAML editor schemas"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
