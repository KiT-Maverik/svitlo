name: Chemistry Skills strict validation

on:
  pull_request:
    branches:
      - main
      - feat/chemistry-skills-integration
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'content/chemistry/data/skills/**'
      - '.github/workflows/chemistry-skills-validation.yml'

permissions:
  contents: read

concurrency:
  group: chemistry-skills-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Chemistry Skills / real taxonomy and strict TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Validate workspace manifests
        run: node scripts/check-workspaces.mjs
      - name: Validate Chemistry taxonomy graph
        run: node scripts/check-skills-taxonomy-structure.mjs content/chemistry/data/skills
      - name: Build real contracts and engine
        run: |
          npm run build --workspace @svitlo/contracts
          npm run build --workspace @svitlo/engine
      - name: Strict scoped TypeScript over every assigned agent entity
        if: github.base_ref == 'feat/chemistry-skills-integration'
        env:
          AGENT_BRANCH: ${{ github.head_ref }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const assignments = {
            'feat/chemistry-skills-agent-1': ['chemicalInquiry', 'substancesAndProperties', 'particlesAndStates'],
            'feat/chemistry-skills-agent-2': ['atomsAndPeriodicity', 'bondingAndStructure', 'mixturesAndSolutions'],
            'feat/chemistry-skills-agent-3': ['chemicalLanguageAndQuantities', 'chemicalReactions', 'acidBaseChemistry', 'energyRatesAndEquilibrium'],
            'feat/chemistry-skills-agent-4': ['inorganicChemistry', 'organicChemistry', 'chemistryInTheWorld'],
          };
          const assigned = assignments[process.env.AGENT_BRANCH];
          if (!assigned) throw new Error('Unknown Chemistry agent branch: ' + process.env.AGENT_BRANCH);
          const include = assigned.map(domain => 'data/skills/' + domain + '/**/*.ts');
          const cfg = {
            extends: './tsconfig.json',
            compilerOptions: { strict: true, incremental: false },
            include,
            exclude: [],
          };
          const path = 'content/chemistry/tsconfig.agent-validation.tmp.json';
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + '\n');
          console.log('Validating full assigned domain source:', include);
          NODE
          npx tsc --noEmit --project content/chemistry/tsconfig.agent-validation.tmp.json
      - name: Full Chemistry TypeScript with all authored data
        if: github.base_ref == 'main'
        run: npm run typecheck --workspace @svitlo/chemistry
      - name: Chemistry app build after integration
        if: github.base_ref == 'main'
        run: npm run build --workspace @svitlo/chemistry
