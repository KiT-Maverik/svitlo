name: Arithmetic taxonomy quality
on:
  pull_request:
    paths:
      - 'content/math/data/skills/arithmetic/**'
      - 'content/math/data/skills/**'
      - 'content/math/docs/skills/**'
      - 'content/math/scripts/**'
      - 'content/math/package.json'
      - 'shared/engine/**'
      - 'shared/contracts/**'
      - 'scripts/textbook-tooling/**'
      - '.github/workflows/arithmetic-taxonomy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Validate the arithmetic workspace and its compiled shared dependencies.
      # Root scripts check unrelated, sometimes untranslated textbook data.
      - run: npm run build --workspace @svitlo/contracts
      - run: npm run build --workspace @svitlo/engine
      - run: npm run build --workspace @svitlo/indexdb
      - run: npm run build --workspace @svitlo/ui-kit
      - run: npm run typecheck --workspace @svitlo/contracts
      - run: npm run typecheck --workspace @svitlo/engine
      - run: npm run typecheck --workspace @svitlo/math
      - run: node --test scripts/check-skills-taxonomy-structure.spec.mjs
      - run: node scripts/check-skills-taxonomy-structure.mjs
      - run: npm run test:components --workspace @svitlo/math
      - run: npm run build --workspace @svitlo/math
      - run: (cd content/math && node --test ../../scripts/textbook-tooling/test-publish.mjs)
      - run: (cd content/math && node ../../scripts/textbook-tooling/check-portability.mjs)
