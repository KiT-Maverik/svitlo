name: Synchronize Course Lesson PR statuses

# PR comment triggers become usable only after this workflow is merged to main.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, edited, converted_to_draft, ready_for_review, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open Course parent PR number
        type: number
        required: true

permissions: {}

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.body == '/course-status sync') ||
      (github.event_name == 'pull_request_target' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      valid: ${{ steps.resolve.outputs.valid }}
      pr: ${{ steps.resolve.outputs.pr }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve Course parent and authorize manual actors before checkout
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const type = process.env.GITHUB_EVENT_NAME, repo = process.env.GITHUB_REPOSITORY;
          const api = url => JSON.parse(execFileSync('gh', ['api', url], {
            encoding: 'utf8', timeout: 30000, maxBuffer: 8 * 1024 * 1024,
          }));
          const courseMarker = '<!-- svitlo-course-flow:v1 -->';
          const lessonMarker = '<!-- svitlo-course-lesson:v1 -->';
          const identity = body => {
            if (typeof body !== 'string' || body.split(courseMarker).length !== 2) return null;
            return body.match(/^- Course UUID:\s*([0-9a-f-]{36})\s*$/im)?.[1]?.toLowerCase() ?? null;
          };
          const output = { valid: 'false', pr: '', sha: '' };
          try {
            const manual = type !== 'pull_request_target';
            if (manual) {
              const actor = type === 'issue_comment' ? event.comment?.user?.login : process.env.GITHUB_ACTOR;
              if (!/^[A-Za-z0-9-]+$/.test(actor ?? '')) throw Error('Invalid actor');
              const permission = api('repos/' + repo + '/collaborators/' + actor + '/permission').permission;
              if (!['write', 'maintain', 'admin'].includes(permission)) throw Error('Write permission required');
            }
            const number = Number(type === 'issue_comment' ? event.issue?.number :
              type === 'workflow_dispatch' ? event.inputs?.pr_number : event.pull_request?.number);
            if (!Number.isSafeInteger(number) || number < 1) throw Error('Invalid PR number');
            const original = api('repos/' + repo + '/pulls/' + number);
            if (original.head?.repo?.full_name !== repo) throw Error('Same repository required');
            let parentNumber = number;
            if (!identity(original.body)) {
              if (manual || typeof original.body !== 'string' ||
                  original.body.split(lessonMarker).length !== 2) throw Error('Not a Course PR/child');
              const match = original.body.match(/^Parent PR:\s*#([1-9][0-9]*)\s*$/m);
              if (!match) throw Error('Missing Lesson parent');
              parentNumber = Number(match[1]);
            }
            const parent = parentNumber === number ? original : api('repos/' + repo + '/pulls/' + parentNumber);
            const courseId = identity(parent.body);
            if (!courseId || parent.state !== 'open' || parent.head?.repo?.full_name !== repo ||
                !/^[a-f0-9]{40}$/.test(parent.head?.sha ?? '')) throw Error('Open Course parent required');
            if (parentNumber !== number &&
                (!original.body.includes('Course: ' + courseId) ||
                 !original.body.includes('Parent PR: #' + parentNumber))) {
              throw Error('Lesson marker does not match parent Course UUID');
            }
            output.valid = 'true';
            output.pr = String(parentNumber);
            output.sha = parent.head.sha;
          } catch (error) {
            console.log('Course sync skipped or rejected: ' + String(error.message).slice(0, 300));
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            Object.entries(output).map(([key, value]) => key + '=' + value).join('\n') + '\n');
          NODE

  analyze:
    needs: resolve
    if: needs.resolve.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted synchronizer from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Check out pinned Course head as data only
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: course-head
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: trusted/package-lock.json
      - name: Install trusted dependencies without scripts
        working-directory: trusted
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test trusted inventory logic
        working-directory: trusted
        run: node --test scripts/syncCourseLessonStatus/*.spec.mjs
      - name: Analyze immutable Course data with read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          COURSE_PR: ${{ needs.resolve.outputs.pr }}
          COURSE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/course-lessons"
          node trusted/scripts/syncCourseLessonStatus/sync-course-lessons.mjs analyze \
            --repo "$GITHUB_REPOSITORY" --pr "$COURSE_PR" --sha "$COURSE_SHA" \
            --root course-head --out "$RUNNER_TEMP/course-lessons/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: course-lesson-status-${{ needs.resolve.outputs.pr }}
          path: ${{ runner.temp }}/course-lessons/report.json
          retention-days: 7
          if-no-files-found: error

  update:
    needs: [resolve, analyze]
    if: needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: course-lessons-description-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted default-branch updater only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: course-lesson-status-${{ needs.resolve.outputs.pr }}
          path: report
      - name: Validate report and update only managed Lessons region
        env:
          GH_TOKEN: ${{ github.token }}
          COURSE_PR: ${{ needs.resolve.outputs.pr }}
          COURSE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          test "$(find report -maxdepth 1 -type f | wc -l)" -eq 1
          test -f report/report.json
          node scripts/syncCourseLessonStatus/sync-course-lessons.mjs update \
            --repo "$GITHUB_REPOSITORY" --pr "$COURSE_PR" --sha "$COURSE_SHA" \
            --report report/report.json
