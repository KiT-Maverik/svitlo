name: One-time Playground Skill fixtures migration
# Retry after aligning JSON test ordering with the existing slug-sorted loader.
on:
  push:
    branches: [tooling/migrate-skill-definitions]
    paths: ['.github/workflows/one-shot-playground-skills.yml']
permissions:
  contents: write
concurrency:
  group: playground-skill-migration
  cancel-in-progress: true
jobs:
  migrate:
    if: github.repository == 'KiT-Maverik/svitlo-web'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - run: node --version && npm --version && npm ci
      - name: Prepare missing synthetic Playground descriptions (no production translations)
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';
          const root = 'content/playground/data/skills';
          let added = 0;
          function visit(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) visit(file);
              else if (entry.name.endsWith('.data.ts')) {
                const text = fs.readFileSync(file, 'utf8');
                const ast = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true);
                if (ast.parseDiagnostics.length) throw Error('Invalid fixture syntax: '+file);
                const declarations = ast.statements.filter(ts.isVariableStatement)
                  .flatMap(s=>s.declarationList.declarations).filter(d=>
                    ts.isCallExpression(d.initializer) && ts.isObjectLiteralExpression(d.initializer.arguments[0]));
                if (declarations.length !== 1) throw Error('Expected one fixture: '+file);
                const obj = declarations[0].initializer.arguments[0];
                const prop = name=>obj.properties.find(p=>ts.isPropertyAssignment(p)&&p.name.text===name);
                if (prop('description')) return;
                const slug = prop('slug')?.initializer?.text;
                const name = prop('name')?.initializer;
                if (!slug || !name || !ts.isObjectLiteralExpression(name)) throw Error('Malformed fixture: '+file);
                const localized = name.properties.map(p=>{
                  if (!ts.isPropertyAssignment(p) || !ts.isStringLiteral(p.initializer))
                    throw Error('Unexpected nonliteral fixture name: '+file);
                  const code = p.name.text;
                  return '      '+code+': '+JSON.stringify('[TEST '+code+'] Synthetic '+slug+' fixture.')+',';
                }).join('\n');
                const block = '  description: {\n'+
                  '    methodological: '+JSON.stringify('Synthetic Playground fixture for '+slug+'; testing only, not curricular content.')+',\n'+
                  '    frontend: {\n'+localized+'\n    },\n  },\n';
                const offset = obj.getEnd()-1;
                fs.writeFileSync(file, text.slice(0,offset)+block+text.slice(offset));
                added++;
              }
            }
          }
          visit(root);
          if (added !== 8) throw Error('Unexpected number of incomplete test fixtures: '+added);
          console.log('Added explicitly synthetic descriptions to',added,'Playground fixtures');
          JS
      - name: Migrate Playground with unchanged migrator
        run: |
          node scripts/migrate-skills-configurators.mjs --package content/playground --write
          node scripts/migrate-skills-configurators.mjs --package content/playground
          node --test scripts/migrate-skills-configurators.spec.mjs scripts/generators/data/publish-skills-data.spec.mjs scripts/generators/pages/skillAnalytics/generate-skill-analytics.spec.mjs
          git diff --check
      - name: Commit Playground fixtures and delete temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/playground/data/skills
          git rm -- .github/workflows/one-shot-playground-skills.yml
          git diff --cached --stat
          git commit -m "Migrate Playground test skills to define configurators"
          git fetch origin tooling/migrate-skill-definitions
          git rebase origin/tooling/migrate-skill-definitions
          git push origin HEAD:tooling/migrate-skill-definitions
