name: Agent CI Artifacts

# One scoped, opt-in report generator. Results exist only as one-day run-scoped Actions ZIP artifacts.
# This workflow must exist on the default branch before comment/manual triggers work.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Existing same-repository pull request number to operate on'
        required: true
        type: number
      kind:
        description: 'Reference family (required when generating)'
        required: false
        type: choice
        default: skills
        options:
          - skills
          - lessons
          - questions
          - courses
          - episodes
          - assessment-methods
          - ui-kit
          - geography-home-copy
          - education-standards
      textbook:
        description: 'For Skills/Lessons/Questions/Courses/Episodes: content/<book>'
        required: false
        type: string
      locale:
        description: 'Optional language code; empty means all languages in the selected scope'
        required: false
        type: string
      component:
        description: 'UI Kit component name; empty means all dictionaries'
        required: false
        type: string
      lesson:
        description: 'Optional Lesson UUID (requires kind=lessons or questions)'
        required: false
        type: string
      course:
        description: 'Course UUID (required for episodes; optional for courses)'
        required: false
        type: string
      episode:
        description: 'Exact Episode UUID (requires kind=episodes and locale)'
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: agent-ci-artifacts-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Authorize command and resolve source PR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/agent-artifacts generate'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.request.outputs.pr }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      branch: ${{ steps.request.outputs.branch }}
      kind: ${{ steps.request.outputs.kind }}
      textbook: ${{ steps.request.outputs.textbook }}
      locale: ${{ steps.request.outputs.locale }}
      component: ${{ steps.request.outputs.component }}
      lesson: ${{ steps.request.outputs.lesson }}
      course: ${{ steps.request.outputs.course }}
      episode: ${{ steps.request.outputs.episode }}
    steps:
      - name: Resolve trusted PR context without checking out code
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const isComment = process.env.GITHUB_EVENT_NAME === 'issue_comment';
          const pr = isComment ? event.issue.number : Number(event.inputs.pr_number);
          if (!Number.isSafeInteger(pr) || pr < 1) throw Error('Valid PR number required');
          const parts = isComment ? event.comment.body.trim().split(/\s+/) : [];
          const operation = 'generate';
          let kind = '', textbook = '', locale = '', component = '', lesson = '', course = '', episode = '';
          if (isComment) {
            if (parts[0] !== '/agent-artifacts' || parts[1] !== 'generate') throw Error('Unknown command');
              kind = parts[2] || '';
              if (kind === 'skills' || kind === 'lessons' || kind === 'questions') {
                if (![4, 5].includes(parts.length)) {
                  throw Error('Usage: /agent-artifacts generate ' + kind + ' content/<book> [locale]');
                }
                textbook = parts[3];
                locale = parts[4] || '';
              } else if (kind === 'courses') {
                if (![4, 5, 6].includes(parts.length)) throw Error('Usage: /agent-artifacts generate courses content/<book> [course-uuid] [locale]');
                textbook = parts[3];
                const extra = parts.slice(4);
                if (extra.length === 1) {
                  if (/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(extra[0])) course = extra[0].toLowerCase();
                  else locale = extra[0];
                } else if (extra.length === 2) {
                  course = extra[0].toLowerCase();
                  locale = extra[1];
                }
              } else if (kind === 'episodes') {
                if (parts.length !== 7) throw Error('Usage: /agent-artifacts generate episodes content/<book> <course-uuid> <episode-uuid> <locale>');
                textbook=parts[3]; course=parts[4].toLowerCase(); episode=parts[5].toLowerCase(); locale=parts[6];
              } else if (kind === 'ui-kit') {
                if (![4, 5].includes(parts.length)) {
                  throw Error('Usage: /agent-artifacts generate ui-kit <component|all> [locale]');
                }
                component = parts[3] === 'all' ? '' : parts[3];
                locale = parts[4] || '';
              } else if (kind === 'assessment-methods' || kind === 'geography-home-copy' || kind === 'education-standards') {
                if (![3, 4].includes(parts.length)) {
                  throw Error('Usage: /agent-artifacts generate ' + kind + ' [locale]');
                }
                locale = parts[3] || '';
              } else {
                throw Error('Explicit kind required: skills, lessons, questions, courses, episodes, ui-kit, assessment-methods, geography-home-copy, education-standards');
              }
          } else {
            ({ kind = '', textbook = '', locale = '', component = '', lesson = '', course = '', episode = '' } = event.inputs);
          }
          const allowed = ['skills', 'lessons', 'questions', 'courses', 'episodes', 'ui-kit', 'assessment-methods', 'geography-home-copy', 'education-standards'];
          if (!allowed.includes(kind)) throw Error('Unsupported reference family');
            if ((kind === 'skills' || kind === 'lessons' || kind === 'questions' || kind === 'courses' || kind === 'episodes') !== Boolean(textbook) ||
                (textbook && !/^content\/[a-z][a-z0-9-]*$/.test(textbook))) {
              throw Error('Only Skills, Lessons, Questions, Courses and Episodes require content/<book>');
            }
            if (locale && !/^[a-z]{2,4}$/.test(locale)) throw Error('Invalid locale');
            if (component && (kind !== 'ui-kit' || !/^[A-Za-z][A-Za-z0-9]*$/.test(component))) {
              throw Error('Invalid UI Kit component');
            }
            if (lesson && (!['lessons', 'questions'].includes(kind) ||
                !/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(lesson))) {
              throw Error('Invalid Lesson UUID');
            }
            if (course && (!['courses','episodes'].includes(kind) ||
                !/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(course))) {
              throw Error('Invalid Course UUID');
            }
            if (kind === 'episodes' && (!course || !episode || !locale || !/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(episode))) throw Error('Exact Course, Episode and locale required');
            if (episode && kind !== 'episodes') throw Error('Episode UUID only supported for episodes');
          const headers = {
            authorization: 'Bearer ' + process.env.GH_TOKEN,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2022-11-28',
          };
          if (isComment) {
            const author = event.comment.user?.login;
            if (typeof author !== 'string' || !/^[a-zA-Z0-9-]+$/.test(author)) {
              throw Error('Valid PR comment author required');
            }
            // Check actual repository access: author_association is not a permission level.
            // GitHub maps the maintain role to permission=write.
            const accessResponse = await fetch('https://api.github.com/repos/' +
              process.env.GITHUB_REPOSITORY + '/collaborators/' +
              encodeURIComponent(author) + '/permission', { headers });
            if (!accessResponse.ok) {
              throw Error('Cannot authorize PR comment by ' + author +
                ': permission lookup HTTP ' + accessResponse.status);
            }
            const { permission } = await accessResponse.json();
            if (!['write', 'maintain', 'admin'].includes(permission)) {
              throw Error('PR comment author ' + author +
                ' lacks write, maintain or admin repository access');
            }
          }
          const response = await fetch('https://api.github.com/repos/' +
            process.env.GITHUB_REPOSITORY + '/pulls/' + pr, { headers });
          if (!response.ok) throw Error('Unable to read PR: HTTP ' + response.status);
          const pull = await response.json();
          if (pull.state !== 'open') throw Error('PR must be open');
          if (pull.head.repo?.full_name !== process.env.GITHUB_REPOSITORY) {
            throw Error('Only PR branches from this repository are allowed');
          }
          if (pull.head.ref === pull.base.repo.default_branch) {
            throw Error('Cannot analyze the default branch as a PR source');
          }
          if (!/^[a-zA-Z0-9][a-zA-Z0-9._\/-]*$/.test(pull.head.ref) ||
              pull.head.ref.includes('..') || pull.head.ref.endsWith('/') ||
              pull.head.ref.startsWith('-')) throw Error('Unsafe branch ref');
          const entries = {
            pr: String(pr), head_sha: pull.head.sha,
            branch: pull.head.ref, kind, textbook, locale, component, lesson, course, episode,
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            Object.entries(entries).map(([k,v]) => k + '=' + v).join('\n') + '\n');
          NODE

  generate:
    name: Generate selected Markdown references
    needs: resolve
    if: needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SVITLO_AGENT_REPORT_PR: ${{ needs.resolve.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies for the requested generator
        run: npm ci --silent --ignore-scripts --no-audit --no-fund
      - name: Detect complete EducationStandard authoring matrix
        id: catalog_check
        if: needs.resolve.outputs.kind == 'education-standards'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { readSupportedLanguageCodes } from './shared/engine/scripts/readSupportedLanguages/read-supported-languages.mjs';
          import {
            readEducationStandardSources,
            hasCompleteEducationStandardLocales,
          } from './scripts/generateTranslationReviewArtifacts/education-standards-reference.mjs';
          const registered = readSupportedLanguageCodes();
          const entries = readEducationStandardSources(process.cwd(), registered);
          const complete = hasCompleteEducationStandardLocales(entries, registered);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'complete=' + complete + '\n');
          NODE
      - name: Build Engine for typed Lesson/Course or complete EducationStandard generation
        if: needs.resolve.outputs.kind == 'lessons' || needs.resolve.outputs.kind == 'courses' || needs.resolve.outputs.kind == 'episodes' || (needs.resolve.outputs.kind == 'education-standards' && steps.catalog_check.outputs.complete == 'true')
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build --workspace @svitlo/engine
      - name: Generate only the selected reference scope
        env:
          SVITLO_AGENT_REPORT_OUTPUT: ${{ runner.temp }}/agent-reference-library
          REQUEST_KIND: ${{ needs.resolve.outputs.kind }}
          REQUEST_BOOK: ${{ needs.resolve.outputs.textbook }}
          REQUEST_LOCALE: ${{ needs.resolve.outputs.locale }}
          REQUEST_COMPONENT: ${{ needs.resolve.outputs.component }}
          REQUEST_LESSON: ${{ needs.resolve.outputs.lesson }}
          REQUEST_COURSE: ${{ needs.resolve.outputs.course }}
          REQUEST_EPISODE: ${{ needs.resolve.outputs.episode }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--kind "$REQUEST_KIND")
          if [[ -n "$REQUEST_BOOK" ]]; then args+=(--package "$REQUEST_BOOK"); fi
          if [[ -n "$REQUEST_LOCALE" ]]; then args+=(--locale "$REQUEST_LOCALE"); fi
          if [[ -n "$REQUEST_COMPONENT" ]]; then args+=(--component "$REQUEST_COMPONENT"); fi
          if [[ -n "$REQUEST_LESSON" ]]; then args+=(--lesson "$REQUEST_LESSON"); fi
          if [[ -n "$REQUEST_COURSE" ]]; then args+=(--course "$REQUEST_COURSE"); fi
          if [[ -n "$REQUEST_EPISODE" ]]; then args+=(--episode "$REQUEST_EPISODE"); fi
          node scripts/generateTranslationReviewArtifacts/generate-translation-review-artifacts.mjs "${args[@]}"
      - name: Validate pinned manifest, scope, checksums and archive inventory
        env:
          SVITLO_AGENT_REPORT_OUTPUT: ${{ runner.temp }}/agent-reference-library
          SOURCE_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          REQUEST_KIND: ${{ needs.resolve.outputs.kind }}
          REQUEST_BOOK: ${{ needs.resolve.outputs.textbook }}
          REQUEST_LOCALE: ${{ needs.resolve.outputs.locale }}
          REQUEST_COMPONENT: ${{ needs.resolve.outputs.component }}
          REQUEST_LESSON: ${{ needs.resolve.outputs.lesson }}
          REQUEST_COURSE: ${{ needs.resolve.outputs.course }}
          REQUEST_EPISODE: ${{ needs.resolve.outputs.episode }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const output = process.env.SVITLO_AGENT_REPORT_OUTPUT;
          const manifest = JSON.parse(fs.readFileSync(path.join(output, 'manifest.json'), 'utf8'));
          const request = {kind:process.env.REQUEST_KIND,package:process.env.REQUEST_BOOK || null,
            locale:process.env.REQUEST_LOCALE || null,component:process.env.REQUEST_COMPONENT || null,
            lesson:process.env.REQUEST_LESSON || null,course:process.env.REQUEST_COURSE || null,
            ...(process.env.REQUEST_KIND==='episodes'?{episode:process.env.REQUEST_EPISODE}: {})};
          if (manifest.schemaVersion !== 3 || manifest.kind !== 'pr-scoped-agent-ci-artifacts' ||
              manifest.sourceCommit !== process.env.SOURCE_HEAD_SHA ||
              manifest.pr !== Number(process.env.SVITLO_AGENT_REPORT_PR) ||
              manifest.runId !== Number(process.env.GITHUB_RUN_ID) ||
              !manifest.scope || !Array.isArray(manifest.generated) ||
              !Array.isArray(manifest.failures) || manifest.generated.length === 0 ||
              manifest.generated.length > 10000 ||
              !['complete','incomplete'].includes(manifest.status)) {
            throw Error('Invalid, missing or stale report manifest');
          }
          for (const [key, value] of Object.entries(request)) {
            if (manifest.scope[key] !== value) throw Error('Report scope does not match authorized request: ' + key);
          }
          const expected = new Set(['manifest.json']);
          let total = 0;
          for (const item of manifest.generated) {
            if (typeof item.path !== 'string' ||
                !/^[a-zA-Z0-9._/-]+\.md$/.test(item.path) ||
                item.path.startsWith('/') || item.path.split('/').some(part => part === '..' || part === '.') ||
                expected.has(item.path) || !/^[a-f0-9]{64}$/.test(item.sha256)) {
              throw Error('Unsafe or duplicate document in report manifest');
            }
            const filename = path.join(output, item.path);
            const stat = fs.lstatSync(filename);
            if (!stat.isFile() || stat.isSymbolicLink() ||
                stat.size !== item.bytes || stat.size > 16 * 1024 * 1024) throw Error('Unsafe report document');
            if (crypto.createHash('sha256').update(fs.readFileSync(filename)).digest('hex') !== item.sha256)
              throw Error('Review report checksum mismatch: ' + item.path);
            total += stat.size;
            expected.add(item.path);
          }
          if (total !== manifest.filesBytes || total > 128 * 1024 * 1024)
            throw Error('Invalid reference corpus size');
          const actual = new Set();
          function walk(directory, prefix = '') {
            for (const entry of fs.readdirSync(directory, {withFileTypes:true})) {
              const relative = prefix ? prefix + '/' + entry.name : entry.name;
              if (entry.isSymbolicLink()) throw Error('Symlink in report archive');
              if (entry.isDirectory()) walk(path.join(directory, entry.name), relative);
              else if (entry.isFile()) actual.add(relative);
              else throw Error('Unsupported report archive file type');
            }
          }
          walk(output);
          if (actual.size !== expected.size || [...actual].some(item => !expected.has(item)))
            throw Error('Unlisted files in report archive');
          NODE
      - name: Upload run-scoped reference corpus
        uses: actions/upload-artifact@v4
        with:
          name: agent-reference-pr-${{ needs.resolve.outputs.pr }}-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-reference-library/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
