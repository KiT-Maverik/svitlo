name: Temporary course-flow preflight 653
on:
  pull_request:
    paths:
      - '.github/workflows/course-flow-preflight-653.yml'
      - 'content/astronomy/data/courses/**'
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.number == 653
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify exact Stage 3 Course plan
        run: node shared/engine/scripts/validateCourseFlow/validate-course-flow.mjs --file content/astronomy/data/courses/b/1e79d8fc-2223-4fa7-bc64-70d8172d3e8b/course.yaml --stage 3-complete
      - name: Course validator regression tests
        run: node --test shared/engine/scripts/validateCourseFlow/validate-course-flow.spec.mjs
