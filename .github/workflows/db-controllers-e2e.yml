name: Native IndexedDB browser controllers
on:
  push:
    branches: [test/db-controllers-e2e]
  pull_request:
    paths:
      - 'shared/indexdb/**'
      - 'shared/contracts/**'
      # This workflow also runs the Playground Playwright suite.
      - 'learningApps/playground/src/app/topics/light/light.e2e.spec.ts'
      - '.github/workflows/db-controllers-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  browser-controllers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run packages:check
      # Run only this workflow's browser dependencies. Root commands check all
      # textbook workspaces, including unrelated in-progress authored translations.
      - run: npm run build --workspace @svitlo/contracts
      - run: npm run build --workspace @svitlo/engine
      - run: npm run build --workspace @svitlo/indexdb
      - run: npm run build --workspace @svitlo/ui-kit
      - run: npm run typecheck --workspace @svitlo/contracts
      - run: npm run typecheck --workspace @svitlo/indexdb
      - run: npm run typecheck --workspace @svitlo/ui-kit
      - run: npm run typecheck --workspace @svitlo/playground
      - run: npm run test --workspace @svitlo/indexdb
      - run: npm run test --workspace @svitlo/ui-kit
      - run: npm run lint --workspace @svitlo/playground
      - run: npm run build --workspace @svitlo/playground
      - run: npx playwright install chromium
      - name: Native IndexedDB Chromium
        run: npm run test:e2e:db
      - name: Native IndexedDB Chromium repeat
        run: npm run test:e2e:db
      - name: Existing Playwright suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-browser-test-results
          path: |
            shared/indexdb/test-results/
            shared/indexdb/playwright-report/
            learningApps/playground/test-results/
            learningApps/playground/playwright-report/
