name: Native IndexedDB browser controllers

on:
  pull_request:
    paths:
      - 'shared/indexdb/**'
      - '.github/workflows/db-controllers-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexdb-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-controllers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:build --workspace @svitlo/engine
      - run: npm run package:build --workspace @svitlo/indexdb
      - run: npx playwright install chromium
      - name: Native IndexedDB Chromium
        run: npm run test:e2e:db --workspace @svitlo/indexdb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexdb-browser-test-results
          path: |
            shared/indexdb/test-results/
            shared/indexdb/playwright-report/
