name: Native IndexedDB browser controllers

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'shared/indexdb/**'
      - '.github/workflows/db-controllers-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexdb-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-controllers:
    # Full host/browser/generator suites only at review boundary or explicitly on demand.
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build --workspace @svitlo/engine
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build --workspace @svitlo/indexdb
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npx playwright install chromium
      - name: Native IndexedDB Chromium
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:e2e:db --workspace @svitlo/indexdb
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: indexdb-browser-test-results
          path: |
            shared/indexdb/test-results/
            shared/indexdb/playwright-report/
