name: Geography skills taxonomy quality

on:
  pull_request:
    paths:
      - 'content/geography/**'
      - '.github/workflows/geography-skills.yml'
  push:
    branches:
      - feat/geography-skills-integration
    paths:
      - 'content/geography/**'
      - '.github/workflows/geography-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geography-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-workspaces.mjs
      - run: node scripts/check-skills-taxonomy-structure.mjs content/geography/data/skills
      - run: npm run build --workspace @svitlo/contracts
      - run: npm run build --workspace @svitlo/engine
      - name: Strict scoped TypeScript check for the agent's complete owned subtrees
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/geography-skills-agent-')
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const match = (process.env.GITHUB_HEAD_REF || '').match(/^feat\/geography-skills-agent-([1-4])$/);
          if (!match) throw new Error('Missing recognized agent head branch');
          const ownership = {
            '1': ['spatialOrientation', 'mapsAndGeospatialRepresentations', 'geographicObjects'],
            '2': ['landformsAndSurfaceProcesses', 'geology'],
            '3': ['waterSystems', 'atmosphereWeatherAndClimate'],
            '4': ['naturalRegionsAndBiogeography', 'humanGeography', 'environmentAndSociety', 'geographicInquiry'],
          };
          const packageRoot = 'content/geography';
          const skillRoot = path.join(packageRoot, 'data/skills');
          const files = [];
          function collect(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) collect(file);
              else if (entry.name.endsWith('.data.ts')) files.push(path.relative(packageRoot, file).split(path.sep).join('/'));
            }
          }
          for (const root of ownership[match[1]]) collect(path.join(skillRoot, root));
          if (!files.length) throw new Error('No owned taxonomy files to typecheck');
          const config = {
            extends: './tsconfig.json',
            compilerOptions: { incremental: false },
            files: files.sort(),
            include: [],
            exclude: [],
          };
          fs.writeFileSync(path.join(packageRoot, '.tsconfig.geography-agent.tmp.json'), JSON.stringify(config, null, 2));
          console.log('Checking', files.length, 'owned .data.ts entities with strict Geography tsconfig and real imports');
          NODE
          npx tsc --noEmit --project content/geography/.tsconfig.geography-agent.tmp.json
      - run: npm run typecheck --workspace @svitlo/geography
      - run: npm run build --workspace @svitlo/geography
