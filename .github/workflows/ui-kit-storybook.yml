name: UI Kit Storybook

# AGENT NOTE (temporary CI policy, 2026-10-30):
# Automatic PR and main-branch push Storybook builds are paused to avoid
# unnecessary CI runs during taxonomy/content-focused early development.
# Keep this workflow manually runnable from GitHub Actions.
# RE-ENABLE automatic PR/push triggers when UI Kit / Storybook is actively
# developed and before production release; consider change filters and
# cancellation of superseded runs when restoring automation.
# Agents changing UI Kit code should validate locally when possible.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run storybook:build --workspace @svitlo/ui-kit
      - name: Verify story inventory, generated docs and shared flags
        run: |
          test -s shared/ui-kit/storybook-static/flags/ua.svg
          node -e 'const fs = require("node:fs"); const index = JSON.parse(fs.readFileSync("shared/ui-kit/storybook-static/index.json", "utf8")); const entries = Object.values(index.entries); const files = new Set(entries.filter(e => e.type === "story").map(e => e.importPath)); if (files.size !== 21) throw new Error("Expected 21 Storybook story source files, got " + files.size); if (!entries.some(e => e.type === "docs")) throw new Error("Autogenerated Storybook docs missing"); console.log("Story files: " + files.size + "; docs entries: " + entries.filter(e => e.type === "docs").length)'
