name: UI Kit Storybook

# AGENT NOTE (temporary CI policy, 2026-10-30):
# Automatic PR and main-branch push Storybook builds are paused to avoid
# unnecessary CI runs during taxonomy/content-focused early development.
# Keep this workflow manually runnable from GitHub Actions.
# RE-ENABLE automatic PR/push triggers when UI Kit / Storybook is actively
# developed and before production release; consider change filters and
# cancellation of superseded runs when restoring automation.
# Agents changing UI Kit code should validate locally when possible.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run app:build-storybook
