# Temporary, PR-scoped diagnostic; remove after dependency remediation is verified.
name: PR 805 dependency audit diagnostic

concurrency:
  group: pr805-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [maintenance/remediate-npm-dependency-security]

permissions:
  contents: write

jobs:
  audit:
    if: github.repository == 'KiT-Maverik/svitlo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve updated manifests using npm without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation from generated lockfile
        run: npm ci --no-audit --no-fund
      - name: Capture both npm audit scopes
        shell: bash
        run: |
          set +e
          npm audit --json >/tmp/pr805-full.json
          code=$?
          if [[ $code -gt 1 ]]; then exit "$code"; fi
          npm audit --omit=dev --json >/tmp/pr805-prod.json
          code=$?
          if [[ $code -gt 1 ]]; then exit "$code"; fi
      - name: Summarize advisories, resolution paths and available fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')).packages;
          const out = [];
          for (const scope of ['full', 'prod']) {
            const data = JSON.parse(fs.readFileSync(`/tmp/pr805-${scope}.json`, 'utf8'));
            out.push(`### ${scope} findings: ${JSON.stringify(data.metadata?.vulnerabilities)}`);
            for (const [name, v] of Object.entries(data.vulnerabilities || {})) {
              const via = (v.via || []).map(x => typeof x === 'string' ? x : `${x.url || x.name} [${x.range}]`).join('; ');
              const seen = Object.entries(lock).filter(([p]) => p.endsWith('/node_modules/' + name) || p === 'node_modules/' + name).map(([path, obj]) => `${obj.version}@${path}`).join(', ');
              out.push(JSON.stringify({package:name, severity:v.severity, direct:v.isDirect, range:v.range, resolved:seen, nodes:v.nodes, via, fix:v.fixAvailable}));
            }
          }
          const report = out.join('\n')+'\n';
          console.log(report);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '<details><summary>PR 805 npm audit diagnostic</summary>\n\n```text\n'+report.slice(0,60000)+'\n```\n</details>\n');
          NODE
      - name: Trace deprecated and blocked-script package owners
        shell: bash
        run: |
          set +e
          for p in inflight glob rimraf whatwg-encoding boolean eslint core-js-pure electron-winstaller esbuild fsevents unrs-resolver; do
            echo "::group::npm explain $p"
            npm explain "$p" 2>&1 | head -45
            echo "::endgroup::"
          done
      - name: Inspect affected framework versions
        run: npm ls next eslint-config-next react react-dom react-server-dom-webpack react-server-dom-turbopack react-server-dom-parcel --all --depth=2 || true
      - name: Verify repository package boundaries
        run: npm run repo:check:packages
      - name: Commit npm-generated lockfile to this PR branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code -- package-lock.json; then
            echo "npm lockfile unchanged"
            exit 0
          fi
          test "$PR_SOURCE_BRANCH" = "maintenance/remediate-npm-dependency-security"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "fix: refresh npm lockfile for patched Next.js and React"
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push --quiet origin "HEAD:refs/heads/$PR_SOURCE_BRANCH"

  hosts:
    name: Next.js Web and Platform builds and Web smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build
      - name: Build Web using the real compiled Math textbook
        env:
          SVITLO_TEXTBOOK: math
          SVITLO_MEDIA_MODE: draft
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:build --workspace @svitlo/web
      - name: Build independent Platform host
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:build --workspace @svitlo/platform
      - name: Smoke-test Web dev server with an explicitly selected textbook
        env:
          SVITLO_TEXTBOOK: math
          SVITLO_MEDIA_MODE: draft
        shell: bash
        run: |
          set -euo pipefail
          npm run app:start:dev --workspace @svitlo/web >/tmp/pr805-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          passed=false
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail --max-time 3 http://127.0.0.1:3000/ -o /tmp/pr805-home.html 2>/dev/null; then
              passed=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -n 50 /tmp/pr805-web.log
              exit 1
            fi
            sleep 2
          done
          if [ "$passed" != true ]; then
            tail -n 50 /tmp/pr805-web.log
            exit 1
          fi
          echo "Web root route returned HTTP 2xx with explicit Math selection"

  tests-and-storybook:
    name: Workspace unit/components and Storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm test
      - name: UI Kit Storybook static build
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run storybook:build --workspace @svitlo/ui-kit
      - name: Web and Playground test components
        env:
          SVITLO_WEB_TEST_SELECTION: web-fixture-alpha
        run: node scripts/ci/quietRun/quiet-run.mjs -- node scripts/ci/productionQuality/run-selected-components.mjs

  types-and-lint:
    name: Repository TypeScript and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Check all TypeScript workspaces
        env:
          SVITLO_WEB_TEST_SELECTION: web-fixture-alpha
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run code:check:types
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run code:lint:check

  native-hosts:
    name: Electron and Capacitor package compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Build Electron host
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:build --workspace @svitlo/desktop
      - name: Build Capacitor host
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:build --workspace @svitlo/mobile
      - name: Check native host unit suites
        run: |
          node scripts/ci/quietRun/quiet-run.mjs -- npm run test --workspace @svitlo/desktop
          node scripts/ci/quietRun/quiet-run.mjs -- npm run test --workspace @svitlo/mobile
