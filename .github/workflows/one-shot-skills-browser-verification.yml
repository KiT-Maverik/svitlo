name: One-shot Skills browser and mobile verification (server props)
on:
  push:
    paths:
      - .github/workflows/one-shot-skills-browser-verification.yml
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run app:build --workspace @svitlo/web
      - run: npm run test:components --workspace @svitlo/web
      - run: npm exec --workspace @svitlo/web -- playwright install chromium --with-deps
      - run: npm run test:e2e --workspace @svitlo/web -- src/app/skillAnalytics.e2e.spec.ts --project=desktop
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run app:build --workspace @svitlo/mobile
      - run: npm run app:check:bundle --workspace @svitlo/mobile
      - run: npm run code:check:types --workspace @svitlo/mobile
