# Temporary, branch-scoped regeneration of the canonical Zod-derived
# Flashcard editor schema. Remove immediately after the generated commit.
name: Flashcard schema sync (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/flashcard-schema-sync-temp.yml'

permissions:
  contents: read

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run package:build --workspace @svitlo/engine
      - run: npm run content:generate:yaml-schemas --workspace @svitlo/engine
      - run: npx prettier --write shared/engine/yaml-schemas/flashcard.schema.json
      - name: Inspect canonical generated schema difference
        id: changes
        run: |
          git add shared/engine/yaml-schemas/flashcard.schema.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi
      - name: Create formatter GitHub App token
        if: steps.changes.outputs.changed == 'true'
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_FORMATTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_FORMATTER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - name: Commit generated schema on original PR branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate Flashcard Zod YAML editor schema"
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin "HEAD:refs/heads/$PR_HEAD_REF"
