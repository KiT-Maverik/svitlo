name: Sync repository labels

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.json'
      - '.github/workflows/sync-labels.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-labels
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rename legacy labels and synchronize the canonical catalogue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const desired = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            if (!Array.isArray(desired) || !desired.length) {
              throw new Error('Refusing label sync: empty or invalid catalogue.');
            }
            const names = new Set();
            for (const label of desired) {
              if (!label.name || !/^[a-fA-F0-9]{6}$/.test(label.color) ||
                  !label.description || label.description.length > 100) {
                throw new Error('Invalid label definition: ' + JSON.stringify(label));
              }
              const key = label.name.toLowerCase();
              if (names.has(key)) throw new Error('Duplicate label: ' + label.name);
              names.add(key);
            }
            // Update labels IN PLACE so that existing Issue/PR assignments survive.
            const legacyName = name => {
              if (name.startsWith('content: ')) return 'area: ' + name.slice(9);
              if (name === 'app: platform') return 'area: platform';
              if (name === 'backend: server') return 'area: server';
              return null;
            };
            const { owner, repo } = context.repo;
            const before = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner, repo, per_page: 100
            });
            const existing = new Map(before.map(label => [label.name.toLowerCase(), label]));
            let created = 0, updated = 0, renamed = 0, conflicts = 0;
            for (const label of desired) {
              const key = label.name.toLowerCase();
              const current = existing.get(key);
              if (current) {
                if (current.name !== label.name ||
                    current.color.toLowerCase() !== label.color.toLowerCase() ||
                    (current.description || '') !== label.description) {
                  await github.rest.issues.updateLabel({
                    owner, repo, name: current.name, new_name: label.name,
                    color: label.color, description: label.description
                  });
                  updated++;
                }
                const legacy = legacyName(label.name);
                if (legacy && existing.has(legacy.toLowerCase())) {
                  conflicts++;
                  core.warning('Both legacy and target labels exist: ' + legacy +
                    ' / ' + label.name + '. Leaving legacy label untouched for manual review.');
                }
              } else {
                const legacy = legacyName(label.name);
                const old = legacy ? existing.get(legacy.toLowerCase()) : null;
                if (old) {
                  await github.rest.issues.updateLabel({
                    owner, repo, name: old.name, new_name: label.name,
                    color: label.color, description: label.description
                  });
                  existing.delete(old.name.toLowerCase());
                  renamed++;
                } else {
                  await github.rest.issues.createLabel({ owner, repo, ...label });
                  created++;
                }
                existing.set(key, label);
              }
            }
            // Never delete unmanaged or historical labels.
            const after = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner, repo, per_page: 100
            });
            const actual = new Map(after.map(label => [label.name.toLowerCase(), label]));
            for (const label of desired) {
              const found = actual.get(label.name.toLowerCase());
              if (!found || found.name !== label.name ||
                  found.color.toLowerCase() !== label.color.toLowerCase() ||
                  (found.description || '') !== label.description) {
                throw new Error('Label sync postcondition failed: ' + label.name);
              }
            }
            core.info('Label sync completed: ' + JSON.stringify({
              previous: before.length, desired: desired.length, created, updated,
              renamed, conflicts, retained: after.length - desired.length
            }));
