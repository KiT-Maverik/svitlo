name: Assert media resources

on:
  pull_request:
    types: [ready_for_review, labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: assert-media-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assert-media:
    name: Assert media and generated resources
    # The label must already exist when Draft becomes Ready. Also support a
    # label added later, and revalidate each new commit while it remains.
    # This optional check must NOT replace mandatory branch protection.
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'assert: media')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test opt-in resource assertions
        run: node --test scripts/ci/assertMedia/assert-media.spec.mjs
      - name: Assert no unresolved Lesson, bank, or Course asset handoffs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/verifyProductionAssets/verify-production-assets.mjs "$BASE_SHA" "$HEAD_SHA"
      - name: Assert physical assets and generated publications
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SVITLO_MEDIA_MODE: production
        run: node scripts/ci/assertMedia/assert-media.mjs "$BASE_SHA" "$HEAD_SHA"
