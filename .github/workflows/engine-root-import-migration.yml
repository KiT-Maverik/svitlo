name: One-shot Engine consumer import migration

on:
  push:
    branches: [refactor-engine-structure]
    paths: [scripts/migrate-engine-imports.mjs]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Rewrite all tracked Engine consumers
        run: |
          node scripts/migrate-engine-imports.mjs --write
          node scripts/migrate-engine-imports.mjs --check
          git diff --check
      - name: Commit consumers and remove temporary workflow
        run: |
          rm .github/workflows/engine-root-import-migration.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "refactor(engine): migrate consumers to root imports"
          git push origin HEAD:refactor-engine-structure
