name: ContentBlock Build API

on:
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'shared/engine/configurators/contentBlocks/**'
      - 'shared/engine/configurators/_shared__configurators/**'
      - 'shared/engine/types/**'
      - 'shared/engine/package.json'
      - '.github/workflows/contentblock-build-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contentblock-build-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Full host/browser/generator suites only at review boundary or explicitly on demand.
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - name: Typecheck Engine and execute ContentBlock regression tests
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:contentblocks --workspace @svitlo/engine
