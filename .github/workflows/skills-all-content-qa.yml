# Temporary full content verification; remove from the PR after a successful run.
name: Skills all content QA
on:
  push:
    branches:
      - agent/skills-taxonomy-api-and-tooling
permissions:
  contents: read
concurrency:
  group: skills-all-content-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build and verify every content package
        run: node scripts/ci/buildChangedContent/build-changed-content.mjs --all
