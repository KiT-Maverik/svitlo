name: Agent 3 textbook package distributions

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/astronomy/**'
      - 'content/biology/**'
      - 'content/geography/**'
      - 'content/history/**'
      - 'content/informatics/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-workspaces.mjs'
      - 'scripts/check-package-boundaries.mjs'
      - 'scripts/check-extraction-readiness.mjs'
      - 'scripts/check-built-package-exports.mjs'
      - '.github/workflows/content-packages-agent-3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-3-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Five packages / build, types, lint, publish and portability
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Validate workspace and package boundaries
        run: npm run packages:check
      - name: Compile shared build dependencies
        run: |
          npm run build --workspace @svitlo/contracts
          npm run build --workspace @svitlo/engine
      - name: Build and test Agent 3 textbook distributions
        shell: bash
        run: |
          set -euo pipefail
          for textbook in astronomy biology geography history informatics; do
            echo "::group::@svitlo/$textbook"
            npm run build --workspace "@svitlo/$textbook"
            npm run typecheck --workspace "@svitlo/$textbook"
            npm run lint --workspace "@svitlo/$textbook"
            node --test "content/$textbook/scripts/publish.spec.mjs"
            node "content/$textbook/scripts/check-portability.mjs"
            echo "::endgroup::"
          done
          npm run test:locales --workspace @svitlo/geography
      - name: Check Agent 3 compiled metadata exports and owned manifests
        run: npm run packages:artifacts:check -- --packages content/astronomy content/biology content/geography content/history content/informatics
