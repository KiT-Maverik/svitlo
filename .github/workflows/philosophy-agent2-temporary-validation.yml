name: Temporary Agent 2 Philosophy typed validation
on:
  pull_request:
    branches:
      - review/philosophy-skills-ai-review
    types: [opened, synchronize, reopened]
    paths:
      - 'learningApps/philosophy/data/skills/**'
      - '.github/workflows/philosophy-agent2-temporary-validation.yml'
permissions:
  contents: read
jobs:
  strict-verify:
    name: Agent 2 / taxonomy and full authored TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Validate workspaces
        run: node scripts/check-workspaces.mjs
      - name: Validate full Philosophy taxonomy
        run: node scripts/check-skills-taxonomy-structure.mjs learningApps/philosophy/data/skills
      - name: Build real contracts and engine
        run: |
          npm run build --workspace @svitlo/contracts
          npm run build --workspace @svitlo/engine
      - name: Verify authored data inclusion and strict TypeScript
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('learningApps/philosophy/tsconfig.json'));if(!j.include?.some(x=>x.includes('data/**/*.ts')))process.exit(1)"
          npm run typecheck --workspace @svitlo/philosophy
