name: EducationStandard catalog

on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/ui-kit/data/definitions/educationStandards/**'
      - 'shared/ui-kit/scripts/generateLocales/**'
      - 'scripts/generateTranslationReviewArtifacts/education-standards-reference.*'
      - 'shared/engine/configurators/educationStandards/**'
      - '.github/workflows/education-standards.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: education-standards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: UI Kit EducationStandard definitions, localization and reference validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Engine
        run: npm run package:build --workspace @svitlo/engine
      - name: Typecheck UI Kit definitions
        run: npm run code:check:types --workspace @svitlo/ui-kit
      - name: Validate catalog and publish locale resources
        run: npm run test:locales --workspace @svitlo/ui-kit
      - name: Validate review reference generator
        run: node --test scripts/generateTranslationReviewArtifacts/education-standards-reference.spec.mjs
      - name: Check formatting
        run: npx prettier --check shared/ui-kit/data/definitions/educationStandards shared/ui-kit/scripts/generateLocales scripts/generateTranslationReviewArtifacts/education-standards-reference.mjs scripts/generateTranslationReviewArtifacts/education-standards-reference.spec.mjs
