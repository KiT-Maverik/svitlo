name: Typed Course materialization

# Typed-only Course Stage 5. Activation requires an authorized default-branch deployment.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - 'scripts/ci/courseMaterialization/**'
      - 'scripts/ci/directMaterialization/**'
      - 'shared/engine/generators/materializers/**'
      - 'shared/engine/types/workflow/**'
      - 'shared/engine/configurators/**'
      - 'shared/engine/scripts/loadAuthoredConfigurators/**'
      - 'shared/engine/build.ts'
      - 'shared/engine/package.json'
      - 'package-lock.json'
      - '.github/workflows/course-typed-materialization.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository Draft typed Course PR
        type: number
        required: true

permissions: {}

concurrency:
  group: typed-course-stage5-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  verify-implementation:
    name: Typed Course / source and trust boundary tests
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - name: Install pinned dependencies without lifecycle scripts
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --ignore-scripts --no-audit --no-fund
      - name: Assert clean trusted Engine preparation
        run: |
          test ! -e shared/engine/dist
          test ! -e shared/engine/temp
          git rev-parse HEAD
      - name: Build ordinary Engine package
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build --workspace @svitlo/engine
      - name: Test trusted typed Course Stage 5 boundary
        run: node --test --test-reporter=dot scripts/ci/courseMaterialization/typed-course-direct.spec.mjs scripts/ci/courseMaterialization/course-handoff-tables.spec.mjs scripts/ci/courseMaterialization/course-handoff-publish.spec.mjs scripts/ci/reviewEvidence/review-evidence.spec.mjs scripts/ci/directMaterialization/reserved-parent-slot.spec.mjs
      - name: Test Course source generator and atomic writer
        run: node --test --test-reporter=dot shared/engine/generators/materializers/course/materializeStage5.spec.mjs shared/engine/generators/materializers/course/materializeStage5.build.spec.mjs shared/engine/generators/materializers/course/sourceCommit.spec.mjs
      - name: Verify focused source formatting
        run: npx prettier --check scripts/ci/courseMaterialization/typed-course-direct*.mjs .github/workflows/course-typed-materialization.yml
      - name: Verify Engine build-time type contracts
        run: npm run code:check:types --workspace @svitlo/engine
      - name: Verify canonical Engine package build and public declarations
        run: |
          rm -rf shared/engine/dist
          npm run package:build --workspace @svitlo/engine
          test -s shared/engine/dist/build.d.ts
          test -s shared/engine/dist/runtime.d.ts

  resolve:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.body == '/course materialize'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      meta: ${{ steps.gate.outputs.meta }}
      pr: ${{ steps.gate.outputs.pr }}
      head: ${{ steps.gate.outputs.head }}
    steps:
      - name: Check out trusted default-branch authorization gate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: Verify exact source and authorized actor
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          COURSE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ci/courseMaterialization/typed-course-gate.mjs resolve

  analyze:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted materializers and immutable default-branch Lesson history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned PR as inert data, never a workflow or script source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.head }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: trusted/package-lock.json
      - name: Install only trusted dependencies without lifecycle scripts
        working-directory: trusted
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the ordinary Engine package
        working-directory: trusted
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm run package:build --workspace @svitlo/engine
      - name: Pull the pinned, credential-free worker image
        run: docker pull node:26.13.1-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
      - name: Execute direct Course entrypoint in an isolated worker and seal manifest
        env:
          COURSE_TYPED_META_B64: ${{ needs.resolve.outputs.meta }}
          COURSE_HEAD_ROOT: candidate
          COURSE_TYPED_REPORT: ${{ runner.temp }}/typed-course/manifest.json
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node trusted/scripts/ci/quietRun/quiet-run.mjs -- node trusted/scripts/ci/courseMaterialization/typed-course-direct.mjs analyze
      - name: Upload read-only job result
        uses: actions/upload-artifact@v6
        with:
          name: typed-course-stage5-${{ needs.resolve.outputs.pr }}-${{ github.run_id }}
          path: ${{ runner.temp }}/typed-course/manifest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, analyze]
    if: needs.analyze.result == 'success'
    outputs:
      proof: ${{ steps.commit.outputs.proof }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted default-branch publisher only
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out pinned PR data; never execute PR source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.head }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: trusted/package-lock.json
      - name: Install trusted TypeScript parser for static Course handoff verification
        working-directory: trusted
        run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --ignore-scripts --no-audit --no-fund
      - name: Download exact read-only job manifest
        uses: actions/download-artifact@v7
        with:
          name: typed-course-stage5-${{ needs.resolve.outputs.pr }}-${{ github.run_id }}
          path: report
      - name: Recheck source hashes and branch lease; commit attested files
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COURSE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COURSE_TYPED_META_B64: ${{ needs.resolve.outputs.meta }}
          COURSE_HEAD_ROOT: candidate
          COURSE_TYPED_REPORT: report/manifest.json
        run: node trusted/scripts/ci/quietRun/quiet-run.mjs -- node trusted/scripts/ci/courseMaterialization/typed-course-publish.mjs publish

  reconcile-pr-tables:
    needs: [resolve, analyze, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted metadata reconciliation (never candidate code)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/download-artifact@v7
        with:
          name: typed-course-stage5-${{ needs.resolve.outputs.pr }}-${{ github.run_id }}
          path: report
      - name: Verify committed file bytes and reconcile Lessons/Episodes tables only
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COURSE_COMMIT_PROOF: ${{ needs.publish.outputs.proof }}
          COURSE_TYPED_REPORT: report/manifest.json
        run: node scripts/ci/courseMaterialization/course-handoff-publish.mjs
