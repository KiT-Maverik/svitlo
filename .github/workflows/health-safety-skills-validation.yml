name: Health & Safety Skills strict validation

on:
  pull_request:
    branches:
      - main
      - feat/health-safety-skills-integration
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'content/health-safety/data/skills/**'
      - '.github/workflows/health-safety-skills-validation.yml'

permissions:
  contents: read

concurrency:
  group: health-safety-skills-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Health & Safety Skills / taxonomy and strict TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Validate workspace manifests
        run: node scripts/check-workspaces.mjs
      - name: Validate Health and Safety taxonomy graph
        run: node scripts/check-skills-taxonomy-structure.mjs content/health-safety/data/skills
      - name: Build real contracts and engine
        run: |
          npm run build --workspace @svitlo/contracts
          npm run build --workspace @svitlo/engine
      - name: Strict scoped TypeScript for the complete assigned agent subtrees
        if: github.base_ref == 'feat/health-safety-skills-integration'
        env:
          AGENT_BRANCH: ${{ github.head_ref }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const assignments = {
            'feat/health-safety-skills-agent-1': ['healthLiteracyAndCare', 'hygieneAndInfectionPrevention', 'nutritionAndFoodSafety', 'movementSleepAndEverydayRoutines'],
            'feat/health-safety-skills-agent-2': ['mentalWellBeingAndSupport', 'personalBoundariesAndViolencePrevention', 'sexualAndReproductiveHealth', 'substanceUseAndDependencePrevention'],
            'feat/health-safety-skills-agent-3': ['everydayAndOccupationalSafety', 'transportWaterAndOutdoorSafety', 'emergenciesAndCivilProtection'],
            'feat/health-safety-skills-agent-4': ['firstAidAndImmediateResponse', 'digitalAndConsumerSafety'],
          };
          const assigned = assignments[process.env.AGENT_BRANCH];
          if (!assigned) throw new Error('Unknown Health & Safety agent branch: ' + process.env.AGENT_BRANCH);
          const include = assigned.map(domain => 'data/skills/' + domain + '/**/*.ts');
          const cfg = {
            extends: './tsconfig.json',
            compilerOptions: { strict: true, incremental: false },
            include,
            exclude: [],
          };
          const path = 'content/health-safety/tsconfig.agent-validation.tmp.json';
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + '\n');
          console.log('Validating complete assigned domain source:', include);
          NODE
          npx tsc --noEmit --project content/health-safety/tsconfig.agent-validation.tmp.json
      - name: Full workspace TypeScript diagnostic on agent PR
        if: github.base_ref == 'feat/health-safety-skills-integration'
        continue-on-error: true
        run: npm run typecheck --workspace @svitlo/health-safety
      - name: Full Health and Safety TypeScript
        if: github.base_ref == 'main'
        run: npm run typecheck --workspace @svitlo/health-safety
      - name: Full Health and Safety app build
        if: github.base_ref == 'main'
        run: npm run build --workspace @svitlo/health-safety
