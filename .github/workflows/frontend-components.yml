name: Frontend component quality
on:
  push:
    branches: [test/frontend-components-unit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm ci --no-audit --no-fund
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run test:components:coverage
      - run: npm test
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run code:check:types
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run code:lint:check
      - run: node scripts/ci/quietRun/quiet-run.mjs -- npm run app:build
