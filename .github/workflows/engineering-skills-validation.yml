name: Engineering Skills strict validation

on:
  pull_request:
    branches:
      - main
      - feat/engineering-skills-integration
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'content/engineering/data/skills/**'
      - '.github/workflows/engineering-skills-validation.yml'

permissions:
  contents: read

concurrency:
  group: engineering-skills-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Engineering Skills / taxonomy and strict TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check workspace manifests
        run: node scripts/check-workspaces.mjs
      - name: Check Engineering Skills graph
        run: node scripts/check-skills-taxonomy-structure.mjs content/engineering/data/skills
      - name: Build real contracts and engine
        run: |
          npm run build --workspace @svitlo/contracts
          npm run build --workspace @svitlo/engine
      - name: Strict scoped TypeScript over complete assigned agent domains
        if: github.base_ref == 'feat/engineering-skills-integration'
        env:
          AGENT_BRANCH: ${{ github.head_ref }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const assignments = {
            'feat/engineering-skills-agent-1': ['engineeringDesign', 'systemsEngineering', 'materialsAndConnections', 'mechanismsAndMachines'],
            'feat/engineering-skills-agent-2': ['thermalAndFluidDevices', 'structuresAndConstruction', 'waterAndEnvironmentalInfrastructure', 'energySystems'],
            'feat/engineering-skills-agent-3': ['electricalAndElectronicEngineering', 'automationAndRobotics', 'transportationAndAerospaceEngineering', 'communicationAndMeasurementDevices'],
            'feat/engineering-skills-agent-4': ['manufacturingAndProduction', 'processAndAgriculturalEngineering', 'humanCenteredEngineeringAndErgonomics', 'biomimicry', 'biomedicalAndAssistiveEngineering', 'safetySustainabilityAndResponsibility'],
          };
          const domains = assignments[process.env.AGENT_BRANCH];
          if (!domains) throw new Error('Unknown Engineering Skills agent branch: ' + process.env.AGENT_BRANCH);
          const include = domains.map(domain => 'data/skills/' + domain + '/**/*.ts');
          const config = {
            extends: './tsconfig.json',
            compilerOptions: { strict: true, incremental: false },
            include,
            exclude: [],
          };
          const path = 'content/engineering/tsconfig.agent-validation.tmp.json';
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log('Validating assigned domain globs:', include);
          NODE
          npx tsc --noEmit --project content/engineering/tsconfig.agent-validation.tmp.json
      - name: Full Engineering workspace TypeScript diagnostic for agent PRs
        if: github.base_ref == 'feat/engineering-skills-integration'
        continue-on-error: true
        run: npm run typecheck --workspace @svitlo/engineering
      - name: Full Engineering workspace TypeScript after integration
        if: github.base_ref == 'main'
        run: npm run typecheck --workspace @svitlo/engineering
      - name: Build complete Engineering app after integration
        if: github.base_ref == 'main'
        run: npm run build --workspace @svitlo/engineering
