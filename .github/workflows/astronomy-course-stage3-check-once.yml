name: Astronomy Stage 3 validation (temporary)

on:
  push:
    branches: [course/astronomy-grade-one]
    paths:
      - .github/workflows/astronomy-course-stage3-check-once.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate actual astronomy course.yaml at Stage 3 complete
        run: >-
          node shared/engine/scripts/validateCourseFlow/validate-course-flow.mjs
          --file content/astronomy/data/courses/b/1e79d8fc-2223-4fa7-bc64-70d8172d3e8b/course.yaml
          --stage 3-complete
      - name: Run Course Flow validator regression tests
        run: node --test shared/engine/scripts/validateCourseFlow/validate-course-flow.spec.mjs
      - name: Inspect lesson slots, quiz intent, Skill coverage and Course structure
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const YAML = require('yaml');
          const f = 'content/astronomy/data/courses/b/1e79d8fc-2223-4fa7-bc64-70d8172d3e8b/course.yaml';
          const source = YAML.parse(fs.readFileSync(f, 'utf8'), { uniqueKeys: true, maxAliasCount: 0 });
          const totals = { module: 0, chapter: 0, lesson: 0, episode: 0 };
          const covered = new Set();
          const quiz = {};
          const seen = new Set();
          function walk(collection) {
            if (!collection) return;
            assert.deepEqual(Object.keys(collection.items).sort(), [...collection.order].sort());
            for (const key of collection.order) {
              const n = collection.items[key];
              assert.equal(n.slug, key);
              totals[n.type]++;
              if (n.type === 'lesson') {
                assert(!n.lessonId, 'planned Lesson has an early ID: ' + key);
                assert(typeof n.methodology === 'string' && n.methodology.length > 1200, 'missing complete methodology: ' + key);
                assert.equal(typeof n.quizRequired, 'boolean', 'missing quiz intent: ' + key);
                assert(!seen.has(key), 'duplicate Lesson slug: ' + key);
                seen.add(key);
                quiz[key] = n.quizRequired;
                for (const skill of n.skills) {
                  assert(n.methodology.includes(skill), 'methodology missing Skill reference: ' + skill);
                  covered.add(skill);
                }
              } else if (n.content) walk(n.content);
            }
          }
          walk(source.content);
          assert.deepEqual(totals, { module: 2, chapter: 4, lesson: 6, episode: 0 });
          assert.deepEqual([...covered].sort(), [...source.outcomes.skills].sort());
          assert.deepEqual(quiz, {
            firstLookAtSky: true,
            observationJournal: false,
            skyChangesOverview: true,
            dayNightBasics: true,
            moonAppearanceBasics: true,
            sunEarthMoonRoles: true,
          });
          console.log(JSON.stringify({ totals, skillCoverage: [...covered].sort(), quiz, courseSource: f }, null, 2));
          NODE
