name: Temporary Agent 4 Chemistry strict validation

on:
  push:
    branches:
      - review/chemistry-skills-language-review-agent-4
    paths:
      - '.github/workflows/chemistry-agent4-validation.yml'

permissions:
  contents: read

jobs:
  chemistry:
    name: Chemistry taxonomy, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Validate workspaces
        run: node scripts/check-workspaces.mjs
      - name: Validate complete Chemistry skills taxonomy
        run: node scripts/check-skills-taxonomy-structure.mjs learningApps/chemistry/data/skills
      - name: Build contracts and engine
        run: |
          npm run build --workspace @svitlo/contracts
          npm run build --workspace @svitlo/engine
      - name: Full Chemistry TypeScript including authored data
        run: npm run typecheck --workspace @svitlo/chemistry
      - name: Build Chemistry application
        run: npm run build --workspace @svitlo/chemistry
