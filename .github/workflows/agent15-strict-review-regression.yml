name: Agent 15 strict review regression

on:
  push:
    branches:
      - agent/kazakh-latin-15

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Engine contract
        run: npm run package:build --workspace @svitlo/engine
      - name: UI Kit typed source including authored data
        run: npm run code:check:types --workspace @svitlo/ui-kit
      - name: Build UI Kit dependency
        run: npm run package:build --workspace @svitlo/ui-kit
      - name: Playground typed source
        run: npm run code:check:types --workspace @svitlo/playground
      - name: UI Kit locale regression
        run: npm run test:locales --workspace @svitlo/ui-kit
