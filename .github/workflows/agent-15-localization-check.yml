name: Temporary Agent 15 strict localization validation

on:
  push:
    branches:
      - agent/kazakh-latin-15

permissions:
  contents: read

jobs:
  verify:
    name: Strict UI Kit and Playground source checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Engine dependency
        run: npm run package:build --workspace @svitlo/engine
      - name: Strict UI Kit typed source validation
        run: npm run code:check:types --workspace @svitlo/ui-kit
      - name: Build UI Kit for Playground imports
        run: npm run package:build --workspace @svitlo/ui-kit
      - name: Strict Playground typed source validation
        run: npm run code:check:types --workspace @svitlo/playground
      - name: UI Kit localization regression tests
        run: npm run test:locales --workspace @svitlo/ui-kit
