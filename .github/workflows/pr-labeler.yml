name: Pull request labels

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
      - name: Fallback area and integration role
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number, per_page: 100
            });
            const labels = new Set(current.map(item => item.name));
            const hasSpecificArea = [...labels].some(name =>
              name.startsWith('area: ') && name !== 'area: repo');
            if (!hasSpecificArea && !labels.has('area: repo')) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: ['area: repo']
              });
            } else if (hasSpecificArea && labels.has('area: repo')) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number, name: 'area: repo'
              });
            }
            const isAgent = labels.has('pr: agent-subtask');
            const isIntegration = new RegExp('\\bintegration\\b', 'i')
              .test(context.payload.pull_request.title);
            if (isAgent && labels.has('pr: integration')) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number, name: 'pr: integration'
              });
            } else if (!isAgent && isIntegration && !labels.has('pr: integration')) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: ['pr: integration']
              });
            }
